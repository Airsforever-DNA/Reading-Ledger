<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>读书笔记 - 静心书斋</title>
    <meta name="description" content="静心书斋·读书笔记——研读、摘录与思考的沉淀，支持搜索与标签筛选。">
    <meta name="theme-color" content="#1d1913">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/premium.css">
</head>
<body class="page-paper">
    <!-- 导航（site.js 注入） -->
    <div id="site-nav" data-active="notes"></div>

    <section class="p-section p-section--paper">
        <div class="u-container">
            <div class="p-head reveal">
                <span class="p-eyebrow">reading notes</span>
                <h1 class="p-title">读书笔记</h1>
                <p class="p-subtitle">研读 · 摘录 · 思考的沉淀</p>
                <div class="u-divider"><span></span></div>
            </div>

            <!-- 工具栏：搜索 + 排序 -->
            <div class="toolbar reveal">
                <div class="search-box">
                    <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path>
                    </svg>
                    <input id="noteSearch" type="search" placeholder="搜索书名、作者或标签…" autocomplete="off">
                </div>
                <div class="sort-mini">
                    排序
                    <button data-sort="date" class="active">最新</button>
                    <button data-sort="title">书名</button>
                </div>
            </div>

            <!-- 标签筛选 -->
            <div class="tag-bar reveal" id="tagBar"></div>

            <!-- 笔记网格 -->
            <div class="feed-grid" id="notesGrid" style="margin-top:34px;"></div>
            <div class="notes-empty" id="notesEmpty" style="display:none;">没有匹配的笔记，换个关键词或标签试试。</div>
        </div>
    </section>

    <!-- 页脚（site.js 注入） -->
    <div id="site-footer"></div>

    <script src="js/books.js"></script>
    <script src="js/site.js"></script>
    <script src="js/books-page.js"></script>
</body>
</html>
