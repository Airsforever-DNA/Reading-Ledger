name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 必须的 Pages 权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署运行，避免并发冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 自动启用 Pages 并将来源设为 GitHub Actions（解决 "Not Found" 错误）
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上传仓库根目录下所有静态文件
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
