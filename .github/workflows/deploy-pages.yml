name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 必须的 Pages 权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署运行，避免并发冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 只打包网站用到的文件：_incoming/（上传素材）和 _originals/（原图）不部署
      - name: Assemble site
        run: |
          mkdir _site
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/_site/' \
            --exclude='/_incoming/' --exclude='/_originals/' ./ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
