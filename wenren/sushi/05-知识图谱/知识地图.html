    name: c.name, value: c.value, itemStyle: {color: c.color},
    meta: {kind:'grp', note:c.note, fileCount:c.value,
           bytes:c.files.reduce((a,f)=>a+f.b,0), files:c.files}
  }))
}));

function tooltip(p){
  const m = p.data && p.data.meta; if(!m) return p.name;
  let h = '<div style="max-width:340px;white-space:normal;font-size:12.5px;line-height:1.6">'
        + '<b style="font-size:14px">' + p.name + '</b>';
  if(m.desc) h += '<p style="margin:4px 0;color:#5a5a5a">' + m.desc + '</p>';
  if(m.note) h += '<p style="margin:2px 0;color:#5a5a5a">' + m.note + '</p>';
  h += '<div style="margin-top:4px">' + m.fileCount + ' 个文件 · ' + fmtB(m.bytes) + '</div>';
  const fl = m.files || [];
  if(fl.length){
    h += '<ul style="margin:4px 0 0 16px;padding:0;color:#777">'
       + fl.slice(0,12).map(f => '<li>' + f.n + '（' + fmtB(f.b) + '）</li>').join('');
    if(fl.length > 12) h += '<li>… 共 ' + fl.length + ' 个</li>';
    h += '</ul>';
  }
  return h + '</div>';
}

function renderDetail(m, title){
  const el = document.getElementById('detail');
  let h = '<h3>' + title + '</h3>';
  if(m.desc) h += '<p>' + m.desc + '</p>';
  if(m.note) h += '<p>' + m.note + '</p>';
  h += '<p class="dim">' + m.fileCount + ' 个文件 · ' + fmtB(m.bytes) + '</p>';
  const fl = m.files || [];
  if(fl.length){
    h += '<ul class="filelist">' + fl.map(f =>
      '<li><a href="' + f.href + '">' + f.n + '</a> <span class="dim">' + fmtB(f.b) + '</span></li>').join('') + '</ul>';
  }
  if(m.entries && m.entries.length){
    h += '<p class="dim">入口：' + m.entries.map(e =>
      '<a href="' + e.href + '">' + e.label + '</a>').join(' · ') + '</p>';
  }
  el.innerHTML = h;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 400);
}

function defaultDetail(){
  document.getElementById('detail').innerHTML =
    '<h3>工程总览</h3>'
    + '<p>点击左图任一扇区或色块，此处显示该板块的说明、文件清单与入口链接。</p>'
    + '<p class="dim">' + STATS.totalFiles + ' 个文件 · ' + fmtB(STATS.totalBytes)
    + '（不含本页自身）</p>'
    + '<ul class="dim" style="padding-left:18px;margin-top:6px">'
    + '<li>事件 ' + STATS.events + ' · 人物 ' + STATS.persons + ' · 关系 ' + STATS.relations + '</li>'
    + '<li>词 15 · 诗 15 · 文 10 · 轶事 ' + STATS.anecdotes + ' 则</li></ul>';
}

// 侧栏板块导航（单一数据源：DATA）
function renderNav(){
  document.getElementById('nav').innerHTML = DATA.map((s, i) =>
    '<div class="nav-card" id="nav-' + i + '">'
    + '<div class="nav-head"><span class="nav-badge" style="background:' + s.color + '">' + s.name.split(' ')[0] + '</span>'
    + '<b>' + s.short + '</b><span class="nav-count">' + s.fileCount + ' 文件</span></div>'
    + '<p>' + s.desc + '</p>'
    + '<p class="nav-links">入口：' + s.entries.map(e =>
        '<a href="' + e.href + '">' + e.label + '</a>').join(' · ') + '</p>'
    + '</div>').join('');
}

const sunburstOpt = {
  tooltip: {trigger:'item', formatter: tooltip, extraCssText:'max-width:360px'},
  series: [{
    type:'sunburst', radius:['14%','92%'], sort:null, minAngle:1.5,
    emphasis:{focus:'ancestor'},
    itemStyle:{borderColor:'#f7f4ee', borderWidth:2, borderRadius:3},
    levels: [
      {},
      {r0:'14%', r1:'50%',
       label:{rotate:'radial', fontSize:13, fontWeight:600, color:'#fff', minAngle:8}},
      {r0:'50%', r1:'92%',
       label:{rotate:'tangential', fontSize:11, color:'#fff', minAngle:10}}
    ],
    data: chartData
  }]
};

const treemapOpt = {
  tooltip: {trigger:'item', formatter: tooltip, extraCssText:'max-width:360px'},
  series: [{
    type:'treemap', width:'100%', height:'90%', top:'10%',
    roam:false, nodeClick:'zoomToNode', leafDepth:2,
    breadcrumb:{show:true, top:4, left:'center', height:22, itemStyle:{color:'#3d5a4c', textStyle:{color:'#fff'}},
      emphasis:{itemStyle:{color:'#9a3b26'}}},
    label:{show:true, formatter:function(p){return p.name + '\n' + p.value + ' 文件';},
      fontSize:12, color:'#fff'},
    upperLabel:{show:true, height:26, formatter:'{b}', color:'#fff', fontWeight:600},
    itemStyle:{borderColor:'#f7f4ee', gapWidth:2, borderWidth:0},
    data: chartData
  }]
};

const charts = {};
function showTab(which){
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.v === which));
  document.getElementById('viz-sunburst').style.display = which === 'sun' ? '' : 'none';
  document.getElementById('viz-treemap').style.display = which === 'tree' ? '' : 'none';
  const id = which === 'sun' ? 'viz-sunburst' : 'viz-treemap';
  if(!charts[id]){
    charts[id] = echarts.init(document.getElementById(id));
    charts[id].setOption(which === 'sun' ? sunburstOpt : treemapOpt);
    charts[id].on('click', function(p){
      if(p.data && p.data.meta) renderDetail(p.data.meta, p.name);
    });
  } else {
    charts[id].resize();
  }
}

document.addEventListener('DOMContentLoaded', function(){
  renderNav();
  defaultDetail();
  showTab('sun');
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.addEventListener('click', () => showTab(b.dataset.v)));
  window.addEventListener('resize', () =>
    Object.values(charts).forEach(c => c.resize()));
  // 统计条
  document.getElementById('statline').innerHTML =
    '总文件 <b>' + STATS.totalFiles + '</b>（不含本页） · 总体积 <b>' + fmtB(STATS.totalBytes) + '</b> · '
    + '内容文件 <b>' + STATS.md + ' md + ' + STATS.html + ' 页</b> · '
    + '数据 <b>' + STATS.json + ' json</b> · 资源 <b>' + STATS.asset + '</b>';
});

</script>
</body>
</html>
