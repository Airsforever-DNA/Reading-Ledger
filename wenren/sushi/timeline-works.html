null, "t": "春宵", "k": "诗", "d": "", "f": "春宵一刻值千金，", "url": "poem/春宵.html", "n": 3}, {"y": null, "t": "汲江煎茶", "k": "诗", "d": "", "f": "活水还须活火烹，", "url": "poem/汲江煎茶.html", "n": 4}, {"y": null, "t": "海棠", "k": "诗", "d": "", "f": "东风袅袅泛崇光，", "url": "poem/海棠.html", "n": 4}, {"y": null, "t": "湖上夜归", "k": "诗", "d": "", "f": "吾家杭湖上，", "url": "poem/湖上夜归.html", "n": 7}, {"y": null, "t": "满庭芳·蜗角虚名", "k": "词", "d": "宋神宗元丰五年前后。", "f": "蜗角虚名，", "url": "poem/满庭芳·蜗角虚名.html", "n": 11}, {"y": null, "t": "狱中寄子由", "k": "诗", "d": "", "f": "圣主如天万物春，", "url": "poem/狱中寄子由.html", "n": 4}, {"y": null, "t": "百步洪", "k": "诗", "d": "", "f": "长洪斗落生跳波，", "url": "poem/百步洪.html", "n": 5}, {"y": null, "t": "纵笔", "k": "诗", "d": "", "f": "白头萧散满霜风，", "url": "poem/纵笔.html", "n": 4}, {"y": null, "t": "自题金山画像", "k": "诗", "d": "", "f": "心似已灰之木，", "url": "poem/自题金山画像.html", "n": 4}, {"y": null, "t": "荔枝叹", "k": "诗", "d": "", "f": "十里一置飞尘灰，", "url": "poem/荔枝叹.html", "n": 9}, {"y": null, "t": "贺新郎·乳燕飞华屋", "k": "词", "d": "宋哲宗元祐年间或更早。", "f": "乳燕飞华屋。", "url": "poem/贺新郎·乳燕飞华屋.html", "n": 18}, {"y": null, "t": "题西林壁", "k": "诗", "d": "", "f": "横看成岭侧成峰，", "url": "poem/题西林壁.html", "n": 4}, {"y": null, "t": "食荔枝二首其二", "k": "诗", "d": "", "f": "罗浮山下四时春，", "url": "poem/食荔枝二首其二.html", "n": 4}, {"y": null, "t": "饮湖上初晴后雨", "k": "诗", "d": "", "f": "水光潋滟晴方好，", "url": "poem/饮湖上初晴后雨.html", "n": 3}, {"y": null, "t": "潮州韩文公庙碑（全碑）", "k": "文", "d": "", "f": "", "url": "prose/潮州韩文公庙碑（全碑）.html", "n": 0}]; const KC = {"词": "#7d4a68", "诗": "#3d5a4c", "文": "#b8860b"};
