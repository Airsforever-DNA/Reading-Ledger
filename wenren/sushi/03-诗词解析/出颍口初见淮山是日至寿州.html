const MD = "# 出颍口初见淮山，是日至寿州\n\n## 一、题名与体裁\n七言律诗。嘉祐六年（1061）冬末，苏轼自汴京赴凤翔签判任途中所作。\n首句\"我行日夜向江海\"入韵，押平水韵\"七阳\"。\n\n## 二、原文\n\n我行日夜向江海，枫叶芦花秋兴长。\n长淮忽迷天远近，青山久与船低昂。\n寿州已见白石塔，短棹未转黄茅冈。\n波平风软望不到，故人久立烟苍茫。\n\n## 三、写作背景\n\n嘉祐六年（1061）八月，苏轼自汴京启程赴凤翔府签书判官任。苏辙送至郑州西门，赋《怀渑池寄子瞻兄》相赠；兄弟相约早退、闲居之约即始于此（后《逍遥堂会宿》\"夜雨何时听萧瑟\"亦同一夜雨之约）。十月二十五日，苏轼出颍口（今安徽寿县、正阳关附近），初见淮山，当日抵达寿州。是年汴京已授新科，苏轼以签书凤翔判官外放，与王安石变法前夕的政局关系不大，主要是一个初仕者出京时的离索之感。\n\n王水照、崔铭《苏轼传》指出此诗作于出颍口南下途中，时已深秋，王安石变法尚未兴起（变法始于熙宁二年）。李一冰《苏东坡新传》将系年定在嘉祐六年（1061）十月下旬赴凤翔途中，可参。\n\n## 四、逐句笺注\n\n**首联**：\"我行日夜向江海，枫叶芦花秋兴长。\"——表面写行程：日夜南行，目标江海（凤翔在陕西内陆，\"江海\"是词面方向，非实指）。枫叶芦花点明节令在深秋。\"秋兴长\"三字以萧瑟秋景寓内心萧瑟。颔联接写淮山景色变化。\n\n**颔联**：\"长淮忽迷天远近，青山久与船低昂。\"——\"长淮\"即淮河，苏轼出颍口后船入淮河。两岸青山相对，时而被水雾遮蔽（\"忽迷天远近\"），时而近在目前仿佛与船身齐低齐昂（\"青山久与船低昂\"）。化用李白\"两岸青山相对出\"而意更曲折。王水照、崔铭特别拈出此句，谓其\"低昂\"二字写舟中观山远近之变，最得神理。\n\n**颈联**：\"寿州已见白石塔，短棹未转黄茅冈。\"——寿州今安徽寿县，古称寿春、寿阳，是楚文化的旧都。\"白石塔\"为寿州地标。船行渐近，寿州塔已遥遥在望；\"短棹未转\"言船尚未绕过黄茅冈（淮河岸边低岗），人已先见其塔。一\"已见\"一\"未转\"，写出空间的纵深推进。\n\n**尾联**：\"波平风软望不到，故人久立烟苍茫。\"——水路平静、风力微弱，反而看不到远方的景物；遥想故人（苏辙）已独立苍茫烟霭之中久久眺望。古人以\"望不到\"收束，倍增离索：不是船到不了寿州，而是人情与京阙的距离无法消弭。\n\n## 五、综合赏析\n\n此诗以平淡语写沉痛情。首句\"我行日夜向江海\"用最朴素的字交代方向与日夜兼程的事实，却在\"向江海\"三字里暗藏初仕者被外放的边缘化感——京城是功业的代称，江海恰是反义，王水照、崔铭《苏轼传》特别强调这层\"政治文化意味\"：对一个正当盛年、壮志未酬的士子来说，被外放到远离权力中心的州县，本身就是一种带刑罚意味的\"前行\"。\n\n颔联\"长淮忽迷天远近，青山久与船低昂\"是宋人山水诗中的名句。它不写山的奇崛，而写舟行之\"晕\"：行船时视野不停变化，山随船移，时高时低，时显时隐；同样一句诗，李白用\"两岸猿声\"，苏轼用\"青山低昂\"，把诗从静态山水推向体感山水——读者不是\"看\"山，而是在与山同进退。颈联以\"已见\"、\"未转\"两个时间副词做空间推进，节奏极稳，是律诗中段的标准章法。尾联\"波平风软望不到，故人久立烟苍茫\"化实为虚，从可见之景转入不可见之人——苏辙在郑州送别后大约已回京，立\"烟苍茫\"中送远行的兄长，却\"望不到\"。这就把一首普通的纪行诗写成了一首兄弟赠答诗：以我之不见君，写君之念我。\n\n整诗章法上由\"向江海\"起势，\"故人\"收束，首尾以\"行\"与\"望\"呼应；中间两联纯用白描，几乎不用典、不着色，这正是苏轼早期学韦应物、柳宗元一路清淡诗的痕迹，也是他日后走向\"理趣\"诗的前奏。\n\n## 六、关联网络\n\n- **兄弟夜雨之约**：苏轼与苏辙自嘉祐六年（1061）郑州别后，至熙宁十年（1077）始再会于澶濮之间，七年间屡以\"夜雨何时听萧瑟\"相忆。出颍口是此约的起点之一。\n- **渑池怀旧**：嘉祐元年（1056）三苏赴京试，曾途经渑池奉闲僧舍题壁；嘉祐六年出颍口是三苏再次西/南行的另一段。这两段都写\"人生到处\"的不定。\n- **次韵张去** 出颍口之后，苏轼在凤翔任所陆续写了大量纪行、酬唱、题壁诗，与眉山陈慥、凤翔太守宋选等均有唱和。\n- **地理**：颍口在今安徽颍上县东南，淮河西岸；寿州即今安徽寿县。从汴京经颍口入淮，再沿淮河西上凤翔，是当时赴陕西的常规路线。\n\n## 七、溯源记录\n\n- **原文依据**：通行《苏轼诗集》（中华书局 1982 年孔凡礼点校本）卷二嘉祐六年（1061）赴凤翔途中作；与王水照、崔铭《苏轼传》、李一冰《苏东坡新传》中所引一致。\n- **系年依据**：王水照、崔铭《苏轼传》：\"苏轼一路上意兴阑珊……在《出颍口初见淮山，是日至寿州》一诗中他这样写道……\"系于赴凤翔途中。李一冰《苏东坡新传》将嘉祐六年十月赴凤翔行程作为此诗背景。\n- **异说**：清人王文诰《苏诗编注集成》系于同程，无异说；今人孔凡礼《苏轼年谱》同系嘉祐六年（1061）。";
