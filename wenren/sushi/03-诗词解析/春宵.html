<script>
const MD = "# 春宵\n\n## 一、题名与体裁\n七言绝句。苏轼作年不详，传统系于熙宁、元丰间通判杭州至知密州、徐州、湖州时期。押仄韵\"十二侵\"（金、阴、深、人）。\n\n## 二、原文\n\n春宵一刻值千金，花有清香月有阴。\n歌管楼台声细细，秋千院落夜沉沉。\n\n## 三、写作背景\n\n《春宵》是一首典型的\"小景大情\"之作。其确切创作时间在苏诗学界无定论，传统注本多归入\"通判杭州至知密州期间\"，即熙宁十年（1077）前后作，但亦有学者认为此诗可能写于元丰年间外放时期。\n\n王水照《苏轼研究》：\"此诗不收于王十朋集注本，只见录于《诗林玉屑》《诚斋诗话》等诗话（直到明成化四年[1468]吉安府本《东坡集·续集》卷二才收入本集）。\"这是此诗在苏轼文本史上的关键事实——它长期不在通行集注本中，依靠南宋诗话传播。王水照同时指出，此诗在日本室町期（五山时期）即已传入日本，\"很可能借助了《诗林玉屑》等诗话的媒介\"。\n\n## 四、逐句笺注\n\n**首句**：\"春宵一刻值千金。\"——以抽象的时间计量起势：\"春宵\"指春天的夜晚，一刻值千金。这是夸张的极言，奠定整首诗的审美基调：春夜之美是稍纵即逝、无可购买的。\"一刻\"是古代计时单位，一昼夜一百刻，\"一刻\"约合今天的 14 分多钟，\"千金\"则反衬春宵的无可估价。\n\n**三、四句**：\"花有清香月有阴。\"——\"花有清香\"是嗅觉，\"月有阴\"是视觉；一是自然之味，一是自然之光。\"月有阴\"指月光被云、树、花影所挡形成的明暗之趣。\"清香\"、\"月阴\"两个意象都是\"非实体\"的——与\"歌管楼台声\"的听觉一样，属于稍纵即逝的感受。\n\n**颈联**：\"歌管楼台声细细，秋千院落夜沉沉。\"——\"歌管\"指乐曲与管弦，是春夜里最易被忽略的细音。\"秋千院落\"是富贵人家的庭园，在月下空寂无人。\"夜沉沉\"是春夜的体积——不只是\"长\"，而是\"深\"。这首诗的细笔全在这两句：把春夜的声、形、气、味打叠在一起。\n\n## 五、综合赏析\n\n这是苏轼\"小景大情\"的代表作，也是宋诗中\"理趣\"在写景领域的另一种表达——不是讲哲理，而是讲\"瞬时即永恒\"的审美哲学。\n\n它的特殊处在于**通篇无诗人自己**。首句不说\"我\"如何如何，次句不说\"我闻\"、\"我看\"，三、四句不说\"我醉\"、\"我醒\"。只有\"花\"、\"月\"、\"歌管\"、\"秋千\"、\"院落\"五种意象在春夜里自顾自地呼吸。这是宋诗与唐诗最大的不同之一：唐诗的主语通常是\"人\"（李白的\"我\"、杜甫的\"吾\"），宋诗的主语常常是\"物\"或\"理\"——苏轼在这里把\"我\"完全让位给\"春宵\"。\n\n王水照、崔铭《苏轼传》特别拈出此诗在东亚的传播史：\"此诗很可能借助了《诗林玉屑》等诗话的媒介，才传入日本，并很快传诵一时，其语句、意象往往被日人采入诗文、谣曲狂言。\"这是苏诗在东亚接受史上的一个典型案例：它最初不在王十朋集注本中，反而依赖南宋诗话在日本流传——这意味着《春宵》的\"小景大情\"主题在禅宗流行的日本格外受欢迎。\n\n更深一层看，\"春宵一刻值千金\"作为汉语成语被高频使用，但往往被抽离了原诗的\"寂静\"维度，只剩下\"时间宝贵\"的训诫。原诗的真正妙处是：**正是那些不能买、不能留、不能量化的东西——\"清香\"、\"月阴\"、\"细细\"的歌声、\"沉沉\"的夜色——才真正值得用\"千金\"去衡量**。这是苏轼理学审美的一个根本观点：美不在数量，而在密度。\n\n## 六、关联网络\n\n- **版本流变**：本诗最早见录于南宋诗话（《诗人玉屑》《诚斋诗话》），王十朋集注本未收；明成化四年（1468）吉安府本《东坡集·续集》卷二才收入本集。这是苏诗文本史上的特殊案例。\n- **东亚传播**：王水照《苏轼研究》指出，此诗在五山时期即传入日本，常被采入诗文、谣曲、狂言；是中日文化交流的代表性文本之一。\n- **小景诗谱系**：与《题西林壁》《饮湖上初晴后雨》一起，构成苏轼\"小景大情\"的三联屏——分别是写景中的哲理、比喻与瞬间感。\n\n## 七、溯源记录\n\n- **原文依据**：通行《苏轼诗集》（中华书局孔凡礼点校本）补遗部分辑入；李一冰《苏东坡新传》、王水照《苏轼研究》（1980 年代初版，多被收入《苏轼评传》）均提及此诗。\n- **系年依据**：孔凡礼《苏轼年谱》将此诗列入\"未详作年\"类，作年不详，存疑。多数注本归入\"通判杭州前后作\"。\n- **异说**：王水照《苏轼研究》明确指出\"此诗不收于王十朋集注本\"——版本异说最关键的一点。";
document.getElementById('content').innerHTML = marked.parse(MD);
