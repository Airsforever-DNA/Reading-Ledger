<script>
const MD = "# 海棠\n\n## 一、题名与体裁\n七言绝句。元丰七年（1084）苏轼自黄州赴汝州途中，于金陵（今南京）作。一说元丰三年（1080）苏轼初到黄州时作。押平水韵\"七阳\"（光、廊、香、妆）。\n\n## 二、原文\n\n东风袅袅泛崇光，香雾空蒙月转廊。\n只恐夜深花睡去，故烧高烛照红妆。\n\n## 三、写作背景\n\n此诗的系年存在两种说法：\n\n**传统说（朱刚《苏轼十讲》、王水照、崔铭《苏轼传》）**：元丰七年（1084）苏轼自黄州量移汝州，途经金陵时作。时苏轼已获赦（神宗去世后哲宗即位，高太后听政，旧党回潮），即将告别贬谪生涯。\n\n**另说**：元丰三年（1080）苏轼初到黄州时作。是时他初贬，对海棠\"情有独钟\"。\n\n王水照、崔铭《苏轼传》：\"苏轼对于海棠似乎是情有独钟，他的另一首《海棠》诗也是脍炙人口的佳作：'东风袅袅泛崇光，香雾空蒙月转廊。只恐夜深花睡去，故烧高烛照红妆。'移情于物，情景交融，实际上是以物喻人乃至物我同一。\"王水照、崔铭将本诗与《寓居定惠院之东，杂花满山，有海棠一株，土人不知贵也》相提并论——后者作于元丰三年（1080）贬黄之初。\n\n## 四、逐句笺注\n\n**首句**：\"东风袅袅泛崇光。\"——\"东风袅袅\"是春风吹拂的样子；\"泛\"是弥漫；\"崇光\"是高处的光。一说\"崇光\"形容海棠花光彩夺目（\"崇\"通\"重\"或\"尊崇\"）。这是写月夜海棠：东风轻吹，花影婆娑，月光从高处弥漫下来。\n\n**次句**：\"香雾空蒙月转廊。\"——\"香雾\"是海棠花的香气在空气中弥漫如雾；\"空蒙\"是朦胧；\"月转廊\"——月光从回廊的一头转到了另一头（暗示时间推移——夜渐深）。这是写海棠的香气与月光共同构成的朦胧世界。\n\n**三句**：\"只恐夜深花睡去。\"——\"花睡\"是拟人——担心海棠花在深夜\"睡去\"（凋谢或闭合）。这是把花当人来对待的核心句。\n\n**末句**：\"故烧高烛照红妆。\"——\"高烛\"是高烧的蜡烛；\"红妆\"指海棠花（红如美人妆容）；\"故烧……照……\"——特意点起高烛来照海棠。\"故\"字特别——是\"故意\"、\"特意\"。\n\n## 五、综合赏析\n\n此诗是苏轼\"以物喻人、物我同一\"的代表作，也是中国古典诗歌中\"以花喻人\"最成功的案例之一。\n\n**\"物我同一\"的根本逻辑**：王水照、崔铭指出：\"移情于物，情景交融，实际上是以物喻人乃至物我同一。\"这首诗的最深一层是——**诗人担心的不是\"花睡去\"，而是\"红妆\"之美在夜深时分无人见证**。这是典型的\"物我同一\"——诗人把自己的审美之眼投射到海棠上：他自己想在月下看海棠，所以他想象海棠也\"想\"被人看。于是\"烧烛\"——既是为海棠照亮，也是为自己\"延续\"这一刻的审美。\n\n更深一层看，\"故烧高烛照红妆\"的\"故\"字，是苏轼浪漫主义美学观的根本体现——**为了看花，特意点烛；为了点烛，特意看花**。这种\"为审美而审美\"的姿态，在宋诗中是少见的——大部分宋诗强调\"理趣\"、\"议论\"、\"教化\"，而苏轼此诗强调\"看花\"本身的纯粹审美行为。这是苏轼\"宋诗中的唐音\"的代表——他把晚唐李商隐\"何当共剪西窗烛\"的\"烛\"意象推到极致：\"共剪西窗烛\"是为续谈；\"故烧高烛照红妆\"是为看花。\n\n**\"花睡\"与\"红妆\"**：海棠是红色的，红色妆容（红妆）是美人。海棠是花，花会\"睡\"——这是拟人；海棠是\"红妆\"——这是拟美。这种双层\"物—人—美\"的转换，是宋代花诗的最高成就：花不是被观赏的对象，花是审美的主体之一。\n\n王水照、崔铭《苏轼传》指出：\"他也特别喜欢这首'海棠曲'，以后经常亲笔书写用来送人，前后不下数十次。\"这首诗在苏轼生前已经是他最常书写的诗作之一——这种\"自书数十次\"的现象说明此诗在苏轼自己的审美标准里属于\"得意之作\"。\n\n## 六、关联网络\n\n- **海棠诗群**：苏轼对海棠情有独钟，先后写过《海棠》（东风袅袅）、《寓居定惠院之东，杂花满山，有海棠一株，土人不知贵也》（\"嫣然一笑竹篱间，桃李满山总粗俗\"）、《黄州定惠院寓居海棠》等多首。\n- **海棠与黄州**：黄州定惠院、海棠是苏轼贬谪期重要的审美对象；黄州时期的海棠诗与东坡诗、雪堂诗共同构成\"黄州审美谱系\"。\n- **\"故烧高烛\"**：成为后世花诗的标志性意象；陆游\"小楼一夜听春雨\"亦有\"深巷明朝卖杏花\"的延续脉络。\n\n## 七、溯源记录\n\n- **原文依据**：通行《苏轼诗集》（中华书局孔凡礼点校本）卷二一元丰三年或元丰七年作；王水照、崔铭《苏轼传》完整引述。\n- **系年依据**：王水照、崔铭《苏轼传》将其与元丰三年（1080）贬黄之初的定惠院海棠诗并提，但未明确本诗作年。朱刚《苏轼十讲》倾向于元丰七年（1084）赴汝州途经金陵时作。今人孔凡礼《苏轼年谱》\"未详作年\"。\n- **异说**：系年存疑——主流两说（元丰三年初贬黄州时、元丰七年自黄州赴汝州途经金陵时），本诗作为\"写定惠院海棠\"亦通。";
