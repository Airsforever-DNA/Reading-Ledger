<script>
const MD = "# 定风波·莫听穿林打叶声\n\n## 一、题名与体裁\n**词牌源流**：「定风波」始见后蜀欧阳炯《花间集》，调名本义为「平定风波」之祝祷；敦煌曲子词中已有此调。分三体：六十二字、六十三字、九十九字（双片），苏轼此词为六十二字小令体之别格（上下片后段各多一字领句）。\n**字数体式**：双片六十二字，前后片各五句、五韵；调中多用「一字领」「二字领」叠用，造成节奏之跌宕开合。\n\n## 二、原文\n> 三月七日，沙湖道中遇雨。雨具先去，同行皆狼狈，余不觉。已而遂晴，故作此。\n>\n> 莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。\n>\n> 料峭春风吹酒醒，微冷，山头斜照却相迎。回首向来萧瑟处，归去，也无风雨也无晴。\n\n## 三、写作背景\n**系年**：宋神宗元丰五年（1082）。\n**地点**：黄州（今湖北黄冈）东南三十里之沙湖（一名螺师店）。\n**触发动机**：三月七日与同僚春日出行至沙湖看田（相田），半途遇雨，雨具已被仆人先行挑走，同行皆觉狼狈，唯苏轼浑然不觉。雨后放晴，遂作此词。\n**异说**：词之作日「三月七日」，向有「三月七日」「三月三日」两种异文（清人王文诰、邵长蘅校注不同）。主流取「三月七日」。\n\n## 四、逐句笺注\n- **三月七日，沙湖道中遇雨**：小序明记，奠定全词纪实基调。\n- **雨具先去，同行皆狼狈，余不觉**：二句一转，一「狼狈」一「不觉」之对照，奠定「我与他者」之别。\n- **已而遂晴，故作此**：「遂晴」二字暗应前文「不觉」，使遇雨之「事」与放晴之「理」叠合。\n- **莫听穿林打叶声**：起句否定语——不须听、不须闻雨声；「穿林打叶」四字写雨点之密与力。\n- **何妨吟啸且徐行**：转折领起——不但不听，且徐行吟啸；化《世说新语》王子猷雪夜访戴「乘兴而行，兴尽而返」之意趣。\n- **竹杖芒鞋轻胜马**：以日常步行之轻便胜远行之车马——贬谪生活中对「轻」之自觉体认。\n- **谁怕？**：以反诘作领——是问天，是问己，更是问同行之「狼狈」者。\n- **一蓑烟雨任平生**：「一蓑烟雨」四字向有版本异文——《东坡乐府》作「一蓑烟雨」，毛氏汲古阁本作「一蓑烟雨」，其他版本或作「烟雨一蓑」「一蓑风雨」「烟雨任平生」。主流通行作「一蓑烟雨任平生」。\n- **料峭春风吹酒醒**：承上片「风雨」而至「春风」，风之寒者曰「料峭」，来自宋人常用语。\n- **微冷，山头斜照却相迎**：斜照即夕阳之返照；「却相迎」三字带主观感情色彩，写日与人之相对。\n- **回首向来萧瑟处**：承「斜照」而回视来时风雨之路。\n- **归去，也无风雨也无晴**：归结之核心——雨也好，晴也好，皆已过去；皆是心外之物。此句宋以来评家皆推为东坡最圆融之人生境界。\n\n## 五、综合赏析\n此词小序中已标明「同行皆狼狈，余不觉」——「不觉」二字是理解全词之钥匙。上片由「莫听」之否定转出「何妨吟啸且徐行」之肯定，再转出「竹杖芒鞋轻胜马」之比较，再转出「谁怕？」之反诘，最后以「一蓑烟雨任平生」之旷达收束——四句之转折连环而下，写贬谪途中遇雨之「安之若素」之直接经验。\n\n下片由「料峭春风」之微寒转出「山头斜照却相迎」之转暖，再以「回首向来萧瑟处」之回视转出「归去，也无风雨也无晴」之超越——经历风雨—回视—超越，三步合于一句。「也无风雨也无晴」非谓无风雨之存在，乃谓风雨晴阴皆已内化于一心而不再激荡——这是庄子「天地与我并生，而万物与我为一」（《齐物论》）之艺术化呈现，亦是禅宗「心无所住」之境界。\n\n苏轼此词最深刻处在于：以最具体之「三月七日沙湖道中遇雨」之经验，演绎出最普遍之人生哲学命题。它不是抽象之哲理，而是从一次雨中徐行升腾出的圆融之境。这种「即事成理」「即景立宗」之能力，使此词成为宋词中最具哲学密度之小令之一。\n\n## 六、关联网络\n- **人物**：同行者姓名未详，推为黄州同僚；苏轼此时日常交游对象有徐大正、李琪、王适等。\n- **人生事件**：元丰五年三月七日沙湖相田——这是黄州谪居生活之一寻常片断，但也是苏轼精神升华之关键时点。\n- **其他作品互见**：《沙湖道中》诗（亦记此次遇雨）、《定风波·王定国歌儿曰柔奴》（1083 黄州，与本词作同一系列之「一蓑烟雨」之延伸）；同年所作《赤壁赋》《临江仙·夜饮东坡醒复醉》皆同寓「超脱—归真」之理趣。\n- **文化史影响**：「一蓑烟雨任平生」成宋以后文人自我标举之成语；「也无风雨也无晴」为禅意词之名句。\n\n## 七、溯源记录\n- **原文依据**：通行整理本（邹同庆、王宗堂《苏轼词编年校注》本，与龙榆生《东坡乐府笺》同），与模型知识一致。\n- **系年依据**：邹同庆、王宗堂《苏轼词编年校注》、孔凡礼《苏轼年谱》卷十九，均系元丰五年三月七日。\n- **异说来源**：①「三月七日」与「三月三日」之争——清人邵长蘅、王文诰《苏诗编注集成》两存之；②「一蓑烟雨」之版本异文——林语堂《苏东坡传》中译为「Wearing a bamboo hat and straw sandals in the misty rain」（不取「一蓑」之具体意象），版本学讨论见龙榆生、龙沐勋《唐宋名家词选》校勘记。\n- **未竟事项**：同行者姓名（疑徐大正）之确考，待核《苏轼年谱》及黄州时期诗文集中之同期交游考。";
