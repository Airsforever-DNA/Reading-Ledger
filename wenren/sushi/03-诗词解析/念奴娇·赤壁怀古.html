const MD = "# 念奴娇·赤壁怀古\n\n## 一、题名与体裁\n**词牌源流**：「念奴娇」取唐玄宗时歌女念奴为名，元稹《连昌宫词》「飞上九天歌一声，二十五郎吹管逐」自注中已有此调；又名「百字令」「大江东去」「酹江月」等，以苏轼此词得名「酹江月」。「赤壁怀古」为题。\n**字数体式**：双片一百字，前后片各十句、十韵，上下片皆四仄韵；用韵以入声为主，气势沉雄。\n\n## 二、原文\n> 大江东去，浪淘尽，千古风流人物。故垒西边，人道是，三国周郎赤壁。乱石穿空，惊涛拍岸，卷起千堆雪。江山如画，一时多少豪杰。\n>\n> 遥想公瑾当年，小乔初嫁了，雄姿英发。羽扇纶巾，谈笑间，樯橹灰飞烟灭。故国神游，多情应笑我，早生华发。人生如梦，一尊还酹江月。\n\n## 三、写作背景\n**系年**：宋神宗元丰五年（1082）。\n**地点**：黄州（今湖北黄冈）谪所。苏轼时年四十六，因「乌台诗案」贬黄州团练副使本州安置已近两年。\n**触发动机**：元丰五年七月，轼游黄冈赤鼻矶（一名赤壁矶），误以为三国周瑜破曹之赤壁（在今湖北蒲圻），因怀古而作。词前原有「赤壁怀古」调名而无小序。\n\n> **系年异说（两说并存，各自解析均成立）**：通行说系元丰五年（1082）七月——邹同庆、王宗堂《苏轼词编年校注》、孔凡礼《苏轼年谱》同此，与前后《赤壁赋》同期构成「赤壁三咏」；朱刚《苏轼十讲》则推断作于元丰三年（1080）初到黄州时（与其时苏辙有同题之作互证）——取三年说，则此词是初贬惊魂未定之际借周郎自照，豪语中「早生华发」之自伤更切；取五年说，则是黄州沉淀两年后的人生总览，「人间如梦」之勘破更醇。本篇以通行五年说为叙述主线，三年说解读角度附此备参。\n\n**异说**：赤壁地理位置历来有三说——嘉鱼赤壁（蒲圻）、汉阳赤壁、黄冈赤鼻矶。苏轼所游为第三处，其词「人道是」三字已明表「传云」之保留态度，未硬断为嘉鱼之役。宋人多已指出其误（如范成大《吴船录》），清人尤表章证明周郎破曹实在嘉鱼；近人考证更详，然「赤壁」文学意象之伟大于黄冈赤鼻矶而不必拘于战址之实。\n\n## 四、逐句笺注\n- **大江东去，浪淘尽，千古风流人物**：起句俯仰时空，「东去」之不可逆与「淘尽」之不可见，构成怀古之宏观背景。\n- **故垒西边**：故垒即旧时军营遗迹；方位词「西边」与「大江东去」形成动静对照。\n- **人道是，三国周郎赤壁**：用「人道是」三字而非径言「此即赤壁」——苏轼之史学诚实处，亦是词笔之含蓄处。\n- **乱石穿空，惊涛拍岸，卷起千堆雪**：三句以「穿」「拍」「卷」三个动词领起，赤壁实景之陡、险、势；「千堆雪」喻浪花之洁白繁密。\n- **江山如画，一时多少豪杰**：承景转人，由地之胜转入时之人。\n- **遥想公瑾当年**：由「今」入「昔」，视角飞越千年。\n- **小乔初嫁了，雄姿英发**：补一笔周郎之丰仪与家室；用「初嫁了」之闲笔，使英雄气与儿女情相映。后世解者或以此句生年考（建安四年孙策破周瑜获乔公二女，时瑜二十四岁；建安十三年赤壁之战时瑜三十四岁，与「小乔初嫁」年岁不合），然词家笔法不必拘实，可作「正当年华」之意。\n- **羽扇纶巾，谈笑间，樯橹灰飞烟灭**：「羽扇纶巾」本指晋人风度（《晋书·谢万传》），苏轼移用于周瑜，强化其雅将风度而不仅临其武略；「谈笑间，樯橹灰飞烟灭」——八个字写尽火攻之功。「谈笑间」维基文库底本作「**谈笑处**」（见 99-溯源/网络采集-词15首.md），通行本作「间」，本文从通行本并注异文。\n- **故国神游**：神游故国，意即「神驰三国之战场」；「神」字作动词。\n- **多情应笑我，早生华发**：自嘲已之早衰（时轼年四十六而华发初生）。\n- **人生如梦，一尊还酹江月**：收束于「如梦」之喟与「酹月」之祭——既是对周郎之祭，也是对自己半生功业未竟之祭。「人生」维基文库底本作「**人间**」——「人间如梦」与结句「人间」意象系统（对立于「三国周郎」的历史时空）另有意味，通行本多作「人生」，两读并存（校记见 99-溯源/网络采集-词15首.md）。\n\n## 五、综合赏析\n此词以赤壁之壮景起，以周郎之少年功业盛，以己身之多情早衰衰，以「如梦」与「酹月」之祭收——形成「景→人→己→祭」四层套叠的怀古结构。每一层皆由外向内、由古而今、由豪而入悲。\n\n最关键处有三：一是「乱石穿空，惊涛拍岸」之写景纯以气势胜，奠定全词基调；二是「羽扇纶巾，谈笑间，樯橹灰飞烟灭」之写人纯以风神胜，三十四岁之周郎与四十六岁之苏轼形成强烈年龄反差；三是「人生如梦」之结句并非消沉，而是经过历史观照之后对个体局限之清醒承认——既不否定梦，亦不执着于梦，而以「酹」之仪式将悲慨化为艺术。\n\n苏轼此词之伟大，在于他以一己之谪宦悲怀，对接了千年英雄史中最辉煌的战例与最风神的人物，从而将自己一己之挫辱转化为对整个人类历史之沉思。这正是东坡谪黄期间精神境界之最宏阔表述。胡仔《苕溪渔隐丛话》评：「东坡『大江东去』赤壁词，语意高妙，真古今绝唱。」\n\n## 六、关联网络\n- **人物**：周瑜（公瑾）——苏轼心中之「少年功业」范本；亦与其终身政敌王安石之少年得志形成潜在对照（待考）。\n- **人生事件**：元丰二年（1079）「乌台诗案」出狱后贬黄州，至元丰七年（1084）量移汝州。\n- **其他作品互见**：《赤壁赋》《后赤壁赋》（皆元丰五年同游赤壁所作）、《念奴娇·中秋》（1082 黄州中秋）。赋与词互见，足见黄州赤壁为苏轼精神再生之地。\n- **文化史影响**：奠定宋词豪放词之最高范式，南宋辛弃疾、陆游、刘克庄等豪放词派奉为圭臬；「大江东去」「酹江月」成赤壁文学之代名词。\n\n## 七、溯源记录\n- **原文依据**：通行整理本（邹同庆、王宗堂《苏轼词编年校注》、龙榆生《东坡乐府笺》），与模型知识一致。「乱石穿空」一作「乱石崩云」，异文见《东坡乐府笺》。\n- **系年依据**：邹同庆、王宗堂《苏轼词编年校注》、孔凡礼《苏轼年谱》卷十九，均系元丰五年。\n- **异说来源**：赤壁三说见《水经注》《舆地纪胜》以来各家考辨；近人考证以蒲圻赤壁为战址（王力、王恢等）；清顾祖禹《读史方舆纪要》则取黄冈之说为文学赤壁辩护。\n- **未竟事项**：「人道是」三字之版本差异（南宋胡仔本、汲古阁本之「人道是」vs 某些版本之「旧说」），待核胡仔《苕溪渔隐丛话》原刻与毛氏汲古阁本之校勘。";
document.getElementById('content').innerHTML = marked.parse(MD);
