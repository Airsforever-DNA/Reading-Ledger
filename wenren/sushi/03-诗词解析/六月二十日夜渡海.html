<script>
const MD = "# 六月二十日夜渡海\n\n## 一、题名与体裁\n七言律诗。元符三年（1100）六月二十日苏轼北归渡琼州海峡时作。押平水韵\"八庚\"（更、晴、清、声、生）。\n\n## 二、原文\n\n参横斗转欲三更，苦雨终风也解晴。\n云散月明谁点缀，天容海色本澄清。\n空余鲁叟乘桴意，粗识轩辕奏乐声。\n九死南荒吾不恨，兹游奇绝冠平生。\n\n## 三、写作背景\n\n元符三年（1100）正月，宋哲宗崩，宋徽宗即位。向太后听政，旧党回潮。五月，苏轼自海南儋州量移廉州（合浦）；六月二十日夜渡琼州海峡，抵雷州。时苏轼六十五岁，已贬海南三年（自绍圣四年 1097 至元符三年 1100）。\n\n李一冰《苏东坡新传》：\"苏轼将三年间，这一番海上来去的感慨，写成一诗：'参横斗转欲三更，苦雨终风也解晴。云散月明谁点缀，天容海色本澄清。空余鲁叟乘桴意，粗识轩辕奏乐声。九死南荒吾不恨，兹游奇绝冠平生。'\"王水照、崔铭《苏轼传》：\"三更过后迎来黎明，风雨久作亦有晴时，云散月明，天海澄清，七年的沉冤终已昭雪。\"\n\n## 四、逐句笺注\n\n**首联**：\"参横斗转欲三更，苦雨终风也解晴。\"——\"参\"是参星（猎户座）；\"斗\"是北斗；\"参横斗转\"——参星横斜、北斗转向——是三更时分的天象。\"苦雨终风\"是连日苦雨、终日大风；\"也解晴\"——终究也会放晴。这是写眼前渡海时的实景——夜半风雨将歇；也是写苏轼的处境——三年的贬谪终于看到赦还的曙光。\n\n**颔联**：\"云散月明谁点缀，天容海色本澄清。\"——\"云散月明\"——乌云散去、月亮明亮；\"谁点缀\"——这些点缀（云的聚散、月光的明灭）是谁加上的？\"天容海色本澄清\"——天容、海色本来就是澄清的。这是典型的\"苏轼理趣\"——把现象（云、月）归到本体（天、海本就澄清）。这一联是苏轼对\"乌台诗案\"以来自己所有\"诬枉\"的总回应：那些\"讪谤\"的指责，本来就不存在——\"本澄清\"。\n\n**颈联**：\"空余鲁叟乘桴意，粗识轩辕奏乐声。\"——\"鲁叟\"是孔子（孔子是鲁国人）；\"乘桴\"是《论语·公冶长》\"道不行，乘桴浮于海\"——孔子感叹\"道不行\"而想浮海。\"空余\"是\"只剩下的\"——苏轼现在只剩下孔子的\"乘桴\"之叹了。\"轩辕\"是黄帝；\"粗识\"是粗略懂得；\"奏乐声\"——《庄子·天运》记黄帝\"张《咸池》之乐于洞庭之野\"。苏轼借黄帝奏乐的故事，说自己粗略懂得了\"齐得失、等荣辱\"的玄理。\n\n**尾联**：\"九死南荒吾不恨，兹游奇绝冠平生。\"——\"九死南荒\"——在岭南、海南经历过多次濒死的处境；\"吾不恨\"——我不恨。\"兹游\"是这次南荒之游（贬谪岭海七年的漫游）；\"奇绝冠平生\"——所见所历之奇绝超过平生所历任何一次。这是苏轼对岭海七年的总评价——不是\"恨\"，而是\"奇绝\"。\n\n## 五、综合赏析\n\n这是苏轼一生诗作中的\"收山之作\"之一，也是中国古典诗歌中最沉痛也最开朗的\"渡海\"诗。\n\n**\"渡海\"的双重意义**：苏轼渡过的不仅是琼州海峡（地理的渡），也是七年的贬谪生涯（生命的渡）。首联\"苦雨终风也解晴\"既是写实（渡海时风雨将歇），也是预言（元符三年正是苏轼政治处境的\"雨歇\"——哲宗崩、徽宗立、向太后听政）。颔联\"天容海色本澄清\"是苏轼对自己七年来被诬枉的最简洁回应——把一切政治乌云扫开，让\"天\"和\"海\"重新显出它们本来的样子。\n\n**\"九死南荒吾不恨\"是苏轼一生的最高姿态**：李一冰特别拈出\"虽然在南荒濒临死境，但不如此，也就失此海外奇游的机会\"。这是苏轼把\"贬谪\"翻转成\"奇游\"——他不再是被流放的人，他是主动的\"游\"者。这是苏轼\"晚期精神\"的最高表达——**把最坏的政治处境审美化**。这种姿态在苏诗中并不罕见：《初到黄州》\"长江绕郭知鱼美\"、《惠州一绝》\"不辞长作岭南人\"——苏轼的诗学就是一种\"在最坏处找到最好\"的精神实践。\n\n**与《题西林壁》的呼应**：\"九死南荒吾不恨，兹游奇绝冠平生\"——与《题西林壁》\"不识庐山真面目，只缘身在此山中\"形成对照。两首诗都涉及\"局中人\"的局限，但处理方式不同：《题西林壁》说\"局中人看不清全局\"；《六月二十日夜渡海》说\"局中人因为亲历其局，反而获得了局外人无法获得的体验\"——前者是认识论的谦卑，后者是存在论的骄傲。苏轼用一生完成了一个从\"谦卑\"到\"骄傲\"的弧线。\n\n**\"粗识轩辕奏乐声\"的道家维度**：王水照、崔铭指出此句\"虽已粗识老庄齐得失、等荣辱的哲理\"——这是苏轼最后的道家自觉。庄子\"齐物\"的\"等荣辱\"与孔子\"乘桴\"的不平，两者并列在颈联——苏轼一生在儒道之间徘徊，最终在海南的三年（读《庄子》、注《老子》）完成了\"儒道合一\"的整合。本诗是这一整合的诗化表达。\n\n**宋诗\"渡海\"主题的终结**：在中国古典诗歌中，\"渡海\"是极少见的题材——中国诗人大多写\"渡江\"、\"渡河\"、\"渡江淮\"，很少真正写\"渡海\"。苏轼此诗是宋诗（甚至可说整个中国古典诗歌）中最完整的\"渡海\"诗——它有天象、有海色、有风浪、有沉思、有对七年的总评。一个诗人用一首诗把\"渡海\"这件事的所有维度都写尽了，这是中国诗歌史上罕见的\"全集式\"之作。\n\n## 六、关联网络\n\n- **海南时期（元符三年，1100）**：本诗作于自海南量移北归渡海之时，是苏轼\"海南三年\"的总结之作。\n- **晚年诗群**：与《惠州一绝》、《澄迈驿通潮阁》二首、《过岭》二首等共同构成苏轼\"岭海外放诗\"的群谱。\n- **渡海与贬谪文学**：本诗与李白《渡荆门送别》、杜甫《江上》、王安石《泊船瓜洲》等\"渡江\"诗遥相呼应，是中国古典诗歌\"行旅诗\"的最高峰。\n\n## 七、溯源记录\n\n- **原文依据**：通行《苏轼诗集》（中华书局孔凡礼点校本）卷四三元符三年（1100）作；李一冰《苏东坡新传》、王水照、崔铭《苏轼传》、林语堂《苏东坡传》均完整引述。\n- **系年依据**：孔凡礼《苏轼年谱》系于元符三年（1100）六月二十日渡琼州海峡。李一冰《苏东坡新传》系同年同月。\n- **异说**：诗题\"六月二十日夜渡海\"在通行整理本中亦作《六月二十日夜渡海》一首；个别注本作《渡海》。";
