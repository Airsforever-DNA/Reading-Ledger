<script>
const MD = "# 水龙吟·次韵章质夫杨花词\n\n## 一、题名与体裁\n**词牌源流**：「水龙吟」又名「龙吟曲」「庄椿岁」，调名本意即「水中龙吟」，唐教坊曲之一；宋人用以写咏物、抒情诸调。\n**字数体式**：双片一百零二字，前后片各十一句、九韵；为长调之一。用韵较宽，可平仄互押。\n\n## 二、原文\n> 章质夫杨花词，妙绝，使屯田（柳永）缘情绮靡而不自觉者，复何以加此。乃次其韵。\n>\n> 似花还似非花，也无人惜从教坠。抛家傍路，思量却是，无情有思。萦损柔肠，困酣娇眼，欲开还闭。梦随风万里，寻郎去处，又还被，莺呼起。\n>\n> 不恨此花飞尽，恨西园、落红难缀。晓来雨过，遗踪何在？一池萍碎。春色三分，二分尘土，一分流水。细看来，不是杨花，点点是离人泪。\n\n## 三、写作背景\n**系年**：宋神宗元丰四年（1081）。\n**地点**：黄州（今湖北黄冈）。\n**触发动  机**：章质夫（章楶）作《水龙吟·杨花词》，苏轼读后称「妙绝」，乃次其韵（按章词原韵和作）。这是文学史上著名的「次韵」之例。\n**异说**：①章质夫原作之流传版本——宋以来传本不一（王灼《碧鸡漫志》记章词「今世传者不一」），主流取《唐宋诸贤绝妙词选》所收本；②词作年月异说——主流取元丰四年；王文诰《苏诗编注集成》有「元丰五年」说，主流取前者。\n\n## 四、逐句笺注\n- **似花还似非花**：起句石破天惊——不直接言「杨花」而以「似花非花」起，奠定全词「咏物—抒情」之双关基调。\n- **也无人惜从教坠**：杨花飘坠，无人珍惜——「也无人惜」之冷淡与「似花非花」之追问形成对照。\n- **抛家傍路**：杨花离枝（家）而坠于路边——「抛」字赋予杨花以人之行为。\n- **思量却是，无情有思**：思量之下，看似无情实则有意——「无情」「有思」之对举是全词主题。\n- **萦损柔肠**：杨花飘舞，似柔肠之萦损——以女子之「柔肠」拟杨花。\n- **困酣娇眼，欲开还闭**：以人之「娇眼」拟杨花合拢之态——「困酣」「欲开还闭」皆女子之慵态。\n- **梦随风万里，寻郎去处**：化唐人金昌绪《春怨》「打起黄莺儿，莫教枝上啼。啼时惊妾梦，不得到辽西」之意——杨花为思妇之梦，梦随风万里寻郎。\n- **又还被，莺呼起**：又还被黄莺惊起——呼应金昌绪诗意。\n- **不恨此花飞尽，恨西园、落红难缀**：「此花」指杨花，「落红」指其他春花——不恨杨花飞尽，恨春花难再留。\n- **晓来雨过，遗踪何在**：经一夜雨，杨花何在？\n- **一池萍碎**：杨花经雨化为浮萍——苏轼自注「杨花落水为浮萍，验之其过，则如所说也」——这是苏轼基于实地观察之创作。\n- **春色三分，二分尘土，一分流水**：春色三分——二分归于尘土（落红之命运），一分归于流水（杨花之命运）——这是中国古代「分数写情」之典型。\n- **细看来，不是杨花，点点是离人泪**：结句最妙——杨花点点即是离人泪——「离人泪」之喻使全词从咏物之层跃入赠别之层。\n\n## 五、综合赏析\n此词全以「杨花」为意象主体，但层次分明——上片由「似花非花」之辨识起，经「无情有思」之深化，至「梦随风万里寻郎」之展开；下片由「飞尽」「难缀」之恨起，经「遗踪何在」之追问，至「二分尘土，一分流水」之命运分割，最末以「点点是离人泪」之总结——全词形成「咏物—拟人—抒情—喻理」之完整结构。\n\n最关键处有三：其一，「似花还似非花」之起句——这一句奠定了整首词的格调：不以「杨花」直接命名，而是以「似与非」之辨起，使全词有一种哲学反思之层次。其二，「萦损柔肠，困酣娇眼」之拟人——以女子之柔肠娇眼拟杨花，使杨花有了「情」之维度。其三，「细看来，不是杨花，点点是离人泪」之结句——这一句将「杨花」与「离人泪」彻底等同，使全词从咏物飞跃为抒离愁之词。这是宋词「咏物—抒情」之最高典范。\n\n「春色三分」之「分数写情」是苏轼独创——以分数分配情感之比例，是数字与诗学之巧妙结合。这种「以数字入词」之手法，为宋词开辟了新境界。\n\n苏轼此词写于黄州谪居初期，正是「拣尽寒枝不肯栖」（《卜算子》）精神之延续——以杨花自况飘泊无依、以离人泪自况思念故人。然此词以「杨花」之意象比《卜算子》之「孤鸿」更柔美、更多情，是苏轼婉约词之代表作。\n\n## 六、关联网络\n- **人物**：章质夫（章楶，字符明，建州浦城人，时任提点刑狱公事，苏轼至交）；柳永（章乐卿），苏轼词中「屯田」即指柳永（《乐章集》）。\n- **人生事件**：元丰四年（1081）春，黄州谪居——是年苏轼在东坡开垦「东坡」地。\n- **其他作品互见**：章质夫原作《水龙吟·杨花词》（「燕忙莺懒芳残，正堤上、杨花飘坠」）；《和子由渑池怀旧》《卜算子·黄州定慧院寓居作》（同谪居期）。\n- **文化史影响**：奠定宋词「次韵」之最高典范；「似花还似非花」「春色三分，二分尘土，一分流水」「点点是离人泪」皆成千古名句；南宋辛弃疾、史达祖之杨花词皆继承之。\n\n## 七、溯源记录\n- **原文依据**：通行整理本（邹同庆、王宗堂《苏轼词编年校注》本），与模型知识一致。\n- **系年依据**：邹同庆、王宗堂《苏轼词编年校注》、孔凡礼《苏轼年谱》卷十八，均系元丰四年；王文诰《苏诗编注集成》有「元丰五年」说，主流取前者。\n- **异说来源**：①章质夫原词流传版本——王灼《碧鸡漫志》卷二专章讨论，主流取《唐宋诸贤绝妙词选》本；②「一池萍碎」之版本异文——「萍碎」一作「萍翠」「萍醉」等，待核《唐宋诸贤绝妙词选》《花庵词选》之原刻。\n- **未竟事项**：①苏轼自注「杨花落水为浮萍」之现代生物学考证——浮萍与杨花非同源，苏轼之观察有误；②「次韵」章词与原韵之完整对照——待补章质夫词集辑本。";
