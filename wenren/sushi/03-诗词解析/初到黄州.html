<script>
const MD = "# 初到黄州\n\n## 一、题名与体裁\n七言律诗。元丰三年（1080）二月苏轼初抵黄州时作。押平水韵\"七阳\"（忙、荒、香、郎、囊）。\n\n## 二、原文\n\n自笑平生为口忙，老来事业转荒唐。\n长江绕郭知鱼美，好竹连山觉笋香。\n逐客不妨员外置，诗人例作水曹郎。\n只惭无补丝毫事，尚费官家压酒囊。\n\n## 三、写作背景\n\n元丰二年（1079）十二月苏轼出狱，责授检校水部员外郎、黄州团练副使，本州安置，不得签书公事。元丰三年（1080）正月，苏轼自京师启程南下，二月一日抵达黄州。\n\n李一冰《苏东坡新传》：\"苏轼抵达黄州，作《初到黄州》诗，感觉非常满足，只有开头两句，可以解释为他平生只为'口食'奔忙，但也不妨解读为一生皆因'口舌'遭殃。\"王水照、崔铭《苏轼传》：苏轼在黄州\"毫无补于世，却还要白白领取朝廷发给的薪俸，虽然检检官的薪水照例只能以实物折支，得到的多半是官府用剩的酒袋。想到这里，不知不觉又吟成了一首诗：'自笑平生为口忙……'。\"\n\n## 四、逐句笺注\n\n**首联**：\"自笑平生为口忙，老来事业转荒唐。\"——\"自笑\"是自嘲；\"为口忙\"双关：① 一生为\"口食\"奔忙——苏轼一生因言事获罪，又以\"口食\"自养；② 一生因\"口舌\"遭殃——苏轼因诗文中\"讪谤\"言词被逮入狱，故\"为口忙\"亦为\"为言获罪\"的反讽。\"老来\"指四十三岁入黄州，已属\"老\"（在宋代士人的年龄感中）；\"事业转荒唐\"——一生的事业到头来变成荒唐——既是自嘲，也是政治控诉。\n\n**颔联**：\"长江绕郭知鱼美，好竹连山觉笋香。\"——\"郭\"指黄州外城；\"长江绕郭\"指长江在黄州城外绕流而过。\"知鱼美\"化用《孟子·告子上》\"鱼，我所欲也\"之意；\"好竹连山\"是黄州城外多竹；\"觉笋香\"是看到好竹，便联想到春笋的香味。这两句是典型的黄州写景——长江、好竹、鱼美、笋香，是黄州的\"四美\"。\n\n**颈联**：\"逐客不妨员外置，诗人例作水曹郎。\"——\"逐客\"是被放逐之客；\"员外置\"指检校员外郎的虚衔；\"诗人例作水曹郎\"——历史上被贬的诗人常任水部员外郎或检校水部员外郎（杜甫曾任检校工部员外郎，韩愈曾任水部员外郎）。苏轼以\"员外\"+\"水曹\"两个虚衔自嘲——这哪里是\"诗人\"应该做的事？分明是被放逐者的\"惯例\"。\n\n**末联**：\"只惭无补丝毫事，尚费官家压酒囊。\"——\"无补丝毫事\"是自谦——自己对国家、对百姓没有一丝一毫的补益；\"尚费官家压酒囊\"——还要白白耗费官府发给的、用酒袋压着的薪水。\"压酒囊\"是宋代的一种实物薪俸形式——官员薪俸的一部分以酒囊（酒袋）折支。\"官家\"指朝廷。\n\n## 五、综合赏析\n\n这是苏轼\"贬谪文学\"的第一首代表作，也是\"自嘲\"作为政治抗议的典范之作。\n\n**\"为口忙\"的双关**是此诗的诗眼。李一冰指出\"为口忙\"的双关：\"口食\"与\"口舌\"。前者是温饱层面（苏轼确实一生为一家温饱而奔波），后者是言说层面（苏轼因言事而入狱）。苏轼把这两层意义压在同一个\"口\"字上，这是宋诗\"以一字见两意\"的精妙用法——一个\"口\"字，既承认自己的\"言事获罪\"是咎由自取（自嘲），也暗含一种\"无辜\"——谁让\"口\"长在我身上？\n\n**\"荒唐\"的自我定位**：苏轼把自己半生仕途（从凤翔签判到杭州通判、密州知州、徐州知州、湖州知州）总结为\"荒唐\"。这是士大夫\"自我贬低\"的传统——白居易《琵琶行》\"座中泣下谁最多，江州司马青衫湿\"是同一种修辞。但苏轼的\"荒唐\"比白居易的\"沦落\"更狠——\"荒唐\"是**直接否定**自己的事业，不像\"沦落\"还保留某种\"委屈\"。这是苏轼对自身处境的极端化处理**：既然你们说我\"讪谤\"，我便承认我的\"事业\"是\"荒唐\"。**\n\n**黄州四美**：颈联的\"长江绕郭\"、\"好竹连山\"是黄州的真实风光；颔联的\"知鱼美\"、\"觉笋香\"是苏轼在贬谪之初对黄州的第一印象。这四美与贬谪的政治处境形成强烈反差——明明是罪臣流放之地，黄州却是一片富足。这种反差是苏轼\"贬谪文学\"的起点：从这里开始，他要在最坏的政治处境里寻找最好的生活。\n\n**章法上的\"自嘲—赞美—自嘲\"**：首联自嘲（荒唐），颔联赞美（黄州四美），颈联自嘲（逐客/水曹），末联自嘲（无补/酒囊）。这是一首**通篇自嘲**的诗——但正因为全篇自嘲，所以颔联的\"赞美\"才格外突兀、格外明亮。苏轼在被放逐的第一首诗里，已经显示出他日后在黄州的根本精神：**在最坏的政治处境里写出最好的诗**。\n\n## 六、关联网络\n\n- **黄州时期（元丰三年—七年，1080—1084）**：苏轼在黄州前后五年，是其文学创作的黄金期。本诗是黄州文学的第一首。\n- **乌台诗案后作品**：与《黄州寒食寄子由二首》《题西林壁》《海棠》《东坡》等共同构成\"黄州诗群\"。\n- **检校水部员外郎、黄州团练副使**：苏轼此后的所有诗文书信均以此虚衔署名；\"水曹郎\"由此成为苏轼被贬时期的\"通用自我定位\"。\n\n## 七、溯源记录\n\n- **原文依据**：通行《苏轼诗集》（中华书局孔凡礼点校本）卷二〇元丰三年（1080）作；李一冰《苏东坡新传》、王水照、崔铭《苏轼传》、林语堂《苏东坡传》均完整引述。\n- **系年依据**：孔凡礼《苏轼年谱》系于元丰三年（1080）二月一日抵达黄州后不久。李一冰《苏东坡新传》同系元丰三年。\n- **异说**：诗题\"初到黄州\"在通行整理本中亦有作《初到黄州》一首；个别注本作《黄州初到》。";
