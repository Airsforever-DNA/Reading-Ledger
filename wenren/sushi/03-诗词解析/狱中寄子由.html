const MD = "# 狱中寄子由\n\n## 一、题名与体裁\n七言律诗二首之一。元丰二年（1079）苏轼因\"乌台诗案\"系御史台狱时所作。押平水韵\"十一真\"（春、身、人、神、因）。\n\n诗前原有长题：*\"予以事系御史台狱，狱吏稍见侵，自度不能堪，死狱中，不得一别子由，故作二诗，授狱卒梁成，以遗子由。\"*\n\n## 二、原文\n\n圣主如天万物春，小臣愚暗自亡身。\n百年未满先偿债，十口无归更累人。\n是处青山可埋骨，他年夜雨独伤神。\n与君世世为兄弟，更结人间未了因。\n\n> **版本校记**（依据 99-溯源/网络采集-补充核源-main.md，维基文库专页与 ctext《苏轼集》卷二十九交叉）：本篇定字从宋刊本系统——「自**亡**身」一作「自**忘**身」（维基文库注异文，ctext 作「忘身」）；「他**年**夜雨」一作「他**时**夜雨」；尾句「**更结人间**未了因」——维基文库、ctext 作「人间」，网络流传本多作「更结来生未了因」，另见「又结」变体。本文以「更结人间未了因」为主文本（「人间」与首联「万物春」意象呼应），异文并注。\n\n## 三、写作背景\n\n元丰二年（1079）七月二十八日，苏轼由湖州任上被逮赴御史台狱（即乌台），关押于京师。罪由是\"乌台诗案\"——舒亶、李定等人从苏轼诗文中摘出\"讪谤新政\"之句加以弹劾。苏轼入狱后，自度必死，遂作两首绝命诗，托狱卒梁成秘藏枕下，嘱其若己死则转交苏辙。\n\n李一冰《苏东坡新传》：\"那两首诗，冠以长题曰：'予以事系御史台狱，狱吏稍见侵，自度不能堪，死狱中，不得一别子由，故作二诗，授狱卒梁成，以遗子由。'二首：'圣主如天万物春……'与'柏台霜气夜凄凄……'\"。王水照、崔铭《苏轼传》亦完整记录此二诗，并指出：\"两首绝命诗凄楚哀怨，令人不忍卒读。\"\n\n## 四、逐句笺注\n\n**首联**：\"圣主如天万物春，小臣愚暗自亡身。\"——\"圣主如天\"是颂圣（皇帝是天之子）；\"万物春\"是天覆万物、万物生春——这是\"罪己颂圣\"的双层写法，把颂圣与自承罪愆绑在一起。\"小臣愚暗自亡身\"——我这个愚昧小臣，自己作死；\"愚暗\"是自贬，\"亡身\"是认罪。\n\n**颔联**：\"百年未满先偿债，十口无归更累人。\"——\"百年未满\"指苏轼时年四十三，距\"百年\"（高寿之意）尚远；\"先偿债\"是说要先把欠下的\"债\"（指言行的过失）偿完才能继续活下去——这是死亡预言。\"十口无归\"指一家十口（苏轼、苏辙两家）没有归宿；\"更累人\"是更拖累子由。这是苏轼对身后事的安排——把对兄弟的牵挂托出。\n\n**颈联**：\"是处青山可埋骨，他时夜雨独伤神。\"——\"是处青山可埋骨\"——任何一处青山都可以埋我的骨——这是苏轼对自己肉身的处置；化用谢安\"埋骨于山水\"之意。\"他时夜雨独伤神\"——将来（指苏轼死后），子由在夜雨时会独自伤心——直接说\"独\"，是预设自己已不在世（此句\"他时\"一作\"他年\"，校记见第二节）。\n\n**尾联**：\"与君世世为兄弟，更结人间未了因。\"——\"与君世世为兄弟\"——这一世之外，再下一世、再下一世——永远是兄弟。这是绝笔中最强烈的伦理承诺。\"更结人间未了因\"——这一世未了的因缘，再结下去（一作\"更结来生未了因\"，直指来世，语更显豁；\"人间\"则与首联\"万物春\"的人间意象回环，收束更沉）。另颈联\"他年夜雨\"一作\"他时夜雨\"。两说均见流传本，校记见第二节。\n\n## 五、综合赏析\n\n这是苏轼一生中最沉痛的两首诗之一，也是中国古典诗歌中最著名的\"绝笔诗\"。\n\n它的核心艺术在**双层话术**——把\"颂圣\"与\"认罪\"、\"交代后事\"与\"约定来生\"对位。首联\"圣主如天万物春\"是\"表\"，\"小臣愚暗自亡身\"是\"里\"——表面对皇帝的颂扬，实质是死囚的自我辩护。这是宋代士大夫面对帝王时最典型的修辞：通过颂圣来求情，通过自贬来保命。苏轼的颂圣是真心的吗？不是；是策略吗？也不全是。两者兼有——他真诚地承认\"愚暗\"，但绝不认\"讪谤\"。\n\n更深一层看，这首诗的伦理结构是**由\"我\"转向\"你\"**：从首联的\"圣主/小臣\"对位（公的政治身份），到颔联的\"百年/十口\"（私的家庭身份），再到颈联的\"青山/夜雨\"（独与友），最后到尾联的\"世世兄弟/来生未了\"（永恒的伦理承诺）——苏轼用了两首绝笔律诗的容量，把\"我\"从公共领域一步步拉回到\"你我\"之间的私领域。这是宋诗中\"私情入公罪\"的最成功范例——他把一首\"上皇帝书\"写成了一首\"家书\"。\n\n王水照、崔铭《苏轼传》指出：\"'夜雨对床'的旧约就这样永远地飘逝了！于是，他用颤抖的手提笔写道：'圣主如天万物春……'\"——\"夜雨对床\"出自苏轼与苏辙嘉祐六年（1061）郑州相别时的约定：\"夜雨何时听萧瑟\"，是兄弟俩一生中最深的约定。苏轼写这首诗时，自度将死，所以把\"夜雨对床\"的不可能写出——\"他年夜雨独伤神\"（一作\"他时\"）：子由将来某夜听雨时，会想到我，但我已经不在了。这是苏轼最沉痛的\"预悼\"。\n\n李一冰记：\"苏轼入狱后，杭州父老感念这个好官，为作解厄道场，祈祷神灵保佑他平安无事。\"在这样的政治氛围下，苏轼写出这首既颂圣又预悼的诗，是中国诗歌史上极罕见的文学/政治事件。\n\n**版本补充**：与本诗同时作的还有第二首（\"柏台霜气夜凄凄，风动琅珰月向低。梦绕云山心似鹿，魂飞汤火命如鸡。眼中犀角真吾子，身后牛衣愧老妻。百岁神游定何处，桐乡知葬浙江西。\"）——这一首更写实，更多监狱夜景的直接描摹；本诗则更沉郁、更概括。\n\n## 六、关联网络\n\n- **乌台诗案（元丰二年，1079）**：苏轼由湖州知州任上被逮，七月二十八日入御史台狱，十二月二十八日出狱，责授水部员外郎、黄州团练副使。本诗作于狱中。\n- **兄弟夜雨之约**：苏轼与苏辙的\"夜雨对床\"之约始于嘉祐六年（1061）；此后屡以\"夜雨何时听萧瑟\"相忆。本诗颈联\"他年夜雨独伤神\"（一作\"他时\"）是这一约定的最深一次书写。\n- **《黄州寒食寄子由》**：本诗之后的元丰三年（1080），苏轼贬黄州后又有《黄州寒食寄子由二首》\"自我来黄州，已过三寒食\"——绝笔未死，遂转为寒食寄诗的次生系列。\n\n## 七、溯源记录\n\n- **原文依据**：通行《苏轼诗集》（中华书局孔凡礼点校本）卷一九元丰二年（1079）作，附诗前长序。李一冰《苏东坡新传》（传记引述，源文件页码标记稀疏）：前后段落完整引述二诗全文。\n- **系年依据**：孔凡礼《苏轼年谱》系于元丰二年（1079）七月至十二月间狱中所作。李一冰亦系元丰二年乌台狱中。\n- **异文校记**：「亡身/忘身」「他年/他时夜雨」「更结人间/来生未了因」三组，多源交叉见 99-溯源/网络采集-补充核源-main.md（维基文库/ctext/百度百科）。\n- **异说**：王文诰《苏诗编注集成》注此诗为\"狱中寄子由二首\"之\"其一\"；少部分整理本将第二首\"柏台霜气夜凄凄\"作\"其二\"。两首都属同一长序下的组诗。";
