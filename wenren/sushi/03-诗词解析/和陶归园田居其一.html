const MD = "# 和陶归园田居·其一\n\n## 一、题名与体裁\n\n五言古诗（和陶诗，次韵）。苏轼《和陶归园田居六首》组诗之其一，次韵陶渊明《归园田居·其一》，韵脚（山、年、渊、田、间、前、烟、颠、闲、然）次第全依原作。通行系年绍圣二年（1095）三月惠州作（据诗序白水山之游，两传行程互证）；选目口径作「绍圣四年—元符元年儋州初期」——两说并存，详见第七节。\n\n## 二、原文\n\n（序，节引）「三月四日，游白水山佛迹岩，沐浴于汤泉，晞发于悬瀑之下，浩歌而归，肩舆却行，以与客言，不觉至水北荔枝浦上。晚日葱昽，竹阴萧然，荔枝累累如黄实矣。有父老年八十五，指以告余曰：『及是可食，公能携酒来游乎？』意欣然许之。」归卧闻幼子苏过诵读陶渊明《归园田居》诗，乃悉次其韵。\n\n环州多白水，际海皆苍山。\n以彼无尽景，寓我有限年。\n东家著孔丘，西家著颜渊。\n市为不二价，农为不争田。\n周公与管蔡，恨不茆三间。\n我饱一饭足，薇蕨补食前。\n门生馈薪米，救我厨无烟。\n斗酒与只鸡，酣歌饯华颠。\n禽鱼岂知道，我适物自闲。\n悠悠未必尔，聊乐我所然。\n\n## 三、写作背景\n\n此诗是苏轼和陶诗的早期代表作。和陶的缘起要追溯到元祐七年（1092）：「他在扬州时，曾经写过《和陶渊明饮酒二十首》，在惠州、儋州二地，则几乎和遍了所有陶诗」（王水照、崔铭《苏轼传》）。林语堂《苏东坡传》则记：「最杰出的成就是一百二十四首《和陶诗》。他在颖州就开始『和』这些诗……等他离开惠州，已经完成一百零九首，最后十五首……都在海南岛完成。」（和陶始于扬州或颍州，两说并注。）苏轼自道其好陶之由（苏辙《子瞻和陶渊明诗集引》引）：「吾于诗人无所甚好，独好渊明之诗。渊明作诗不多，然其诗质而实绮，癯而实腴」，且「岂独好其诗也哉，如其为人，实有感焉」，表示「欲以晚节师范其万一」。\n\n绍圣二年三月四日，苏轼游惠州白水山（林语堂引其书信，信末自署「三月四日〔1095年〕」，与此诗序相合），归途行至荔枝浦，八十五岁老父邀他荔枝熟时携酒重游；归卧后闻苏过诵陶诗，遂次韵成六首。贬惠以来「杜门自屏」的罪臣，在山水与人情里找到了陶渊明式的居所。\n\n## 四、逐句笺注\n\n**「环州多白水，际海皆苍山。」**——惠州一带（环州，环绕州城）多瀑布溪泉（白水山以瀑布名），东江迤逦接海，四望皆青山。开篇即以陶体的疏淡白描落笔。\n\n**「以彼无尽景，寓我有限年。」**——以天地无尽之景，寄托我有涯之年。语意本《庄子》「吾生也有涯」而反用其意：景无尽，年有限，正好寓居。这是全诗的哲思纲领。\n\n**「东家著孔丘，西家著颜渊。市为不二价，农为不争田。」**——把惠州邻里写成孔丘、颜渊聚居之乡：市上不二价，田间不相争。这是以三代淳风理想化贬地民风，与《十月二日初到惠州》「父老相携迎此翁」同源。\n\n**「周公与管蔡，恨不茆三间。」**——周公诛管叔、蔡叔，骨肉相残；恨不能同住三间茅屋做平民兄弟。于田园牧歌中忽着此冷峭一笔，隐然有对当朝骨肉株连、党祸相残之慨〔推断〕。\n\n**「我饱一饭足，薇蕨补食前。」**——一饭已饱，采薇蕨佐餐；用伯夷叔齐采薇首阳典，写安贫。\n\n**「门生馈薪米，救我厨无烟。斗酒与只鸡，酣歌饯华颠。」**——学生送柴米，救了冷灶；村人斗酒只鸡，为白头老人饯行劝饱。「华颠」即白头。两组人情，把「邻曲」写足了。\n\n**「禽鱼岂知道，我适物自闲。悠悠未必尔，聊乐我所然。」**——禽鱼哪里懂得道理？我自适意，万物自闲。「我适物自闲」是全诗警句：陶的「返自然」是退出后的归宿，苏的「物自闲」是安顿中的化境。末联收束：世事悠悠未必尽如人意，且乐我所自得。\n\n## 五、综合赏析\n\n和陶诗是苏轼晚年的一件大事——苏辙评其海南诗作「精深华妙，不见老人衰惫之气」，而「质而实绮，癯而实腴」八个字，正是苏轼从陶诗中提炼、又由和陶诗实践出来的晚年美学纲领。这一首要读懂三件事。\n\n**一、次韵之难与「以陶写苏」。**次韵等于戴着陶渊明的镣铐起舞：韵脚、次第全依原作，一步不能错。陶《归园田居·其一》是「久在樊笼里，复得返自然」的得遂初愿；苏轼套着同一副韵脚写的却是逐臣的安顿——陶是自愿归田，苏是被迫投荒。王水照、崔铭说得透彻：「陶渊明是主动的，苏轼则为被动，主动者如脱钩之鱼，被动者如服辕之马。」所以同写田园，陶诗是如释重负，苏诗是苦中作乐而有自得。\n\n**二、田园的底下埋着一根刺。**「东家著孔丘，西家著颜渊」四句把惠州写成三代之直，是理想化；但「周公与管蔡，恨不茆三间」陡然翻出骨肉相残的古典——在绍圣党祸、兄弟分窜雷儋的背景下，这一联是田园牧歌里的一声冷笑〔推断〕。苏轼的平淡从来不是没有波澜，而是波澜按进了水面之下。\n\n**三、「我适物自闲」是苏轼给陶渊明的续笔。**陶说「池鱼思故渊」，是鱼归故渊；苏说「禽鱼岂知道，我适物自闲」——禽鱼不必知道什么道理，我自适而物自闲，物我两不相扰。这一句把陶的「自然」推到了禅与庄的交界处：不是回到某个桃源，而是就地获得自在。后来的「一壑能专」（儋州）、再到「兹游奇绝冠平生」，都是从这里生长出去的。\n\n## 六、关联网络\n\n- **和陶谱系**：上承扬州《和陶饮酒二十首》（元祐七年），同组有《和陶归园田居》六首（其二「穷猿既投林」、其三「新浴觉身轻」等），下接儋州《和陶拟古九首》《和陶怨诗示庞邓》等——岭海和陶由此组而成规模（去惠时已得一百零九首，林语堂说）。\n- **惠州山水人情**：与《食荔枝二首·其二》《荔枝叹》同期；白水山之游又见其《与陈季常书》（「今日游白水佛迹」）。\n- **陶苏关系**：与苏轼「随行有《陶渊明集》，陶写伊郁，正赖此耳」（《答程全父推官》，王水照、崔铭引）互证——和陶非文字游戏，是晚年的精神依靠。\n\n## 七、溯源记录\n\n- **原文依据**：全诗二十句经维基文库《和歸園田居六首》专页逐句核对（2026-09-29 网络采集，采词「周公与管蔡」「禽鱼岂知道」分段复核）；序文纪游部分据王水照、崔铭《苏轼传》第十一章引述；「归卧既觉，闻儿子过诵渊明《归园田居》诗六首，乃悉次其韵」据 ctext《蘇軾集》序文。\n- **系年依据（多记录并存）**：通行系年绍圣二年（1095）三月惠州作，据诗序「三月四日游白水山」与两传行程互证（林语堂引书自署「三月四日〔1095年〕」）；**选目口径作「绍圣四年—元符元年儋州初期」，与此系年不合，两说并存注记并上报（另见「未完成项」）**。\n- **重要辨正**：选目所引「东方有一士」系**陶渊明《拟古九首·其五》原句**，非苏轼《和陶归园田居·其一》本文（维基文库、ctext 核对一致）；「东方有一士」的和作为儋州单行篇**《和东方有一士》**（通行本《和陶拟古九首》其五另为咏冼夫人之作，维基文库《和拟古九首》核对）——已按 2026-09-29 授权「选目勘误补收」另立《和东方有一士.md》，本条 2026-09-29 复核时同步订正（初辨曾误指其在《和陶拟古九首》其五）。\n- **和陶总数与缘起异说**：林语堂记一百二十四首、始于颍州；王水照、崔铭记始于扬州《和陶饮酒二十首》——两说并注。\n";
