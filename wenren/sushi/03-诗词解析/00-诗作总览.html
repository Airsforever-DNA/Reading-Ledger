const MD = "> **系年异说与文本异文处理规范（Qi 拍板 2026-09-29）**：凡系年有争议的作品，多记录并存、标注清楚，不裁决单一系年——各系年下的解读角度均附注保留，两读皆通；文本异文同理并注。岭海时期（惠州·儋州·北归，1094-1101）选目按「可信最大并集」口径收录，不限单数。\n>\n> **增补记录（2026-09-29）**：经 Qi 拍板「可信最大并集」口径，岭海时期增补 6 首（第 16—21 首）；同日经授权「选目勘误补收」再立 1 篇（第 22 首），本册由 15 首扩为 22 首；增补各篇系年异说按上行规范双注。\n>\n> **选目错位存档（2026-09-29，勘误补收依据）**：原选目第 4 首引「东方有一士」系**陶渊明《拟古九首·其五》原句**，非苏轼《和陶归园田居·其一》本文；「东方有一士」的和作为儋州单行篇**《和东方有一士》**（通行本《和陶拟古九首》其五另为咏冼夫人之作，经维基文库《和擬古九首》《和東方有一士》专页核对）——故补收第 22 篇，原引文错位记录于此存档。\n\n# 苏轼诗作总览\n\n## 一、选目说明：为何这 22 首能覆盖苏轼诗风的演变\n\n苏轼一生诗作约 2400 余首（王水照、崔铭《苏轼传》统计），现存 2700 余首。要从这 2700 余首中选出既具代表性、又能体现诗人一生诗风演变的作品，是一项高度结构化的工作。\n\n**本选目的覆盖逻辑**：\n\n苏轼诗风的演变，大致可分为五个阶段：\n1. **早期（1061 之前）**——学韩愈、学韦应物、应举习作；\n2. **凤翔—杭州—密州时期（1061—1078）**——酬唱、写景、记事；\n3. **徐州—湖州时期（1077—1079）**——博喻、感旧、咏物；\n4. **黄州时期（1080—1084）**——理趣、东坡、海棠；\n5. **岭海时期（1094—1101）**——和陶、纪行、政治诗。\n\n22 首的分布如下：\n- **早年酬唱（1061 前后）**：第 1、2 首——和子由渑池怀旧、出颍口初见淮山是日至寿州（早期兄弟送别、纪行诗）。\n- **杭州写景（1071—1074）**：第 3、4、5、8 首——六月二十七日望湖楼醉书、饮湖上初晴后雨、春宵、湖上夜归（西湖写景四联屏）。\n- **徐州咏物（1077—1078）**：第 6、7 首——东栏梨花、百步洪（感旧诗、博喻诗）。\n- **黄州理趣（1080—1084）**：第 9、10、11、12、13 首——狱中寄子由、初到黄州、东坡、海棠、题西林壁（贬谪第一年—东坡居士确立—理趣顶峰）。\n- **岭海纪行（1094—1101）**：第 14—22 首——荔枝叹、六月二十日夜渡海〔原有双壁〕，及〔增补〕食荔枝二首·其二、纵笔、儋耳、和陶归园田居·其一、汲江煎茶、自题金山画像，〔勘误补收〕和东方有一士（惠州风物与谪趣、儋州气象与日常、和陶大端、北归平生自评）。\n\n这条线由\"早期酬唱\"到\"杭州写景\"到\"徐州咏物\"到\"黄州理趣\"到\"岭海纪行\"——对应苏轼诗风的五段重要演变。\n\n**为什么选这 22 首（不是其他）**：\n\n- **以\"理趣\"为核心**：苏轼诗区别于唐诗的最大特点，是\"理趣\"。本选目用《和子由渑池怀旧》《饮湖上初晴后雨》《题西林壁》《东坡》四首建立理趣诗谱系。\n- **以\"贬谪\"为骨架**：苏轼一生的转折点是乌台诗案与黄州贬谪。本选目用《狱中寄子由》《初到黄州》《东坡》《荔枝叹》《六月二十日夜渡海》《自题金山画像》等呈现\"贬—赦—归\"三段。\n- **以\"西湖—东坡—海南\"为地标**：苏轼一生最重要的三个地理坐标——杭州西湖、黄州东坡、海南儋州。本选目中《饮湖上初晴后雨》《东坡》《六月二十日夜渡海》分别写三地。\n- **以\"兄弟\"为情感线**：苏轼与苏辙的兄弟情是其一生的伦理底色。本选目用《和子由渑池怀旧》《狱中寄子由》《东栏梨花》呈现三次最重要的兄弟时刻。\n- **增补七首的四条线（2026-09-29）**：① 岭海日常审美线——《食荔枝二首·其二》《纵笔》《汲江煎茶》，由一果一饭写到一瓢一杓一更声；② 儋州气象线——《儋耳》补「垂天雌霓、快意雄风」的天象奇观；③ 和陶线——《和陶归园田居·其一》《和东方有一士》合观岭海和陶之始与深（「我适物自闲」与「我即渊明」），并使「东方有一士」这一陶原句在册内有了对应的苏轼和作；④ 平生自评线——《自题金山画像》以「黄州惠州儋州」六字收官，与 06-轶事「旷达胸襟」册互见。\n\n---\n\n## 二、22 首系年总表\n\n| 序号 | 诗题（首句） | 系年 | 地点 | 体裁 | 主题 |  [和东方有一士.md](和东方有一士.md) |\n\n---\n\n## 三、诗风演变总览\n\n### 阶段一：早年酬唱（1061 前后）——学韦柳的清淡与理趣萌芽\n\n苏轼 1061 年赴凤翔途中写下《和子由渑池怀旧》《出颍口初见淮山是日至寿州》两首。前者奠定苏轼理趣诗的起点——\"雪泥鸿爪\"的隐喻从此定格为汉语成语；后者建立苏轼\"以清淡语写沉痛情\"的早期风格。两首诗皆写\"赴凤翔途中\"，是苏轼\"走向权力边缘\"的第一次。\n\n**核心特征**：① 以\"兄弟\"为情感中心；② 以\"无常\"为哲思底色；③ 写景学韦应物、柳宗元。\n\n### 阶段二：杭州写景（1071—1074）——西湖诗学的完成\n\n苏轼在杭州通判任上两年多，留下《饮湖上初晴后雨》《六月二十七日望湖楼醉书》《湖上夜归》《春宵》等名篇。这是苏轼诗的\"写景成熟期\"——他把西湖写成了一面镜子，把宋诗的写景推向\"瞬间\"与\"过程\"两个维度。\n\n**核心特征**：① 写景的\"动态化\"（云、雨、风、月皆动）；② 比喻的\"双向化\"（晴对雨、淡对浓）；③ 感官的\"轻盈化\"（暗香、细浪）。\n\n### 阶段三：徐州咏物（1077—1078）——博喻与感旧\n\n苏轼知徐州两年，写下《百步洪》《东栏梨花》等诗。前者把\"舟过急流\"的瞬间感写成七喻连珠的\"博喻诗\"；后者把\"中年\"写成\"几清明\"——这是宋诗\"以赋为诗\"与\"以议论为诗\"的合体。\n\n**核心特征**：① 博喻的密度；② \"以赋为诗\"的能力；③ \"感旧\"的中年意识。\n\n### 阶段四：黄州理趣（1080—1084）——东坡居士的诞生\n\n元丰二年（1079）乌台诗案后，苏轼贬黄州前后五年。这是苏轼诗的\"黄州时期\"——也是其创作最丰沛、思想最深化的时期。本选目用《狱中寄子由》《初到黄州》《东坡》《海棠》《题西林壁》五首呈现这一时期。\n\n**核心特征**：① 政治苦难的诗化处理（自嘲、双关）；② \"东坡\"作为审美符号的诞生；③ 理趣诗的顶峰（《题西林壁》）；④ \"物我同一\"的极致（《海棠》）。\n\n### 阶段五：岭海纪行（1094—1101）——和陶、政治、回归\n\n元祐更化之后，章惇为相，苏轼远谪惠州、海南。本选目用《荔枝叹》《六月二十日夜渡海》两首呈现晚期。晚期是苏轼把\"贬谪\"翻转成\"奇游\"的精神胜利——\"九死南荒吾不恨，兹游奇绝冠平生\"。\n\n**核心特征**：① 把\"贬谪\"翻转成\"奇游\"；② 晚期\"反讽\"与\"民本\"的合一（荔枝叹）；③ 儒道融合的最高表达（渡海）。\n\n〔增补扩写〕增补七首后，岭海期共九首，另见四条新线：《食荔枝二首·其二》《纵笔》见惠州谪趣与\"因诗得罪\"传说的交汇，《儋耳》《汲江煎茶》见儋州的天地奇观与日常审美，《和陶归园田居·其一》《和东方有一士》见岭海和陶之始与深——由「我适物自闲」到「我即渊明，渊明即我」，《自题金山画像》以「黄州惠州儋州」六字收束平生自评——至此岭海期由\"双壁\"扩为贬谪（纵笔、自题）—风物（食荔枝）—政治（荔枝叹）—和陶（归园田居、东方有一士）—气象（儋耳）—日常（汲江煎茶）—回归（渡海）的完整光谱。\n\n---\n\n## 四、文本传播与版本问题\n\n原选 15 首诗（不含增补 7 篇）在文本传播史上有几个关键节点：\n- **王十朋集注本（南宋）**：未收《春宵》——这是《春宵》在苏诗文本史上的特殊性（详见《春宵.md》第六节）。\n- **明成化四年（1468）吉安府本《东坡集·续集》**：《春宵》才收入本集。\n- **中华书局孔凡礼点校本（1982）**：现行通行本，本文所引以此为底本。\n\n异文与异说详见各篇第六节\"溯源记录\"。\n\n---\n\n## 五、参考与素材\n\n本文写作主要依据以下传记与研究著作：\n- 林语堂《苏东坡传》（1977 中文版）\n- 李一冰《苏东坡新传》（1983 初版）\n- 王水照、崔铭《苏轼传》（2000）\n- 朱刚《苏轼十讲》（2019）\n- 王水照《苏轼研究》（1980 年代初版）\n- 王水照、朱刚《苏轼评传》（2018）\n\n详细引用见各篇第六节。\n\n### 溯源口径说明\n\n本系列 22 篇解析的第六节\"溯源记录\"遵循如下二元口径：\n- **[模型知识]**：正文文本本身及诗题/系年，凡属常见整理本（如中华书局孔凡礼点校《苏轼诗集》、王文诰《苏诗编注集成》、冯应榴《苏轼诗集合注》）所收之通行文本，均以此标注。\n- **[传记引述]**：写作背景、地理、人物关系的具体陈述，凡能从以下 6 本传记中定位者，均以\"传记名 + 章节要点\
