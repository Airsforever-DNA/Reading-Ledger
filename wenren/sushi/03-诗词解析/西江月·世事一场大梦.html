const MD = "# 西江月·世事一场大梦\n\n## 一、题名与体裁\n**词牌源流**：「西江月」调名本意即「西江之月」，唐玄宗时教坊曲；南唐冯延巳、欧阳炯均有作，宋人继之。\n**字数体式**：双片五十字，前后片各四句、四韵；以平韵为主。\n\n## 二、原文\n> 世事一场大梦，人生几度秋凉？夜来风叶已鸣廊，看取眉头鬓上。\n>\n> 酒贱常愁客少，月明多被云妨。中秋谁与共孤光，把盏凄然北望。\n\n## 三、写作背景\n**系年**：宋神宗元丰五年（1082）或宋哲宗元符元年（1098）。\n**地点**：黄州（今湖北黄冈）或儋州（今海南儋县）。\n**触发动  机**：词写中秋感怀——世事如梦、人生易老、对月独酌、无可共语。\n**异说**：①黄州说——邹同庆、王宗堂《苏轼词编年校注》系元丰五年（1082）黄州作；②儋州说——清人王文诰《苏诗编注集成》系元符元年（1098）儋州作。两种异说长期并存。\n\n## 四、逐句笺注\n- **世事一场大梦**：化李白《春夜宴从弟桃花源序》「浮生若梦」之意——以「大梦」喻世事之虚幻。\n- **人生几度秋凉**：「秋凉」一作季节之秋，一作心境之凉——苏轼两解皆有。\n- **夜来风叶已鸣廊**：夜风过处，叶落廊前——「鸣廊」之「鸣」字赋予落叶以声响。\n- **看取眉头鬓上**：眉头渐蹙、鬓上渐白——直写衰老之迹。\n- **酒贱常愁客少**：酒价虽贱，然客少——寂寞之意，与陶渊明「过门更相呼，有酒斟酌之」之愿相映。\n- **月明多被云妨**：月明常被云遮——既是自然之实，亦是人事之喻。\n- **中秋谁与共孤光**：中秋佳节，无人共此孤月。\n- **把盏凄然北望**：举杯北望——北望者何？若作黄州，则北望汴京（朝廷）；若作儋州，则北望故土家人。\n\n## 五、综合赏析\n此词全以「中秋」之时点、「孤独」之情怀、「大梦」之感慨三者为骨架。世事如梦、人生易老是哲学命题；秋风落叶、眉头鬓白是生理之衰；酒贱客少、月明云妨是社交之困；中秋谁共、北望何方是情感之孤。四层并陈，而以「凄然」二字收束——凄然是情感之实写，亦是苏轼谪居心绪之总概括。\n\n最关键处是「世事一场大梦」之「大梦」二字——这不是消极之颓唐，而是苏轼对人生本质之哲学把握。谪居岁月之中，功名之不可期、故旧之不可见、壮志之不可展，皆使「大梦」之喻有具体所指。「人生几度秋凉」之「几度」二字，将人生之有限性具体化——并非无限之长，而是有限之秋凉。\n\n「把盏凄然北望」之「北望」二字，是全词情感之地理化——若解为黄州作，则「北望」指向汴京，是贬谪者对朝廷之思（虽非眷恋，但亦非决绝）；若解为儋州作，则「北望」指向故土与兄弟，是天涯沦落者对家乡之思。两种解读皆通向「孤独」之主题。\n\n此词与苏轼其他中秋词（《水调歌头·丙辰中秋》密州作、《念奴娇·中秋》黄州作）并读，可见「中秋」在苏轼词中已成一种特殊之时点——每至中秋，皆引发对人生、对家国、对兄弟、对孤独之深度思索。\n\n## 六、关联网络\n- **人物**：北望者若解为黄州，则指向汴京之朝臣故旧（如王安石、司马光等）；若解为儋州，则指向苏辙（时在雷州）。\n- **人生事件**：①元丰五年（1082）黄州——「乌台诗案」后贬黄第三年；②元符元年（1098）儋州——贬儋第三年，已年六十二。\n- **其他作品互见**：《水调歌头·丙辰中秋》（1076 密州）、《念奴娇·中秋》（1082 黄州）、《西江月·黄州中秋》（此词异名）。\n- **文化史影响**：「世事一场大梦」为后世常用成语；「把盏凄然北望」为孤独主题之名句。\n\n## 七、溯源记录\n- **原文依据**：通行整理本（邹同庆、王宗堂《苏轼词编年校注》本），与模型知识一致。\n- **系年依据**：黄州说见邹同庆、王宗堂《苏轼词编年校注》；儋州说见王文诰《苏诗编注集成》。两说并存，未定论。\n- **异说来源**：①系年之争（详见上）；②「中秋谁与共孤光」之理解——黄州说强调苏轼与黄州友人徐大正、王适等之疏离；儋州说强调与苏辙雷州之相距。\n- **未竟事项**：①同行者、当时具体情境之考订；②「酒贱常愁客少」是否与元符年间儋州酒价贬低有关——待补《儋县志》《宋史·苏轼传》之经济史料。";
