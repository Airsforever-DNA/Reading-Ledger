const MD = "# 江城子·密州出猎\n\n## 一、题名与体裁\n**词牌源流**：同「江城子·乙卯正月二十日夜记梦」条。\n**字数体式**：双片七十字，前后片各七句、五韵，平韵为主。\n\n## 二、原文\n> 密州出猎与太守会猎于铁沟。\n>\n> 老夫聊发少年狂。左牵黄，右擎苍。锦帽貂裘，千骑卷平冈。为报倾城随太守，亲射虎，看孙郎。\n>\n> 酒酣胸胆尚开张。鬓微霜，又何妨？持节云中，何日遣冯唐？会挽雕弓如满月，西北望，射天狼。\n\n## 三、写作背景\n**系年**：宋神宗熙宁八年（1075）。\n**地点**：密州（今山东诸城）任所。\n**触发动机**：与密州知州（即轼本人）出猎于铁沟，地方会猎。苏轼时年三十九，借出猎抒写报国之志。\n**异说**：题目作「密州出猎」或「猎于铁沟」两存之；密州「铁沟」之确切位置待考（《诸城县志》）。\n\n## 四、逐句笺注\n- **密州出猎与太守会猎于铁沟**：小序明记事件、地点。密州知州即苏轼本人，故「太守」乃自称。\n- **老夫聊发少年狂**：「老夫」三十九岁之自称，含谐谑意；「聊发少年狂」点出全词核心——一己之狂兴与群体之场面。\n- **左牵黄，右擎苍**：黄犬、苍鹰——田猎之标配，本《史记·李斯传》「臂苍鹰」之意。\n- **锦帽貂裘，千骑卷平冈**：随从之服饰与场面——「卷」字写出马蹄扬尘之迅疾。\n- **为报倾城随太守**：倾城，倾一城之人；为报一城人追随之盛意，「亲射虎，看孙郎」——「看孙郎」即看孙权，《三国志·吴书·孙权传》载孙权「亲乘马射虎」，此处苏轼自况。\n- **酒酣胸胆尚开张**：承上片之场面转入酒酣之豪情。\n- **鬓微霜，又何妨**：回应首句「老夫」——虽鬓已斑白，何碍壮志？\n- **持节云中，何日遣冯唐**：《史记·冯唐列传》载云中郡守魏尚获罪，冯唐持节赦之；苏轼借汉文帝遣冯唐赦魏尚之典，自比魏尚，问何时朝中有人为陈情而赦免其罪——实暗指自己外放密州之「罪责」。\n- **会挽雕弓如满月，西北望，射天狼**：「天狼」星名，主侵掠（《楚辞·九歌·东君》「举长矢兮射天狼」）；西北望——指向西夏（北宋西北主要敌国）。此句为宋词中罕见之边塞报国主题。\n\n## 五、综合赏析\n此词全以「狂」字为基调——上片写狂之「场面」，下片写狂之「志向」。上片之「狂」是外向的——左牵黄、右擎苍、千骑卷平冈、倾城随太守——把出猎场面之壮阔写出至极致。下片之「狂」由外向转入内向——由酒酣胸胆之开张转入「鬓微霜又何妨」之自许，再转入「持节云中何日遣冯唐」之借古喻今，最末以「会挽雕弓如满月，西北望，射天狼」之边塞报国之志作结。\n\n最关键处有二：其一，借古喻今之「冯唐」典——苏轼自比魏尚，将「何日赦免」之愿以典故之含蓄方式表达，既抒报国之志，又隐约陈情。其二，「西北望，射天狼」——「天狼」指向西夏，「西北」指向宋之敌国，这是苏轼词中罕见之边塞主题，为宋词开拓之新境——传统宋词多写男女之情、离愁别绪、家国之痛，「射天狼」之立志一扫旧习，奠定豪放词派之开阔气象。\n\n此词与同月所作之悼亡词《江城子·乙卯正月二十日夜记梦》对比阅读，可见苏轼情感之广度——一月之中，一写极私之悼亡，一写极公之报国；一以「千里孤坟」「明月短松」收，一以「西北望」「射天狼」收——情感之两极并陈，最见苏轼人格之完整。\n\n## 六、关联网络\n- **人物**：铁沟会猎之同行者姓名未详——苏轼在密州时期之交游有赵昶、孔文仲等。\n- **人生事件**：熙宁七年（1074）自杭州通判移知密州——这是苏轼首次任主政一方之州官；熙宁八年（1075）密州任内重要一年。\n- **其他作品互见**：《和子由渑池怀旧》（1069 赴密途中）、《江城子·乙卯正月二十日夜记梦》（同月悼亡）、《水调歌头·丙辰中秋》（次年中秋怀子由）。\n- **文化史影响**：奠定宋词豪放词之政治抱负范式；「会挽雕弓如满月，西北望，射天狼」为辛弃疾、陆游、刘克庄等南宋爱国词人所继承与发展。\n\n## 七、溯源记录\n- **原文依据**：通行整理本（邹同庆、王宗堂《苏轼词编年校注》本），与模型知识一致。\n- **系年依据**：邹同庆、王宗堂《苏轼词编年校注》、孔凡礼《苏轼年谱》卷十六，均系熙宁八年冬。\n- **异说来源**：①题目「密州出猎」与「猎于铁沟」两存之——邹同庆《苏轼词编年校注》注出；②「铁沟」地理位置——清《诸城县志·古迹志》、民国《续修诸城县志》两存异说，待考。\n- **未竟事项**：同行出猎之姓名考，待补《密州诗文集》及《苏轼年谱》密州诗文考。";
