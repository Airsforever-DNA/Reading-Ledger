<script>
const MD = "# 纵笔\n\n## 一、题名与体裁\n\n七言绝句。绍圣四年（1097）春作于惠州白鹤峰新居（通行系年；亦有系绍圣三年〔1096〕后段之说——选目作「绍圣四年 1096 前后」，即绍圣三年末至四年初之间，两读并注）。押平水韵「二冬」（容、钟），首句「风」借邻韵「一东」。\n\n## 二、原文\n\n白头萧散满霜风，小阁藤床寄病容。\n报道先生春睡美，道人轻打五更钟。\n\n## 三、写作背景\n\n绍圣三年（1096）是苏轼在惠州最凄楚的一年：七月爱妾朝云病逝，「苏迈带着苏过和自己的眷属来到惠州」之前，他鳏居经年（王水照、崔铭《苏轼传》）。绍圣四年二月，白鹤峰新居落成，合家团聚，他以为「新居成，庶几其稍安乎」，谁知住了不到两个月，绍圣四年四月便接到再贬琼州别驾、昌化军安置的告命。\n\n本诗即新居春日之作。关于它有一个著名传说：南宋曾敏行《独醒杂志》载，此诗传至京师，章惇见「报道先生春睡美」之句，曰「苏子瞻尚尔快活」，遂有再贬儋州之命。王水照、崔铭《苏轼传》转述并评论道：「据说这首诗传到京师，章惇笑道：『苏子瞻竟然如此快活！』于是把苏轼贬得比所有人都远。苏轼再贬海南当然绝不仅仅是章惇故意要他睡不好，而主要是当时政治斗争的必然结果，但这个传说也的确形象地反映了苏轼因才遭嫉，因诗得罪，因名惹祸的实际情形。」林语堂《苏东坡传》亦记此说而明标传闻性质：「有人记载说，他写了两行诗描述他在春风中小睡，聆听屋后庙院钟声的情景。章惇读到这段诗，就说：『原来苏东坡那么惬意。』于是颁布了移居的命令。」\n\n## 四、逐句笺注\n\n**「白头萧散满霜风」**——「萧散」是萧疏散漫、不拘检束之态；六十上下的逐臣白发，散立在春寒未尽的霜风里。起句先自画一幅衰颓像。\n\n**「小阁藤床寄病容」**——白鹤峰新居的小阁、藤床；「寄」字最苦——病躯只是暂时「寄」放于此。苏轼在惠州久患痔疾，曾「自病自疗」，断食辟谷（王水照、崔铭《苏轼传》）。「寄病容」三字，把老、病、迁、居不安定的四层意思压在一处。\n\n**「报道先生春睡美」**——「报道」犹言「传话告诉」；有人传报说：先生春睡正美。不说自己睡得美，而借旁人之口说出，一句转折，前两句的衰颓气象忽然翻成谐趣。\n\n**「道人轻打五更钟」**——邻寺道人敲五更钟时，怕惊醒先生的春睡，特意放轻。诗到此戛然而止——钟声之「轻」，全是睡者之「适」的侧写。\n\n## 五、综合赏析\n\n这首诗的分量全在一个「轻」字上。\n\n**结构上是先抑后扬的绝句典范**。前两句极写其坏：白头、霜风、小阁、藤床、病容，逐臣晚景的诸种灰暗一一摆足；后两句忽然透进天光——一声放轻的五更钟，把前两句的沉重全部托住。绝句以第三句转折，此诗的「报道」二字正是机关：由自述转为传闻，由实境转入旁人眼中的自己，「病容」与「睡美」在两个视角里并行不悖——诗人自己知道病与老，而惠州的山寺与人情只看见一个睡得香甜的先生。\n\n**「轻打五更钟」是宋诗里少见的以声写静的好笔墨**。钟本该惊梦，这里却是护梦；「轻」是道人的体贴，更是惠州这片土地对逐臣的体贴。与《纵笔》同调的还有他写惠州的「鸡犬相识」、松风亭「此间有什么歇不得处」——都是把贬所写成可安居之地的小品笔墨，而此诗只用一个「轻」字就写尽了。\n\n**而这首诗的命运，使它成为中国诗史上罕见的「因快活得罪」的标本**。章惇因此诗再贬儋州的记载属南宋笔记传闻（王水照、崔铭明标「据说」，林语堂明标「有人记载说」），不能坐实为再贬的直接原因；但传闻之所以成立，正因为它是从乌台诗案到岭海之贬这条「因诗得罪」线索的天然延伸——六十年前因诗下狱，六十年后因诗睡不安稳，传说把这层因果浓缩在「春睡美」三个字里。\n\n**后话尤其意味深长**：到儋州后，苏轼又写《纵笔三首》，其一「寂寂东坡一病翁，白须萧散满霜风」——「白头」换作「白须」，同样的句式在海外重写一遍。一个连贬谪都压不垮的标题，被他连续使用：这不是巧合，是老人对自己生命状态的持续签收。\n\n## 六、关联网络\n\n- **惠州—儋州纵笔系列**：惠州《纵笔》（本篇）与儋州《纵笔三首》（「寂寂东坡一病翁，白须萧散满霜风」）首句同构，前后呼应，见谪居心迹的延续。\n- **「因诗得罪」谱系**：上接乌台诗案（《狱中寄子由》为狱中之作），下接岭海之贬；章惇传说一节是这条线索的民间定本。\n- **谪居自适谱系**：《初到黄州》《食荔枝二首·其二》《六月二十日夜渡海》——自嘲、自适、自胜的三级台阶，本诗居中段。\n\n## 七、溯源记录\n\n- **李一冰《苏东坡新传》补引（main 直采，2026-09-29）**：p909-910 白鹤峰新居《迁居》诗「已买白鹤峰，规作终老计」——本诗「小阁藤床」之居所语境；p921 绍圣四年章惇重提旧说、再贬之命下（责授琼州别驾、昌化军安置）——「春睡美」招祸说的政治大背景（李一冰叙事与王水照崔铭「政治斗争必然结果」评断同向）。\n\n- **原文依据**：〔模型知识·通行本〕《苏轼诗集》；王水照、崔铭《苏轼传》第十一章完整引述，文字全同。\n- **系年依据**：通行编年系绍圣四年（1097）春、惠州白鹤峰新居（新居成于绍圣四年二月，同年四月再贬）；选目作「绍圣四年 1096 前后」——即绍圣三年末至四年初之间，两读并注。\n- **传说性质的标注**：章惇因「春睡美」再贬儋州之说出自南宋曾敏行《独醒杂志》〔模型知识〕，属笔记传闻；两传转述时均加「据说」「有人记载说」限定，并明言再贬主因是绍圣四年朝廷对元祐臣僚的大规模追贬——本篇照此口径处理，不把传说写成史实。\n";
document.getElementById('content').innerHTML = marked.parse(MD);
