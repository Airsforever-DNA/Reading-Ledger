const MD = "# 六月二十七日望湖楼醉书\n\n## 一、题名与体裁\n七言绝句之一。熙宁五年（1072）六月二十七日，苏轼任杭州通判时，与友人在望湖楼饮酒，遇雨即景成诗五首，此为其一。押仄韵\"十七霰\"（山、船、天）。\n\n## 二、原文\n\n黑云翻墨未遮山，白雨跳珠乱入船。\n卷地风来忽吹散，望湖楼下水如天。\n\n## 三、写作背景\n\n熙宁五年（1072）夏，苏轼三十六岁，以通判杭州任。是年六月廿七日，他独登钱塘门外昭庆寺前的望湖楼饮酒，恰遇夏日阵雨。雨势急骤、变幻倏忽，苏轼即景连书五首七绝，此为其一（其二\"放生鱼鳖逐人来\"、其三\"乌菱白芡不论钱\"等亦传诵甚广）。\n\n李一冰《苏东坡新传》：\"六月二十七日，苏轼独上钱塘门外昭庆寺前的望湖楼喝酒，天忽阵雨，他尽情观赏了湖上的雨景，醉书五首绝句，其第一首曰：黑云翻墨未遮山……\"。王水照、崔铭《苏轼传》则记：\"朗日晴空固然是游湖的最佳日子，风雨交加的时节也未尝不别有情韵：'黑云翻墨未遮山……'\"。\n\n## 四、逐句笺注\n\n**首句**：\"黑云翻墨未遮山。\"——以\"翻墨\"喻乌云翻卷如泼墨，色彩、动态一齐出。\"未遮山\"三字关键：乌云虽密，却还没能把山遮住，写云雨骤起未骤合的\"倏忽之间\"。\n\n**次句**：\"白雨跳珠乱入船。\"——\"白雨\"对\"黑云\"，一白一黑，雨点在湖光映照下呈现白色；\"跳珠\"是具象的拟喻——雨滴打在船篷上蹦跳如珠，跳动再\"乱入船\"，写雨势之急。\n\n**三句**：\"卷地风来忽吹散。\"——风从地面卷起，乌云与骤雨一起被吹散。\"卷地\"二字得杜甫\"卷地风来忽吹散\"（《茅屋为秋风所破歌》）的笔意。\n\n**末句**：\"望湖楼下水如天。\"——雨霁之后，望湖楼下水面平静如镜，与天色合而为一。\"水如天\"三字既是写实（西湖水天一色），也回应首句\"未遮山\"——乌云散尽，山与天的原色重现。\n\n## 五、综合赏析\n\n这是宋诗中最著名的\"瞬间摄影\"之作。一首七绝 28 字里完成了一场完整的夏日阵雨：起云→下雨→风来→雨散，全在目睫之间。\n\n它的成功在三点：一是**色彩的对位**——\"黑云\"对\"白雨\"，首句铺底、次句衬明；二是**动词的精准**——\"翻\"、\"跳\"、\"卷\"、\"吹\"，四个动词把云、雨、风的动态串成连环画；三是**末句的回旋**——\"水如天\"既写实景（水面与天空同色），又回应首句\"未遮山\"，让整诗从\"乌云密布\"走到\"水天一色\"，在 28 字里把\"乱\"还给\"清\"。\n\n王水照、崔铭评此诗：\"云集而雨降，风来而天晴，来时迅猛，去时快疾，雨后湖上水天一色，分外清新。\"这是对苏轼写景诗最准确的概括：他不是静止地描写西湖，而是把西湖当作一个不断变化的\"过程\"来写。这种把\"动\"作为审美对象的倾向，正是苏轼诗学区别于王维、孟浩然那种\"画意诗\"的标志。\n\n从诗史看，此诗与同组其它四首合起来构成了中国古典诗歌中最完整的\"雨景谱\"：从云起（其一）、放生池（其二）、农事（其三）、新月小船（其四其五），把一场雨前、雨中、雨后、雨夜的西湖风景一网打尽。\n\n## 六、关联网络\n\n- **杭州通判时期（熙宁四年—熙宁七年，1071—1074）**：苏轼因与王安石新法不合自请外任，先后到杭州、密州、徐州、湖州。本诗是杭州通判期间作品。\n- **望湖楼醉书五绝**：其余四首亦为写景名作，其二\"放生鱼鳖逐人来\"写西湖放生池，其三\"乌菱白芡不论钱\"写湖鲜。\n- **与饮湖上初晴后雨的关系**：二诗同年而作，分别写西湖之\"动\"（云雨变幻）与\"静\"（晴雨皆美），共同构成苏轼对西湖的\"双面认知\"。\n\n## 七、溯源记录\n\n- **原文依据**：通行《苏轼诗集》（中华书局孔凡礼点校本）卷六熙宁五年（1072）杭州作；李一冰《苏东坡新传》、王水照、崔铭《苏轼传》、林语堂《苏东坡传》均完整引述。\n- **系年依据**：孔凡礼《苏轼年谱》系于熙宁五年（1072）六月二十七日，时苏轼任杭州通判。\n- **异说**：诗题\"六月二十七日望湖楼醉书\"在通行整理本中亦作《六月二十七日望湖楼醉书五绝》之\"其一\"；少数注本简作《望湖楼醉书》。";
