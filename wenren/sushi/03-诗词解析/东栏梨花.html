const MD = "# 东栏梨花\n\n## 一、题名与体裁\n七言绝句。熙宁十年（1077）苏轼知徐州时作。押仄韵\"十三覃\"（雪、月、白、花）。\n\n## 二、原文\n\n梨花淡白柳深青，柳絮飞时花满城。\n惆怅东栏一株雪，人生看得几清明。\n\n## 三、写作背景\n\n熙宁十年（1077）春，苏轼四十岁，知徐州军州事。苏轼到徐州任已是第二年，是年二月苏辙自南京来徐州相会，兄弟\"留百余日时，宿于逍遥堂\"（苏辙《逍遥堂会宿》诗序），追感嘉祐六年（1061）郑州相别以来的\"夜雨对床\"之约。同年暮春，苏轼见庭前梨花盛开而有感于人生易老，作此诗。\n\n李一冰《苏东坡新传》专章记述这一时期的兄弟重逢：\"苏轼读了这两首诗（按：指苏辙《逍遥堂会宿》二首），心里很是难过，想对老弟解慰一番。\"东栏梨花即作于此背景下，是苏轼\"中年感旧\"系列作品中的名篇。\n\n## 四、逐句笺注\n\n**首句**：\"梨花淡白柳深青。\"——一白一青、一淡一深，是色彩对位。梨花是白色的，但苏轼用一个\"淡\"字把它从\"白\"中拔出——淡到近乎\"有\"与\"无\"之间；柳树则是浓青色（\"深青\"），与梨花形成\"有/无\"的对照。\n\n**次句**：\"柳絮飞时花满城。\"——柳絮在暮春飞起，梨花满城盛开。两个意象都是暮春的特征：一\"飞\"一\"满\"，把时间与空间打叠在一起——时间的\"飞\"与空间的\"满\"，正是暮春最典型的时空气氛。\n\n**三句**：\"惆怅东栏一株雪。\"——\"东栏\"是庭园东边的栏槛旁；\"一株雪\"指一株盛开的梨花（梨花色白如雪，故以\"雪\"喻之）。苏轼在自家东栏前看见这株梨花，因它触动了\"清明\"这个双重意象——既是天气的清明节令，也是人事的清醒明净。\n\n**末句**：\"人生看得几清明。\"——\"看得几清明\"是双关：① 还能看几次\"清明节\"的梨花？② 还能看几次人生的清明？这是一个中年人的发问：表面在数季节的次数，骨子里在数生命的次数。\n\n## 五、综合赏析\n\n此诗是苏轼\"中年感旧\"诗中最精致的一首，也是宋诗\"以理趣写景\"与\"以景写情\"结合最紧密的范例之一。\n\n它的特殊之处在**第三、四句的倒装**。通常宋诗的理趣句会把\"理\"放在末句，\"景\"放在前面；但苏轼在这里反着来——\"惆怅东栏一株雪\"是景（东栏前的梨花），\"人生看得几清明\"是理；可这两句之间的逻辑跳跃极大：从一株梨花直接跳到\"人生\"——这是因为\"清明\"二字承担了桥梁。\"清明\"既是暮春的节气（梨花盛开的时节），又是人生的清醒状态；这两个语义被同一首七绝的二十八字黏合在一起。\n\n更深一层看，这首诗的悲剧性在于\"几\"字。\"几清明\"不是\"很多清明\"，而是\"还有几次清明\"——一个四十岁的中年人在数自己还剩多少个春天。这种\"自数\"在中国古典诗歌中并不罕见（陈子昂《登幽州台歌》\"前不见古人\"、杜甫\"万里悲秋常作客\"皆是），但苏轼把它放在最精致的梨花意象里：花是白色的、淡的、飞散的、无根的——人也是。\"惆怅\"二字定下基调：不是悲愤、不是伤感，而是一种有审美自觉的\"惆怅\"——知道美会消逝、知道春会过去、知道梨花明天就谢了，但今天仍然要去东栏前看它。\n\n李一冰特别指出：此诗与《逍遥堂会宿》二首、苏辙原作二首共同构成徐州时期兄弟唱和的\"清明\"主题——苏辙送别时\"误喜对床寻旧约，不知漂泊在彭城\"，苏轼则用\"东栏梨花\"回答：即使漂泊，每一年清明仍然是值得\"看得\"的。苏轼的中年，不是\"避世\"也不是\"入世\"，而是\"既看得清明、又惆怅清明\"的双重观看。\n\n## 六、关联网络\n\n- **兄弟唱和**：熙宁十年（1077）苏辙至徐州相会，作《逍遥堂会宿》二首：\"逍遥堂后千寻木，长送中宵风雨声。误喜对床寻旧约，不知漂泊在彭城\"；苏轼以《东栏梨花》《和子由逍遥堂五绝》作答。\n- **徐州时期（熙宁十年，1077）**：是苏轼知徐州军州事的第二年，是年有百步洪之游、逍遥堂会宿、黄楼之役等；本诗是徐州时期\"感旧\"主题代表作。\n- **清明主题**：宋代清明节是踏青、扫墓、赏花的高峰节令；苏轼把清明同时写为\"节气\"与\"人生清醒\"，是宋人节令诗的典范。\n\n## 七、溯源记录\n\n- **原文依据**：通行《苏轼诗集》（中华书局孔凡礼点校本）卷一四熙宁十年（1077）作；李一冰《苏东坡新传》、王水照、崔铭《苏轼传》均引用此诗关联背景。\n- **系年依据**：孔凡礼《苏轼年谱》系于熙宁十年（1077）暮春；李一冰《苏东坡新传》（传记引述，无确切页码定位）：\"熙宁十年二月始复会于澶濮之间，相从来徐\"为本诗创作背景。\n- **异说**：本诗在部分整理本中作《和子由逍遥堂五绝》之\"其四\"，诗题\"东栏梨花\"是首句简称。";
