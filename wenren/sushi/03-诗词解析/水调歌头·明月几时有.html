<script>
const MD = "# 水调歌头·明月几时有\n\n## 一、题名与体裁\n**词牌源流**：「水调歌头」始见唐崔峒《水调歌》大曲，「歌头」即大曲之第一段。依《词谱》，本调九十五字，前后片各四韵，共八韵；以「丙辰中秋」之作为宋词典范。\n**字数体式**：双片九十五字，前后片各四十七字又两字领句；上下片皆以仄韵为主，用韵较宽，可平仄通押。\n\n## 二、原文\n> 丙辰中秋，欢饮达旦，大醉，作此篇，兼怀子由。\n>\n> 明月几时有？把酒问青天。不知天上宫阙，今夕是何年。我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间。\n>\n> 转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆？人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。\n\n## 三、写作背景\n**系年**：宋神宗熙宁九年（1076）丙辰中秋。\n**地点**：密州（今山东诸城）任所。苏轼时年四十，由杭州通判移知密州。\n**触发动机**：是年中秋，与僚友通宵畅饮；与胞弟子由（苏辙）已六年未见（自熙宁四年通判杭州离汴京后）。词前小序明标「兼怀子由」。\n**异说**：王宗堂、邹同庆《苏轼词编年校注》系于熙宁九年；孔凡礼《苏轼年谱》同。刘尚荣《苏轼词全集》编次无异。词中「我欲乘风归去」之「归」字，向有解作「归朝廷」（神宗朝新法之际轼已外放六年）者，亦有解作「归天上」之神话回归者——主流取后说，前说可备一解。\n\n## 四、逐句笺注\n- **明月几时有**：化李白《把酒问月》「青天有月来几时？我今停杯一问之」句意。\n- **把酒问青天**：直承李白而加「青天」，使问者与所问对象并举，意境更阔。\n- **不知天上宫阙，今夕是何年**：用《长恨歌》「七夕长生殿」之神话时空感，兼疑天上未必知人间「今夕」。\n- **我欲乘风归去**：用《列子·汤问》御风而行、《庄子·逍遥游》「乘云气，浮游乎万物之祖」之意。\n- **又恐琼楼玉宇，高处不胜寒**：化用唐人「琼楼玉宇」意象；「不胜寒」一作自虚，非凭空感受，乃暗寓朝廷（高处）之冷峻。「又恐」维基文库底本作「**惟恐**」（见 99-溯源/网络采集-词15首.md），通行整理本多作「又恐」，本文从通行本并注异文（李一冰《苏东坡新传》p253 全文引此词亦作「惟恐」）。\n- **起舞弄清影**：化李白《月下独酌》「我歌月徘徊，我舞影零乱」之意。\n- **何似在人间**：转折关键——纵天上高寒可畏，终究不如人间温暖。苏轼一生出处之际的核心姿态：虽向往超脱，而终归于人间。\n- **转朱阁，低绮户，照无眠**：承月之行迹而视角由天上转入人间；「无眠」者即下文兼怀之人。\n- **不应有恨，何事长向别时圆**：诘问月之「有情」与「无情」；问月即问天。\n- **人有悲欢离合，月有阴晴圆缺，此事古难全**：以「古难全」三字涵盖人生根本性缺憾，是苏轼最具代表性的「以理化情」句式。\n- **但愿人长久，千里共婵娟**：从分离之哀转入永恒之愿；化谢庄《月赋》「美人迈兮音尘阙，隔千里兮共明月」。「婵娟」本形容美好之人，此处借指美好之月。\n\n## 五、综合赏析\n此词以中秋赏月为契机，由问月、欲登月、恐高寒、终归人间之脉络展开，构成由神话之思到人间之情的完整回环。前片核心在「归」与「不归」之间的张力——「欲乘风归去」是出尘之想，「何似在人间」是入世的最终裁决。这一裁决并非消极退让，而是经历超脱诱惑之后对人间温暖的有意识选择。后片由「转朱阁」之月引出「别时圆」之憾，再以「古难全」一句将个体之离愁提升为宇宙人生的共同法则，化解了情感的尖锐。最终落到「长久」与「共婵娟」之祝愿——「长久」是时间向度上的超越，「千里共」是空间向度上的超越。\n\n苏轼此词最深刻处在于：将个人思念、家庭情感与对宇宙人生的哲学反思三者熔于一炉。它不是单纯的怀人词，也非单纯的哲理词，而是「以哲思消化情感、以情感升华哲思」之典范。胡仔《苕溪渔隐丛话》誉为「中秋词，自东坡《水调歌头》一出，余词尽废」，此一断语之成立，正在于情感、意象、哲思三层结构的同时完整——三者缺其一，则中秋词坛格局皆可重排。\n\n## 六、关联网络\n- **人物**：苏辙（子由），时在齐州（济南）任职；同年八月曾请假赴密州与轼相聚数日，兄弟作诗唱和。\n- **人生事件**：熙宁七至九年（1074-1076）外放密州任期；与王安石新法集团政见分歧，外放内心苦闷。\n- **其他作品互见**：《和子由渑池怀旧》（熙宁六年，怀旧与人生无常之思）、《江城子·乙卯正月二十日夜记梦》（1075 密州悼王弗）。三篇并读，可见密州时期苏轼情感与哲思交织的整体面貌。\n- **文化史影响**：胡仔、王灼以来历代评家皆以「中秋绝唱」目之；南宋以降节庆应制词、祝寿词多有仿效。\n\n## 七、溯源记录\n- **原文依据**：通行整理本（邹同庆、王宗堂《苏轼词编年校注》中华书局 2002；龙榆生《东坡乐府笺》本亦同），与模型知识一致。\n- **系年依据**：邹同庆、王宗堂《苏轼词编年校注》、孔凡礼《苏轼年谱》卷十六，均系熙宁九年丙辰中秋。\n- **异说来源**：「归去」之解，见缪钺、叶嘉莹《灵谿词说》专章讨论；主流取神话回归说，「归朝廷」说见清人张惠言《词选》及相关评注。\n- **未竟事项**：「丙辰」具体月日与子由是否已在密州同度中秋之考证，待补方千里《宋人生卒年行录》或孔凡礼《苏轼年谱》附录。";
