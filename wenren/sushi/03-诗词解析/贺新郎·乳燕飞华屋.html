<script>
const MD = "# 贺新郎·乳燕飞华屋\n\n## 一、题名与体裁\n**词牌源流**：「贺新郎」又名「金缕曲」「金缕词」「乳燕飞」，调名本意即「贺新郎婚」之乐歌，宋人盛行；南宋辛弃疾、刘克庄多用之。\n**字数体式**：双片一百一十六字，前后片各十句、十韵；为长调之一。\n\n## 二、原文\n> 乳燕飞华屋。悄无人、槐阴转午，晚凉新浴。手弄生绡白团扇，扇手一时似玉。渐困倚、孤眠清熟。帘外谁来推绣户，枉教人、梦断瑶台曲。又却是，风敲竹。\n>\n> 石榴半吐红巾蹙。待浮花、浪蕊都尽，伴君幽独。秾艳一枝细看取，芳心千重似束。又恐被、秋风惊绿。若待得君来向此，花前对酒不忍触。共粉泪，两簌簌。\n\n## 三、写作背景\n**系年**：宋哲宗元祐年间或更早。\n**地点**：不可考——具体地点不详。\n**触发动  机**：苏轼对一才女子夏日幽居之描写；后人附会为「侍妾榴仙」之咏或对某人怀想。词无明确小序。\n**异说**：①系年异说——邹同庆、王宗堂《苏轼词编年校注》列之约元祐年间，未确考；②归属异说——宋以来即有传为辛弃疾作、贺铸作等异说，现代词学界一致归苏轼。③「石榴」女子身份——主流解为虚写，部分注家附会为苏轼侍妾「榴仙」。\n\n## 四、逐句笺注\n- **乳燕飞华屋**：乳燕在华屋间飞——起句写夏日华屋之清幽。\n- **悄无人、槐阴转午**：悄然无人，槐阴转过午后——「槐阴转午」四字写时间之悄然流逝。\n- **晚凉新浴**：傍晚凉意中女子新浴——「新浴」二字定女子之身份（高华而不艳俗）。\n- **手弄生绡白团扇**：手把玩生丝所制白团扇——化班婕妤《怨歌行》「新裂齐纨素，鲜洁如霜雪。裁为合欢扇，团团似明月」之意。\n- **扇手一时似玉**：扇与手皆白，一时如玉——写女子之洁白美。\n- **渐困倚、孤眠清熟**：渐困倦而独眠，清熟（梦熟）——「孤眠」二字关键。\n- **帘外谁来推绣户**：谁在帘外推门？\n- **枉教人、梦断瑶台曲**：使人之梦断于瑶台之曲——枉教人之等待虚惊。\n- **又却是，风敲竹**：原来只是风吹竹声——是风而非人，是竹而非门。\n- **石榴半吐红巾蹙**：石榴半开如红巾之蹙——「蹙」字写石榴花瓣之皱缩状。\n- **待浮花、浪蕊都尽**：等到一般之花皆谢尽。\n- **伴君幽独**：独此石榴陪伴幽独之人。\n- **秾艳一枝细看取**：细看此一枝秾艳。\n- **芳心千重似束**：芳心如千重之紧束——「芳心千重」与「红巾蹙」之呼应。\n- **又恐被、秋风惊绿**：又恐石榴一朝秋风起而叶惊——绿叶惊动则花不再存。\n- **若待得君来向此**：若等到君来看此花。\n- **花前对酒不忍触**：花前对酒而不忍触（石榴）——触则花落。\n- **共粉泪，两簌簌**：花瓣之粉泪与女子之泪水，两皆簌簌而下。\n\n## 五、综合赏析\n此词全以「夏日华屋—孤眠女子—石榴花」为三重意象，构成层层递进之情感结构。上片写「人」——乳燕、槐阴、晚凉、新浴、白团扇、孤眠清熟、推绣户、风敲竹——以女子之孤独生活起兴；下片写「花」——石榴半吐、浮花浪蕊、芳心千重、秋风惊绿、花前对酒、粉泪两簌簌——以石榴之命运写女子之命运。\n\n最关键处有三：其一，「帘外谁来推绣户，枉教人、梦断瑶台曲。又却是，风敲竹」之三次翻转——女子梦中以为人来推门——醒来发现无人——再听方知是风——三次翻转将女子之孤独、期待、失落、空寂全部写出。这一段是宋词中写「孤眠女子」之千古绝唱。\n\n其三，「石榴半吐红巾蹙」之比拟——以「红巾蹙」拟石榴花瓣之皱缩，是苏轼咏物之妙笔；其四，「芳心千重似束」之拟人——以「芳心千重」拟石榴之花瓣层叠，亦是苏轼独到之观察。\n\n「共粉泪，两簌簌」之结句最为悲美——花瓣之粉泪与女子之泪水「两簌簌」而下，是花与人之同情共振。这一意象是宋词中「人花同悲」主题之最高典范。\n\n此词归属之争颇多，然现代词学界一致归苏轼——其风格、其意象、其情感深度，皆与苏轼谪居后期词风相通。词中「枉教人梦断瑶台曲」之婉曲、「共粉泪两簌簌」之悲美，皆非他人可代笔。\n\n## 六、关联网络\n- **人物**：石榴女子身份不可考——主流解为虚写。\n- **人生事件**：①若作于黄州（约 1082），则与苏轼谪居期间「怜香惜玉」之情思相通；②若作于元祐年间（1089-1094），则与苏轼居汴京、杭、扬时期之交游有关。\n- **其他作品互见**：《贺新郎》同期作尚有「夏景」「秋情」等主题；可与《定风波·莫听穿林打叶声》《鹧鸪天·林断山明竹隐墙》《水龙吟·次韵章质夫杨花词》参看。\n- **文化史影响**：奠定宋词「咏物—拟人」之最高典范；「枉教人、梦断瑶台曲，又却是、风敲竹」为婉约词之名句；南宋辛弃疾《贺新郎》、史达祖《绮怀》皆有此意象之继承。\n\n## 七、溯源记录\n- **原文依据**：通行整理本（邹同庆、王宗堂《苏轼词编年校注》本），与模型知识一致。\n- **系年依据**：邹同庆、王宗堂《苏轼词编年校注》列之约元祐年间，未确考；王文诰《苏诗编注集成》有异说；孔凡礼《苏轼年谱》列为暂系年。\n- **异说来源**：①系年之争——主流约元祐年间（1089-1094），亦有归黄州说；②归属——宋以来传本不一（《草堂诗余》《花庵词选》曾有归辛弃疾、贺铸之误），现代词学界一致归苏轼；③「石榴」女子身份——旧注家多附会苏轼侍妾「榴仙」（待考）。\n- **未竟事项**：①词作具体年月之确考；②「乳燕飞华屋」之版本异文——南宋《草堂诗余》本作「乳燕栖华屋」，主流作「飞」。";
