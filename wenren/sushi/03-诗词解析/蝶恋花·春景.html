const MD = "# 蝶恋花·花褪残红青杏小\n\n## 一、题名与体裁\n**词牌源流**：「蝶恋花」又名「鹊踏枝」「凤栖梧」，调名本意为蝶恋花间之情景，原出唐教坊曲；南唐冯延巳、李煜多用此调，宋人继之。\n**字数体式**：双片六十字，前后片各五句、五韵；以仄韵为主。调中多用转折连词（却、又、不肯等），适合婉曲低回之情感。\n\n## 二、原文\n> 花褪残红青杏小。燕子飞时，绿水人家绕。枝上柳绵吹又少，天涯何处无芳草。\n>\n> 墙里秋千墙外道。墙外行人，墙里佳人笑。笑渐不闻声渐悄，多情却被无情恼。\n\n## 三、写作背景\n**系年**：宋哲宗元祐四年（1089）或稍后（一说约元丰年间作）。\n**地点**：具体地点不可考。\n**触发动  机**：词写春日踏青所见之情景——残红褪去、青杏初小、燕飞水绕、柳绵渐稀；下片写墙里墙外之情事。词无明确小序。\n**异说**：①系年异说——邹同庆、王宗堂《苏轼词编年校注》系元祐四年（1089）任杭州知州时作；龙榆生《东坡乐府笺》则系元丰年间（约 1080）；主流取元祐四年。②归属异说——此词亦有传为欧阳修（北宋）、晏殊作，文献学证据不一。\n\n## 四、逐句笺注\n- **花褪残红青杏小**：起句写暮春之景——红花已褪，青杏尚小，是春末之标志。\n- **燕子飞时，绿水人家绕**：燕子翻飞，绿水绕人家——「绕」字写水与人居之亲近。\n- **枝上柳绵吹又少**：柳绵即柳絮，柳絮随风渐稀——春之将尽。\n- **天涯何处无芳草**：《离骚》「何所独无芳草兮」之意——天涯处处皆有芳草，何必留恋此春？——含自慰亦含自伤。\n- **墙里秋千墙外道**：承春面之上之景转入情事——墙里有秋千，墙外是道路。\n- **墙外行人，墙里佳人笑**：墙外之行人听到墙里佳人之笑声。\n- **笑渐不闻声渐悄**：笑声渐远渐无——听觉上之消逝。\n- **多情却被无情恼**：多情之行人，无情之墙里——「恼」字写尽此情之无奈。\n\n## 五、综合赏析\n此词全以「春去」与「情逝」之双线结构展开——上片写景，下片写情；而景与情皆以「渐消」之动态推进。\n\n上片四句皆写春之将尽：花褪（残红褪尽）、燕飞（燕子更替新巢）、柳绵吹少（春深柳絮渐稀）、天涯芳草（春将远去）。四句连环而下，构成完整的「春之退场」过程——这是中国文学中典型的「伤春」主题。下片由景入情——墙里秋千、墙外行人、墙里笑声——三句以「墙里」「墙外」之空间分隔，暗示情感之不可通。最末「多情却被无情恼」之「恼」字，是全词情感之焦点——多情者烦恼于无情者，无情者并不知有此人。\n\n最关键处是「多情却被无情恼」之「恼」字——此字既写行人因墙里之笑声而起之情思，又写墙里之佳人其实无意于行人——是「自作多情」之叹。此句宋以来即被视为「多情」主题之名句，与晏殊《蝶恋花》（「昨夜西风凋碧树」）、欧阳修《蝶恋花》（「庭院深深深几许」）并为「蝶恋花」调之经典。\n\n此词与晏殊、欧阳修同调词相比，最显著处在于：以「天涯何处无芳草」之自慰冲淡「多情却被无情恼」之自伤——形成情感之自洽自愈结构，而非单方面之愁苦。这是苏轼词特有之「以理化情」之表现。\n\n## 六、关联网络\n- **人物**：墙里佳人身份未详——苏轼词中此类女性形象多为虚指而非实指。\n- **人生事件**：①元祐四年（1089）任杭州知州（约三月至任）——若主流系年成立；②若取元丰年间作，则为黄州谪居期间（约 1080-1082）作品。\n- **其他作品互见**：同期有《蝶恋花·春景》（另一首，写送春情景）、《蝶恋花·京口得乡书》等；可与晏殊、欧阳修同调词比较。\n- **文化史影响**：「天涯何处无芳草」为后世离别赠答常用成语；「多情却被无情恼」为多情主题之名句；秦观《踏莎行》「郴江幸自绕郴山，为谁流下潇湘去」与此词「绿水人家绕」之句法相通。\n\n## 七、溯源记录\n- **原文依据**：通行整理本（邹同庆、王宗堂《苏轼词编年校注》本），与模型知识一致。\n- **系年依据**：邹同庆、王宗堂《苏轼词编年校注》、龙榆生《东坡乐府笺》系元祐四年；王文诰《苏诗编注集成》系元丰年间，主流取前者。\n- **异说来源**：①系年之争（详见上）；②归属——唐圭璋《全宋词》收苏轼名下；《词品》《花草粹编》等早期词选本曾误收欧、晏名下，现代词学界一致归苏轼。\n- **未竟事项**：①「天涯何处无芳草」之化用——《离骚》「何所独无芳草兮」外，是否另有汉乐府或唐人诗化用，待补；②「墙里佳人」是否为实写（苏轼杭、密、黄时期交游中某位女性）——主流取虚指解。";
