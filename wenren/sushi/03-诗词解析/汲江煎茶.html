const MD = "# 汲江煎茶\n\n## 一、题名与体裁\n\n七言律诗。元符二年（1099）前后作于儋州桄榔庵（选目系元符二年；亦有元符三年〔1100〕春说，两读并注）。押「八庚」韵（烹、清、声、更），「瓶」属邻韵九青，庚青通押。诗有自注：「唐人云：茶须缓火炙，活火煎。」\n\n## 二、原文\n\n活水还须活火烹，自临钓石取深清。\n大瓢贮月归春瓮，小杓分江入夜瓶。\n雪乳已翻煎处脚，松风忽作泻时声。\n枯肠未易禁三碗，坐听荒城长短更。\n\n## 三、写作背景\n\n元符元年（1098），苏轼被董必逐出官舍，在城南桄榔树下买地筑桄榔庵，「老人与过子相对，如两苦行僧耳」（王水照、崔铭《苏轼传》引其书信）；元符二年儋耳米贵，他曾有「绝粮之忧」（林语堂引其辟谷笔记，自署四月十九日）。就在这近乎断炊的处境里，他把日常生活过成了审美：晨起理发、午窗坐睡、夜卧濯足，自编为《谪居三适》组诗——「汲水烧茶这样的生活细事，在他的生花妙笔之下，也显得魅力无穷」（王水照、崔铭《苏轼传》语）。《汲江煎茶》正与《谪居三适》同出一源：夜里亲到江边钓石汲取活水，回庵煎茶，坐听更声，成此八句。\n\n## 四、逐句笺注\n\n**「活水还须活火烹，自临钓石取深清。」**——活水（流动的江水）还须配活火（有焰的炭火），句法如口头禅而出处凿凿（自注引唐人论茶语）。他不遣仆代劳，「自临钓石」，亲自汲取江心深处最清的水。\n\n**「大瓢贮月归春瓮，小杓分江入夜瓶。」**——大瓢舀水，连水中的月影一并舀起，贮入瓮中；小杓舀水，仿佛把一条江分出一角，注入瓶里。「贮月」「分江」是全诗最奇之笔：月与江本不可携，苏轼让它们随水入瓮入瓶。\n\n**「雪乳已翻煎处脚，松风忽作泻时声。」**——茶汤煮沸，白沫翻起（茶乳为「雪乳」，茶沫为「脚」）；倾泻时水声忽起，如松涛骤至。「松风」喻煎茶声是苏轼的惯调，早有《试院煎茶》「飕飕欲作松风鸣」〔模型知识〕。\n\n**「枯肠未易禁三碗，坐听荒城长短更。」**——反用卢仝《七碗茶歌》「三碗搜枯肠」〔模型知识〕：卢仝三碗便搜出文字，苏轼自嘲枯肠空空，三碗也未必禁得起；于是不写诗了，只是坐着，听荒城里长一声短一声的更鼓。「荒城」即儋州。\n\n## 五、综合赏析\n\n杨万里评此诗「一篇之中句句奇，一句之中字字奇」（〔模型知识〕，语出《诚斋诗话》），这不是虚誉——八句诗，每两句都站得住，合起来又是一气呵成的完整一夜。\n\n**奇在把「汲水」写成「揽月分江」。**颔联是宋诗炼句的绝品：瓢起则月入瓮，杓落则江入瓶——物象是水，意象是月与江。「贮」「分」两个动词各有着落：月不可贮而贮之，江不可分而分之，虚处坐实，小中见大。一碗茶的原料，被他写成天地的馈赠；而做这件事的人，是个快断粮的六十多岁逐臣。\n\n**奇在声音贯穿全篇。**首句「活火烹」的炭火声，到「松风忽作」的沸滚声，再到「长短更」的更鼓声，声浪由近而远、由暖而寒，正是这首诗的时间结构：从入夜汲水、煎茶、饮茶，一直坐到五更将尽。「坐听」二字尤可玩味——不是失眠，是听；荒城的更声本来凄凉，被他听成了茶后的余韵。\n\n**最奇的是结句的「荒」字。**前六句把儋州的夜写得澄澈明净、有月有江有松风，第七句忽然翻出「枯肠」，第八句落到「荒城」——一个「荒」字，把前面的美丽全部照亮，又全部压住。苏轼的高明正在于此：他不为贬谪涂脂抹粉，荒是实荒，美是实美，两样并置，互不抹杀。与《儋耳》的「快意雄风」对读，可见儋州苏轼的两副笔墨：登高则天地壮阔，煎茶则斗室澄明；而无论哪一副，底色都是那个「坐听荒城」的清醒的人。\n\n**这首诗也是苏轼「日常审美化」的终极样本。**从黄州的「长江绕郭知鱼美」，到惠州的「日啖荔枝三百颗」，到儋州的「大瓢贮月」——同一部诗史，越贬越远，越写越细：由江山风月，而一果一饭，而一瓢一杓一更声。苏辙评其海南诗「精深华妙，不见老人衰惫之气」，此诗足以当之。\n\n## 六、关联网络\n\n- **儋州日常诗群**：与《谪居三适》（旦起理发、午窗坐睡、夜卧濯足）、《纵笔三首》《书上元夜游》共同构成桄榔庵的日常书写。\n- **茶诗谱系**：上承《试院煎茶》（「飕飕欲作松风鸣」），旁通卢仝《七碗茶歌》，是宋人茶诗的压卷之作。\n- **晚年美学**：与《和陶归园田居·其一》「我适物自闲」同一境界——由外物之适，到物我两闲；与《六月二十日夜渡海》的夜、水、声意象遥相呼应（一夜渡海，一夜听更）。\n\n## 七、溯源记录\n\n- **李一冰《苏东坡新传》补引（main 直采，2026-09-29）**：p945-958 桄榔庵时期生活叙事（逐出官舍后「尚有此身，付与造物」之自处、儋州日常起居）——本诗「大瓢贮月归春瓮」的日常实践语境；本诗未获李一冰逐句笺释，按通行本标注。\n\n- **原文依据**：〔模型知识·通行本〕《苏轼诗集》；王水照、崔铭《苏轼传》第十一章完整引述并系于桄榔庵时期，自注「唐人云：茶须缓火炙，活火煎」一并引录。\n- **异文**：王水照、崔铭本首句作「活水**还需**活火烹」，通行本作「还须」——照录双注。\n- **系年依据（多记录并存）**：选目系元符二年（1099）；儋州桄榔庵期（元符元年至三年）通行；亦有元符三年（1100）春说——不裁决。\n- **评语**：杨万里「一篇之中句句奇，一句之中字字奇」出《诚斋诗话》〔模型知识〕，未核原书页，待核。\n";
