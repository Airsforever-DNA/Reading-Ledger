<script>
const MD = "# 百步洪\n\n## 一、题名与体裁\n七言古诗长篇。元丰元年（1078）苏轼知徐州时作。组诗二首，此为其一。押平水韵\"十一尤\"（波、梭、磨、落、坡、脱、荷、涡）。\n\n## 二、原文\n\n长洪斗落生跳波，轻舟南下如投梭。\n水师绝叫凫雁起，乱石一线争磋磨。\n有如兔走鹰隼落，骏马下注千丈坡。\n断弦离柱箭脱手，飞电过隙珠翻荷。\n四山眩转风掠耳，但见流沫生千涡。\n\n## 三、写作背景\n\n元丰元年（1078），苏轼知徐州。是年重阳，苏轼主持黄楼落成典礼（黄河抗洪的纪念建筑）；同年，他与好友王巩（定国）、颜复等多次出游百步洪。百步洪在徐州城东南五里，是泗水的一段急流，因落差大、水流湍急而得名。苏轼以连珠博喻的手法，将舟过急流的感受化成千古名篇。\n\n李一冰《苏东坡新传》、王水照、崔铭《苏轼传》均将此诗定为元丰元年（1078）秋知徐州时所作。此诗是苏轼\"以文为诗\"、\"以赋为诗\"的代表作，也是宋诗\"博喻\"手法的典范。\n\n## 四、逐句笺注\n\n**首二句**：\"长洪斗落生跳波，轻舟南下如投梭。\"——\"长洪\"指百步洪（也作\"百步洪\"，因水势汹涌而得名）；\"斗落\"形容落差极大，像用\"斗\"量过一样陡然下跌。水面激起\"跳波\"——不是平静的微波，而是跳跃的白浪。\"轻舟南下如投梭\"——轻舟在南下的过程中快得如织布的梭子，一来一去。\n\n**次二句**：\"水师绝叫凫雁起，乱石一线争磋磨。\"——\"水师\"即船夫；\"绝叫\"指惊恐尖叫。两岸乱石对峙，水道只在\"一线\"间穿过；船行其间仿佛石头与船在\"磋磨\"——撞击、摩擦。\n\n**中四句（博喻）**：\"有如兔走鹰隼落，骏马下注千丈坡。断弦离柱箭脱手，飞电过隙珠翻荷。\"——这是此诗最著名的\"七喻连珠\"：① 兔走（兔子飞奔）；② 鹰隼落（鹰隼扑击）；③ 骏马下注千丈坡（骏马从千丈高坡冲下）；④ 断弦离柱（琴弦从柱上崩断）；⑤ 箭脱手（箭从手中飞射而出）；⑥ 飞电过隙（闪电从缝隙间掠过）；⑦ 珠翻荷（水珠从荷叶上滑落）。七个比喻从动→静→快→微，从大尺度（千丈坡）到小尺度（飞电过隙、珠翻荷叶），穷尽\"快\"的不同面向。\n\n> **异文校记**：「骏马下注千丈**坡**」——ctext《苏轼集》卷十、古诗库及苏轼自和诗均作「坡」；部分今人文章引作「千丈**波**」（如中国社科网用韵研究文）。通行整理本从「坡」，「波」系常见讹引。校记依据见 99-溯源/网络采集-补充核源-main.md。\n\n**末二句**：\"四山眩转风掠耳，但见流沫生千涡。\"——\"眩转\"是诗人自己的体感——四面的山都在旋转；\"风掠耳\"是耳边的风声。\"但见流沫生千涡\"是视觉：抬头只见白色的水沫在水面上旋转成无数漩涡。\n\n## 五、综合赏析\n\n这是宋诗\"博喻\"最经典的范例，也是苏轼\"以赋为诗\"的标志性作品。\n\n**博喻的源流**：博喻（连用多种比喻描写同一对象）最早见于《庄子》（\"天地与我并生，而万物与我为一\"式的多面同喻），但把它推到极致的，是苏轼此诗与《百步洪》其二等作品。苏轼把\"舟过急流\"这一瞬间的体感，拆成七个不同的比喻：兔、鹰、骏马、断弦、箭、闪电、露珠。这种\"一喻未尽、再喻又起\"的写法，把单一比喻无法容纳的多重感受一层层剥开。\n\n**为什么是\"七喻\"而不是\"三喻\"、\"五喻\"？** 王水照、崔铭分析：博喻的密度要配合体验的层次。\"兔走\"是地面感、\"鹰隼落\"是空中感、\"骏马下注\"是俯冲感、\"断弦离柱\"是瞬间断裂感、\"箭脱手\"是速度感、\"飞电过隙\"是光线感、\"珠翻荷\"是微观感——这七个喻不是简单的堆叠，而是从大到小、从粗到细、从动到静，覆盖了\"快\"的所有物理维度。\n\n**章法上的\"赋\"**：这首诗的章法借鉴了汉赋的\"主客问答\"或\"层层铺陈\"——但苏诗比汉赋更精炼：全诗十句，没有一句是叙事或议论，全部是描摹。它把\"赋\"压缩成了\"诗\"的密度。这种\"以赋为诗\"的能力，是苏轼区别于王安石、黄庭坚的关键——王安石的\"博喻\"更讲逻辑，黄庭坚的\"博喻\"更讲奇崛；苏轼的博喻则更讲体感。\n\n**结尾的\"眩\"字**：\"四山眩转\"中的\"眩\"字是整首诗的诗眼——它不是写景，而是写感觉。\"眩\"字把读者从\"看景\"切换到\"人船一体\"：你不是站在岸上观景的旁观者，你是船里的人。你的四周在旋转，你的耳边是风，你的眼前是飞沫。这种\"诗中人\"的视角是苏轼写景诗区别于王维、孟浩然\"诗中景\"的最重要特征。\n\n## 六、关联网络\n\n- **百步洪其二**：此为组诗其一。其二\"四山眩转风掠耳\"（王水照、崔铭所引）后转入\"悟理\"——由急流之喻转向人生无常：\"人生一世间，所欲至多……\"，是\"以赋为诗\"与\"以议论为诗\"的合体。\n- **徐州时期（熙宁十年、元丰元年，1077—1078）**：苏轼知徐州前后两年，是其写作量最丰沛的时期之一，黄楼、百步洪、逍遥堂会宿皆在此时。\n- **博喻诗谱系**：苏轼《百步洪》开了宋诗博喻的范式；后辛弃疾《鹧鸪天·晚日寒鸦》、陆游《秋夜将晓出篱门迎凉有感》等皆有沿用。\n\n## 七、溯源记录\n\n- **原文依据**：通行《苏轼诗集》（中华书局孔凡礼点校本）卷一六元丰元年（1078）徐州作；王水照、崔铭《苏轼传》完整引述。李一冰《苏东坡新传》引用此诗并论及徐州时期诗风。\n- **系年依据**：孔凡礼《苏轼年谱》系于元丰元年（1078）秋知徐州时。王水照、崔铭《苏轼传》指出\"这新鲜有趣的休闲活动深深地吸引，常常和朋友们一同游赏……\"即作于此时。\n- **异说**：通行整理本作\"百步洪二首\"之\"其一\"；部分注本（如王文诰《苏诗编注集成》）单独题作\"百步洪\"，实则指其一。";
