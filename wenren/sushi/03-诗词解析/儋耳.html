<script>
const MD = "# 儋耳\n\n## 一、题名与体裁\n\n七言律诗。绍圣四年（1097）岁末至元符元年（1098）间作于儋州（系年两说，见第七节）。题「儋耳」用古郡名——汉武帝置儋耳郡，即苏轼谪所昌化军（今海南儋州）。押平水韵「十灰」（开、嵬、来、埃、灰）。\n\n## 二、原文\n\n霹雳收威暮雨开，独凭栏槛倚崔嵬。\n垂天雌霓云端下，快意雄风海上来。\n野老已歌丰岁语，海国新洗甲兵埃。\n残年饱饭东坡老，一壑能专万事灰。\n\n## 三、写作背景\n\n绍圣四年（1097）四月，苏轼责授琼州别驾、昌化军安置；据说章惇以字戏定贬所，「苏轼字子瞻，贬儋州，因为儋与瞻偏旁相同」（王水照、崔铭《苏轼传》）。六月十一日兄弟诀别于海滨，七月二日抵儋。此地「食物人烟，萧条之甚」，几乎「举无所有」：食无肉，病无药，居无室，出无友，冬无炭，夏无寒泉（王水照、崔铭《苏轼传》引其书信）；他在《行琼儋间》诗中自写初望：「登高望中原，但见积水空。此生当安归，四顾真途穷。」岁末登临，久雨乍晴、虹垂风来，遂有此诗。\n\n本诗背景需并记两说：若作于绍圣四年岁末，则是「初谪儋州、岁暮雨霁」之登临；若作于元符元年（1098）冬，则谪居已年余，其年三月朝廷遣董必按察岭南、苏轼被逐出官舍（两传均载），「洗甲兵埃」之语或兼含时事之感。两读皆通，本篇笺注与赏析均按两可的文本事实立论。\n\n## 四、逐句笺注\n\n**首联**：「霹雳收威暮雨开，独凭栏槛倚崔嵬。」——岁暮雷雨收威，暮色中云开；「霹雳收威」既写海岛冬雷骤歇的实景，也隐然有威怒过去、天意回环的意味〔推断〕。「独凭栏槛」见其孤独——海外孤臣，登高只身；「崔嵬」是所倚之高楼峻石。\n\n**颔联**：「垂天雌霓云端下，快意雄风海上来。」——雨后双虹，色淡的一道（雌霓）从云端垂下；海风大至，吹得人通体快意。「垂天」语出《庄子·逍遥游》鹏翼「若垂天之云」；「雌霓」「雄风」借宋玉《风赋》雄雌之分而成对仗。王水照、崔铭《苏轼传》专引此联：「这是海南岛雨后虹挂高空，风来海上的景色。」\n\n**颈联**：「野老已歌丰岁语，海国新洗甲兵埃。」——村野老人已唱起丰年之歌；海国洗去兵尘。「甲兵埃」暗用杜甫《洗兵马》「净洗甲兵长不用」意〔模型知识〕；旧注或以「海国」句实指是年岭外兵事方息——所指旧注有异，照录不裁。\n\n**尾联**：「残年饱饭东坡老，一壑能专万事灰。」——残年只求饱饭，东坡已老；能专守一壑，万事皆灰。「一壑能专」用班固《答宾戏》「渔钓于一壑，则万物不奸其志」语（见《汉书·叙传》）〔模型知识〕；「万事灰」既是心灰，也是把万般尘虑烧尽后的干净。\n\n## 五、综合赏析\n\n初贬儋州的苏轼，写下的却是一首气象阔大的七律——这首诗的价值，正在「困顿」与「快意」的反差里。\n\n**前四句是宋诗中罕见的岭海奇观**。首句「霹雳收威」以雷霆起笔而归于「开」，一收一放，暮雨初霁的天象写成了一场威权的退场；颔联「垂天雌霓云端下，快意雄风海上来」，一联十四字把海南雨后的全景撑开：虹自天垂，风从海立，字字皆动。宋玉《风赋》本以「雄风」属大王、「雌风」属庶人，寓讽喻之别；苏轼借其字面而泯其贵贱——雌霓未必卑微，雄风未必威福，只剩天地两种伟力在海上对峙交割〔推断〕。这一联之奇，与《六月二十日夜渡海》「云散月明谁点缀，天容海色本澄清」同一副手笔：都是把政治的沉冤托付给天象的澄澈。\n\n**颈联由天而人，见苏轼的底色终究是民本**。「野老已歌丰岁语」——他到儋州不到半年，先听见的是百姓的丰年；「海国新洗甲兵埃」——兵尘洗尽，是比个人赦还更大的祈愿。与同期《荔枝叹》的直斥时弊并观，可知岭海苏轼的「闲适」诗里始终嵌着「民不饥寒为上瑞」的那根刺。\n\n**尾联是全诗的收束，也是自我结算**。「残年饱饭」是最卑微的愿望——六十二岁的逐臣，把生存目标降到一碗饱饭；「一壑能专万事灰」随即翻上一层：万事既灰，一人专壑，垂钓著书，反得大自在。庄子式的灰心与班固式的专壑，在末句合为一种贬谪者的自由。这与他数月前「此生当安归，四顾真途穷」的绝望对照，正是苏轼的独门功夫：境遇降到最低处，诗境反而升到最阔处。\n\n## 六、关联网络\n\n- **儋州诗群**：与《行琼儋间》《儋耳山》《汲江煎茶》《书上元夜游》等共同构成儋州谪居的群谱——奇观、绝粮、夜煎茶、上元夜游，一体多面。\n- **岭海气象书写**：与《六月二十日夜渡海》「天容海色本澄清」为岭海两大天象名联，一写雨霁虹风，一写夜渡星月。\n- **民本线索**：与《荔枝叹》「雨顺风调百谷登，民不饥寒为上瑞」同一立场，一为政治诗的直陈，一为写景诗的旁及。\n\n## 七、溯源记录\n\n- **李一冰《苏东坡新传》补引（main 直采，2026-09-29）**：p922-933 绍圣四年六月至七月渡海段（徐闻递角场候风、「舣舟将济，眩慄丧魄」、祷伏波祠）——本诗「霹雳收威」所对之海天语境；p945 逐出官舍、桄榔林下买地造屋（初至儋之居处叙事）。\n\n- **原文依据**：〔模型知识·通行本〕《苏轼诗集》；颔联「垂天雌霓云端下，快意雄风海上来」经王水照、崔铭《苏轼传》第十一章完整引述印证，余六句未获书页级核对（标〔模型知识·通行本〕）。\n- **系年依据（多记录并存）**：一说绍圣四年（1097）岁末（初抵儋州之冬），一说元符元年（1098）冬（谪居经年、董必按察之后）——选目口径「绍圣四年末—元符初」两说并包，不裁决单一系年。\n- **「甲兵埃」所指**：旧注或谓实指是年岭外兵事，或谓泛用杜甫《洗兵马》意——两注并存；「霹雳收威」的喻解（威权退场）属本篇〔推断〕，非旧注。\n";
