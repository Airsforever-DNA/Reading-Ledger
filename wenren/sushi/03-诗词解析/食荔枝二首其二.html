<script>
const MD = "# 食荔枝二首·其二（惠州一绝）\n\n## 一、题名与体裁\n\n七言绝句。绍圣三年（1096）春夏间作于惠州（一说绍圣二年）。通行本《苏轼诗集》题为《食荔枝二首》其二，一题《惠州一绝》。押平水韵「十一真」（春、新、人）。\n\n## 二、原文\n\n罗浮山下四时春，卢橘杨梅次第新。\n日啖荔枝三百颗，不辞长作岭南人。\n\n## 三、写作背景\n\n绍圣元年（1094）四月章惇拜相，苏轼一路五改谪命，十月二日抵达惠州贬所。初到时有「仿佛曾游岂梦中」的亲切（王水照、崔铭《苏轼传》引《十月二日初到惠州》），又借苏武、管宁自解：「岭南万户皆春色，会有幽人客寓公。」此后三年，他助建东新桥、西新桥，促成广州引竹管入城的自来水工程，过着「风土食物不恶，吏民相待甚厚」的贬居生活。\n\n绍圣二年（1095）三月四日他已游白水山，「今日游白水佛迹，山上布水三十仞」（林语堂《苏东坡传》引《与陈季常书》，信末自署三月四日）。同月作《四月十一日初食荔支》，以「海山仙人绛罗襦」写初食之惊；到写本诗时，荔枝已从「初食」的奇遇变成日日相伴的家常。王水照、崔铭《苏轼传》引此诗正与「岭南万户皆春色」相接：「正如诗人此后在《食荔枝二首》其一中所写到的：罗浮山下四时春……不辞长作岭南人。」\n\n## 四、逐句笺注\n\n**「罗浮山下四时春」**——罗浮山在惠州西北，是葛洪炼丹处；苏轼赴惠途中曾「登罗浮山访求仙人安子期旧迹，至冲虚观见葛洪丹炉」（王水照、崔铭《苏轼传》）。「四时春」言岭南气候，冬亦如春。\n\n**「卢橘杨梅次第新」**——卢橘即枇杷（苏轼以卢橘为枇杷，宋人习称）；杨梅与枇杷之后，荔枝按序登场，「次第新」写出果熟的时序像一场接力。\n\n**「日啖荔枝三百颗」**——「三百颗」是极言其多的夸语，不是实数；对着险些杀身的「讪谤」罪名，他偏用一句吹牛的口吻写口腹之乐。\n\n**「不辞长作岭南人」**——岭南即大庾岭以南，正是当朝流放「罪大恶极」官员的贬所；「不辞」二字最重——把朝廷的惩罚说成自己的选择。\n\n## 五、综合赏析\n\n这首诗只有二十八字，却是苏轼岭海时期传播最广的一首，因为它把「贬谪」这个政治判决，改写成了一份安居申请。\n\n**第一层是地理的翻身**。宋代人一说岭南便「谈虎色变」（王水照、崔铭语），是「只有『罪大恶极』的官员才会被放逐到这里」的地方；而在诗中，这里是罗浮山下四季如春、月月有鲜果的乐园。这与他贬黄州初到时「长江绕郭知鱼美，好竹连山觉笋香」（《初到黄州》）是同一副笔墨——先替贬所正名，再替自己安身。\n\n**第二层是口腹的政治学**。「日啖荔枝三百颗」的夸口，故意把一个逐臣的日常写得太惬意；而「不辞长作岭南人」，是全诗真正用力的一句——绍圣三年他已确知「北归无日」（林语堂引其书信：「今者北归无日，因遂自谓惠人」），既然走不了，索性把「不得不留」说成「不愿走」。这不是糊涂，而是清醒之后的自我安顿：随缘委命，把判决改写成选择，就夺回了处境的解释权。\n\n**第三层要看回「不辞」的底色**。此诗同期的惠州并不轻快：绍圣三年七月朝云病逝，他自己痔疾缠身，积蓄因修桥葬骨散尽。所以「长作岭南人」是苦中作乐的强音而非岁月静好的实录——也正因此，它与《荔枝叹》构成苏轼笔下荔枝的两面：一面是「宫中美人一破颜，惊尘溅血流千载」的贡品血泪，一面是「日啖荔枝三百颗」的私人清欢。公与私、讽世与自适，在同一颗荔枝上并存，这正是岭海苏轼的一体两面。\n\n## 六、关联网络\n\n- **惠州时期（1094—1097）**：与《荔枝叹》同期同地——一公一私两首荔枝诗，并读见苏轼晚年两副笔墨；亦与《四月十一日初食荔支》《十月二日初到惠州》构成惠州组诗。\n- **贬谪自适谱系**：上承《初到黄州》「长江绕郭知鱼美」，下启《纵笔》「报道先生春睡美」，直至《六月二十日夜渡海》「九死南荒吾不恨」——「在最坏处找到最好」一以贯之。\n- **荔枝文学**：与杜牧、白居易咏荔诗及汉唐贡荔史事（见《荔枝叹》）共同构成中国「荔枝书写」的谱系，此诗是其中最私人、最轻快的一首。\n\n## 七、溯源记录\n\n- **李一冰《苏东坡新传》补引（main 直采，2026-09-29）**：惠州食事与朝云背景见 p887（惠州饮食生活章，「日啖荔枝」所在段）及 p890 起「朝云之死」章（绍圣三年七月朝云卒之惠州语境）；「卢橘杨梅次第新」的岭南物候叙事与李一冰惠州卷纪实互证。\n\n- **原文依据**：〔模型知识·通行本〕《苏轼诗集》（中华书局孔凡礼点校本）；王水照、崔铭《苏轼传》第十一章完整引述。\n- **异文与编号**：王水照、崔铭本引作「《食荔枝二首》其一」且作「卢橘**黄梅**次第新」——编号（其二／其一）与异文（杨梅／黄梅）两处出入，照实双注，本文从通行本「其二」「杨梅」。\n- **系年依据**：通行编年系绍圣三年（1096）惠州作（选目口径同）；亦有系绍圣二年（1095）者——多记录并存，不裁决。\n";
