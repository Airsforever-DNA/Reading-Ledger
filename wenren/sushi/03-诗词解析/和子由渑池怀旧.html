const MD = "# 和子由渑池怀旧\n\n## 一、题名与体裁\n七言律诗。和韵诗，和苏辙《怀渑池寄子瞻兄》。嘉祐六年（1061）冬，苏轼赴凤翔途中经渑池，忆五年前（嘉祐元年 1056）三苏赴京试时曾借宿渑池奉闲僧舍题壁，今老僧已死、新塔已筑、题壁无存，因作此诗。押平水韵\"四支\"（泥、西、飞、记、嘶、题）。\n\n## 二、原文\n\n人生到处知何似？应似飞鸿踏雪泥。\n泥上偶然留指爪，鸿飞那复计东西。\n老僧已死成新塔，坏壁无由见旧题。\n往日崎岖还记否？路长人困蹇驴嘶。\n\n（轼自注：往日马死于二陵，骑驴至渑池。）\n\n## 三、写作背景\n\n嘉祐元年（1056）三苏父子三人自眉山赴京应举，途经河南渑池，借住奉闲和尚寺舍，曾在寺壁题诗留念（兄弟均有题诗）。五年后（嘉祐六年 1061），苏轼赴凤翔签判任，再次途经渑池；此时奉闲已卒、舍利塔新筑、寺壁题诗亦湮灭不存。苏辙在汴京送兄至郑州，赋《怀渑池寄子瞻兄》，苏轼以原韵和之，遂成此篇。\n\n李一冰《苏东坡新传》将系年定在嘉祐六年（1061）十一月初赴凤翔途中。王水照、崔铭《苏轼传》指出：\"苏轼又一次陷入深深的思索之中。整个世界生生灭灭，变化不已，没有常性……'无常'二字主宰着宇宙的一切\"。该诗是苏轼早年的代表作，奠定其\"理趣诗\"的根基。\n\n## 四、逐句笺注\n\n**首联**：\"人生到处知何似？应似飞鸿踏雪泥。\"——以问起兴：\"人到世上、四处奔走，像什么呢？\"答以\"飞鸿踏雪泥\"：雪泥上偶然留下鸿雁的指爪，鸿飞之后，谁还记得它从哪里来、往哪里去。这是苏轼诗中最早系统阐述\"无常\"主题的作品。\"雪泥鸿爪\"因此成为汉语成语，比喻往事遗痕。\n\n**颔联**：\"泥上偶然留指爪，鸿飞那复计东西。\"——紧承首联：鸿爪留在雪泥是\"偶然\"，鸿飞本身并不在意东西方向。\"那复\"即\"哪能再\"。苏轼以最平易的字眼写出最深沉的感慨——人之于世，无主、无常、无意。\n\n**颈联**：\"老僧已死成新塔，坏壁无由见旧题。\"——切回眼前景。奉闲和尚已圆寂，仅剩新起的舍利塔（僧人火化后以塔藏骨灰）；当年寺壁题诗因墙壁剥落而荡然无存。\"无由\"即\"无从\"。颈联把抽象的\"无常\"落到具体的物是人非上。\n\n**尾联**：\"往日崎岖还记否？路长人困蹇驴嘶。\"——以问收束，问苏辙：\"还记得五年前这段崎岖路吗？\"末句自注\"往日马死于二陵，骑驴至渑池\"补叙事：嘉祐元年赴京时骑的马死在了二陵，即葬夏代帝王的南陵与葬周文王的北陵之间，故而换骑跛驴（\"蹇驴\"）继续赶路，路长人困，驴亦嘶鸣。一\"还记否\"把兄弟、往事、人生打叠在一起——既是在问子由，也是在自问，更是在问所有\"雪泥鸿爪\"般的过客。\n\n## 五、综合赏析\n\n此诗是苏轼\"理趣诗\"的奠基之作，也是他与苏辙兄弟唱和的最早名篇。\"雪泥鸿爪\"四字从此定格为汉语成语，影响远及东亚。\n\n从结构上看，全诗前四句说理、后四句叙事：首联以\"知何似\"设问，颔联以\"偶然\"对\"那复\"作答，把抽象哲思用最具体的画面托住。颈联立刻把视线拉到眼前的渑池僧舍，老僧已死、新塔已筑、坏壁无题——把\"无常\"从思辨化为可触可感。尾联收回到\"往日\"，以自注中的\"马死二陵\"和\"骑驴\"两个细节，把兄弟当年赶考的艰窘重新唤回。这种\"哲思—景物—旧事—问询\"四层结构，是宋诗\"以议论为诗\"的成熟范式——但苏轼的议论从不空洞，因为总有一两个具体物象（雪泥、鸿爪、新塔、坏壁、蹇驴）钉在那里。\n\n更深一层看，这首诗把\"人生到处\"的漂泊感与兄弟唱和的伦理情感捆在了一起。雪泥鸿爪的\"无常\"如果只是个人感叹，便近佛老；但苏轼在尾联以\"还记否\"问苏辙，把无常感从一己的孤独里拖出来，变成兄弟之间可以共同承担、互相印证的东西。这是苏轼的理趣与陶渊明、王维的不同之处：他不止于\"自适\"，而要把道理放进人与人的情感网络里。\n\n王水照、崔铭评此诗\"从庐山奇妙的景物特点中引出一个认识事物的道理\"，即\"身在其中，不一定认识事物的全貌和本质\"——这话虽被借评《题西林壁》，但用于《渑池怀旧》同样贴切：人在路中，看到的只是雪泥；只有跳出\"当下\"才能看到\"鸿飞那复计东西\"。此诗与十年后的《题西林壁》是苏轼理趣诗的两座高峰。\n\n## 六、关联网络\n\n- **兄弟唱和**：苏辙原作《怀渑池寄子瞻兄》\"相携过岭北，……\"；苏轼此为和作。兄弟二人嘉祐六年郑州别后屡以\"夜雨何时听萧瑟\"相忆，至熙宁十年（1077）始再会于澶濮之间，作《逍遥堂会宿》二首。\n- **雪泥鸿爪**：苏轼最早将此意象写入诗，自此该成语定形；后陆游《书愤》\"细雨骑驴入剑门\"亦化用此境。\n- **理趣诗谱系**：王文诰《苏诗编注集成》将此诗视为\"东坡理趣诗的起点\"；与《题西林壁》《和子由渑池怀旧》共同构成苏轼\"诗中有画、画外有理\"的核心文本群。\n\n## 七、溯源记录\n\n- **原文依据**：通行《苏轼诗集》（中华书局孔凡礼点校本）卷二，嘉祐六年（1061）作；李一冰《苏东坡新传》、王水照、崔铭《苏轼传》、林语堂《苏东坡传》均完整引述。\n- **系年依据**：孔凡礼《苏轼年谱》系于嘉祐六年（1061）十一月赴凤翔途经渑池时。李一冰《苏东坡新传》（传记引述，源文件页码标记稀疏）：三苏嘉祐元年（1056）赴京试时\"借了老僧奉闲的僧舍歇脚……兄弟俩都在寺壁上题诗留念\"。\n- **异说**：王文诰《苏诗编注集成》注此诗为\"和子由《怀渑池》而作\"，与通行本无异。";
