<script>
const MD = "# 满庭芳·蜗角虚名\n\n## 一、题名与体裁\n**词牌源流**：「满庭芳」调名本意即「满庭芳香」，唐教坊曲；宋人用以写抒情、赠答诸调。\n**字数体式**：双片九十五字，前后片各十句、四韵；平韵为主。另一格为双片九十三字、九十五字之异体。\n\n## 二、原文\n> 或注：因怀思中酒，作此。\n>\n> 蜗角虚名，蝇头微利，算来着甚干忙。事皆前定，谁弱又谁强。且趁闲身未老，须放我、些子疏狂。百年里，浑教是醉，三万六千场。\n>\n> 思量。能几许？忧愁风雨，一半相妨。又何须抵死，说短论长。辜负对楼新月，玉钩斜、帘卷黄昏。此际正，猿啼鹤怨，惆怅见邻墙。\n\n## 三、写作背景\n**系年**：宋神宗元丰五年前后。\n**地点**：黄州（今湖北黄冈）或其他时期。\n**触发动  机**：词写对人生失意之体悟——「蜗角虚名」「蝇头微利」皆为贬谪时期心境之自况。\n**异说**：①系年异说——主流系元丰五年前后，亦有归黄州后期或东坡时期之异说；②「或注」之原文——邹同庆《苏轼词编年校注》注明此注为后人添加；③归属——宋以来曾有传为秦观、晁补之作之异说。\n\n## 四、逐句笺注\n- **蜗角虚名，蝇头微利**：蜗角、蝇头皆极微之物——喻名利之渺小。典出《庄子·则阳》「有国于蜗之左角者，曰触氏；有国于蜗之右角者，曰蛮氏。时相与争地而战，伏尸数万」；蝇头出自《韵府》《类聚》之常典。\n- **算来着甚干忙**：算来为何如此奔忙——「干忙」即白忙。\n- **事皆前定，谁弱又谁强**：事皆前定，谁弱谁强——化《荀子》「天行有常」之意，亦含宿命论之味道。\n- **且趁闲身未老**：趁此闲身未老。\n- **须放我、些子疏狂**：须放我些许疏狂——「疏狂」二字是苏轼贬谪后之心境。\n- **百年里，浑教是醉，三万六千场**：百年三万六千日，浑教每日皆醉——化李白「百年三万六千日，一日须倾三百杯」之意。\n- **思量。能几许？**：思量人生，能有几许时光——「能几许」之叹。\n- **忧愁风雨，一半相妨**：忧愁与风雨，一半相妨——「忧愁风雨」之喻很妙——忧愁与风雨一样，皆人之一半时间。\n- **又何须抵死，说短论长**：又何须拼命说短论长——「抵死」即拼命。\n- **辜负对楼新月，玉钩斜、帘卷黄昏**：辜负对楼新月、玉钩斜挂、帘卷黄昏之景——三景并列，皆美。\n- **此际正，猿啼鹤怨，惆怅见邻墙**：此刻正是猿啼鹤怨之时，惆怅中见邻墙——以猿鹤之异声写孤独心境。\n\n## 五、综合赏析\n此词全以「反思世俗功名」之主题展开，是苏轼贬谪时期「悟—放—超脱」心境之典型表达。\n\n上片由「蜗角虚名，蝇头微利」之微渺起，经「事皆前定，谁弱又谁强」之反思，至「百年里，浑教是醉，三万六千场」之放浪——形成完整的「反思—放下—放浪」之过程。下片由「思量能几许」之追问起，经「忧愁风雨一半相妨」之自叹，「说短论长」之不必，最末至「猿啼鹤怨惆怅见邻墙」之孤寂——形成完整的「追问—自适—孤寂」之过程。\n\n最关键处是「且趁闲身未老，须放我、些子疏狂」之自我开释——苏轼贬谪之后，不是消极之颓唐，而是「主动放下」之疏狂。「疏狂」二字是苏轼精神状态之精髓——既能放浪形骸，又能保持内心之清明。\n\n「三万六千场」之数字与李白同一数字之呼应，是苏轼对李白诗学之直接继承。然苏轼此词不只是李白之复制，而是将李白之「豪放酒醉」化为「贬谪之士」之「疏狂自放」——这是宋代士人之精神新境。\n\n「辜负对楼新月，玉钩斜、帘卷黄昏」三景并列——「新月」「玉钩」「帘卷黄昏」皆黄昏到夜晚之景，是苏轼贬谪时期最常描写之时段——黄昏是「一天之将尽」，亦是「人生黄昏」之隐喻。\n\n## 六、关联网络\n- **人物**：词中无具体人物——为自我反思之作。\n- **人生事件**：①元丰五年（1082）黄州谪居——贬谪已三年；②元丰五年后东坡时期「人生反思」之主题。\n- **其他作品互见**：《临江仙·夜饮东坡醒复醉》《定风波·莫听穿林打叶声》《水调歌头·丙辰中秋》皆同属「贬谪—反思—超脱」之主题系列。\n- **文化史影响**：奠定宋词「反思功名」之主题范式；「蜗角虚名，蝇头微利」为后世常用成语；「百年三万六千场」入宋人酒文化。\n\n## 七、溯源记录\n- **原文依据**：通行整理本（邹同庆、王宗堂《苏轼词编年校注》本），与模型知识一致。\n- **系年依据**：邹同庆、王宗堂《苏轼词编年校注》系元丰五年前后；孔凡礼《苏轼年谱》列为暂系年。\n- **异说来源**：①「或注：因怀思中酒」之原注——邹同庆《苏轼词编年校注》注明此注为后人添加，不甚可靠；②归属——宋人笔记《避暑录话》《鹤林玉露》传为秦观、晁补之作，今已证伪。\n- **未竟事项**：①词作具体年月之确考——邹同庆、王宗堂《苏轼词编年校注》「附录」列此词为暂系年；②「猿啼鹤怨」之具体意象——是苏轼诗中常用语，典出《抱朴子》「周穆王南征，一军尽化，君子为猿为鹤」之意，待补《抱朴子·对俗》原文。";
