<script>
const MD = "# 鹧鸪天·林断山明竹隐墙\n\n## 一、题名与体裁\n**词牌源流**：「鹧鸪天」调名本意即「鹧鸪之歌」，唐教坊曲；唐人已有此调，宋人用以写景、抒情、赠答诸调。\n**字数体式**：双片五十五字，前后片各四句、四韵；平韵为主。\n\n## 二、原文\n> 林断山明竹隐墙，乱蝉衰草小池塘。翻空白鸟时时见，照水红蕖细细香。\n>\n> 村舍外，古城旁，杖藜徐步转斜阳。殷勤昨夜三更雨，又得浮生一日凉。\n\n## 三、写作背景\n**系年**：宋神宗元丰五年（1082）或稍后。\n**地点**：黄州（今湖北黄冈）。\n**触发动  机**：黄州雨后初晴，苏轼杖藜闲行乡村所见。\n**异说**：①具体年月异说——主流系元丰五年（《黄州诗文集》中亦见类似场景之同期诗作）；②归属异说——曾被误入宋末元初人词集，今已证伪。\n\n## 四、逐句笺注\n- **林断山明**：树林之尽头，山之明亮——「断」「明」对举，由近及远。\n- **竹隐墙**：竹丛遮隐墙壁——「隐」字写竹林之密。\n- **乱蝉衰草小池塘**：乱蝉在衰草丛生之小池旁鸣叫——「乱蝉」与「衰草」皆夏末秋初之景。\n- **翻空白鸟时时见**：白鸟在天空翻飞，时时可见——「翻空」写白鸟之高飞。\n- **照水红蕖细细香**：红莲照水，散发细细清香——「红蕖」即荷花，「细细」写香气之轻。\n- **村舍外，古城旁**：村舍在外，古城在旁——交代所行之地。\n- **杖藜徐步转斜阳**：拄着藜杖，缓缓步行至斜阳之中——「徐步」写闲行之态。\n- **殷勤昨夜三更雨**：昨夜三更时雨「殷勤」——「殷勤」之喻赋予雨以人之情感。\n- **又得浮生一日凉**：又得此浮生中之一日清凉——「又得」二字写出惊喜之意。\n\n## 五、综合赏析\n此词全以「夏日乡间雨后之游」为题材，无重大主题、无激越情感，唯以白描手法写雨后乡村之清凉可喜。上片四句皆写景：「林断山明」「竹隐墙」「乱蝉衰草」「翻空白鸟」「照水红蕖」——五组景物，构成完整的夏日乡间图景。下片三句写行：「村舍外，古城旁」「杖藜徐步」「殷勤昨夜三更雨」「又得浮生一日凉」——由景转入人，由人转入感受。\n\n最关键处是「殷勤昨夜三更雨，又得浮生一日凉」之结句——苏轼以「殷勤」二字赋予夜雨以人格化之情感，这是诗人与自然之关系达到和谐时才会有的比喻——在贬谪之困顿中，夜雨不仅带来物理之凉，更带来精神之慰藉。「又得浮生一日凉」之「又」字，是苏轼谪黄时期精神状态之精确表达——「又得」说明此种慰藉之难得、之稀少、之珍贵；并非每日可得，故每一日皆值得珍惜。\n\n「浮生」二字直接化用李白「浮生若梦」之典，但苏轼此处对「浮生」之态度并非消极——「浮生一日凉」是积极地把握当下的一日之清凉——这是苏轼谪居期间对「当下」之高度珍视。\n\n此词与《定风波·莫听穿林打叶声》《浣溪沙·簌簌衣巾落枣花》并为苏轼「谪居生活词」之代表作，三首皆以「日常片刻」之体验为题材，以「珍惜当下」之态度为内核。这一主题贯穿苏轼谪居期之始终，是苏轼精神升华之最重要主题之一。\n\n## 六、关联网络\n- **人物**：杖藜者即苏轼自指——无具体同行者。\n- **人生事件**：元丰五年（1082）黄州谪居——是年苏轼生活已较前两年安定（东坡雪堂已建成，「东坡」地名已定）。\n- **其他作品互见**：《鹧鸪天》黄州同期作尚有「笑揖峨嵋访道翁」「一夕轻雷落万丝」等首；《定风波·莫听穿林打叶声》《浣溪沙·簌簌衣巾落枣花》《西江月·世事一场大梦》皆同期「日常化」主题。\n- **文化史影响**：「殷勤昨夜三更雨，又得浮生一日凉」为后世「珍惜当下」主题之名句；南宋辛弃疾、陆游皆有类似风格之仿作。\n\n## 七、溯源记录\n- **原文依据**：通行整理本（邹同庆、王宗堂《苏轼词编年校注》本），与模型知识一致。\n- **系年依据**：邹同庆、王宗堂《苏轼词编年校注》系元丰五年；孔凡礼《苏轼年谱》同。\n- **异说来源**：①「三更雨」具体年月——主流归元丰五年之夏；②「古城旁」之地理——主流指黄州府城旁之乡村景观。\n- **未竟事项**：①「红蕖」季节问题——荷花盛开为六月至七月，雨在三更，则此词作于夏末——与「乱蝉衰草」之时令吻合；②此词在苏轼黄州词中之排序——待补《东坡乐府笺》之具体目录考。";
document.getElementById('content').innerHTML = marked.parse(MD);
