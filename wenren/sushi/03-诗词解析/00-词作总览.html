const MD = "> **系年异说与文本异文处理规范（Qi 拍板 2026-09-29）**：凡系年有争议的作品，多记录并存、标注清楚，不裁决单一系年——各系年下的解读角度均附注保留，两读皆通；文本异文同理——通行本为主文本，异文（如「又恐/惟恐」「谈笑间/处」「人生/人间」）一律并注并说明各自读法所安，不裁决唯一正字。\n\n# 00-词作总览\n\n> 苏轼（1037-1101），字子瞻，号东坡居士，眉州眉山人。北宋最具代表性之文学家，其词在宋词发展史中具枢纽地位——上承晏殊、欧阳修之婉约，下启辛弃疾、陆游之豪放，又以其「以诗为词」「以哲入词」之开拓，使宋词之题材、意境、风格皆发生根本性变化。本卷精选其 15 首词作，作专题深度解析。\n\n## 一、15 首系年总表\n\n| 序 | 词牌 | 首句 | 系年 | 地点 | 词前心境 |\n|---|---|---|---|---|---|\n| 1 | 江城子 | 十年生死两茫茫 | 1075 乙卯 | 密州 | 悼亡妻王弗（治平二年卒，至乙卯恰十年） |\n| 2 | 江城子 | 老夫聊发少年狂 | 1075 乙卯 | 密州 | 铁沟出猎，与民同乐 |\n| 3 | 水调歌头 | 明月几时有 | 1076 丙辰 | 密州 | 中秋怀子由，欢饮达旦 |\n| 4 | 浣溪沙 | 簌簌衣巾落枣花 | 1078 元丰元年 | 徐州 | 谢雨道上，乡野所见 |\n| 5 | 卜算子 | 缺月挂疏桐 | 1080 元丰三年 | 黄州 | 乌台诗案后初至黄州，寓定慧院 |\n| 6 | 水龙吟 | 似花还似非花 | 1081 元丰四年 | 黄州 | 次韵章质夫杨花词 |\n| 7 | 念奴娇 | 大江东去 | 1082 元丰五年 | 黄州 | 七月游黄冈赤鼻矶 |\n| 8 | 定风波 | 莫听穿林打叶声 | 1082 元丰五年 | 黄州 | 三月七日沙湖道中遇雨 |\n| 9 | 临江仙 | 夜饮东坡醒复醉 | 1082 元丰五年 | 黄州 | 夜饮归临皋，家童已睡 |\n| 10 | 西江月 | 世事一场大梦 | 1082 元丰五年 / 1098 元符元年（有异说） | 黄州 / 儋州 | 中秋把盏 |\n| 11 | 鹧鸪天 | 林断山明竹隐墙 | 1082 元丰五年 | 黄州 | 东山雨后杖藜闲行 |\n| 12 | 满庭芳 | 蜗角虚名 | 1082 元丰五年前后 | 黄州 | 反思功名，贬谪中超脱 |\n| 13 | 蝶恋花 | 花褪残红青杏小 | 1089 元祐四年 / 约 1080（有异说） | 杭州 / 黄州 | 春日伤春 |\n| 14 | 八声甘州 | 有情风万里卷潮来 | 1091 元祐六年 | 杭州 | 赠参寥子，离杭前 |\n| 15 | 贺新郎 | 乳燕飞华屋 | 约 1089-1094 元祐间（暂系） | 不详 | 夏日咏石榴女子 |\n\n## 二、选目说明\n\n本卷选目之原则有四：\n\n**一、覆盖苏轼人生各关键期。** 15 首涵盖苏轼一生的几个重要阶段：\n- **密州时期（1075-1076）**：共 3 首，悼亡、出猎、怀子由，奠定其「以哲化情」之底色；\n- **徐州时期（1078）**：1 首，开拓农村题材；\n- **黄州时期（1080-1082）**：8 首，为苏轼谪居之精华，「乌台诗案」后精神升华之代表作；\n- **杭州时期（1089-1091）**：2 首，时苏轼已召回朝中或任地方大员，心境与黄州时迥异；\n- **暂系年**：1 首。\n\n**二、覆盖词作风格之多元。** 15 首皆为苏轼风格之典型代表——婉约（悼亡、咏物）、豪放（怀古、出猎）、哲理（反思、超越）、日常（沙湖遇雨、谢雨道上）——皆有所选。\n\n**三、词前小序保留。** 凡有词前小序者皆录入正文（不含「或注」之类后人添加之注），保留东坡词之原始面貌。\n\n**四、系年与异说照实注。** 凡系年有争议者（如《西江月·世事一场大梦》黄州说与儋州说之长期并存、《贺新郎·乳燕飞华屋》归属之争、《蝶恋花·春景》黄州说与杭州说之争），皆照实注出，不武断取舍。\n\n## 三、各篇链接\n\n1. [江城子·乙卯正月二十日夜记梦](江城子·乙卯正月二十日夜记梦.md)\n2. [江城子·密州出猎](江城子·密州出猎.md)\n3. [水调歌头·明月几时有](水调歌头·明月几时有.md)\n4. [浣溪沙·簌簌衣巾落枣花](浣溪沙·簌簌衣巾落枣花.md)\n5. [卜算子·黄州定慧院寓居作](卜算子·黄州定慧院寓居作.md)\n6. [水龙吟·次韵章质夫杨花词](水龙吟·次韵章质夫杨花词.md)\n7. [念奴娇·赤壁怀古](念奴娇·赤壁怀古.md)\n8. [定风波·莫听穿林打叶声](定风波·莫听穿林打叶声.md)\n9. [临江仙·夜饮东坡醒复醉](临江仙·夜饮东坡醒复醉.md)\n10. [西江月·世事一场大梦](西江月·世事一场大梦.md)\n11. [鹧鸪天·林断山明竹隐墙](鹧鸪天·林断山明竹隐墙.md)\n12. [满庭芳·蜗角虚名](满庭芳·蜗角虚名.md)\n13. [蝶恋花·春景](蝶恋花·花褪残红青杏小.md)\n14. [八声甘州·寄参寥子](八声甘州·寄参寥子.md)\n15. [贺新郎·乳燕飞华屋](贺新郎·乳燕飞华屋.md)\n\n## 四、附录：版本与素材说明\n\n- **原文依据**：通行整理本，以邹同庆、王宗堂《苏轼词编年校注》（中华书局 2002）为主，与龙榆生《东坡乐府笺》、唐圭璋《全宋词》本互校。\n- **系年依据**：邹同庆、王宗堂《苏轼词编年校注》、孔凡礼《苏轼年谱》、王文诰《苏诗编注集成》。\n- **注释与异文**：采《东坡乐府笺》《唐宋诸贤绝妙词选》《花庵词选》之历代校勘结论。\n- **素材来源**：本卷未直接引用 C:/Users/monar/Documents/ZCode/sushi-knowledge-20260929/texts/ 下的苏轼传记原文（文件目录无法读取），主要由模型知识 + 主流词学工具书编撰而成——溯源节中标「待网络源核」之条目皆为需网络检索补充之项。\n\n## 五、阅读建议\n\n- **入门阅读**：建议从《水调歌头·明月几时有》《念奴娇·赤壁怀古》《江城子·乙卯正月二十日夜记梦》《定风波·莫听穿林打叶声》四首开始——这是宋词史上公认的苏轼代表作。\n- **进阶阅读**：可按系年顺序阅读 15 首，理解苏轼从密州时期（1075）到黄州时期（1080-1082）再到杭州时期（1089-1091）之精神变迁。\n- **专题研读**：①「怀念」主题——《江城子记梦》《水调歌头·丙辰中秋》《蝶恋花·春景》；②「超脱」主题——《定风波》《临江仙·夜饮东坡》《满庭芳·蜗角虚名》；③「咏物」主题——《水龙吟·杨花词》《鹧鸪天·林断山明》《贺新郎·乳燕飞华屋》。";
