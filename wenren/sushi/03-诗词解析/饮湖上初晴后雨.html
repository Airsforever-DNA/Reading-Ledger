const MD = "# 饮湖上初晴后雨\n\n## 一、题名与体裁\n七言绝句。熙宁六年（1073）夏，苏轼任杭州通判时，与友人在西湖饮酒，先晴后雨，即景成诗二首，此为其一。押仄韵\"四寘\"（好、奇、宜）。\n\n## 二、原文\n\n水光潋滟晴方好，山色空蒙雨亦奇。\n欲把西湖比西子，淡妆浓抹总相宜。\n\n## 三、写作背景\n\n熙宁六年（1073）夏，苏轼在杭州通判任。一日饮酒湖上，遇先晴后雨，景色变幻奇妙。苏轼即景成诗二首，其一为千古绝唱，其二\"朝曦迎客艳重冈，晚雨留人入醉乡\"（《饮湖上初晴后雨》其二）亦传诵。\n\n李一冰《苏东坡新传》：\"一日，饮酒湖上，初晴后雨，作诗二首，其一云：'水光潋滟晴方好，山色空蒙雨亦奇。欲把西湖比西子，淡妆浓抹总相宜。'此篇一出，在西湖诗中，可谓'前无古人，后无来者'。\"王水照、崔铭《苏轼传》谓此诗\"以浅显易懂的语言、新颖贴切的比喻，成为千古绝唱\"。\n\n## 四、逐句笺注\n\n**首句**：\"水光潋滟晴方好。\"——写西湖晴天：日光下水面波光闪动（\"潋滟\"），是西湖最美的时刻之一。\"方好\"是\"正好的意思\"，下语极轻。\n\n**次句**：\"山色空蒙雨亦奇。\"——写雨中：远山被雨雾笼罩，呈现一片迷蒙（\"空蒙\"）；这种朦胧之美同样奇妙。\"亦奇\"对\"方好\"，一为正、一为奇，晴与雨各有其趣。\n\n**三、四句**：\"欲把西湖比西子，淡妆浓抹总相宜。\"——以美人喻湖，把\"水光潋滟\"比西施的\"淡妆\"，把\"山色空蒙\"比西施的\"浓抹\"。\"淡妆浓抹总相宜\"是说西施天姿国色，无论怎样妆扮都好看；同理，西湖无论晴雨都是美的。\n\n**西子**：指春秋时越国美女西施。这是中国文学史上最著名的湖与美人的比喻，自此\"西子湖\"成为西湖的别称之一。李一冰《苏东坡新传》特别拈出：\"西湖本无定称……但至苏轼此诗流传众口，从此奠定了西湖的名称，更有人称之为西子湖者，亦本于此。\"\n\n## 五、综合赏析\n\n这是宋诗中知名度最高的写景诗之一，也是\"西湖\"作为美学符号的定形之作。\n\n它在七绝二十八字内完成了两层提升：第一层是**景的对照**——晴天\"水光潋滟\"与雨天\"山色空蒙\"对照，把\"晴\"与\"雨\"从对立变成并列：不是\"晴好雨坏\"，而是\"晴好雨亦奇\"。第二层是**喻的飞跃**——把整个西湖比西施，把水光比\"淡妆\"、山色比\"浓抹\"，一句\"淡妆浓抹总相宜\"把所有\"晴/雨\"的二元对峙化为\"美\"的统一。\n\n王水照、崔铭评此诗：\"浅显易懂的语言、新颖贴切的比喻\"。这两点看似平常，实际是苏轼对宋诗\"以才学为诗\"倾向的纠偏：他不堆典、不用事、不押险韵，只用最日常的比喻、最浅近的字。这种\"浅\"与\"奇\"的并存，是苏轼理趣诗在写景领域的成功案例。\n\n更深一层看，此诗的成功不只在写景。它用\"淡妆浓抹总相宜\"暗示了一种审美哲学：**美不在某种固定的呈现方式，而在主体的天然资质**。无论\"晴\"还是\"雨\"都是西湖的本来面目，无论\"淡妆\"还是\"浓抹\"都出自西施的天生丽质。这与苏轼后来《题西林壁》\"不识庐山真面目，只缘身在此山中\"的视角论——审美主体的局限性——遥相呼应。\n\n林语堂《苏东坡传》感慨：\"这当然只是比喻的说法。无论如何'西子'化妆总比不上不化妆来得漂亮。苏东坡美化了湖畔，以完美的艺术手笔使一切显得自然。\"——这种\"美化\"不是粉饰，而是把\"自然\"这个最高级的褒奖，送给了一个具体的地方。\n\n## 六、关联网络\n\n- **杭州通判时期**：与《六月二十七日望湖楼醉书》同为苏轼杭州写景诗的双璧。\n- **西湖诸咏**：苏轼的西湖诗构成中国文学史上最大的\"西湖书写\"群；《怀西湖寄晁美叔同年》\"西湖天下景，游者无愚贤。浅深随所得，谁能识其全\"是另一名篇。\n- **西施与湖**：把湖比美人是常见的诗学操作，李白\"若耶溪傍采莲女\"、白居易\"杨柳岸晓风残月\"皆为同类；但把\"晴/雨\"双向都纳入\"美\"的版图，是苏轼的首创。\n\n## 七、溯源记录\n\n- **原文依据**：通行《苏轼诗集》（中华书局孔凡礼点校本）卷七熙宁六年（1073）杭州作；李一冰《苏东坡新传》、王水照、崔铭《苏轼传》、林语堂《苏东坡传》均完整引述。\n- **系年依据**：孔凡林林《苏轼年谱》系于熙宁六年（1073）夏。林语堂《苏东坡传》将熙宁六年（1073）作为通判杭州的标志性时段。\n- **异说**：李一冰《苏东坡新传》指出，诗题\"饮湖上初晴后雨\"在某些整理本中作\"饮湖上初晴后雨二首\"之\"其一\"。";
