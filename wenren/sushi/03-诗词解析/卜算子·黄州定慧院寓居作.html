const MD = "# 卜算子·黄州定慧院寓居作\n\n## 一、题名与体裁\n**词牌源流**：「卜算子」取意于「卖卜算命」之歌，敦煌曲子词中已有此调；唐末骆宾王有同题之作，宋人用以写抒情、咏物诸调。\n**字数体式**：双片四十四字，前后片各四句、三韵；以入声韵为主。韵脚短促，适合表达孤峭幽独之情。\n\n## 二、原文\n> 黄州定慧院寓居作。\n>\n> 缺月挂疏桐，漏断人初静。时见幽人独往来，缥缈孤鸿影。\n>\n> 惊起却回头，有恨无人省。拣尽寒枝不肯栖，寂寞沙洲冷。\n\n## 三、写作背景\n**系年**：宋神宗元丰三年（1080）。\n**地点**：黄州（今湖北黄冈）定慧院寓居。\n**触发动机**：元丰二年（1079）「乌台诗案」出狱，贬黄州团练副使本州安置；元丰三年春至黄州，初寓居定慧院（在黄冈东南），生活困顿，作此词。\n**异说**：词之作日难以确考——邹同庆、王宗堂《苏轼词编年校注》系元丰三年春；亦有系元丰五年（一说作于赴黄州途中）之异说，主流取前者。\n\n## 四、逐句笺注\n- **缺月挂疏桐**：起句以景起——「缺月」「疏桐」皆残缺、孤寂之象。\n- **漏断人初静**：漏断即更深夜静；「人初静」由外境之静转内心之静。\n- **时见幽人独往来**：幽人即隐者，此为苏轼自指；「独往来」三字写尽孤身之状。\n- **缥缈孤鸿影**：承「幽人」而联想至「孤鸿」——人如鸿，鸿亦如人。\n- **惊起却回头**：由人之想象转入鸿之动作——孤鸿惊起后回头。\n- **有恨无人省**：孤鸿有恨，无人理解——亦是词人自况。\n- **拣尽寒枝不肯栖**：孤鸿拣选尽所有寒枝而不肯栖息——这是本词最核心之诗句，象征苏轼不肯降志辱身之意。\n- **寂寞沙洲冷**：结句落至「沙洲」之冷，与「寒枝」之冷形成呼应——寂寞是孤鸿之常态。\n\n## 五、综合赏析\n此词以「孤鸿」为意象主体，但开篇却由人写起——「缺月挂疏桐」之景、「幽人独往来」之形，皆人之所见所感；至「缥缈孤鸿影」才将人鸿合一；下片全以鸿写，但句句皆人。\n\n「拣尽寒枝不肯栖」一句为全词核心——「拣尽」是动作之彻底，「寒枝」是环境之艰苦，「不肯栖」是意志之抉择。这一意象自宋以来即有两种解读：一为坚持高洁、不肯随波逐流之意（主流）；二为孤高太过、不肯随顺世俗之意（少数）。主流解读与苏轼谪黄初年之精神状态完全契合——乌台诗案后，苏轼既未认错亦未激进对抗，而是采取「自放于山水之间」之姿态，此「拣尽寒枝不肯栖」正是此态度之艺术化表达。\n\n最末「寂寞沙洲冷」收束全词——沙洲之寂寞与寒冷，既是环境之实写，亦是心绪之投射。苏轼此词为「谪宦第一词」（胡仔《苕溪渔隐丛话》），写尽贬谪之人格困境：既不愿随波逐流，又不愿绝尘自弃——此两难之间，「拣尽寒枝不肯栖」正是对两难之拒绝。\n\n此词亦是宋词「咏物」传统之杰作——以「鸿」写人而不言「人」，含蓄蕴藉，开宋人「寄托词」之新境。\n\n## 六、关联网络\n- **人物**：苏轼自况之「幽人」「孤鸿」——元丰三年初至黄州之时「幽人」。\n- **人生事件**：元丰二年（1079）七月「乌台诗案」入御史台狱；八月出狱，责授黄州团练副使本州安置；十二月至黄州。\n- **其他作品互见**：《初到黄州》（1080 元丰三年春，元丰三年正月至黄州）、《黄州寒食诗帖》（1080 黄州）、《定风波·莫听穿林打叶声》（1082 黄州，已出「拣尽寒枝不肯栖」之境界而升华）。\n- **文化史影响**：「拣尽寒枝不肯栖」为后世孤高之士所常引用；林逋「梅妻鹤子」、姜夔「念奴娇」皆有此意象之回响。\n\n## 七、溯源记录\n- **原文依据**：通行整理本（邹同庆、王宗堂《苏轼词编年校注》本），与模型知识一致。\n- **系年依据**：邹同庆、王宗堂《苏轼词编年校注》、孔凡礼《苏轼年谱》卷十八，均系元丰三年春；王文诰《苏诗编注集成》系元丰五年，主流取前者。\n- **异说来源**：①系年之争（详见上）；②「定慧院」地理位置——主流说为黄冈东南定惠院（一作「定惠」），非长江北岸之同名佛寺。\n- **未竟事项**：「拣尽寒枝」之寓意解读异说——胡仔《苕溪渔隐丛话》、王灼《碧鸡漫志》、清人张惠言《词选》均有不同解读，待核现代黄任轲、杨海明等苏轼词研究专著之专章讨论。";
