<script>
const MD = "# 题西林壁\n\n## 一、题名与体裁\n七言绝句。元丰七年（1084）苏轼自黄州赴汝州，途经庐山时作。押平水韵\"十一尤\"（峰、不同、中）。\n\n## 二、原文\n\n横看成岭侧成峰，远近高低各不同。\n不识庐山真面目，只缘身在此山中。\n\n## 三、写作背景\n\n元丰七年（1084）四月，苏轼量移汝州团练副使，自黄州启程东归。途中游庐山，前后写下《初入庐山》《庐山二胜》《题西林壁》等诗十余首。本诗作于游庐山后期，题于庐山西林寺墙壁上（一说\"题西林寺壁\"）。\n\n李一冰《苏东坡新传》：\"几日来，看山所得，不仅是美感上的享受，更重要的是得到了一重解悟，得到了一重隽妙的见识。《题西林壁》道：'横看成岭侧成峰，远近高低各不同。不识庐山真面目，只缘身在此山中。'\"王水照、崔铭《苏轼传》：\"临下山之前，他在西林寺壁上题诗一首：'横看成岭侧成峰，远近高低各不同。不识庐山真面目，只缘身在此山中。'\"\n\n## 四、逐句笺注\n\n**首句**：\"横看成岭侧成峰。\"——\"横看\"是从正面看（横列在眼前的山），庐山呈现为连绵的山岭（\"岭\"）；\"侧看\"是从侧面看（侧面的角度），庐山呈现为一座座山峰（\"峰\"）。同是一座庐山，从不同角度看，形象截然不同。这是\"局中人\"的视角局限性。\n\n**次句**：\"远近高低各不同。\"——\"远近\"——离得远看与离得近看，山的形态不同；\"高低\"——从高处俯视与从低处仰视，山的形态不同。四种视角、四种形态——这是首句\"横看/侧看\"之后的扩展：从\"两个角度看\"扩展到\"四个角度看\"。\n\n**三句**：\"不识庐山真面目。\"——直接说出\"局中人\"的盲点：你看不清庐山的\"真面目\"，因为你是山里的人。这是苏轼对\"局中人局限\"的判断——站在事物内部的人，反而看不清事物的全貌。\n\n**末句**：\"只缘身在此山中。\"——\"只缘\"是\"只因为\"；\"身在此山中\"——身在庐山之中。一句把\"看不清\"的因由点透：你是山里人，山在你四面八方；你被山包围着，所以你看到的只是局部，永远看不到\"庐山\"作为整体的\"真面目\"。\n\n## 五、综合赏析\n\n这是苏轼\"理趣诗\"的最高峰，也是中国古典诗歌中\"认识论\"主题最简洁、最深刻的表达。\n\n**诗与禅的会通**：李一冰《苏东坡新传》引黄山谷语：\"此老于般若横说竖说，了无剩语；非其笔端有舌，安能吐此不传之妙？\"——把此诗与佛教般若学相比。般若学的核心命题是\"色即是空、空即是色\"——任何具体事物都是因缘和合的\"色\"，没有独立的\"自性\"。苏轼此诗与般若学的会通在：**\"庐山\"作为\"整体\"是不存在的，\"庐山真面目\"只能是众多\"局部\"的和合**——这正是\"色即是空\"的诗化表达。\n\n**诗与理的融合**：此诗的结构是\"写景—说理\"——前两句写景（庐山的多面），后两句说理（不识真面目的因由）。但苏轼的高明在于：**说理的两句本身也是写景**——\"不识庐山真面目，只缘身在此山中\"既是抽象的\"认识论\"，也是具体的\"山中山外\"画面。这就是\"理趣\"——理藏在景里，景被理点亮。\n\n**宋诗的\"认识论\"高光**：王水照、崔铭《苏轼传》指出：\"身在其中，不一定认识事物的全貌和本质。从不同的角度只能看到山的局部，局中人反而看不清事物的真相和全貌，所谓'当局者迷，旁观者清'。只有跳出一己的局限，摆脱自我的成分，才能获得客观全面的圆融观照。由此，他反观自己的生活道路，对于生活中某些问题的认识有了更为深入的看法。\"\n\n**反观人生**：苏轼写此诗时，已经历乌台诗案、四年黄州贬谪，又被量移汝州——这是他对\"局中人局限\"的一次\"反观\"：他自己就是\"身在庐山中\"的人——被贬黄州是身在庐山、被召回京是身在庐山。他的视野一直\"横看成岭侧成峰\"——既看不到全局，也看不到自己。但如果他能\"跳出来\"——像今日的游客一样，从空中俯瞰庐山——他就能看清自己。\n\n**诗史意义**：此诗在中国诗歌史上享有\"百代家喻户晓\"（李一冰语）的知名度。它把\"理趣诗\"推到了与\"情韵诗\"并驾齐驱的高度——王维的\"诗中有画\"、苏轼的\"诗中有理\"共同构成了唐宋诗的两座高峰。后世理学诗（如朱熹、陆游理趣诗）皆以此诗为典范。\n\n## 六、关联网络\n\n- **庐山诗群**：元丰七年（1084）苏轼游庐山写下《初入庐山》《庐山二胜》《题西林壁》等十余首，形成完整的\"庐山书写\"。\n- **理趣诗谱系**：与《和子由渑池怀旧》《饮湖上初晴后雨》《东坡》共同构成苏轼理趣诗的核心文本群。\n- **认知论与禅学**：苏轼\"身在此山中\"的视角论与禅宗\"不立文字、教外别传\"的认识论有深层呼应；后世被王阳明\"知行合一\"、朱熹\"格物致知\"等宋明理学命题反复化用。\n\n## 七、溯源记录\n\n- **原文依据**：通行《苏轼诗集》（中华书局孔凡礼点校本）卷二三元丰七年（1084）作；李一冰《苏东坡新传》、王水照、崔铭《苏轼传》、林语堂《苏东坡传》均完整引述。\n- **系年依据**：孔凡礼《苏轼年谱》系于元丰七年（1084）四月游庐山后期。李一冰《苏东坡新传》记\"几天来\"所得，是经过一段游览之后的总结之作。\n- **异说**：诗题\"题西林壁\"与\"题西林寺壁\"在通行整理本中通用；个别注本（如王文诰《苏诗编注集成》）注此诗\"题于西林寺\"。";
