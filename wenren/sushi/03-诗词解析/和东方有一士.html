<script>
const MD = "# 和东方有一士\n\n## 一、题名与体裁\n\n五言古诗（和陶诗，次韵）十六句。苏轼谪儋州期间（元符年间，1098—1100）作，为陶渊明《拟古九首·其五》「东方有一士」的和作——陶诗此首在陶集中又单行重出，今传可信和作即本篇单行《和东方有一士》；通行本《和陶拟古九首》组诗之其五为咏冼夫人之作（维基文库《和拟古九首》核对，见第七节）。另《蘇詩補註》有陶诗此首「重出两和」之说（苏轼两度和之），原书页待核——若两和说成立则组诗中或另有一和，今从维基文库实证之单行篇立目。次韵韵脚（完、冠、颜、关、端、弹、鸾、寒）与陶原作逐字同序。本篇系选目勘误补收（详见第七节）。\n\n## 二、原文\n\n瓶居本近危，甑坠知不完。\n梦求亡楚弓，笑解适越冠。\n忽然反自照，识我本来颜。\n归路在脚底，殽潼失重关。\n屡从渊明游，云山出毫端。\n借君无弦物，寓我非指弹。\n岂惟舞独鹤，便可蹑飞鸾。\n还将岭茅瘴，一洗月阙寒。\n\n（自注）「此东方一士，正渊明也，不知从之游者谁乎？若了得此一段，我即渊明，渊明即我也。」\n\n## 三、写作背景\n\n儋州三年是苏轼和陶诗的收官期：「最杰出的成就是一百二十四首《和陶诗》……最后十五首……都在海南岛完成。他请子由写序」（林语堂《苏东坡传》）。随行无书，「随行有《陶渊明集》，陶写伊郁，正赖此耳」（《答程全父推官》，王水照、崔铭《苏轼传》引），且「每体中不佳，辄取读不过一篇，唯恐读尽后无以自遣」（同上引）——陶集是他的岭海「二友」之一。苏辙《子瞻和陶渊明诗集引》记苏轼自言：「吾于诗人无所甚好，独好渊明之诗……质而实绮，癯而实腴」，又「欲以晚节师范其万一」。\n\n「东方有一士」是陶渊明《拟古九首·其五》虚设的人物：一个被服不完、三旬九食、十年一冠的安贫之士，居于青松白云之间，弹琴以待知音，「愿留就君住，从今至岁寒」。苏轼远在海岛、无弦可听之时，次韵和下了这十六句，并在自注中直接点破：「此东方一士，正渊明也。」贬儋的苏轼从陶诗里认出了陶渊明，也认出了自己。\n\n## 四、逐句笺注\n\n**「瓶居本近危，甑坠知不完。」**——以两件家什自写谪儋处境：悬瓶易坠（居处本就逼近危境），甑已堕地则不必再看（用孟敏「堕甑不顾」典：甑既破，顾之何益〔模型知识〕）。「不完」承陶诗「被服常不完」的韵脚，把陶的「衣不完」换成自己的「甑不完」——贫困的物质细节换了，贫而不改其乐的姿态没换。\n\n**「梦求亡楚弓，笑解适越冠。」**——梦中去求亡失的楚弓（楚王遗弓、楚人得之，本不必求〔模型知识〕），笑而解下适越无用之冠（宋人资章甫而越人断发文身，冠无所用〔模型知识〕）。功名如亡弓，冠服如赘物——两句用两个「得失可以两忘」的古典，把半生宦海一笔勾销。\n\n**「忽然反自照，识我本来颜。」**——忽然回光自照，认出本来面目。「本来颜」是禅家「本来面目」语〔推断〕。\n\n**「归路在脚底，殽潼失重关。」**——归路就在脚下，不必过殽山、潼关的天险——北归之望既绝，则处处皆可为家，脚下即归途。\n\n**「屡从渊明游，云山出毫端。」**——屡屡从渊明同游，纸上云山自笔端涌出——陶集就是同游之地。\n\n**「借君无弦物，寓我非指弹。」**——借你那张无弦琴（陶渊明蓄无弦琴，「但识琴中趣，何劳弦上声」〔模型知识〕），寄托我心，而不须手指去弹。得趣忘弦，得意忘言。\n\n**「岂惟舞独鹤，便可蹑飞鸾。」**——无弦之趣不止于独鹤起舞，简直可以乘鸾飞升。\n\n**「还将岭茅瘴，一洗月阙寒。」**——还要带着岭南茅瘴之乡的这一身尘土，去洗一洗月宫的清寒——瘴乡与月阙互换，人间烟火暖过天上清冷。\n\n## 五、综合赏析\n\n陶苏对读，是读这首诗的唯一入口——因为这首诗本身就是一场对读。\n\n**陶诗向外寻，苏诗向内照。**陶《拟古·其五》的结构是一场寻访：「我欲观其人，晨去越河关」——东方有一士，我要越关渡水去看他；见到之后，「取琴为我弹」，愿留就君住。苏轼的和作把这个方向整个倒转：「忽然反自照，识我本来颜」——不必晨去越关，回光一照，那个被服不完、安贫乐道的人就是我自己；「归路在脚底」——也不必「愿留就君住」，脚下即归处。陶的诗眼是「求」，苏的诗眼是「照」；陶的境界是慕其人而愿从之游，苏的境界是自证其人而是人即我。这一转，是禅门「回光返照」的手法嫁接在陶诗的骨架上〔推断〕。\n\n**「借君无弦物」是和诗中最见巧思的一联。**次韵已是戴着镣铐，苏轼还要「次典」：陶诗里那位士人「取琴为我弹」，苏轼偏借陶渊明自己那张著名的无弦琴——琴而无弦，弹而无指。这既是用陶之典，也是答陶之问：你问我识不识琴中趣？我不弹而弹。结句「还将岭茅瘴，一洗月阙寒」再把陶诗的「岁寒」接过来——陶说的是松柏之寒岁，苏说的是儋州的瘴乡与天上的广寒：他连谪居的瘴气都不当作苦，反而要拿它去暖月宫的清寒。贬损之地说成暖地，天上清寒反成可洗之物——这是《儋耳》《汲江煎茶》一路的儋州笔墨：荒而不怨，寒而自暖。\n\n**自注十四个字是全部和陶诗的纲目。**「我即渊明，渊明即我也」——这不是自大，而是和陶这种写作方式的极致：次韵到「物我两忘」处，和者与被和者的边界消失了。同期的《和陶归园田居》说「我适物自闲」，苏辙序说苏轼「深愧渊明」而又「欲以晚节师范其万一」，此诗的自注则更进一层：师范既久，师我合一。两年后北归途中，他在金山寺对自己的画像写下「问汝平生功业，黄州惠州儋州」——把自己一生的定论交给三个贬所；而这首诗早把另一个定论交给了儋州：我就是那个东方有一士。\n\n## 六、关联网络\n\n- **和陶谱系**：与《和陶归园田居·其一》同为岭海和陶代表（归园田居写惠州之始，本篇写儋州之深）；同组关系另见《和陶拟古九首》（其五为咏冼夫人之作）——三篇的编次出入见第七节。\n- **儋州诗群**：与《儋耳》《汲江煎茶》同期同地，共写「荒而不怨」的儋州心境。\n- **晚年自评线**：与《自题金山画像》遥相呼应——「我即渊明」与「黄州惠州儋州」，一个给身份下定义，一个给功业下定义。\n- **陶苏关系**：与苏辙《子瞻和陶渊明诗集引》「质而实绮，癯而实腴」说互证。\n\n## 七、溯源记录\n\n- **本篇立目经过（选目勘误补收）**：原选目第 4 首引「东方有一士」为《和陶归园田居·其一》文——经核该句系陶渊明《拟古九首·其五》原句；本工程前次辨正曾表述「和作在《和陶拟古九首》其五」，本次再核维基文库《和拟古九首》，其五实为咏冼夫人之作（「冯冼古烈妇」），「东方有一士」的和作确证为**单行篇《和东方有一士》**——前表一并纠正，依 2026-09-29 授权以「选目勘误补收」立本篇。\n- **原文依据**：维基文库《和東方有一士》专页分段逐句核对（2026-09-29 网络采集，两次分段复核）；次韵韵脚（完、冠、颜、关、端、弹、鸾、寒）与陶原作逐字同序，结构印证成立。异文：第三句「忽然**反**自照」，检索快照所引东坡全集系统作「**返**自照」——照录双注。\n- **自注**：诗后自注全文（「此东方一士，正渊明也……渊明即我也」）经维基文库专页照录。\n- **「重出两和」之说**：《蘇詩補註》谓「东方有一士诗十六句重载于拟古九首中，坡公亦遂两和之」——据检索快照转引，未核原书页（待核）；组诗内和作与单行篇之编次诸本或有出入，多记录并存，不裁决。\n- **系年依据**：儋州谪居期（元符年间，1098—1100）作〔模型知识·通行编年〕，未获书页级印证，具体年份待核。\n";
document.getElementById('content').innerHTML = marked.parse(MD);
