const MD = "# 答谢民师书\n\n## 一、题名与体裁\n\n- **题名**:「答谢民师书」。谢民师,即谢举廉,字民师,新淦(今江西新干)人,北宋文人。元丰八年(1085)苏轼自黄州量移汝州途中,曾途经高安,与谢民师相聚;元符三年(1100)苏轼北归途中,又经高安,与谢民师重逢,作此书。\n- **体裁**:书(论文书/书牍)。中国「书」体起源于汉(《史记·韩信卢绾列传》、邹阳《狱中上梁王书》),成熟于六朝(鲍照《登大雷岸与妹书》、丘迟《与陈伯之书》);至唐宋而蔚为大观,苏轼为「书」体之大家。本篇为「**论文书**」之代表——以书信论文学之纲领。\n\n## 二、原文\n\n> **轼启:**近奉违,窃辱问讯,逮此以还,蒙不斥弃,感慰深矣。比日履兹雪寒,起居佳胜。某到黄已二年,亦蒙遇际之有,共事者皆贤士,不觉感被之深。某虽在外,然与公之相与,有以见公之为人矣。\n>\n> **所示书教及诗赋杂文,观之熟矣。**大略如行云流水,初无定质,但常行于所当行,常止于所不可不止,文理自然,姿态横生。**孔子曰:「言之不文,行而不远。」**又曰:**「辞达而已矣。」**夫言止于达意,即疑若不文,是大不然。**求物之妙,如系风捕影,能使是物了然于心者,盖千万人而不一遇也,而况能使了然于口与手者乎?**是之谓辞达。**辞至于能达,则文不可胜用矣**。\n>\n> 扬雄好为艰深之辞,以文浅易之说,若正言之,则人人知之矣。此正所谓**「**雕虫篆刻**」**,而**其**所**以**之**也**。\n>\n> **欧阳文忠公言:「文章如精金美玉,市有定价,非人所能以口舌定贵贱也。」**故**吾**之**所**以**信**于**足下**者**,**也**。\n>\n> **然**所**以**信**于**足下**者**,**又**不**可**以**言**尽**也**。**千万**珍**重**!**。\n\n> **校记**:本文异文主要在末段。通行本(中华书局《苏轼全集》)与宋刊本略合。\n> 1. 「**大略如行云流水**」:通行本作此,亦有作「大略如行云流水,所至自然」者。\n> 2. 「**如系风捕影**」:通行本作此。\n> 3. 「**雕虫篆刻**」:扬雄《法言·吾子》:「**童子雕虫篆刻,壮夫不为**」。\n\n## 三、写作背景\n\n- **系年**:元符三年(1100)。\n- **地点**:北归途中(约在今江西高安一带)。\n- **人物**:谢民师(谢举廉,字民师),新淦(今江西新干)人,曾任某县令(具体不详)。与苏轼早有交往:元丰八年(1085)苏轼量移汝州途经高安时,曾与谢民师相聚;元符三年(1100)北归再经高安,又相聚。\n- **写作情境**:谢民师以书信请教,并呈诗赋杂文求教于苏轼。苏轼作此书为答复。**时苏轼已六十五岁(虚岁),北归已近人生终点**。\n- **历史背景**:元符三年(1100)正月,宋哲宗崩,徽宗即位,大赦天下;苏轼于海南(儋州)获赦北归。是年五月过金陵(今南京),六月经真州(今江苏仪征)、常州(今江苏常州),七月二十八日病逝于常州。本篇作于北归途中。\n- **异说**:作年诸家一致(元符三年,1100),无重大异说。\n\n## 四、分段笺注\n\n### 4.1 「轼启」\n\n- **书牍体例**:**轼启**,苏东坡自称名「**轼**」(其字子瞻),以「**轼启**」开始——书信惯例。\n\n### 4.2 「近奉违,窃辱问讯,逮此以还,蒙不斥弃,感慰深矣」\n\n- 「**奉违**」:离别之意。\n- 「**窃辱问讯**」:承蒙下问(谦辞)。\n- 「**逮此以还**」:从那以后。\n- 「**蒙不斥弃**」:**承蒙不弃**。\n- 「**感慰深矣**」:深为感慰。\n- 书信开头之谦辞——**感谢对方不弃**。\n\n### 4.3 「比日履兹雪寒,起居佳胜」\n\n- 「**比日**」:近日。\n- 「**雪寒**」:冬日雪寒。\n- 「**起居佳胜**」:**起居安佳**——祝愿语。\n\n### 4.4 「所示书教及诗赋杂文,观之熟矣」\n\n- 「**所示书教**」:**您所赐教的书信文章**。\n- 「**诗赋杂文**」:**诗、赋、杂文等**。\n- 「**观之熟矣**」:**读之已熟**。\n- 此句转入正题——**谢民师呈诗赋杂文,苏轼读之已熟**。\n\n### 4.5 「大略如行云流水,初无定质,但常行于所当行,常止于所不可不止」\n\n- 「**行云流水**」:**云之行、水之流**——自然而无定。\n- 「**初无定质**」:**本无固定形态**。\n- 「**常行于所当行**」:**在该行之处就行**。\n- 「**常止于所不可不止**」:**在该止之处不得不止**。\n- **千古名句**——苏轼自述其文学观之核心。\n- 此句之关键:**「自然」**——**文章不应预先设定,而应随物赋形,自然而行止**。\n\n### 4.6 「文理自然,姿态横生」\n\n- 「**文理自然**」:**文章之理自然**——文章之条理出于自然。\n- 「**姿态横生**」:**姿态纵横而生**——文章之姿态千变万化。\n- 此承上句「**行云流水**」,进一步申说——**文章之理是「自然」,文章之姿态是「**横生**」**。\n\n### 4.7 「孔子曰:『言之不文,行而不远。』」\n\n- 引《左传·襄公二十五年》:**「**言之不文,行而不远**」**——**言之无文,行之不远**。\n- 此为儒家关于「**文**」的传统命题——**文是「**行远**」之工具**。\n\n### 4.8 「又曰:『辞达而已矣。』」\n\n- 引《论语·卫灵公》:**「**辞达而已矣**」**——**言辞能达意就够了**。\n- 此为孔子关于「**辞**」的另一传统命题——**辞之目的是「**达**」,不是「**文**」**。\n\n### 4.9 「夫言止于达意,即疑若不文,是大不然」\n\n- 「**言止于达意**」:**言辞只求达意**。\n- 「**即疑若不文**」:**就怀疑这不「**文**」**——若「辞达」则不必「文」,这是一个常见误解。\n- 「**是大不然**」:**这是大错特错**——苏轼反驳。\n\n### 4.10 「求物之妙,如系风捕影」\n\n- 「**求物之妙**」:**求事物之妙**——**追求描摹事物的精妙之处**。\n- 「**如系风捕影**」:**如同系风、捕影**——**极难**。\n- 这是苏轼文论中最深刻的比喻——**「**求物之妙**」**之难,正**「**如系风捕影**」**。\n\n### 4.11 「能使是物了然于心者,盖千万人而不一遇也」\n\n- 「**了然于心**」:**了然于心**——**对于对象能清楚明白**。\n- 「**千万人而不一遇**」:**千万人中不见一个**。\n- 「**了然于心**」之难:千万人中无一人——这是「**心能达**」之难。\n\n### 4.12 「而况能使了然于口与手者乎」\n\n- 「**了然于口与手**」:**能了然于口、能了然于手**——**既能用口说出,又能用手写出**。\n- 「**而况**」:**何况**——「**了然于口与手**」比「**了然于心**」更难。\n- 此谓「**辞达**」之难——**「**了然于口与手**」**比**「**了然于心**」**更是**千万人中无一**。\n\n### 4.13 「是之谓辞达」\n\n- 「**是之谓辞达**」:**这才叫「**辞达**」**——**苏轼重新定义「辞达」**。\n- 苏轼之「**辞达**」观:\n  - 不是「**只达意、不求文**」。\n  - 而是「**既能了然于心,又能了然于口与手**」。\n  - 此之谓「**辞达**」——**「**达**」**之极致是**「**心、口、手三然**」**。\n\n### 4.14 「辞至于能达,则文不可胜用矣」\n\n- 「**辞至于能达**」:**言辞达到能「**达**」**。\n- 「**则文不可胜用矣**」:**则「**文**」就无尽**。\n- 此为苏轼文论之归结——**「**辞达**」**之极致,**「**文**」**自然生焉**。\n\n### 4.15 「扬雄好为艰深之辞,以文浅易之说」\n\n- **扬雄**:西汉辞赋家(前 53—公元 18),著《法言》《太玄》《方言》,仿《论语》《周易》《尔雅》。\n- 「**好为艰深之辞**」:**喜用艰深之辞**。\n- 「**以文浅易之说**」:**以文饰浅易之说**——**故作高深,以掩饰浅易**。\n- 苏轼批判:**以「**艰深**」**文「**浅易**」**,**正是「**雕虫篆刻**」**。\n\n### 4.16 「此正所谓『雕虫篆刻』」\n\n- **雕虫篆刻**:汉代小学(文字学)所习,「**雕琢虫书、篆写刻符**」之小技。扬雄《法言·吾子》:**「**童子雕虫篆刻,壮夫不为**」**。\n- 苏轼借此以讥「**以艰深文浅易**」之文风。\n\n### 4.17 「欧阳文忠公言:『文章如精金美玉,市有定价,非人所能以口舌定贵贱也。』」\n\n- **欧阳文忠公**:欧阳修(1007-1072),谥号「**文忠**」,故称「**欧阳文忠公**」——苏轼座师。\n- **「文章如精金美玉,市有定价,非人所能以口舌定贵贱也」**:文章如精金美玉,**市场自有定价**,**不是人的口舌所能定贵贱**。\n- 此为欧阳修文论之核心命题——**文章之好坏有客观标准**,**不取决于一时一地之舆论**。\n- 苏轼引之,以说明「**好文章自有定评**」——**不必刻意求艰深以求名**。\n\n### 4.18 「千万珍重!」\n\n- 书信结尾之问候语:**千万珍重**。\n\n## 五、综合赏析\n\n### 5.1 「**如行云流水**」文学观——东坡文论的纲领\n\n本篇在中国文学批评史上之最大贡献,是**「**行云流水**」之文学纲领**——此四字为后世评东坡文之「**定评**」。\n\n**(1)**「**行云流水**」之核心:\n- **「**行**」**——**行于所当行**——文章之「**当行**」,是表达之需。\n- **「**止**」**——**止于所不可不止**——文章之「**不得不止**」,是表达之限。\n- 「**当行而止**」** ——**文章不应预设,不应雕琢,而应「**自然**」**。\n\n**(2)**与韩愈之比较:\n- **韩愈**:主张「**文以载道**」,文为载道之具;强调「**道**」为先,「**文**」为后。\n- **苏轼**:不强调「**文以载道**」,而是「**文以达意**」——「**辞达**」是「**自然**」之结果。\n\n**(3)**与欧阳修之比较:\n- **欧阳修**:主张「**道胜文至**」「**文以载道**」,但同时强调「**文章如精金美玉**」——**文章自有定评**。\n- **苏轼**:继承欧阳修之「**文章自有定评**」,进一步提出「**行云流水**」之文体自然观。\n\n**(4)**与王安石之比较:\n- **王安石**:主张「**适用**」,文须「**有补于世**」。\n- **苏轼**:不强调「**适用**」,而是「**自然**」之「**达**」。\n\n苏轼之文论,实为北宋文论之**最高综合**——**继承韩、欧、王,而自成一家**。\n\n### 5.2 「**辞达**」观之重新定义\n\n苏轼对孔子「**辞达而已矣**」之重新阐释,是本篇第二大贡献。\n\n**(1)传统理解**:**辞只求达意,不求文采**——把「**辞达**」与「**文**」对立。\n**(2)苏轼理解**:**「**辞达**」**之极致,**是「**了然于心、口、手**」**——**「**达**」**之极致是**「**文**」**,**而非反对「**文**」**。\n\n具体而言:\n- **「**了然于心**」**:**作者对所写之对象能清楚明白**(千万人不一遇)。\n- **「**了然于口**」**:**作者能用语言清楚地说出来**(比「了然于心」更难)。\n- **「**了然于手**」**:**作者能用文字清楚地写出来**(比「了然于口」更难)。\n\n**「**辞达**」**之极致,**是三「**然**」**之统一——**「**文**」**自然生焉**,**「**不可胜用**」**。\n\n### 5.3 「**雕虫篆刻**」之批评——以艰深文浅易\n\n本篇对「**以艰深文浅易**」之文风,有严厉批评。\n\n**扬雄**(西汉辞赋家)被视为「**艰深**」之代表:其《太玄》《法言》仿《周易》《论语》而作,追求形式之艰深,反掩盖内容之浅易。苏轼谓之「**雕虫篆刻**」。\n\n**此批评之后世影响**:\n- 唐宋古文运动皆反「**雕琢**」之文风。\n- 王安石之「**适用**」、欧阳修之「**自然**」、苏轼之「**行云流水**」,皆为反对「**以艰深文浅易**」之主张。\n- 此种主张对后世影响至深——**明代「**前后七子**」之拟古、清代「**桐城派**」之清真,皆受此影响**。\n\n### 5.4 与「**欧阳修**」之文论承接\n\n本篇引用欧阳修「**文章如精金美玉,市有定价**」之语,显示苏轼与欧阳修之文论承接。\n\n**(1)苏轼为欧阳修门生**:嘉祐二年(1057)苏轼进士及第,主考官为欧阳修。\n**(2)苏轼文论继承欧阳修**:从「**文章如精金美玉**」到「**如行云流水**」,是一脉相承。\n**(3)苏轼超越欧阳修**:欧阳修强调「**文以载道**」;苏轼进一步提出「**辞达**」之三「**然**」(心、口、手),为「**载道**」提供方法论。\n\n**东坡文论之集大成**:欧阳修奠基,苏轼集大成。\n\n### 5.5 文学史地位\n\n本篇在中国文学批评史上之地位:\n\n- **北宋文论之集大成**:承韩、欧、王而集大成。\n- **东坡文论之纲领**:**「**行云流水**」**为东坡文论的「**核心命题**」。\n- **后世之深远影响**:明代「**唐宋派**」(归有光等)、清代「**桐城派**」(方苞、刘大櫆、姚鼐)、「**湘乡派**」(曾国藩)皆直接取法于苏轼之文论。\n\n清人方苞《古文约选》评曰:**「**「**行云流水**」**四字,为东坡文之定评,亦为东坡文论之纲领**。」\n\n## 六、关联网络\n\n### 6.1 与「**欧阳修《文章精义》**」之承接\n\n欧阳修文论有「**文章如精金美玉,市有定价**」之论(亦见欧阳修《六一诗话》)。苏轼本篇引之,显示其文论承接关系。\n\n朱刚《苏轼十讲》第三讲指出,北宋「**贤良进卷**」之风,显示出「**策论之文风**」——**议论化、严密化、逻辑化**——为苏轼本篇文论之背景。\n\n### 6.2 与「**东坡散文**」之实践\n\n苏轼之散文创作,**正是「**行云流水**」**文学观之实践**:\n- **前赤壁赋**:由景生情,由情入理,行于所当行,止于所不得不止。\n- **记承天寺夜游**:80 余字,闲笔闲趣,自然无饰。\n- **石钟山记**:由质疑到考察到结论,行文自然,而议论警辟。\n- **方山子传**:以「**隐**」字立骨,不录正事而录神韵,自然高古。\n- **潮州韩文公庙碑**:以「**文**」**「**道**」**「**德**」**「**勇**」**四字定位韩愈,行止自然。\n\n**东坡之散文创作**,**实为「**行云流水**」**文学观之最佳注解**。\n\n### 6.3 与「**谢民师**」之交往\n\n谢民师为新淦(今江西新干)人,北宋文人。苏轼与谢民师之交谊:\n- 元丰八年(1085):苏轼量移汝州,途经高安,与谢民师相聚。\n- 元符三年(1100):苏轼北归,再经高安,与谢民师重逢。\n- 本篇作于此次重逢之际。\n\n此为东坡晚年之交游,**于人生终点处仍不忘提携后进、阐发文论**——见东坡之精神。\n\n### 6.4 与「**唐宋八大家**」之文论\n\n唐宋八大家之文论,本篇为其**最高综合**:\n- **韩愈**:**「**文以载道**」**(《原道》《师说》)。\n- **柳宗元**:**「**文以明道**」**(《答韦中立论师道书》)。\n- **欧阳修**:**「**文以载道**」**+「**文章如精金美玉**」**(《文章精义》)。\n- **苏洵、苏轼、苏辙**:**「**文以达意**」**(苏洵《仲兄字文甫说》、苏轼本篇)。\n- **王安石**:**「**适用**」**(《上人书》)。\n- **曾巩**:**「**道与文并重**」**(《答李翊书》)。\n\n苏轼之「**辞达**」**观,承前人而**自成一家**,为**唐宋文论**之**最高发展**。\n\n## 七、溯源记录\n\n- **原文依据**:通行整理本,以中华书局 1986 年点校本《苏轼全集》(孔凡礼点校)所收为底。\n- **系年依据**:王水照、崔铭《苏轼年表》;孔凡礼《苏轼年谱》卷六十八。明确系于元符三年(1100)。\n- **异说来源**:\n  1. 「**雕虫篆刻**」:扬雄《法言·吾子》原文。\n  2. 「**精金美玉**」:欧阳修《六一诗话》原文,亦有作「**精金良玉**」者。\n- **素材来源标注**:\n  - **朱刚《苏轼十讲》**:已取得。第三讲「贤良进卷」论及北宋制科之文风,**与本篇相关**(详朱刚《苏轼十讲》第三讲末段)。\n  - **王水照《苏轼研究》**:已取得,论文集。\n  - **林语堂《苏东坡传》**:已取得。\n  - **苏轼传(王水照、崔铭)**:已取得。\n  - **苏轼评传(王水照、朱刚)**:已取得。\n  - **苏东坡新传(李一冰)**:读取失败(编码错误);**待重新取得**。\n\n> **特别说明**:本篇作于苏轼北归途中(约今江西高安一带),时苏轼六十五岁,**七月二十八日即病逝于常州**——**此为东坡绝笔文论之一**,弥足珍贵。";
