const MD = "# 方山子传\n\n## 一、题名与体裁\n\n- **题名**:「方山子传」。方山子为传主之号,本名陈慥(zào),字季常。本篇以号名题,而以号贯篇。\n- **体裁**:传(史传之变体)。中国「传」体言正史之列传(如《史记》列传、《汉书》列传),亦含散传(如韩愈《圬者王承福传》《柳子厚墓志铭》)。本篇属「散传」之变体——以散笔写畸人,以「**隐**」字为骨,与《史记》之列传形似而神异。\n\n## 二、原文\n\n> **方山子,光、黄间隐人也。**少时慕朱家、郭解为人,闾里之侠皆宗之。稍壮,折节读书,欲以此驰骋当世,然终不遇。晚乃遁于光、黄间,曰岐亭。**庵居蔬食,不与世相闻;弃车马,毁冠服,徒步往来**。山中人莫识也,使其家僮持其榇以往,与人博奕,声名籍籍,谓「方山子」云。\n>\n> **予谪居于黄,过岐亭,见所谓方山子者。**从其家僮两人,跨驴而行,食且饮于逆旅,见其与樵者、牧者相与语,意甚欢。其子弟或请问其家产事,皆不答,而独以「方山」名其庐。\n>\n> **昔与余游庐山,饮酒咏诗,甚欢。**及去,余独登山而望之,不觉泪下。\n>\n> **方山子曰:「吾之所有,亦不过如此矣。」**\n>\n> **余观夫世之所谓士者,**方其意气之盛也,皆足以激昂一世,然一旦溃乱而失其常度,至于流离困顿,而后求所以为「方山」之徒者,始悔其向之为矣。嗟夫!**此虽贫贱而能不移者,固难能也;而富贵而能不移者,又岂易也哉**!\n\n> **校记**:\n> 1. 「榇」(chèn):棺木。通行本或作「榇」,意谓方山子使家僮随身携带棺木,示其「随时可死」之意。\n> 2. 「闾里之侠」:闾里即乡里。\n> 3. 「声名籍籍」:声名甚盛。\n> 4. 「方其意气之盛也」:通行本作「方」,意为「正」、「当」。\n\n## 三、写作背景\n\n- **系年**:约元丰三年至元丰七年(1080-1084)间。\n- **地点**:黄州(今湖北黄冈)、岐亭(今湖北麻城)。\n- **缘起**:苏轼贬黄州时期,与陈慥(字季常,号方山子)交往密切。陈慥之先世陈希亮与苏洵有旧,陈希亮之子陈慥遂与苏轼兄弟定交。苏轼贬黄州(1080)后,陈慥多次来访,苏轼亦多次至岐亭访陈慥。\n- **写作情境**:本篇作于元丰六年(1083)前后(亦说元丰五年或元丰七年)。作记之时,东坡已贬黄州数载,与陈慥情谊益深。\n- **异说**:具体作年历来有三说(元丰三年、元丰五年、元丰七年),今多取元丰五年至六年说。\n\n## 四、分段笺注\n\n### 4.1 「方山子,光、黄间隐人也」\n\n- **光、黄**:光州(今河南潢川)、黄州(今湖北黄冈)。两州相邻。\n- 「**隐人**」:隐居之人——非「逸民」(隐于朝市),而是「幽人」(隐于山林)。\n\n### 4.2 「少时慕朱家、郭解为人」\n\n- **朱家、郭解**:皆汉代著名侠客,见《史记·游侠列传》。\n- 朱家:汉初鲁人,以侠义闻名,救人之困,不伐其德。\n- 郭解:汉代大侠客,轵(今河南济源)人,以侠义闻名,「**自喜侠士,救人之难,不伐其德**」。\n- 陈慥少时慕朱家、郭解之侠义——**「**侠**」为方山子早年之精神底色**。\n\n### 4.3 「闾里之侠皆宗之」\n\n- **闾里之侠**:乡里间之侠客。\n- 「皆宗之」:都以陈慥为宗师——可见陈慥当时之「**侠名**」。\n\n### 4.4 「稍壮,折节读书,欲以此驰骋当世,然终不遇」\n\n- **折节**:改变志向(从侠转向儒)。\n- **驰骋当世**:在当世有所作为。\n- 「终不遇」:始终未能得志——**才而不遇**。\n\n### 4.5 「晚乃遁于光、黄间,曰岐亭」\n\n- **遁**:隐遁。\n- **岐亭**:在今湖北麻城,与黄州相邻。\n- 「**遁于光、黄间**」:陈慥之隐居地点在光、黄交界处之岐亭。\n\n### 4.6 「庵居蔬食,不与世相闻;弃车马,毁冠服,徒步往来」\n\n- **庵居**:居草庵。\n- **蔬食**:以蔬菜为食(非肉食)。\n- **「不与世相闻」**:不与世事相通——**与世隔绝**。\n- **「弃车马,毁冠服」**:放弃车马(不乘车)、毁坏冠服(不戴士人之冠、穿士人之服)。\n- **「徒步往来」**:徒步往来。\n\n此为**「形」之隐**——外在生活之改造。\n\n### 4.7 「山中人莫识也,使其家僮持其榇以往,与人博奕,声名籍籍」\n\n- **「山中人莫识也」**:山中人都不认识他——隐姓埋名。\n- **「使其家僮持其榇以往」**:让家僮带着棺木与他一起——**示其随时可死之意**(魏晋名士风度)。\n- **「与人博奕」**:与人下棋博奕(赌博)。**嗜赌**——方山子另一面之「任侠」气质。\n- **「声名籍籍」**:声名仍然很大——**虽隐而名不隐**。\n\n### 4.8 「予谪居于黄,过岐亭,见所谓方山子者」\n\n- 苏轼自报家门:**自己贬于黄州,因过岐亭而见方山子**。\n\n### 4.9 「从其家僮两人,跨驴而行」\n\n- **从其家僮两人**:方山子有家僮二人跟随。\n- **跨驴而行**:骑驴而行(不骑马、不坐车——保持「徒步」原则,驴可代步)。\n\n### 4.10 「食且饮于逆旅,见其与樵者、牧者相与语,意甚欢」\n\n- **逆旅**:旅店。\n- **「与樵者、牧者相与语」**:与打柴的、放牧的人谈话。\n- **「意甚欢」**:意态非常欢快——**陈慥能「与下层人共语」而不显骄傲**,这是真「隐」之姿态。\n\n### 4.11 「其子弟或请问其家产事,皆不答」\n\n- **子弟**:家中的子弟(陈慥家中晚辈)。\n- 「请问其家产事」:问陈家之财产状况。\n- 「皆不答」:**皆不答**——陈慥不在乎家产。\n\n### 4.12 「而独以『方山』名其庐」\n\n- 「**方山**」:方山。陈慥于岐亭隐居,其庐名「方山」。\n- 「独以方山名其庐」:**不以家产、不以姓名,只以隐居之地「方山」名其庐**——**「方山」即陈慥,陈慥即「方山」**。\n\n### 4.13 「昔与余游庐山,饮酒咏诗,甚欢」\n\n- **庐山**:在今江西九江,宋代文士常游之胜地。\n- 「**昔与余游庐山**」:从前方山子与我(苏轼)同游庐山。\n- 「**饮酒咏诗,甚欢**」:饮酒作诗,甚为欢快。\n\n### 4.14 「及去,余独登山而望之,不觉泪下」\n\n- 「**及去**」:等到分别之时。\n- 「**余独登山而望之**」:**我独自登山而望其去**——目送之意。\n- 「**不觉泪下**」:**不知不觉中流泪**——一种深厚的情感。\n- 此为东坡极为深情之笔——「**为方山子写传记而流泪**」,见二人情谊之深。\n\n### 4.15 「方山子曰:『吾之所有,亦不过如此矣。』」\n\n- 方山子本人之语:\n- 「**吾之所有,亦不过如此矣**」:**我所有的,也不过是这样了**——陈慥对自己当下状态的总结。\n- 「此」指隐居生活。**陈慥认为:我之所有,就是这种隐居生活**——既不怨亦不骄,只是「**我只有这个了**」。\n\n### 4.16 「余观夫世之所谓士者,方其意气之盛也,皆足以激昂一世」\n\n- 苏轼之议论:\n- 「**世之所谓士者**」:世人所说的「士」。\n- 「**方其意气之盛也**」:当他们意气最盛之时。\n- 「**皆足以激昂一世**」:**都可以激励一世**——士人得志之时,皆可有所作为。\n\n### 4.17 「然一旦溃乱而失其常度,至于流离困顿」\n\n- 「**溃乱而失其常度**」:**溃乱而失去常度**——遭遇变故,失去平日的态度与节操。\n- 「**流离困顿**」:流离失所,困苦颠沛。\n\n### 4.18 「而后求所以为『方山』之徒者,始悔其向之为矣」\n\n- 「**求所以为方山之徒**」:**才想到要去做方山子这样的人**。\n- 「**始悔其向之为**」:**才开始后悔从前之所为**。\n- 此为对「士人」之沉痛批评——**「一遇变故,方悔前非;后悔已迟**」。\n\n### 4.19 「嗟夫!此虽贫贱而能不移者,固难能也」\n\n- 感叹:\n- 「**此虽贫贱而能不移者,固难能也**」:**像方山子这样,虽处贫贱而能不移其志的人,本就是难能的**。\n\n### 4.20 「而富贵而能不移者,又岂易也哉」\n\n- 「**而富贵而能不移者,又岂易也哉**」:**而富贵之后而能不移其志的人,又哪里容易呢**?\n\n这是**全篇之警句**:\n- 「贫贱不移」——指方山子。\n- 「**富贵不移**」——指一般之士。\n- 苏轼之时代与一生,所见士人:**「得志则飞扬、失意则后悔」**——东坡感慨。\n\n## 五、综合赏析\n\n### 5.1 文体之变——「散传」的极致\n\n本篇以「**散笔**」写「**传**」,与《史记》之正传不同:\n\n**(1)不录家世**:正传必录家世、籍贯、本姓;本篇不录陈慥之先世(陈希亮为名臣)。\n**(2)不录事迹**:正传必录主要事迹;本篇不录陈慥之主要事迹(陈慥曾应科举、曾任官)。\n**(3)不录婚姻**:正传必录配偶子女;本篇仅以「**其子弟或请问其家产事,皆不答**」一句带过。\n**(4)只录「**形**」**:本篇所录,只是陈慥之「**形貌**」(跨驴、徒步、与人语)、陈慥之「**庐名**」(方山)、陈慥之「**声名**」(声名籍籍)、陈慥之「**一言**」(吾之所有,亦不过如此矣)。\n**(5)以议论收**:末段东坡直接出面议论,与正传之「**太史公曰**」一致,然议论对象已超出方山子本人——「**世之所谓士者**」。\n\n这种「**不录正事而录神韵**」之写法,是散文家之「**变形**」——史传之骨,散文之魂。\n\n### 5.2 「隐」之多重意涵\n\n「**隐**」字为本篇之眼,其义至少有四重:\n\n**(1)形之隐**:弃车马、毁冠服、徒步往来——外在生活之改造。\n**(2)地之隐**:遁于光、黄间之岐亭——隐于山林。\n**(3)名之隐**:山中人莫识——隐姓埋名。\n**(4)心之隐**:独以「方山」名其庐——心中所居、所安,唯「方山」是。\n\n四义中,第四义最深——**「方山」非地名,而是方山子之「**心所安处**」**。\n\n### 5.3 「**此虽贫贱而能不移者,固难能也;而富贵而能不移者,又岂易也哉**」\n\n此为全篇之警句,其深刻之处在于:\n\n**(1)「贫贱不移」是方山子**:方山子早慕侠、壮欲骋、晚而隐——**形隐而心不移**。\n**(2)「**富贵不移**」是对「士」之问**:然「**一般之士**」(「世之所谓士者」),富贵而不移其志,**岂易也哉**?\n**(3)东坡之自况**:东坡本人一生——嘉祐进士(得志)、乌台诗案(失意)、贬黄州(困顿)、赦还(再起)、贬惠州儋州(再失)——**「**方其意气之盛也,皆足以激昂一世,然一旦溃乱而失其常度**」**——东坡笔下「世之所谓士者」,**实亦自况也**。\n\n此为东坡**借传寓己**之笔——方山子之「**贫贱不移**」,实为东坡对自身「**屡经贬谪而不移其志**」之自勉。\n\n### 5.4 与「东坡其他传记文」之比较\n\n- **《方山子传》**(约 1080-1083):散传写「**隐者**」——以「隐」立骨。\n- **《亡妻王氏墓志铭》**(1065):志铭写「**贤妇**」——以「情」立骨。\n- **《祭黄几道文》**(1084):祭文写「**亡友**」——以「哀」立骨。\n- **《东坡志林》**(散篇):笔记写「**心迹**」——以「真」立骨。\n\n东坡为文,题材广而各体咸备——传、铭、祭、记、赋、论、碑、书,无一不工。\n\n### 5.5 文学史地位\n\n本篇在中国散文史上之地位,主要不在「传」体之突破(中国散文史上之「**散传**」,韩愈、柳宗元已开其先声),而在「**借传寓己**」之笔法。\n\n清人沈德潜《唐宋八大家文读本》评曰:「**借一传以自写其胸中块垒**。」茅坤《唐宋八大家文钞》评曰:「**方山子之「隐」,东坡之「志」也**。」\n\n## 六、关联网络\n\n### 6.1 与「陈季常」之诗\n\n陈慥(字季常)是东坡于黄州时期最亲密之友人之一。苏轼于黄州作《岐亭五首》(元丰三年,1080)、《戏陈季常》《寄题岐亭五首》等诗,反复咏陈季常。其中最广为流传者为:\n\n> 「龙丘居士亦可怜,谈空说有夜不眠。忽闻河东狮子吼,拄杖落手心茫然。」\n\n「**河东狮子吼**」之典,指陈季常之妻柳氏凶悍——此为东坡戏陈季常之作,可见二人交情之深(可戏谑)。\n\n### 6.2 与「陈希亮」与「苏洵」之旧\n\n陈季常之父陈希亮(字公弼),北宋名臣,与苏洵(苏轼父)有旧。陈希亮与苏洵、张方平、李端愿等为友;其子陈慥遂与苏轼兄弟定交。\n\n本篇不录陈氏家世者,正是东坡以「**散传**」之笔有意略去——只写陈季常本人之「**形**」与「**神**」,不及其「**世**」。\n\n### 6.3 与「岐亭」之地望\n\n岐亭在今湖北麻城,与黄州相邻。苏轼于黄州时期,常自黄州往岐亭访陈季常;陈季常亦常自岐亭至黄州访苏轼。\n\n- 苏轼《岐亭五首》之序:「元丰三年正月庚寅,予与徐得之、子由同游岐亭,见陈季常……」\n- 苏轼《书<方山子传>后》:具体作年之自记。\n\n### 6.4 与「东坡黄州时期」之交往圈\n\n东坡贬黄州期间,与陈季常(方山子)、王巩(王定国)、苏迈(长子)、苏辙(弟)、王文甫(王淮东)、巢谷(巢元修)、徐得之等多有往来。本篇所述陈季常,是东坡黄州之交谊代表。\n\n## 七、溯源记录\n\n- **原文依据**:通行整理本,以中华书局 1986 年点校本《苏轼全集》所载为底。异文「榇」(一作「衾」、「枣」)之异,通行本作「榇」,意为「棺木」,从之。\n- **系年依据**:王水照、崔铭《苏轼年表》;孔凡礼《苏轼年谱》卷三十七、四十。今多采元丰三年至元丰七年(1080-1084)间说,具体作年存三说。\n- **异说来源**:\n  1. 具体作年:元丰三年说、元丰五年说、元丰七年说并存。\n  2. 「榇」之具体解释:或以为「**棺木**」(示其随时可死),或以为「**枕头**」(示其隐士风度)。\n  3. 「**河东狮子吼**」之典:陈季常妻柳氏悍——此为后世传说,非本篇所述。\n- **素材来源标注**:\n  - **王水照、朱刚《苏轼评传》**:已取得文本。其中思想史部分论及东坡与陈季常之交谊。\n  - **王水照《苏轼研究》**论文集:已取得文本,涉及苏轼交游圈之分析。\n  - **王水照崔铭《苏轼传》**、**林语堂《苏东坡传》**、**朱刚《苏轼十讲》**:已取得文本。\n  - **苏东坡新传(李一冰)**:本环境读取失败(编码问题),**待重试**。第六章「吟啸徐行迎风雨」论及东坡与陈季常之交谊,可与本篇互见。";
