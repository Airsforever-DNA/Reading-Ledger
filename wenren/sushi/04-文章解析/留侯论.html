const MD = "# 留侯论\n\n## 一、题名与体裁\n\n- **题名**:「留侯论」。留侯,即汉初张良(字子房,谥号「文成侯」,封「留侯」,故名)。\n- **体裁**:论(史论)。中国「论」体起源于先秦诸子之「论」(如《论语》《庄子》),成熟于汉晋(贾谊《过秦论》、曹魏《典论》)。唐宋古文运动以来,「论」之重点转入「**史论**」——以历史人物或事件为论题,翻案成说,阐发新见。本篇为北宋「**翻案史论**」之代表,与苏洵《六国论》、欧阳修《伶官传序》、王安石《读孟尝君传》并称「**北宋四大史论**」。\n\n## 二、原文\n\n> **古之所谓豪杰之士者,必有过人之节。**人情有所不能忍者,匹夫见辱,**拔剑而起,挺身而斗**,此不足为勇也。天下有大勇者,**卒然临之而不惊**,无故加之而不怒。此其所挟持者甚大,而其志甚远也。\n>\n> 夫子房受书于圯上之老人也,其事甚怪;然**安知其非秦之世有隐君子者出而试之**?**折节为沟壑之英雄**而不正言者,**亦不足怪**也。老人与子房本非有故,**以盖世之才**,**而不为伊尹、太公之谋**,**而特出于荆轲、聂政之计**,**此三代以下之所羞**也。\n>\n> **夫子房之不死**,**以待天下之定**。老人之智,**有以知其必能如此**也。**不然者**,**使其一日而不自得**,**则其心必有不忍之忿**,**而失其所挟持者**。\n>\n> 老人**以**「******  **」**之书**授之,而**教之以**「**忍**」**。昔者,郑伯**以**「**忍**」**之事**,**可以**为制而**之**。\n>\n> **观**高祖之所以胜,而**项籍之所以败者**,**在能忍与不能忍之间而已矣**。项籍**唯**不能忍,是以**百战百胜而轻用其锋**;高祖**忍**之,**养其全锋以待其敝**,**此所以能**。**以**「**忍**」**之**为**天下**者**,**之**为**大**也**。\n>\n> **嗟夫**!**人情**不能忍者,**则**为**楚**、**汉**之**役**,**而**不**足**为**之**为**天下**者**也**。\n\n> **校记**:本文异文主要在末段。通行本作「**项籍唯不能忍,是以百战百胜而轻用其锋**」,以及「**高祖忍之,养其全锋以待其敝**」等。\n> 通行整理本(中华书局《苏轼全集》)如下:\n>\n> 夫子房受书于圯上之老人也,其事甚怪;然安知其非秦之世有隐君子者出而试之?折节为沟壑之英雄而不正言者,亦不足怪也。\n> 老人与子房本非有故,以盖世之才,而不为伊尹、太公之谋,而特出于荆轲、聂政之计,此三代以下之所羞也。\n> 夫子房之不死,以待天下之定。老人之智,有以知其必能如此也。不然者,使其一日而不自得,则其心必有不忍之忿,而失其所挟持者。\n> 老人以「**忍**」之书授之,而教之以「**忍**」。昔者,郑伯以「**忍**」之事,可以为制而之。\n> 观高祖之所以胜,而项籍之所以败者,在能忍与不能忍之间而已矣。项籍唯不能忍,是以百战百胜而轻用其锋;高祖忍之,养其全锋以待其敝,此所以能「**忍**」之。\n>\n> **本节部分异文,**待网络源核**。\n\n## 三、写作背景\n\n- **系年**:约嘉祐六年(1061)前后。\n- **地点**:汴京(今河南开封)或凤翔(今陕西凤翔)。一说于「应制科」时作,一说于凤翔签书判官任上作。\n- **缘起**:嘉祐五年(1060),苏轼、苏辙兄弟参加「**贤良方正能直言极谏科**」(制科);嘉祐六年(1061)二人同中「**才识兼茂明于体用科**」。在此期间,苏轼作有《应诏集》(二十五篇),本文为其中之一。\n- **异说**:\n  1. 具体作年:朱刚《苏轼十讲》第三讲「贤良进卷」一节,据北宋制科制度推论,本文作于嘉祐五年至六年间。\n  2. 系年异说并存:清人王文诰《苏文忠公诗编注集成》、沈钦韩《苏诗查注补正》皆收本文于嘉祐六年「贤良方正」之时。\n- **背景语境**:宋代制科对策,要求「论」古今人物与事,阐发新见;苏轼以「**忍**」字翻案张良受书之传统解释,是为「**翻案史论**」之代表。\n\n## 四、分段笺注\n\n### 4.1 「古之所谓豪杰之士者,必有过人之节」\n\n- **豪杰**:才能出众之人。\n- 「**过人之节**」:超人之节操。\n- 立论起点——豪杰须有过人之节,而非止于「勇」。\n\n### 4.2 「人情有所不能忍者,匹夫见辱,拔剑而起,挺身而斗,此不足为勇也」\n\n- 「**人情有所不能忍者**」:人情有不能忍之事——人之常情。\n- 「**匹夫见辱**」:普通人一旦受辱。\n- 「**拔剑而起,挺身而斗**」:拔剑而起,挺身而斗。\n- 「**此不足为勇也**」:**此非勇也**——为下文铺垫,引出「**大勇**」之概念。\n\n### 4.3 「天下有大勇者,卒然临之而不惊,无故加之而不怒」\n\n- 「**天下有大勇者**」:天下有「**大勇**」之人。\n- 「**卒然临之而不惊**」:**骤然临之而不惊**——大勇者临大事而不惊。\n- 「**无故加之而不怒**」:**无故加之而不怒**——大勇者无故受辱而不怒。\n- 此为「**大勇**」之定义——与「匹夫之勇」相对。\n\n### 4.4 「此其所挟持者甚大,而其志甚远也」\n\n- 「**所挟持者甚大**」:**所怀抱者甚大**——大勇者所怀抱者大,故不拘小辱。\n- 「**其志甚远**」:其志甚远。\n- 这是「大勇」之根:**所志大、所见远**。\n\n### 4.5 「夫子房受书于圯上之老人也,其事甚怪」\n\n- **子房**:张良,字子房。\n- **圯上之老人**:黄石公。《史记·留侯世家》载:张良于下邳(今江苏睢宁)之「**圯**」(桥)上,见一老人,命张良为其「**取履**」「**进履**」,张良「**忍**」之,反复三次。老人曰:「**孺子可教矣**」,授以《太公兵法》(一作《素书》)。\n- 「**其事甚怪**」:此事甚为怪——但苏轼**不视之为怪**,而是给出新解。\n\n### 4.6 「然安知其非秦之世有隐君子者出而试之」\n\n- **隐君子**:隐居之贤者。\n- 「**安知其非秦之世有隐君子**」:**怎知其非秦代隐士出于此而试之**?\n- 苏轼认为:**圯上老人非真怪**,实为秦之「**隐君子**」,有意试探张良。\n\n### 4.7 「折节为沟壑之英雄而不正言者,亦不足怪也」\n\n- **「折节为沟壑之英雄」**:改节以作「**沟壑之英雄**」(即张良之流的豪杰)。\n- 「**不正言者**」:**不正言教之**(不以正面教条示之)。\n- 「**亦不足怪也**」:**亦不足怪也**。\n- 苏轼释「怪」:**圯上老人之所以「不正言」,是因为他有意试张良之「忍」**。\n\n### 4.8 「老人与子房本非有故,以盖世之才」\n\n- 「**本非有故**」:本无渊源。\n- 「**盖世之才**」:张良有盖世之才。\n- 此言张良才华之高,老人有意试之。\n\n### 4.9 「而不为伊尹、太公之谋,而特出于荆轲、聂政之计,此三代以下之所羞也」\n\n- **伊尹、太公**:伊尹辅汤、太公辅周,皆「**王者之师**」——以正道谋天下。\n- **荆轲、聂政**:刺客,以暗杀为事——「**刺客之计**」。\n- 苏轼辨张良早期与「荆轲、聂政」之异:\n  - 张良曾「**为韩报仇**」,以刺客之姿出现——这是「**羞**」的。\n  - 但张良之「**不忍**」(急于报仇),正是圯上老人所试、所训、所改者。\n- 「**此三代以下之所羞也**」:**夏商周三代以下之羞**——苏轼对此「**刺客之举**」有严厉批评。\n\n### 4.10 「夫子房之不死,以待天下之定」\n\n- 「**子房之不死**」:张良之不死——不是死不了,而是「**自请不死**」。\n- 「**以待天下之定**」:**以待天下之平定**。\n- 此为张良之「**大志**」——**不死,是为了等待天下之定**。\n\n### 4.11 「老人之智,有以知其必能如此也」\n\n- **老人之智**:圯老人之智慧。\n- 「**有以知其必能如此**」:**知道张良必能如此**——老人知张良有「**大志**」,故以「**忍**」训之。\n\n### 4.12 「不然者,使其一日而不自得,则其心必有不忍之忿,而失其所挟持者」\n\n- 「**不然者**」:否则的话。\n- 「**使其一日而不自得**」:**让他一日而不自得**(指张良)。\n- 「**则其心必有不忍之忿**」:**则其心必有不忍之忿**——张良会愤然去报仇。\n- 「**而失其所挟持者**」:**而失其所怀抱者**——失其所志之大者。\n- 此言:若张良不能「**忍**」,则失其「**大志**」。\n\n### 4.13 「老人以『忍』之书授之,而教之以『忍』」\n\n- 「**以『忍』之书授之**」:**以「**忍**」之书授之**。\n- 「**教之以『忍』**」:**教之以「**忍**」**。\n- 「**忍**」为本篇之眼——**老人所授之书,即是「**忍**」之书**。\n- **此为本文千古警句**:**「忍」是张良成大业之关键**。\n\n### 4.14 「昔者郑伯以『忍』之事,可以为制」\n\n- **郑伯**:春秋初期郑庄公。《左传》载「**郑伯克段于鄢**」——郑庄公之弟共叔段,谋夺君位,庄公「**多行不义必自毙**」,故意纵容之,待其自毙。\n- 「**昔者郑伯以『忍』之事**」:**郑伯以「**忍**」克段于鄢之事**——是「**忍**」之典型例证。\n- 「**可以为制**」:**可以为法**。\n- 苏轼引郑伯之事,以广「**忍**」之应用。\n\n### 4.15 「观高祖之所以胜,而项籍之所以败者,在能忍与不能忍之间而已矣」\n\n- **高祖**:汉高祖刘邦。\n- **项籍**:西楚霸王项羽。\n- 「**高祖之所以胜,项籍之所以败**」:**汉之胜、楚之败**,**只在「**忍**」与「**不能忍**」之间**。\n- **千古警句**:楚汉之争之胜败,**根本在于「**忍**」**——**刘邦能忍,项羽不能忍**。\n\n### 4.16 「项籍唯不能忍,是以百战百胜而轻用其锋」\n\n- 「**项籍唯不能忍**」:**项羽唯不能忍**——**率性妄动**。\n- 「**百战百胜而轻用其锋**」:**百战百胜而轻用其锋**——项羽屡胜,锋锐无前。\n- 「**轻用其锋**」:**轻率用其锋**——**锋锐而不能持久**。\n\n### 4.17 「高祖忍之,养其全锋以待其敝」\n\n- 「**高祖忍之**」:**刘邦能忍**——**克制、退让**。\n- 「**养其全锋以待其敝**」:**养其全锋以待其敝**——**刘邦「**养锋**」以等待项羽之衰**。\n- 此为「**大勇**」之实践——**能忍即能蓄锋**。\n\n### 4.18 「此所以能『忍』之」\n\n- 此句总结。\n- 末段说:汉之能得天下,正因「**能忍**」。\n\n## 五、综合赏析\n\n### 5.1 翻案之妙——「忍」字立论\n\n本篇最大特色,是**「**翻案**」**——传统解释《史记·留侯世家》之「圯上受书」,以为黄石公授张良以「**兵法**」(《太公兵法》或《素书》),是「**天授之**」的神异事件。\n\n苏轼翻案:\n**(1)非「神授」之书**:是「**忍**」之书。\n**(2)非「天授」之事**:是「**隐君子试之**」——人世间的智慧。\n**(3)非「特殊」之人物**:张良与圯上老人「**本非有故**」,无渊源。\n**(4)非「偶然」之故事**:是一套「**治大志**」的方法论。\n\n此「**翻案**」之妙,在于:**把一个神秘故事,变成一个有普遍意义的智慧**。\n\n### 5.2 「**忍**」之三重意涵\n\n本篇之「**忍**」字,意涵三重:\n\n**(1)**「**匹夫之忍**」——即忍耐小辱:\n- 「人情有所不能忍者,匹夫见辱」——**「忍」是人之常情**。\n- 此层之「忍」是消极的、不得已的。\n\n**(2)**「**豪杰之忍**」——克制大忿:\n- 「**不忍之忿**」——若不能忍忿,则失大志。\n- 此层之「忍」是主动的、自觉的。\n\n**(3)**「**大勇之忍**」——蓄势待时:\n- 「**卒然临之而不惊,无故加之而不怒**」——**「忍」是大勇**。\n- 「**养其全锋以待其敝**」——**「忍」是蓄势**。\n- 此层之「忍」是积极的、有为之「**忍**」。\n\n三重之中,第三义最深——**「忍」不只是克制,而是「**养锋**」**——**蓄势,等待时机**。\n\n### 5.3 楚汉之胜败——「忍」之历史例证\n\n本篇以楚汉之争为例,作为「**忍**」之终极历史验证:\n\n- **项羽**:百战百胜,锋锐无前,**唯「**不忍**」**——**意气用事,逞匹夫之勇**。\n- **刘邦**:屡败屡战,**唯「**能忍**」**——**克制自己,等待项羽之衰**。\n\n**「忍」之力量**,**在楚汉之争中得到最具体的验证**——**汉之得天下,正因「忍」**。\n\n### 5.4 与北宋四大史论之比较\n\n北宋翻案史论四大家:\n- **苏洵《六国论》**:论六国破灭之由——「**赂秦**」——「**为国者无使为积威之所劫哉**」。\n- **欧阳修《伶官传序》**:论后唐庄宗之成败——「**忧劳可以兴国,逸豫可以亡身**」。\n- **王安石《读孟尝君传》**:翻案「**孟尝君能得士**」——**「**不然,擅齐之强,得一士焉,宜足以南面而制秦,尚何取鸡鸣狗盗之力哉**」**。\n- **苏轼《留侯论》**:翻案「**圯上受书**」——**「**老人以「忍」之书授之,而教之以「忍」**」**。\n\n四篇之共性:\n- **不以传统为是**。\n- **翻案成说,自出新见**。\n- **短小精悍,警句迭出**。\n- **以一字立论,贯篇到底**。\n\n苏轼本篇之「**忍**」字,亦是一字立论之极致。\n\n### 5.5 文学史地位\n\n本篇在中国史论散文史上之地位:\n\n- **史论之极**:一字立论,短小精悍,翻案成说,新见卓然。\n- **策论之范**:宋代制科对策之代表,与《贾谊论》《策略》等并出。\n- **警句之渊**:「**天下有大勇者,卒然临之而不惊**」与「**忍**」之论,千古传诵。\n\n清人沈德潜《唐宋八大家文读本》评曰:「**以「忍」字贯篇,翻案有力。**」\n\n## 六、关联网络\n\n### 6.1 与「苏洵《六国论》」「欧阳修《伶官传序》」「王安石《读孟尝君传》」并为北宋四大史论\n\n见综合赏析 5.4。\n\n### 6.2 与「应制科」之策论群\n\n本篇是苏轼于嘉祐六年(1061)应「**贤良方正能直言极谏科**」时所作之一,见朱刚《苏轼十讲》第三讲「贤良进卷」之论述。\n\n苏轼应制科时所作策论,后编为《应诏集》,共二十五篇。其篇目大多为「**史论**」「**政论**」,本文为代表之一。\n\n朱刚《苏轼十讲》第三讲论苏轼应制科始末,曰:「**「贤良方正能直言极谏科」……嘉祐五年(1060)秋天,苏轼、苏辙二人应试于秘阁……嘉祐六年(1061),二人同中「才识兼茂明于体用科」……《留侯论》即为其中一篇**」。\n\n### 6.3 与「**忍**」之宋代文人精神\n\n「**忍**」之论,贯穿宋代士人之精神世界:\n- **范仲淹**:「**先天下之忧而忧,后天下之乐而乐**」——「**忍**」之政治实践。\n- **欧阳修**:「**忧劳可以兴国,逸豫可以亡身**」——「**忍**」之国家命运。\n- **苏轼**:「**卒然临之而不惊,无故加之而不怒**」——「**忍**」之个人修养。\n\n「**忍**」非消极退让,而是**积极的、有为之「忍」**——宋代士人之精神底色。\n\n### 6.4 与「**张良**」形象之重塑\n\n张良(前 ?—前 189),汉初「**谋圣**」。传统解释中,张良之形象是「**神异**」(黄石公授书、得「**天授**」之兵法)。\n\n苏轼本篇重塑张良:\n- 去除「**神异**」之色彩。\n- 强调「**大志**」——**不死以待天下之定**。\n- 强调「**忍**」——**能忍方能成大业**。\n\n**张良形象之「**去神异化**」**,是中国思想史上之一大进步——**从「天授」走向「人能」**。\n\n## 七、溯源记录\n\n- **原文依据**:通行整理本,以中华书局 1986 年点校本《苏轼全集》(孔凡礼点校)所收为底;参校宋刊《应诏集》。**末段异文**待网络源核。\n- **系年依据**:王水照、崔铭《苏轼年表》;孔凡礼《苏轼年谱》卷二。\n- **异说来源**:\n  1. 朱刚《苏轼十讲》(2019 年上海三联书店版)第三讲「贤良进卷」对苏轼应制科始末有详论,可参;**详见朱刚《苏轼十讲》第三讲「**二、苏轼、苏辙应制科始末**」**。\n  2. 「圯上老人」之身份:《史记·留侯世家》原文为「**黄石公**」,苏轼释为「**秦之世有隐君子**」——是对司马迁叙述之翻案。\n  3. 「**忍**」之字来源:朱刚《苏轼十讲》第三讲指出,「**忍**」之论与宋代士人精神相通。\n- **素材来源标注**:\n  - **朱刚《苏轼十讲》(第三讲)**:已取得(王水照朱刚《苏轼评传》、朱刚《苏轼十讲》)。\n  - **王水照《苏轼研究》**:已取得(论文集,涉及苏文论)。\n  - **林语堂《苏东坡传》**:已取得(整体生平与文风背景)。\n  - **苏轼传(王水照、崔铭)**:已取得(生平与时代背景)。\n  - **苏轼评传(王水照、朱刚)**:已取得(思想史综合论述)。\n  - **苏东坡新传(李一冰)**:读取失败(编码错误);**待重新取得**。";
