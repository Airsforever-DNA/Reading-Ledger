const MD = "# 后赤壁赋\n\n## 一、题名与体裁\n\n- **题名**:「后赤壁赋」。作于元丰五年(1082)十月十五日,前于「前赤壁赋」(同年七月十六日)三月,故名「后」。\n- **体裁**:赋。与前赋同为「文赋」,然作意截然不同。前赋说理,后赋写境;前赋主客共游,后赋苏子独登。\n\n## 二、原文\n\n> **是岁十月之望,步自雪堂,将归于临皋。二客从予过黄泥之坂。霜露既降,木叶尽脱,人影在地,仰见明月。顾而乐之,行歌相答。**\n>\n> 已而叹曰:「有客无酒,有酒无肴;月白风清,如此良夜何?」客曰:「今者薄暮,举网得鱼,巨口细鳞,状似松江之鲈。顾安所得酒乎?」归而谋诸妇。妇曰:「我有斗酒,藏之久矣,以待子不时之须。」\n>\n> **于是携酒与鱼,复游于赤壁之下。江流有声,断岸千尺;山高月小,水落石出。**\n>\n> 予乃摄衣而上,履巉岩,披蒙茸,踞虎豹,登虬龙;攀栖鹘之危巢,俯冯夷之幽宫。盖二客不能从焉。划然长啸,草木震动,山鸣谷应,风起水涌。予亦悄然而悲,肃然而恐,凛乎其不可留也。反而登舟,放乎中流,听其所止而休焉。\n>\n> **时夜将半,四顾寂寥。适有孤鹤,横江东来。翅如车轮,玄裳缟衣,戛然长鸣,掠予舟而西也。**\n>\n> 须臾客去,予亦就睡。梦一道士,羽衣蹁跹,过临皋之下,揖予而言曰:「赤壁之游乐乎?」问其姓名,俯而不答。「呜呼噫嘻!我知之矣。畴昔之夜,飞鸣而过我者,非子也耶?」道士顾笑,予亦惊寤。开户视之,不见其处。\n\n> **异文校记**:\n> 1. 「缟衣」一作「缟裳」,通行本作「缟衣」(指鹤身白羽如白衣)。\n> 2. 「不时之须」:通行本作「不时之需」,意为「不时之需」。「须」通「需」。\n\n## 三、写作背景\n\n- **系年**:元丰五年壬戌(1082)十月十五日。与「前赤壁赋」同年,作于前赋三月之后。\n- **地点**:黄州(今湖北黄冈)雪堂—临皋—赤壁一线。雪堂为苏轼元丰五年于黄州东坡所筑之居所,故以「东坡」为号(详见别卷「东坡」得号考)。\n- **缘起**:自雪堂(东坡)步还临皋,与二客过黄泥坂,见月而乐,寻酒复游赤壁。苏轼《东坡志林·后赤壁赋》条:「十月十五日,与客饮于雪堂,夜归临皋。」则「雪堂」「临皋」并黄州居所。\n- **异说**:本赋「道士化鹤」之结尾,历代解读者多向道家思想索解;亦有疑为苏轼谪居黄州时期精神苦闷之寄托。今并存。\n\n## 四、分段笺注\n\n### 4.1 「雪堂」「临皋」「黄泥之坂」\n\n- **雪堂**:苏轼于黄州东坡筑之居所。元丰五年三月始建,雪中落成,因名「雪堂」。\n- **临皋**:黄州临皋亭,本州官设驿馆。苏轼元丰三年(1080)到黄州之初寓居此处。\n- **黄泥坂**:雪堂与临皋之间的地名,往来必经。\n\n### 4.2 「人影在地,仰见明月」\n\n- 霜降叶脱,大地澄澈,月色与月光下人影相映。\n- 此句与陶渊明「采菊东篱下,悠然见南山」(《饮酒》其五)之神韵相近——平淡中见真意。\n\n### 4.3 「有客无酒,有酒无肴;月白风清,如此良夜何」\n\n- 「如此良夜何」:对良夜而叹惜,自问自答的笔法,与前赋「何为其然也」相呼应。\n\n### 4.4 「巨口细鳞,状似松江之鲈」\n\n- **松江鲈**:松江(今属上海)所产鲈鱼,以「巨口细鳞」为特征,《后汉书·左慈传》「松江鲈鱼」之典,后世以为美食之代表。\n- 此处用「状似」而非「即是」,黄州鲈非真松江鲈,而以家乡风味引发联想。\n\n### 4.5 「我有斗酒,藏之久矣,以待子不时之须」\n\n- 「斗酒」:一斗之酒。汉代以来「斗酒」常以「会饮」之量。\n- 「不时之须」:不期而至之需。「须」通「需」。\n\n### 4.6 「江流有声,断岸千尺;山高月小,水落石出」\n\n- 此十六字为古今传诵之名句:\n  - **断岸千尺**:写赤壁之陡峭。\n  - **山高月小**:写仰望之月相——山高显月小,与秋水时至的「水落石出」(水位降,石现)共构冬日之「瘦」景。\n- 与前赋「清风徐来,水波不兴……月出于东山之上,徘徊于斗牛之间」之夏夜「润」「满」之景形成对照:前者夏景,后者冬景;前者温润,后者凛冽。\n\n### 4.7 「履巉岩,披蒙茸,踞虎豹,登虬龙」\n\n- **巉岩**:险峻之岩石。\n- **蒙茸**:杂乱的草木。\n- **踞虎豹、登虬龙**:以「虎豹」「虬龙」形容奇形怪状之山石——非真虎豹、真虬龙,而是踞之如虎豹、登之如虬龙。\n- 「踞」「登」皆动作幅度大之动词,极状攀登之惊险。\n\n### 4.8 「攀栖鹘之危巢,俯冯夷之幽宫」\n\n- **鹘**:鹰隼类猛禽,「栖鹘」即栖于崖上之鹘。\n- **冯夷**:水神,即「河伯」,见《庄子·秋水》《楚辞·九歌》。「幽宫」指水神之宫,深藏水下。\n- 上攀鹘巢,下俯水宫——上极于天,下极于渊,极写登高之极致。\n\n### 4.9 「划然长啸,草木震动,山鸣谷应,风起水涌」\n\n- 「划然」:突然。\n- 「草木震动」:长啸之声震动草木。\n- 「山鸣谷应」:山鸣则谷相应,形容回声之大。\n- 「风起水涌」:啸声起而风随水应。\n- 此段以听觉、触觉联合,写出长啸之威力——人虽一介凡夫,长啸能与天地共振。\n\n### 4.10 「予亦悄然而悲,肃然而恐,凛乎其不可留也」\n\n- 长啸之后,反生悲恐——惧高、惧险、惧人之渺小。\n- 「悄然」「肃然」「凛乎」三状递进,极状登高之后的精神状态。\n\n### 4.11 「反而登舟,放乎中流,听其所止而休焉」\n\n- 「听其所止」:任凭船随水所至而止。\n- 此句与前赋「纵一苇之所如,凌万顷之茫然」呼应——前赋之乐是主动放任,后赋之归是被动听止——一种退让、「放下」之姿态。\n\n### 4.12 「适有孤鹤,横江东来」\n\n- 「适」:正值。\n- 「孤鹤」:孤独之鹤。「孤」字是中国文学中一个极重要的意象——孤鹤、孤舟、孤云、孤月、孤鸿,常象征高洁之身世或与世相违之精神。\n- 「横江东来」:自东而来,横绝江面。\n\n### 4.13 「翅如车轮,玄裳缟衣,戛然长鸣,掠予舟而西也」\n\n- **玄裳缟衣**:玄色下裙,白色上衣——以衣裳喻鹤身:顶白(缟衣)、身黑(玄裳)。\n- 「戛然」:鸣声清越。\n- 「掠予舟而西」:掠过苏子之舟而向西飞去。\n\n### 4.14 「梦一道士,羽衣蹁跹」\n\n- **羽衣**:道士所着之衣,以示飞升之意。蹁跹(pián xiān):旋转飞舞。\n- 苏轼本人好道,与道士多有交往(张易简、陈太初等),故梦境中道士出现并非突兀。\n\n### 4.15 「畴昔之夜,飞鸣而过我者,非子也耶」\n\n- **畴昔**:从前,昨夜。\n- 苏轼梦中将鹤与道士合一:昨夜飞过我舟之孤鹤,正是今我梦见之道士。\n- 此为后赋之「眼」:鹤—道士—我之三位一体,虚实相生,人鹤相通。\n\n### 4.16 「道士顾笑,予亦惊寤」\n\n- 「顾笑」:回头一笑,意味深长。\n- 「惊寤」:惊醒。「寤」即「悟」——一梦而悟。\n- 「开户视之,不见其处」:开门视之,道士不见——留下的不仅是失落,更是余韵。\n\n## 五、综合赏析\n\n### 5.1 文体之异——「写境」与「说理」的分途\n\n前赋以主客辩难为主,说理是其骨干,情景是铺垫;后赋则反是——以写景、记游为主,哲理完全融入景中,不立文字、不正面辩难。前赋可称「哲赋」,后赋可称「境赋」。\n\n这种「后作变调」的现象,在中国文学史中常见:同一题材前后二作,后者多为前者的「修正」或「补充」——苏东坡如此,王羲之《兰亭集序》与一般序文相比亦然(但非同期)。后赋不为前赋之续,而为前赋之「另一面」。\n\n### 5.2 冬景与夏景——情感色调之对照\n\n前赋之月:「出于东山之上,徘徊于斗牛之间」——夏月润朗。\n后赋之月:「山高月小」——冬月凛冽。\n前赋之水:「清风徐来,水波不兴」——夏水平静。\n后赋之水:「江流有声,断岸千尺」——冬水凛然。\n\n这是中国文学中最经典的「季节对照」手法之一——同一地点、同一月夜,不同时节之景,引发不同情感。前赋之「乐」是温暖的乐,后赋之「悲」是高古的悲——二者合一,方为完整的东坡赤壁。\n\n### 5.3 鹤—道士—我——三身合一之寓意\n\n后赋结尾之「孤鹤」与「道士」之关系,是中国文学阐释史上一个经久不衰的话题:\n\n**(1)具象层面**:夜里真有一鹤掠过,苏轼夜梦道士,将二者联类而及。\n**(2)道教层面**:鹤为仙禽,道士之化身,此乃道教「羽化登仙」思想的体现。\n**(3)哲学层面**:人、鹤、仙之三位一体,反映了苏轼「物我相忘」之庄子式境界。\n**(4)隐喻层面**:「孤鹤」即苏轼自己——孤高傲世、不与世同;而「道士」则是苏轼的「本相」——精神之自我。\n\n历代解者各有侧重,合而观之方见全貌。\n\n### 5.4 结构与节奏\n\n全文可分四段:\n1. **从雪堂步月,得酒复游**(首段)。\n2. **登岸历险,划然长啸**(中段前半)。\n3. **归舟闻鹤,惊而记梦**(中段后半)。\n4. **梦觉开户,渺然失处**(末段)。\n\n节奏由「缓—急—缓—空」四步递转,首段缓步而来,中段紧张高危,中后归舟忽遇孤鹤而一惊,末段则入梦—惊寤—空寂——情感跌宕起伏,非前赋之「乐—悲—达—乐」线性结构可比。\n\n### 5.5 文学史地位\n\n后赋之地位,常与前赋并提,合称「赤壁二赋」。清人张之洞《书目答问》以「赤壁二赋」为苏轼赋之代表。近代以来研究多注意:\n\n- 前赋是「理性之超越」(从悲到达)。\n- 后赋是「感性之超越」(从惊到悟)。\n- 二者相辅,可见东坡「达」与「悟」两条精神路径之并存。\n\n## 六、关联网络\n\n### 6.1 与「前赤壁赋」(1082 七月)互文\n\n见前赋「关联网络」节。前赋说理、后赋写境;前赋主客共在,后赋苏子独游。两赋合读,方见东坡赤壁之全。\n\n### 6.2 与「念奴娇·赤壁怀古」(约 1082)同期三角\n\n词写「大江东去」之豪壮、前赋写「水月之喻」之哲思、后赋写「孤鹤—道士」之仙心——三作同期,共构东坡「赤壁」主题之立体群像。\n\n### 6.3 与「雪堂」之建及「东坡」之号\n\n雪堂建于元丰五年三月,本赋作于十月,雪堂建成后约半年。「东坡」之名,据苏轼《东坡志林》《雪堂问》诸则,与雪堂之建直接相关——以「东坡」为号,始于此期。后赋中雪堂、临皋、黄泥坂诸地名,是东坡「黄州生活」之物质坐标。\n\n### 6.4 与「后赤壁赋图」与后世题咏\n\n本赋意境为后世画家、诗人所反复题咏:\n- 北宋乔仲常绘《后赤壁赋图》(现存美国纳尔逊—艾特金斯美术馆)。\n- 金代赵秉文、元代赵孟頫、明代文徵明、清代恽寿平等皆有《后赤壁赋图》。\n- 苏轼《赤壁赋》诗、《赤壁》词、《后赤壁赋》共同构成「赤壁」之文学—绘画传统。\n\n## 七、溯源记录\n\n- **原文依据**:通行整理本,以中华书局 1986 年点校本《苏轼全集》所载为底。异文「玄裳缟衣/缟裳」并存,本文从「缟衣」说,以合常释。\n- **系年依据**:王水照、崔铭《苏轼年表》;孔凡礼《苏轼年谱》卷三十九。明确系于元丰五年壬戌(1082)十月十五日。\n- **异说来源**:\n  1. 「孤鹤—道士」寓意:具象说、道教说、庄子说、隐喻说并存,详见综合赏析 5.3。\n  2. 「雪堂」「临皋」位置:清人王文诰《苏文忠公诗编注集成》、王世贞《弇州山人四部稿》辨之甚详,今多采东坡—雪堂—临皋之线。\n- **素材来源标注**:\n  - **朱刚《苏轼十讲》(2019)第四讲「三咏赤壁」**:已取得文本。\n    - 第四讲第二目「《赤壁赋》与宋代『文赋』」直接论本篇与前赋之体裁关系;\n    - 第四讲第三目「《后赤壁赋》的神秘世界」专论本篇「孤鹤—道士」之关系,为综合赏析 5.3「三身合一」之核心素材。\n  - **林语堂《苏东坡传》(中文版)第十六章「赤壁赋」**:已取得文本。详述本赋写作情境。\n  - **王水照《苏轼研究》**、**王水照朱刚《苏轼评传》**、**王水照崔铭《苏轼传》**:已取得文本,可与本篇行迹互见。\n  - **苏东坡新传(李一冰)**:本环境读取失败(编码问题),**待重试**。第七章「三咏赤壁成绝唱」对本篇有专论。";
