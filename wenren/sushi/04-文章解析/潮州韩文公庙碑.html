const MD = "# 潮州韩文公庙碑\n\n## 一、题名与体裁\n\n- **题名**:「潮州韩文公庙碑」。潮州(今广东潮安)韩文公庙之碑文;庙主为韩愈(谥「文公」,世称「韩文公」)。\n- **体裁**:碑志(庙碑/神道碑之变体)。中国「碑」体起源于汉,成熟于南北朝;「庙碑」为记某庙之建与所祀之人功德者。本篇为「庙碑」之典范,亦为苏轼议论文之代表。\n\n## 二、原文\n\n> 本篇选录核心段落,全碑见〔潮州韩文公庙碑（全碑）〕:[潮州韩文公庙碑（全碑）](潮州韩文公庙碑（全碑）.md)。\n\n> **首段(起首立论段)**:\n>\n> **匹夫而为百世师,一言而为天下法。**是皆有以参天地之化,关盛衰之运。其生也有自来,其逝也有所为。故申、吕自岳降,**傅说为列星**,古今所传,不可诬也。孟子曰:「吾善养吾浩然之气。」是气也,寓于寻常之中,而塞乎天地之间。卒然遇之,则王公失其贵,晋、楚失其富,良、平失其智,贲、育失其勇,仪、秦失其辩。是孰使之然哉?其必有不依形而立,不恃力而行,不待生而存,不随死而亡者矣。故在天为星辰,在地为河岳,幽则为鬼神,而明则复为人。此理之常,无足怪者。\n>\n> **定评段(「文起八代之衰」段)**:\n>\n> 自东汉以来,道丧文弊,异端并起,历唐贞观、开元之盛,辅以房、杜、姚、宋而不能救。独韩文公起布衣,谈笑而麾之,天下靡然从公,复归于正,盖三百年于此矣。**文起八代之衰,而道济天下之溺;忠犯人主之怒,而勇夺三军之帅。**此岂非参天地,关盛衰,浩然而独存者乎?\n\n> **校记**:本节为选录,底本为通行整理本(简体);全碑全文、随段简注与版本校记(含维基文库本异文六条)统见 [潮州韩文公庙碑（全碑）](潮州韩文公庙碑（全碑）.md)。\n\n## 三、写作背景\n\n- **系年**:元祐七年(1092)。\n- **地点**:知扬州任上(苏轼时任扬州知州)。\n- **缘起**:潮州(今广东潮安)旧韩文公庙地窄屋漏,元祐五年(1090)知州王涤迁建于州南七里,新庙成,遣使跨海至扬州求文,苏轼于扬州任上(1092 年内)为作此碑(碑文第四段自叙「使来请记」;与全碑页口径一致)。\n- **历史背景**:韩愈(768-824),字退之,谥文公,世称韩昌黎。韩愈曾于元和十四年(819)因谏迎佛骨被贬潮州(后改袁州),在潮州仅七月余,却为潮州做了很多好事(驱鳄、放奴、兴学等),深受潮州百姓爱戴。潮州之韩文公庙,建于宋代。\n- **写作情境**:苏轼时任扬州知州,为潮州韩愈庙重新撰碑——**「**为韩愈立碑于千里之外**」**,此非亲临其地之作,然苏轼对韩愈之崇敬,使其文气沛然。\n\n## 四、分段笺注\n\n### 4.1 「匹夫而为百世师,一言而为天下法」\n\n- **匹夫**:平民(无官位之人)。\n- **百世师**:百代之师表。\n- 「一言而为天下法」:**一句话而为天下法则**——韩愈之「文起八代之衰」「道济天下之溺」等关键语,皆成「天下法」。\n- 开门见山——以「匹夫—百世师」「一言—天下法」之对偶,定位韩愈之历史地位。\n\n### 4.2 「是皆有以参天地之化,关盛衰之运」\n\n- **参天地之化**:参与天地之化育。\n- **关盛衰之运**:关涉盛衰之命运。\n- 此谓韩愈之功业——与天地同参、与盛衰共关。\n\n### 4.3 「其生也有自来,其逝也有所为」\n\n- **有自来**:有来历。\n- **有为之所**:有作为之事。\n- 韩愈之「生」与「逝」皆有特殊意义——**非凡夫之生与逝**。\n\n### 4.4 「故申、吕自岳降,傅说为列星」\n\n- **申、吕**:申伯、吕侯,皆周代贤臣,《诗经·大雅·崧高》《诗经·大雅·大明》咏之。古人传说其诞生时「**山岳降神**」。\n- **傅说**:商代贤相,传说其死后「**化为列星**」(《庄子·大宗师》)。\n- 此为「古之贤者死而不朽」之传说——以明韩愈「逝而有所为」。\n\n### 4.5 「孟子曰:『吾善养吾浩然之气。』」\n\n- 引《孟子·公孙丑上》:「**我善养吾浩然之气**」——此为孟子之名言。\n- 「浩然之气」:至大至刚之气,充塞于天地之间。\n- 本段引孟子之语,为韩愈之「**浩然之气**」提供儒家根据。\n\n### 4.6 「是气也,寓于寻常之中,而塞乎天地之间」\n\n- 此「**浩然之气**」之特质:\n  - **「寓于寻常之中」**:藏于寻常事物之中。\n  - **「塞乎天地之间」**:充塞于天地之间。\n- 「**寓于寻常**」与「**塞乎天地**」——此为「**内圣外王**」之气,内修而至大外充塞。\n\n### 4.7 「卒然遇之,则王公失其贵,晋、楚失其富,良、平失其智,贲、育失其勇,仪、秦失其辩」\n\n- **卒然**:即「猝然」,突然。\n- **王公失其贵**:王公大人遇之(浩然之气),失其所以为贵。\n- **晋、楚失其富**:晋、楚(春秋两富霸)失其所以为富。\n- **良、平失其智**:张良、陈平失其所以为智。\n- **贲、育失其勇**:孟贲、夏育(古之勇士)失其所以为勇。\n- **仪、秦失其辩**:张仪、苏秦失其所以为辩。\n- 此谓「浩然之气」之威——**遇之则世俗一切贵、富、智、勇、辩皆失其凭**。(引文与全碑页一致)\n\n### 4.8 「是孰使之然哉?其必有不依形而立,不恃力而行,不待生而存,不随死而亡者矣」\n\n- 设问:是什么使王公、晋楚、良平、贲育、仪秦皆失其凭?——必有浩然之气在。\n- 「**不依形而立**」「**不恃力而行**」「**不待生而存**」「**不随死而亡**」四句排比:此气**不依附形骸、不依仗力气、不因生死而成毁**。\n- 此为浩然之气之「**超越性**」——独立于形骸、气力、生死之外。\n\n### 4.9 「故在天为星辰,在地为河岳,幽则为鬼神,而明则复为人」\n\n- 承上四「不」——正因超越生死,故**无所不在**:在天为星辰,在地为河岳。\n- **幽、明**:阴界与阳世——幽则为鬼神,明则复为人。\n- 呼应 4.4「申、吕自岳降,傅说为列星」——贤者之神**充塞两间,死而不朽**。\n\n### 4.10 「此理之常,无足怪者」\n\n- 收束首段:此乃**常理**,不必惊怪。\n- 呼应本段开头「古今所传,**不可诬也**」——为下文「韩文公起布衣」预设理论根基。\n\n### 4.11 「独韩文公起布衣,谈笑而麾之,天下靡然从公,复归于正」\n\n- **独韩文公起布衣**:「独」字紧承上文「房、杜、姚、宋而不能救」——盛唐贤相皆不能救道丧文弊，唯韩愈以布衣之身（非世家、非门阀）独任其事。\n- **「谈笑而麾之」**:**谈笑之间而指挥之**——韩愈之辟佛,似轻而易举。\n- **「天下靡然从公」**:天下靡然从公(从韩愈)。\n- **「复归于正」**:重新归于正道(儒学之正)。\n- 此为对韩愈「**辟佛**」之高度赞美——**起于布衣,而定天下之「道」**。\n\n### 4.12 「文起八代之衰,而道济天下之溺」\n\n- **「文起八代之衰」**:**文起八代之衰**——为千古名句。\n  - 八代:东汉、魏、晋、宋、齐、梁、陈、隋——此八代骈文盛行,文风衰靡;韩愈起而振之,复归于「古文」。\n  - 「**文起八代之衰**」:为后世对韩愈文学史地位之**千古定评**——出自本篇。\n- **「道济天下之溺」**:**道济天下之溺**——「道」救天下沉溺于佛教之失。\n  - 韩愈之辟佛,「济」天下之「溺」于佛教。\n- 此二句为全篇之**核心命题**——**千古定评所自出**。\n\n### 4.13 「忠犯人主之怒,而勇夺三军之帅」\n\n- **「忠犯人主之怒」**:**忠直而冒犯人主之怒**——韩愈谏迎佛骨,触怒宪宗,贬潮州。\n- **「勇夺三军之帅」**:长庆二年(822)镇州兵变,韩愈奉诏宣慰,单车直入叛军,直面王庭凑陈说利害,折服乱兵,全军而返——其勇足以夺三军之帅(通行笺注;本事见两《唐书》韩愈本传,据模型知识,待核)。\n- 此谓韩愈不仅是「文人」,更是「忠臣」「勇者」——**立德、立功、立言三不朽**。\n\n### 4.14 「此岂非参天地,关盛衰,浩然而独存者乎」\n\n- 此谓韩愈之气:**浩然而独存**。\n- 「**参天地、关盛衰**」呼应首段——韩愈之功业可与天地参、与盛衰关。\n- 「**浩然而独存**」——**独存**呼应 4.8「不待生而存,不随死而亡」:以「**浩然**」定位韩愈之气,以「**独存**」言其超越生死。(引文与定评段一致)\n\n## 五、综合赏析\n\n### 5.1 全文核心——「文起八代之衰」之千古定评\n\n本篇在中国文学史上之最大贡献,是**「**文起八代之衰**」一句之提出**——此为后世对韩愈**文学史地位**之**千古定评**。\n\n**(1)何谓「八代之衰」**:\n- 八代:东汉、魏、晋、宋、齐、梁、陈、隋。\n- 衰:骈文盛行,文风雕琢、辞藻堆砌,失去先秦两汉散文之自然与气骨。\n\n**(2)韩愈之功**:\n- 「**起八代之衰**」:**挽回了八代之衰**——以「古文运动」振起散体文,反对骈文。\n- 「**复归于正**」:文风重归于「**正**」(儒学之正道、散文之传统)。\n\n**(3)历史影响**:\n- 此定评一出,后世之唐宋古文运动、宋明清之古文传统,皆以此为旗帜。\n- 茅坤《唐宋八大家文钞》、方苞《古文约选》、姚鼐《古文辞类纂》等古文选本,皆受此论影响。\n\n### 5.2 「道济天下之溺」——韩愈之辟佛\n\n本篇不仅评价韩愈之「**文**」,更评价其「**道**」——**「**道济天下之溺**」**:\n- 「**溺**」:沉溺——天下沉溺于佛教。\n- 「**济**」:救——韩愈之辟佛,是救天下之溺。\n- 韩愈《原道》《论佛骨表》《谏迎佛骨表》等,皆是「道济天下之溺」之具体实践。\n\n苏轼以「**道**」与「**文**」并提——**「文起八代之衰」是文学贡献,「道济天下之溺」是思想贡献**——二者合一,方是完整的韩愈。\n\n### 5.3 「忠犯人主之怒,而勇夺三军之帅」\n\n此二句概括韩愈之「**德**」与「**勇**」:\n- **「忠犯人主之怒」**:元和十四年(819),韩愈谏迎佛骨,触怒宪宗,贬潮州。\n- **「勇夺三军之帅」**:长庆二年(822)镇州兵变,韩愈单车入叛军宣慰,折服王庭凑(通行笺注镇州说,两《唐书》本传有载,据模型知识,待核)——与 4.13 同口径。\n\n此谓韩愈**立德、立功、立言三不朽**——**「文」「道」「德」「勇」四字,定位韩愈为「完人」**。\n\n### 5.4 议论与叙事之合一\n\n本篇是「**庙碑**」,却极重议论——这是东坡对「庙碑」之革新:\n\n**(1)正格之庙碑**:应交代庙之建、庙主之事迹、祭祀之仪。\n**(2)东坡之革新**:本篇以「**议论**」为主,「**叙事**」为辅——先以「**匹夫而为百世师**」立论,再历叙汉、唐之「**不知道**」,再以「**韩文公起布衣**」作结,「**文起八代之衰**」千古定评。\n**(3)「庙碑」之变格**:叙事成分只占很少——以议论代叙事,以「评」代「述」,此为东坡庙碑之新格。\n\n### 5.5 苏轼与韩愈之文统承接\n\n本篇之深层意义,是**东坡为韩愈之继承者**:\n- 茅坤《唐宋八大家文钞》定韩愈为「八大家」之首。\n- 东坡本篇,以「**文起八代之衰**」定位韩愈,**实亦自我定位为韩愈之继承者**。\n- 东坡之「文」「道」观,与韩愈一脉相承,而有所创新——**东坡继承韩愈而超越韩愈**。\n\n### 5.6 文学史地位\n\n本篇在中国散文史上之地位:\n\n- **碑志**:庙碑之典范——以议论代叙事之革新。\n- **文论**:千古文论定评之源头——「**文起八代之衰**」出自本篇。\n- **韩愈研究**:后世评韩之「基准」——东坡之评,后世研究韩愈者不可越。\n\n清人沈德潜《唐宋八大家文读本》评曰:「**文起八代之衰,千古论韩文公者无以易此**。」\n\n## 六、关联网络\n\n### 6.1 与「韩愈」之文统承接\n\n本篇定位韩愈为「文起八代之衰」者——实亦自我定位为韩愈继承者。东坡于文学史上之坐标,基本是:**继承韩愈、超越韩愈**。\n\n### 6.2 与「乌台诗案」之反思\n\n苏轼作本篇于元祐七年(1092),已是「乌台诗案」(1079)后十三年,东坡于宦海几番沉浮:\n\n- 元丰二年(1079):乌台诗案,贬黄州。\n- 元丰八年(1085):神宗崩,哲宗即位,高太后听政。\n- 元祐元年(1086):东坡起知登州,后历中书舍人、翰林学士。\n- 元祐四年(1089):出知杭州。\n- 元祐六年(1091):知颍州,改扬州。\n- 元祐七年(1092):知扬州,作本篇。\n- 元祐八年(1093):高太后崩,哲宗亲政,新党复起。\n- 元祐九年(1094):东坡又贬。\n\n本篇作于「**第二次贬谪之前夕**」——东坡已感受到新党将起的政治风波。本篇之「**忠犯人主之怒**」「**勇夺三军之帅**」之句,实亦**东坡自我之勉**——**韩愈之被贬与东坡之被贬,在精神上一脉相承**。\n\n### 6.3 与「潮州」之地望\n\n潮州(今广东潮安),唐宋时为「南蛮」之地。韩愈元和十四年(819)贬潮州,约七月余,做了驱鳄、放奴、兴学等好事,深受潮州百姓爱戴。韩愈离潮后,潮州百姓立庙祀之。\n\n本篇之「**潮州韩文公庙碑**」,即是为此庙所作之碑文。苏轼虽未亲至潮州,而于扬州任上遥撰此文,见东坡之情感。\n\n### 6.4 与「唐代古文运动」之承续\n\n韩愈(768-824)倡古文运动于唐代,柳宗元辅之;北宋欧阳修继之;苏轼集大成。本篇以「文起八代之衰」定位韩愈,是「**古文运动**」之**自我历史回顾**——**从韩愈、柳宗元到欧阳修、苏轼,古文传统一脉相承**。\n\n## 七、溯源记录\n\n- **原文依据**:通行整理本,以中华书局 1986 年点校本《苏轼全集》所载为底。本文篇幅较长,本节录入核心段落,**详读原文请查中华书局本**。\n- **系年依据**:王水照、崔铭《苏轼年表》;孔凡礼《苏轼年谱》卷六十。明确系于元祐七年(1092)。\n- **异说来源**:\n  1. 「文起八代之衰」之「八代」具体所指:东汉、魏、晋、宋、齐、梁、陈、隋——诸家一致,无重大异说。\n  2. 「匹夫而为百世师」之境界:历代释读有歧;或以为道学之境,或以为文学之境。\n  3. 历代评注:宋人黄震、明人茅坤、清人沈德潜、姚鼐等皆有评。\n- **素材来源标注**:\n  - **朱刚《苏轼十讲》第八讲「元祐党争」**:已取得文本。论及元祐时期东坡之政治处境,与本篇作时(元祐七年,1092)互见。\n  - **王水照《苏轼研究》**论文集「综论篇」「品评篇」「影响篇」:已取得文本。其中「品评篇」专论东坡对韩愈之继承与超越——与本篇「文起八代之衰」之定评互见。\n  - **王水照、朱刚《苏轼评传》**:已取得文本,思想史综合论述。\n  - **王水照崔铭《苏轼传》**、**林语堂《苏东坡传》**:已取得文本。\n  - **苏东坡新传(李一冰)**:本环境读取失败(编码问题),**待重试**。第十一章「白头萧散谪岭海」前后段论及元祐时期苏轼,可能论及本篇写作情境。";
