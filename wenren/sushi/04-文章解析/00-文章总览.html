const MD = "# 苏轼文章 10 篇深度解析·总览\n\n> 本卷为「苏轼知识工程·书籍工程」第四单元「文章解析」之总览,内含 10 篇深度解析的索引、苏轼文的历史地位综论,以及各篇之间的互文关系。\n\n---\n\n## 一、苏轼文的历史地位\n\n### 1.1 「唐宋八大家」中的坐标\n\n唐宋八大家之目,首倡于明初朱右选编《八先生文集》;茅坤承之,辑《唐宋八大家文钞》,自此「八大家」成为定称。其中唐两家——韩愈、柳宗元,宋六家——欧阳修、苏洵、苏轼、苏辙、王安石、曾巩。\n\n苏轼(1037—1101)居宋六家之第二序,然就创作成就论,实与韩愈、欧阳修鼎足而三:\n\n- **韩愈**以「古文运动」开山之功,苏轼称其「文起八代之衰」(《潮州韩文公庙碑》);其文以气势胜,奇崛雄辩。\n- **欧阳修**以「六一风神」定宋文之调,平易纡徐,从容闲雅;苏轼既出其门(嘉祐二年进士),又以纵横变化推而广之。\n- **苏轼**则集前人之大成而自成面目。茅坤评其文「行乎其所当行,止乎其所不得不止」;吕留良《晚村精选八大家文课》言「东坡文妙处,只是平淡」。\n\n### 1.2 文体的全面性\n\n苏轼散文之全面,在北宋罕有匹俦:\n- **赋**——《前赤壁赋》《后赤壁赋》,将抒情小品的灵活性注入散体大赋,创「文赋」新范。\n- **记**——《喜雨亭记》《超然台记》《石钟山记》《记承天寺夜游》,题小旨大,因事寄慨。\n- **传**——《方山子传》,史传之变体,以散笔写畸人。\n- **论**——《留侯论》,史论翻案,别开生面。\n- **碑志**——《潮州韩文公庙碑》,叙事议论熔为一炉。\n- **书牍**——《答谢民师书》,论文之书,亦为北宋文论的纲领。\n\n### 1.3 文学史脉络\n\n苏轼之文,可分三期:\n\n1. **早期(1060s-1070s 初)**:凤翔、汴京、密州任上,受父苏洵、师欧阳修影响,以政论、史论、亭台记为主;「喜雨」「超然」皆此期作。\n2. **贬谪期(1079-1086)**:「乌台诗案」(1079)后贬黄州(1080-1084),文学创作达至巅峰;两《赤壁赋》《记承天寺夜游》《方山子传》《石钟山记》皆出此时。\n3. **晚岁(1087-1101)**:起贬至惠州、儋州,北归途中作《潮州韩文公庙碑》《答谢民师书》,文风愈趋冲淡,议论趋于圆融。\n\n---\n\n## 三、10 篇总表\n\n| 序 | 篇名 | 文体 | 系年 | 地点 | 一句话定位 |\n|----|------|------|------|------|------------|\n| 1 | 前赤壁赋 | 赋(文赋) | 1082(元丰五年)七月十六日 | 黄州 | 苏轼文学巅峰;水月之喻融庄、禅、骚为一炉 |\n| 2 | 后赤壁赋 | 赋(文赋) | 1082(元丰五年)十月十五日 | 黄州 | 紧承前赋,变抒情为纪游、由景入仙的孤峭之篇 |\n| 3 | 记承天寺夜游 | 记(小品) | 1083(元丰六年) | 黄州 | 80 字短文,「何夜无月?何处无竹柏?」为东坡精神最简语 |\n| 4 | 超然台记 | 记(亭台记) | 1076(熙宁九年) | 密州 | 「超然」二字之注脚,庄子齐物思想的散文化呈现 |\n| 5 | 喜雨亭记 | 记(亭台记) | 1062(嘉祐七年) | 凤翔 | 早期名作;以「喜」字立骨,小亭小景见仁民爱物之心 |\n| 6 | 石钟山记 | 记(考察记) | 1084(元丰七年) | 湖口(赴汝州途经) | 实地考察之文,「事不目见耳闻」的认识论宣言 |\n| 7 | 方山子传 | 传(史传变体) | 约 1080 前后 | 黄州 | 为陈慥立传,以「隐」字贯通的另一篇赤壁 |\n| 8 | 潮州韩文公庙碑 | 碑志 | 1092(元祐七年) | 知扬州任上 | 「文起八代之衰」之千古定评所自出(原文选录+全碑独立页:[全碑](./潮州韩文公庙碑（全碑）.md)) |\n| 9 | 留侯论 | 论(史论) | 约 1061 前后 | 凤翔/汴京(应制科前后) | 「忍」字立论,翻案黄石公授书之千古奇文 |\n| 10 | 答谢民师书 | 书(论文书) | 1100(元符三年) | 北归途中 | 「如行云流水,初无定质」——东坡文论的纲领 |\n\n---\n\n## 四、互文关系地图\n\n### 4.1 「黄州三赋一记」三角\n\n- **前赤壁赋**(1082 七月)→ **后赤壁赋**(1082 十月)→ **念奴娇·赤壁怀古**(1082 前后同期词作)\n- 三者构成「赤壁」主题的诗赋词立体群像;前赋说理、后赋纪游、长怀古抒怀。\n- **记承天寺夜游**(1083)系黄州最后一篇小品,与两赋共同标志东坡贬谪期文学的成熟。\n\n### 4.2 「密州—凤翔—黄州」的亭台记三篇\n\n- **喜雨亭记**(1062,凤翔)→ **超然台记**(1076,密州)→ **石钟山记**(1084,湖口)\n- 三篇分别对应「小亭写喜」「高台论超然」「实地考名物」,展现东坡「记」体的三种范型。\n\n### 4.3 「史论—碑志—书牍」的议论文章\n\n- **留侯论**(1061 前后)→ **潮州韩文公庙碑**(1092)→ **答谢民师书**(1100)\n- 三篇跨度 40 年,串起东坡对「文」与「道」关系的终生思考:少壮翻案、中年论定、晚岁自述。\n\n### 4.4 「方山子—陈慥—陈季常」\n\n- **方山子传**(约 1080 前后)写陈慥,与诗《岐亭五首》(1080)同期。\n- 共同塑造「陈季常」形象——这位隐于光州的旧交,与东坡的贬谪生涯形成互文。\n\n---\n\n## 五、阅读路径建议\n\n1. **入门路径**:读《记承天寺夜游》(80 字)→《喜雨亭记》(700 字)→《超然台记》(1000 字)→《前赤壁赋》。\n2. **主题路径**:三篇「赤壁」连贯读(前赋 + 后赋 + 念奴娇词);三篇「亭台」连贯读。\n3. **议论路径**:《留侯论》→《潮州韩文公庙碑》→《答谢民师书》,可见东坡文论的演进。\n4. **深度路径**:本卷每篇 7 节结构,先通读「综合赏析」与「关联网络」,再下钻「分段笺注」与「溯源记录」。\n\n---\n\n## 六、各篇链接\n\n- [前赤壁赋](./前赤壁赋.md)\n- [后赤壁赋](./后赤壁赋.md)\n- [记承天寺夜游](./记承天寺夜游.md)\n- [超然台记](./超然台记.md)\n- [喜雨亭记](./喜雨亭记.md)\n- [石钟山记](./石钟山记.md)\n- [方山子传](./方山子传.md)\n- [潮州韩文公庙碑](./潮州韩文公庙碑.md)(解析篇,「二、原文」为选录)\n- [潮州韩文公庙碑（全碑）](./潮州韩文公庙碑（全碑）.md)(全碑文本页,含随段简注与版本校记)\n- [留侯论](./留侯论.md)\n- [答谢民师书](./答谢民师书.md)\n\n---\n\n## 附:溯源记录\n\n- 原文:通行整理本,以《苏轼全集》(中华书局 1986 点校本)、《苏轼文集》(孔凡礼点校,中华书局)所收为底。\n- 系年:王水照、崔铭《苏轼年表》;孔凡礼《苏轼年谱》;另参各篇「溯源节」所列异说。\n- 异文:凡「共适/共食」、「窈窕/幽窕」一类之异,见各篇第四节。\n- 本卷素材:约定的 6 本传记已取得 5 本(林语堂《苏东坡传》、王水照崔铭《苏轼传》、王水照《苏轼研究》、王水照朱刚《苏轼评传》、朱刚《苏轼十讲》);李一冰《苏东坡新传》本环境读取失败(编码问题,待重试)。各篇溯源节已根据所取得素材逐篇标注引证章节,原文部分以通行模型知识为底,凡存疑异文均已标注。";
