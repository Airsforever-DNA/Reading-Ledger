const MD = "# 前赤壁赋\n\n## 一、题名与体裁\n\n- **题名**：「前赤壁赋」。苏轼于元丰五年(1082)同地、同题作赋两篇,本篇作于七月,故称「前」;十月所作称「后」。「赤壁」之具体所在,本文所述为黄州(今湖北黄冈)城外赤鼻矶,非三国周瑜破曹之嘉鱼赤壁。\n- **体裁**:赋。属「文赋」(散体赋),与汉代「古赋」(骋辞大赋)、六朝「骈赋」(俳偶)相区别。文赋以散带骈、夹叙夹议、情景交融,中唐杜牧《阿房宫赋》、欧阳修《秋声赋》开其先声,苏轼则于本文集其大成而开新境。\n\n## 二、原文\n\n> **壬戌之秋,七月既望,苏子与客泛舟游于赤壁之下。**\n>\n> 清风徐来,水波不兴。举酒属客,诵明月之诗,歌窈窕之章。少焉,月出于东山之上,徘徊于斗牛之间。白露横江,水光接天。纵一苇之所如,凌万顷之茫然。浩浩乎如冯虚御风,而不自知其所止;飘飘乎如遗世独立,羽化而登仙。\n>\n> **于是饮酒乐甚,扣舷而歌之。歌曰:**\n>\n> 「桂棹兮兰桨,击空明兮溯流光。渺渺兮予怀,望美人兮天一方。」\n>\n> **客有吹洞箫者,倚歌而和之。其声呜呜然,如怨如慕,如泣如诉;余音袅袅,不绝如缕。舞幽壑之潜蛟,泣孤舟之嫠妇。**\n>\n> **苏子愀然,正襟危坐而问客曰:「何为其然也?」**\n>\n> 客曰:「『月明星稀,乌鹊南飞。』此非曹孟德之诗乎?西望夏口,东望武昌。山川相缪,郁乎苍苍;此非孟德之困于周郎者乎?方其破荆州,下江陵,顺流而东也,舳舻千里,旌旗蔽空,酾酒临江,横槊赋诗,固一世之雄也,而今安在哉?况吾与子渔樵于江渚之上,侣鱼虾而友麋鹿,驾一叶之扁舟,举匏樽以相属。寄蜉蝣于天地,渺沧海之一粟。哀吾生之须臾,羡长江之无穷。挟飞仙以遨游,抱明月而长终。知不可乎骤得,托遗响于悲风。」\n>\n> **苏子曰:「客亦知夫水与月乎?逝者如斯,而未尝往也;盈虚者如彼,而卒莫消长也。盖将自其变者而观之,则天地曾不能以一瞬;自其不变者而观之,则物与我皆无尽也,而又何羡乎?且夫天地之间,物各有主,苟非吾之所有,虽一毫而莫取。惟江上之清风,与山间之明月,耳得之而为声,目遇之而成色,取之无禁,用之不竭,是造物者之无尽藏也,而吾与子之所共适。」**\n>\n> 客喜而笑,洗盏更酌。肴核既尽,杯盘狼籍。相与枕藉乎舟中,不知东方之既白。\n\n> **异文校记**:\n> 1. 末句「共适」,宋刊本及《东坡志林》一系作「共食」。「适」训「享用」,义较长;从通行本。\n> 2. 「窈窕」一作「幽窕」(《文选》本《诗经·关雎》之异),通行本作「窈窕」,从《文选》及苏轼意中《陈风·月出》之「窈纠」亦近。\n\n## 三、写作背景\n\n- **系年**:元丰五年壬戌(1082)七月十六日。既望,望日(十五)之后,十六日。\n- **地点**:黄州(今湖北黄冈)。苏轼以「乌台诗案」(元丰二年,1079)贬黄州团练副使、本州安置,不得签书公事。元丰三年(1080)二月到黄州,至元丰七年(1084)四月离开,前后近五年。\n- **缘起**:据苏轼《书赤壁赋》后自记及《东坡志林》,七月既望,与客泛舟游赤鼻矶,作此赋。客为谁,无确考;清人王文诰、沈钦韩等或以为黄州通判杨世昌(道士,善箫)。《后赤壁赋》「适有孤鹤」条下苏轼自言「曾为李委画长江」,则本赋之客或非杨世昌一人。\n- **异说**:「客」为何人,历代有杨世昌、绵州武都山道士、王长官等说。今多取泛指「客人」之解。\n\n## 四、分段笺注\n\n### 4.1 「壬戌之秋,七月既望」\n\n- **壬戌**:干支纪年。元丰五年(1082)岁在壬戌。古代干支既用于纪年,亦用于纪日;此处指年。\n- **既望**:农历每月十五日为「望」,十六日为「既望」(望已过之意)。《苏轼·前赤壁赋》自书题款「壬戌之秋,七月既望」与文本一致。\n- **赤壁**:本文所游为黄冈赤鼻矶(又称赤鼻山),并非三国「赤壁之战」之嘉鱼赤壁。轼之误认,后人多有辨正,本文不考据。\n\n### 4.2 「诵明月之诗,歌窈窕之章」\n\n- 一说「明月之诗」指《诗经·陈风·月出》;「窈窕之章」即指《月出》首章「月出皎兮,佼人僚兮,舒窈纠兮」。「窈纠」与「窈窕」音近,可互通。\n- 一说指曹操《短歌行》「月明星稀,乌鹊南飞」一联;下文客所引正出此。\n- 两说并立,前说侧重情境(诵月),后说侧重伏笔(为下文「客」之悲音铺垫)。本文采「月出」之说为主。\n\n### 4.3 「徘徊于斗牛之间」\n\n- 「斗牛」:二十八宿之斗宿(玄武之首)、牛宿。古代天文分划,黄州纬度可见斗牛于东方夜空。「徘徊」状月移之缓,赋予明月以人情。\n\n### 4.4 「纵一苇之所如,凌万顷之茫然」\n\n- 「一苇」:《诗经·卫风·河广》「谁谓河广?一苇杭之」,极言舟小。「万顷茫然」:水面辽阔无垠。\n- 「凌」:越过、漂浮其上。\n\n### 4.5 「冯虚御风」\n\n- 「冯虚」:凌空。「御风」:《庄子·逍遥游》「列子御风而行」,本谓御风而行;此用其意。\n- 苏轼早年学道,《赤壁赋》中多处化用《庄子》语,为其哲学建构之根。\n\n### 4.6 「桂棹兮兰桨」「击空明兮溯流光」\n\n- 「棹」「桨」互文,均为划船之具,以桂兰喻其香洁。\n- 「空明」:月光映水,水中天光空明澄澈。\n- 「溯流光」:船行水中,似追逐流光。\n- 「望美人兮天一方」:化《楚辞·九章·思美人》之语。「美人」兼具多重意涵:可指所念之人,可指贤君,可指理想之境,亦可指「道」。\n\n### 4.7 「如怨如慕,如泣如诉」\n\n- 写箫声之妙,以六喻叠出(怨、慕、泣、诉,加余音袅袅之不绝),为白描而神态毕具。\n\n### 4.8 「舞幽壑之潜蛟,泣孤舟之嫠妇」\n\n- 「潜蛟」「嫠妇」:蛟于幽壑能闻而舞,寡妇于孤舟能闻而泣,皆极状箫声之悲切动人。\n- 此二句用《列子·汤问》韩娥善歌「余音绕梁,三日不绝」之同类笔法。\n\n### 4.9 「月明星稀,乌鹊南飞」\n\n- 曹操《短歌行》之成句。客引此,一以吊古,一以伏下文之「孟德之困于周郎」。\n\n### 4.10 「山川相缪,郁乎苍苍」\n\n- 「缪」:通「缭」,盘绕、连接。\n- 「郁乎」:草木茂盛貌,亦状山色苍郁。\n\n### 4.11 「舳舻千里,旌旗蔽空」\n\n- 「舳舻」:船尾与船头,泛指战船。\n- 「酾酒临江,横槊赋诗」:曹操《短歌行》即作于赤壁之战前夕;「酾酒」斟酒,「横槊」横持长矛,赋诗指《短歌行》本篇。\n- 此数句铺陈孟德当年之雄图,与下文「而今安在哉」形成强烈反差。\n\n### 4.12 「寄蜉蝣于天地,渺沧海之一粟」\n\n- 「蜉蝣」:朝生暮死之虫,《诗经·曹风·蜉蝣》咏之。\n- 「一粟」:大海之一粟,喻人之渺小。\n- 此是「客」之核心哀音:人生短暂,无法与永恒之自然相抗。\n\n### 4.13 「挟飞仙以遨游,抱明月而长终」\n\n- 客之幻想:与仙人同游,与月同寿。然下一句「知不可乎骤得」立刻点破幻想之不可期。\n- 「托遗响于悲风」:将悲凉的箫声寄托于秋风。\n\n### 4.14 「逝者如斯,而未尝往也」\n\n- 化《论语·子罕》「子在川上曰:逝者如斯夫,不舍昼夜」之语,而翻出新意。\n- 原意:时光如流水逝去。苏轼新意:水虽流去,而水之本体未尝消失——长江还是长江,此为「不变者」。\n- 「盈虚者如彼,而卒莫消长也」:月虽圆缺变化,而月之本体未尝增减。\n- **此处为全文哲学建构之枢纽**:由「变」与「不变」之辨,引出「物与我皆无尽」之结论。\n\n### 4.15 「自其变者而观之,则天地曾不能以一瞬;自其不变者而观之,则物与我皆无尽也」\n\n- 关键之辩证。变者观之,天地万物无一刻停;不变者观之,万物与我皆永恒存在。\n- 此融合《庄子·齐物论》「彼亦一是非,此亦一是非」之相对观,与《周易·系辞》「盛衰之变」之循环观。\n- **与佛家「诸行无常」「诸法无我」之关系**:**非破执,而是消解对立**;并非否定变化,而是提供另一观以平视之。\n\n### 4.16 「物各有主,苟非吾之所有,虽一毫而莫取」\n\n- 儒家「义利之辨」的痕迹。物各有其主,不取不义之财。\n- 与下文清风明月之「取之无禁,用之不竭」形成转折:有主之物不可取,无主之物无尽享。\n\n### 4.17 「耳得之而为声,目遇之而成色,取之无禁,用之不竭」\n\n- 关键语。清风明月不为任何人所有,任何人都可「耳闻目见」。\n- 「无尽藏」:佛家用语,谓无尽宝藏。苏轼深受佛老之学影响,此处拈出「无尽藏」一词,贯通释道。\n\n### 4.18 「而吾与子之所共适」\n\n- 全文主题之落点。「共适」之「适」,取「享」义,与下文「洗盏更酌」之乐相应。\n- **异文**:本作「共食」者,义亦通(共食此景、共食此乐)。今从「共适」,取「共享此适」之意。\n\n## 五、综合赏析\n\n### 5.1 文体之变——「文赋」的成熟\n\n本文非汉之古赋(骋辞大赋,如《子虚》《上林》),亦非六朝之骈赋(声律对偶),而是中唐以来渐成之「文赋」。其特点:以散带骈、夹叙夹议、情景交融、对话穿插、议论与抒情并出。\n\n赋中之「客」与「苏子」之辩难,是文赋之典型结构——主客问答,本为赋体所固有(枚乘《七发》开其先例),但本文将其从「启发」变为「消解」:客起悲,苏子解之;非以理屈人,而以理自宽。\n\n### 5.2 「水月之喻」的哲学建构——三教融贯的典范\n\n「客亦知夫水与月乎」一段,为全文哲学之眼,历来称颂者多矣。其特点:\n\n**(1)转《论语》之悲为《庄子》之达**。《子罕》篇「逝者如斯」原是孔子对时光流逝的感慨,带有悲剧意识。苏轼则「以庄解儒」:水流去而水未尝往——水之本体不变。这就把孔子的悲怆化为了庄子的达观。\n\n**(2)以「变/不变」之辨消解「有限/无限」之对立**。客之悲源于「有限(人生)对无限(长江)」的不对称;苏子的解不是「延长人生」(不可能),而是「换一个观法」:从「不变」的角度看,「物与我皆无尽也」——物与我同为永恒存在之部分,无有限无限之别。\n\n**(3)以佛家「无尽藏」统摄庄、儒**。「造物者之无尽藏」一语,以佛家语收束全段:无尽藏者,不可穷尽之宝藏;清风明月,即是。这种「造物主」思想虽非正统佛家(佛教不立造物主),但苏轼融摄各家,创造出一种属于他自己的「达观哲学」。\n\n**(4)「共适」二字为哲学的归宿**。不是「独享」,不是「占有」,而是「共适」——人人皆可享清风明月。这种思想既包含庄子的「齐物」(人人皆在永恒之中),也包含儒家的「与民共」(非独乐而众乐),更暗含佛家的「同体大悲」(我与万物一体)。**三教于此汇流**。\n\n### 5.3 结构与节奏\n\n全文可分四段:\n1. **泛舟乐景**(首段):清风明月,登仙之乐。\n2. **饮酒放歌**(中段前半):扣舷而歌,箫声悲起。\n3. **客难苏解**(中段后半至「共适」):主客辩难。\n4. **客喜收束**(末段):洗盏更酌,相与入梦。\n\n「乐—悲—达—乐」四步递转,而非直线「由悲转达」,故全篇情感丰富,非单一主题之议论文可比。\n\n### 5.4 文学史地位\n\n本文被推为「古今第一赋」者甚多:\n\n- **茅坤**:「予尝谓东坡之文,行乎其所当行,止乎其所不得不止」,本文是其典范。\n- **沈德潜**《唐宋八大家文读本》:评本文「凭空写来,情境逼真,说理超妙」。\n- **王国维**《人间词话》虽论词,亦以本文所写「境界」为「造境」与「写境」之圆融。\n\n就赋之演变史论,《前赤壁赋》是「文赋」之巅峰与定调之作——自此而后,「以议论入赋、以哲理融情」成为宋赋之主流范式。\n\n## 六、关联网络\n\n### 6.1 与「后赤壁赋」(1082 十月)互文\n\n后赋紧承前赋,但作意截然不同:\n- 前赋:主客泛舟、对话辩论,哲理性强。\n- 后赋:独自重游、写景记异,纪游性强。\n- 前赋以「水月」之喻收束哲思;后赋以「孤鹤」之梦托出仙境。\n- 一者说理,一者写境;一者主客共在,一者苏子独游。\n\n两赋合看,可见东坡同一时期两种笔法之并存。\n\n### 6.2 与「念奴娇·赤壁怀古」同期三角\n\n《念奴娇·赤壁怀古》(约 1082 前后)写「大江东去」之豪壮、《前赤壁赋》写「月白风清」之幽微、《后赤壁赋》写「孤鹤横江」之奇崛——三作同期(均在黄州时期),共构东坡「赤壁」主题之诗赋词立体群像。词抒豪情、赋写哲思与幽怀,各有分工。\n\n### 6.3 与「记承天寺夜游」(1083)共为黄州文学标志\n\n《记承天寺夜游》80 字小品,与本赋同写「月夜」、同写「闲愁」,但笔致更简净。一长一短,一繁一简,标志东坡黄州文学的两种极致。\n\n### 6.4 与「答谢民师书」(1100)文论呼应\n\n本赋「如怨如慕、如泣如诉」之抒情笔法,与《答谢民师书》「如行云流水,初无定质,但常行于所当行,常止于所不可不止」之文学纲领相呼应——本赋正是「行于所当行、止于所不得不止」之实践。\n\n## 七、溯源记录\n\n- **原文依据**:通行整理本,以中华书局 1986 年点校本《苏轼全集》(孔凡礼等整理)所载为底;参《苏轼文集》同卷。**异文「共适/共食」**,见宋刊本及《东坡志林》卷一所收异文条目,本文取「共适」说,从主流。\n- **系年依据**:王水照、崔铭《苏轼年表》(《苏轼全集》附录);孔凡礼《苏轼年谱》卷三十九。明确系于元丰五年壬戌(1082)七月十六日。\n- **异说来源**:\n  1. 「客」之身份:王文诰《苏文忠公诗编注集成》、沈钦韩《苏诗查注补正》并系杨世昌(道士,善箫);今人亦多有辨正。\n  2. 「窈窕之章」所指:《诗经·陈风·月出》说与曹操《短歌行》说并存;本文取前说为主,后说为辅。\n- **素材来源标注**:\n  - **朱刚《苏轼十讲》(2019 上海三联书店)第四讲「三咏赤壁」**:已取得文本。原文部分以通行模型知识为底,核证以下分项出自该讲:\n    - 第四讲第二目「《赤壁赋》与宋代『文赋』」论前、后赤壁赋之结构差异——**前赋说理、后赋写境**;\n    - 第四讲第三目「《后赤壁赋》的神秘世界」论孤鹤—道士之关系;\n    - 第四讲第六目「也无
