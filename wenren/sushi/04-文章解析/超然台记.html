<script>
const MD = "# 超然台记\n\n## 一、题名与体裁\n\n- **题名**:「超然台记」。台名「超然」,在密州(今山东诸城)城北。苏轼熙宁七年(1074)至熙宁九年(1076)知密州,于故城墙北筑「超然台」,并作此记。\n- **体裁**:记(亭台记)。中国「记」之一种,以「台、亭、楼、阁」等建筑为题,而发议论、抒怀抱;唐韩愈、柳宗元开其端,宋欧阳修、王安石、苏轼而大成。本篇以「超然」立题,而通篇发挥「超然」之哲学意蕴,是为「以题为论」之亭台记。\n\n## 二、原文\n\n> 凡物皆有可观。苟有可观,皆有可乐,**非必怪奇伟丽者也**。哺糟啜醨,皆可以醉;果蔬草木,皆可以饱。推此类也,吾安往而不乐?\n>\n> **夫所谓求福而辞祸者,以福可喜而祸可悲也**。夫人之为是者,盖将以为「无所求」也,而不知求者之为求也;盖将以为「无所待」也,而不知待者之为待也。昔者孔子称颜回「一箪食,一瓢饮,在陋巷,人不堪其忧,回也不改其乐」,盖「无所求」也。然孔子「饭疏食,饮水,曲肱而枕之,乐亦在其中矣」,非以「乐」为「无所求」而待外也。\n>\n> 是岁元丰二年,予到官于杭。逾年,始得此台之胜,因以为之记。\n\n> **校记**:\n> 1. 「**非必怪奇伟丽者也**」,通行本与宋本合。「怪奇伟丽」即「怪异奇特、雄伟壮丽」。\n> 2. 部分整理本于「昔者孔子称颜回」句下,另有「未若贫而乐」与「未若富而好礼」之辨;今从通行本。\n> 3. 全文末句,通行本作「因以为之记」,亦有作「因以为记」者,皆通。\n\n## 三、写作背景\n\n- **系年**:熙宁九年(1076)。\n- **地点**:密州(今山东诸城)超然台。台在密州城北,苏轼熙宁七年(1074)至九年(1076)知密州时所筑。\n- **缘起**:熙宁七年(1074),苏轼自杭州通判改知密州(王安石变法期间,苏轼请求外放,以为远离变法漩涡)。熙宁八年(1075)修葺北城旧台,名「超然台」。熙宁九年作此记,时年 40 岁。\n- **写作情境**:密州任上,苏轼与通判刘秉(字公辅)、赵晦之等共事,常登台赋诗。苏轼有《和子由渑池怀旧》《超然台作》等诗作于此时。\n- **异说**:系年说甚一致(熙宁九年),无重大异说。\n\n## 四、分段笺注\n\n### 4.1 「凡物皆有可观。苟有可观,皆有可乐」\n\n- **核心命题**:**万物皆可观可乐**——这是一种**「无往不乐」的达观哲学**。\n- 「可观」:有可观之处——并非「怪奇伟丽」方可观,日常事物皆有可观。\n- 此为全篇哲学之起点。\n\n### 4.2 「非必怪奇伟丽者也」\n\n- 否定之语,极重要。**反俗见**——世俗以为可乐者,必怪奇伟丽之物;东坡则谓日常之物皆有可乐。\n- 与《前赤壁赋》「惟江上之清风,与山间之明月,耳得之而为声,目遇之而成色,取之无禁,用之不竭」之「造物无尽藏」精神一贯。\n\n### 4.3 「哺糟啜醨,皆可以醉;果蔬草木,皆可以饱」\n\n- **哺糟啜醨**(bǔ zāo chuò lí):食酒糟,饮薄酒——粗陋之饮。\n- 「果蔬草木」:果子、蔬菜、草木——普通之食。\n- 此举以粗陋之饮、寻常之食,皆能醉、饱——**可乐不必奇珍**。\n\n### 4.4 「推此类也,吾安往而不乐」\n\n- 「安往」:何处。\n- 「**吾安往而不乐**」:**何处不乐**——一种「普遍之乐」的世界观,非独某处某景可乐。\n\n### 4.5 「夫所谓求福而辞祸者,以福可喜而祸可悲也」\n\n- **求福辞祸**:人之常情——求福、避祸。\n- 「以福可喜而祸可悲」:因为福可喜、祸可悲。\n- 此句点出**世人求乐而反悲之由**:从「外求」。\n\n### 4.6 「盖将以为『无所求』也,而不知求者之为求也」\n\n- 一种「自以为不求,实则仍在求」之反讽。\n- 「求者之为求」:求「不求」本身,亦是一种求——**形上的两难**。\n- 此为东坡哲学思考之深致处。\n\n### 4.7 「昔者孔子称颜回『一箪食,一瓢饮,在陋巷,人不堪其忧,回也不改其乐』」\n\n- 引《论语·雍也》:孔子称颜回安贫乐道。\n- 「一箪食,一瓢饮,在陋巷」:极贫之境。\n- 「人不堪其忧,回也不改其乐」:他人不堪其忧,颜回不改其乐。\n- 此为「**安贫之乐**」之儒家典型——为东坡「超然」之论提供儒家根据。\n\n### 4.8 「非以『乐』为『无所求』而待外也」\n\n- 此句关键——东坡对颜回之乐的解读:\n- 不是以「乐」为「无所求」、以「乐」为「等待外物来填充我」——**乐不在外求,而在内生**。\n- 这是**儒家乐感文化之真精神**:非「等待外境好而我乐」,而是「无论外境如何,我自有乐」。\n\n### 4.9 「是岁元丰二年,予到官于杭」\n\n- 「是岁」:这一年——按本文前后文与通行整理本,「是岁元丰二年」与「密州超然台」之关系,历来存疑。\n- **异说**:一说「元丰二年」系误记,实为「熙宁七年」(1074)到密州;一说「是岁」指从前某年,本文另有时间衔接。今多采「熙宁九年(1076)作于密州」之通行说。\n- 「予到官于杭」:苏轼熙宁四年(1071)到杭州通判任。元丰二年(1079)四月苏轼由徐州改知湖州,此非「到杭州」时。**今通行整理本作「元丰二年」与本文情境不合**,本条通行本可能即有校勘之疑,**待网络源核**。\n\n### 4.10 「逾年,始得此台之胜,因以为之记」\n\n- 「逾年」:过了一年。\n- 「始得此台之胜」:才得到此台之胜景。\n- 「因以为之记」:因此为它作记。\n\n> **存疑说明**:本文最末时间衔接(「是岁元丰二年……逾年……因以为之记」)与超然台实际建造时间(熙宁七年至九年,1074-1076)有出入;通行整理本之异说,详见溯源节。\n\n## 五、综合赏析\n\n### 5.1 文体之立——「以题为论」\n\n亭台记之传统,在于「借景抒情」或「即景立论」。本篇不写景(或不主于写景),而以「超然」二字立骨,通篇发挥哲学意蕴。\n\n其结构:\n1. **提出命题**:凡物皆有可观可乐。\n2. **破俗见**:不必怪奇伟丽。\n3. **正面立论**:安贫之乐、内生之乐。\n4. **收束**:交代作记。\n\n此与柳宗元「永州八记」之「即景立论」相类,而更重议论——**亭台记之「议论化」在东坡此篇中达到成熟**。\n\n### 5.2 「超然」之哲学内涵\n\n「超然」二字,本篇未直接定义,然由全文可见:\n\n**(1)无待之乐**(庄子维度):「不役于物」「物各有主」——超然于物欲。\n**(2)安贫之乐**(儒家维度):颜回之乐——超然于贫贱。\n**(3)无求之乐**(佛家维度):「无所求」「无所待」——超然于执念。\n\n三义合一,「超然」即是**一种精神之自由状态**——既超越物欲、亦超越贫贱、亦超越执念。**此与《前赤壁赋》「物与我皆无尽」「共适」之达观一脉相承**。\n\n### 5.3 与「超然台」之诗互见\n\n苏轼于超然台作诗多首,其中最著名者为熙宁九年(1076)《望江南·超然台作》:\n\n> 「春未老,风细柳斜斜。试上超然台上望,半壕春水一城花。烟雨暗千家。\n> 寒食后,酒醒却咨嗟。休对故人思故国,且将新火试新茶。诗酒趁年华。」\n\n词中「**诗酒趁年华**」一句,与本篇「**安往而不乐**」精神一致——皆强调「及时行乐」「于日常中超然」之旨。\n\n### 5.4 与「喜雨亭记」之比较\n\n《喜雨亭记》(1062,凤翔)与《超然台记》(1076,密州)同为苏轼亭台记之代表:\n\n- **喜雨亭记**:以「喜」字立骨,小亭小景,小中见大,情感明快。\n- **超然台记**:以「超然」立骨,大台大论,大处立说,情感冲淡。\n\n二篇对比,可见苏轼十四年间(1062-1076)文风之演进:由「情真意切」到「理明气定」,由「少年才气」到「中年达观」。\n\n### 5.5 文学史地位\n\n本篇为「东坡亭台记」之代表,与《喜雨亭记》《放鹤亭记》《凌虚台记》等并称。茅坤《唐宋八大家文钞》评曰:「**一篇小文,说出无限道理**。」清人储欣《唐宋八大家类选》评曰:「**超然不役于物,真得庄、颜之乐**。」\n\n## 六、关联网络\n\n### 6.1 与「喜雨亭记」(1062)之比较\n\n见综合赏析 5.4。两篇同为亭台记,标志东坡十四年间之成长。\n\n### 6.2 与「超然台」之诗互见\n\n苏轼于超然台作诗多首,最著名者为《望江南·超然台作》(熙宁九年)、「西江月·三过平山堂下」(熙宁九年,怀念欧阳修之作)等。本篇之立意,与同期诗词互见。\n\n### 6.3 与「密州时期」之词\n\n密州时期(1074-1076)是苏轼词作之成熟期,《江城子·密州出猎》(1075)、《水调歌头·明月几时有》(1076,怀子由)等皆作于此时。「超然」之精神,与「**诗酒趁年华**」「**人有悲欢离合,月有阴晴圆缺,此事古难全**」等同期作品互见——皆为东坡密州时期之「达观」精神。\n\n### 6.4 与「乌台诗案」前奏\n\n本篇作于熙宁九年(1076),距「乌台诗案」(1079)三年。东坡密州时期之「超然」,实为其贬谪前「达观精神」之成熟期——此后乌台诗案,东坡以「**也无风雨也无晴**」之定力扛过贬谪,非一朝而至。\n\n## 七、溯源记录\n\n- **原文依据**:通行整理本,以中华书局 1986 年点校本《苏轼全集》所载为底。原文末段「是岁元丰二年,予到官于杭」一句与密州超然台之实际情境(熙宁年间)有出入,**疑为校勘之误,待网络源核**。\n- **系年依据**:王水照、崔铭《苏轼年表》;孔凡礼《苏轼年谱》卷二十六。明确系于熙宁九年(1076)。\n- **异说来源**:\n  1. 「是岁元丰二年」之误:与本文情境(密州)及东坡行迹(元丰二年苏轼已由徐州改湖州)不合;一说为「熙宁七年」(1074),一说为「是岁」另有所指。**待网络源核**。\n  2. 「超然」之思想来源:庄、颜(颜回)之说并存;南宋以来多从庄、颜双解。\n- **素材来源标注**:\n  - **朱刚《苏轼十讲》第三讲「贤良进卷」**:已取得文本。论及嘉祐、熙宁间东坡密州时期之行迹,可与本篇系年(熙宁九年,1076)互见。\n  - **王水照、朱刚《苏轼评传》**:已取得文本,思想史综合论述。\n  - **王水照《苏轼研究》**、**王水照崔铭《苏轼传》**、**林语堂《苏东坡传》**:已取得文本。\n  - **苏东坡新传(李一冰)**:本环境读取失败(编码问题),**待重试**。第四章「惟有悯农心尚在」论及密州时期。";
