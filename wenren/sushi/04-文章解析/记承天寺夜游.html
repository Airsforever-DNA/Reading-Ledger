const MD = "# 记承天寺夜游\n\n## 一、题名与体裁\n\n- **题名**:「记承天寺夜游」。以游踪立题,「记」为文体。\n- **体裁**:记(小品记/日记)。中国文体之「记」,起源甚早(《史记》《汉书》之「书」「志」),至唐宋而蔚为大观;其下分亭台记、画记、游记、考察记等。本篇为「游记」之极致——80 余字成篇,是中国文学中最短的「记」之一。\n\n## 二、原文\n\n> **元丰六年十月十二日,夜。解衣欲睡,月色入户,欣然起行。念无与为乐者,遂至承天寺寻张怀民。怀民亦未寝,相与步于中庭。**\n>\n> 庭下如积水空明,水中藻荇交横——盖竹柏影也。\n>\n> **何夜无月?何处无竹柏?但少闲人如吾两人者耳。**\n\n> **异文校记**:本文极短,文字多无歧异。通行本与宋刊本合。\n\n## 三、写作背景\n\n- **系年**:元丰六年(1083)十月十二日夜。\n- **地点**:黄州承天寺。\n- **缘起**:苏轼贬黄州时期(1080-1084),与张怀民(字梦得,亦贬官至黄州)交好。是夜月色入户,苏轼起而行,至承天寺寻张怀民,共步中庭,因作此记。\n- **人物**:张怀民(又名张梦得),亦贬官至黄州,与苏轼同为「闲人」(贬谪之人,不得任事)。清人王文诰《苏文忠公诗编注集成》、张鸣《苏轼年谱》均记张怀民与苏轼过从甚密。\n\n## 四、分段笺注\n\n### 4.1 「元丰六年十月十二日,夜」\n\n- **元丰六年**:1083 年。距「乌台诗案」(1079)四年,距元丰七年(1084)离黄州赴汝州一年余。\n- 「**日记体**」开头:开篇即标「月日」,是中国日记体散文之典型开篇(柳宗元「永州八记」亦有「始得西山宴游记」标年)。\n\n### 4.2 「解衣欲睡,月色入户,欣然起行」\n\n- 「**欣然**」二字奠定全篇基调:本来要睡了,见月色入户,欣然起行——不是大悲大喜,只是一种安静的欣喜。\n- 「月色入户」:月色「进」到了室内,仿佛有情——东坡笔下,物皆有情。\n\n### 4.3 「念无与为乐者,遂至承天寺寻张怀民」\n\n- 「念」:想到。\n- 「无与为乐者」:没有可以共乐之人。\n- 「遂至承天寺」:于是走到承天寺。承天寺在黄州城东南,苏轼元丰六年常往之(《东坡志林》记承天寺数则)。\n\n### 4.4 「怀民亦未寝,相与步于中庭」\n\n- 「**未寝**」:张怀民也还没睡——这一细节甚重要:并非苏轼强邀,乃怀民亦自闲而未眠。\n- 「相与步于中庭」:一起在院子里走——不必交谈,只是共步、共看月光。\n\n### 4.5 「庭下如积水空明,水中藻荇交横——盖竹柏影也」\n\n- 此段为千古名句。\n- **庭下如积水空明**:月光洒在庭院的地面上,像一片清澈的水。\n- **水中藻荇交横**:水里面,水草交错——这是写**竹柏之影**(月光下,竹影、柏影摇曳于「积水」之中,似水草)。\n- 「**盖竹柏影也**」:一语点破——前面所写的「积水」「藻荇」,原来是月光下的竹柏影子!\n- **写作之妙**:不直接说「月光照竹柏,其影在地」,而先以「积水」「藻荇」两个比喻引领读者进入「水底世界」,再点破是影——**虚实相生**,营造出一种「亦真亦幻」之境。\n- 「**藻荇**」:藻为水草,荇(xìng)为荇菜,即《诗经·周南·参差荇菜》之荇——苏轼将《诗经》之名物化为庭院月光之景,雅而能俗。\n\n### 4.6 「何夜无月?何处无竹柏?但少闲人如吾两人者耳」\n\n- 「**何夜无月?何处无竹柏?**」:两个反问——每夜都有月,每处都有竹柏。\n- 「**但少闲人如吾两人者耳**」:只是缺少像我两人这样的「闲人」罢了。\n- 「**闲人**」:此二字最要玩味——表面是「清闲之人」(贬谪不得任事,反得闲暇),实则是「**闲适而有雅致**」之人;更深层则是「**超越功名、心与月同**」之人。\n- 「如吾两人者」:不仅指苏轼与张怀民,更指**所有「能于月下步庭而有所感」之人**——这是一种精神上的共鸣呼唤。\n\n## 五、综合赏析\n\n### 5.1 篇幅之极简\n\n全篇 80 余字,在中国散文史上是最短的「记」之一——却能成为千古名篇,其特点:\n\n- **无事可记**(无大事可叙)。\n- **无景可记**(只记一庭院之月色)。\n- **无人可记**(只一怀民而已)。\n- **无议论可记**(只最后三句感慨)。\n\n这种「四无」之文,以「**闲**」字为核心——闲心、闲步、闲眼、闲笔,合而成篇。中国散文史上,能做到这样「以闲为体」的,除柳宗元「永州八记」之少数篇章外,极少能与东坡此篇匹敌。\n\n### 5.2 「闲人」之多重意涵\n\n「**但少闲人如吾两人者耳**」一句,为全篇精神之眼。「闲人」之义,至少有四重:\n\n**(1)字面义**:贬谪之人,不得任事,反得清闲。\n**(2)行为义**:能于月夜欣然起行,不远寻友,共步中庭——有「闲情」之人。\n**(3)精神义**:能于「庭下积水」「藻荇交横」之幻境中,识别竹柏之真——有「闲眼」(不被表象迷惑)之人。\n**(4)哲学义**:超越功名、不被外物所役,故能与月同在、与竹柏同在——有「**闲心**」之人。\n\n四义中,第四义最深。「闲人」二字,实际上是东坡对贬谪生活的反向解读——被贬之「不幸」,反成全了精神的「**大闲**」。\n\n### 5.3 与前赋精神之一贯\n\n本篇作于元丰六年(1083)十月,前赋作于元丰五年(1082)七月——相隔一年多,但精神一贯:\n\n- 前赋之「共适」:清风明月,取之无禁,人可共之。\n- 本篇之「闲人」:每夜有月,每处有竹柏,只是少「闲人」之眼。\n\n二者皆以「人—自然」之共在为主题——「造物者之无尽藏」(前赋)与「何夜无月」(本篇),是同一精神的两面表达。前赋说理,本篇写心;前赋深,本篇淡;前赋重,本篇轻——**合而观之,方为东坡贬黄州之心境全貌**。\n\n### 5.4 「庭下如积水空明」之文学史影响\n\n此句之「以地为水、以影为草」之笔法,对中国后世散文影响深远:\n\n- 明代张岱《西湖七月半》之写月色,有类似笔意。\n- 明清小品如袁宏道《满井游记》、张潮《幽梦影》之写景,皆有此余韵。\n- 近代以来周作人、梁实秋、林语堂之小品文,皆以「闲」为体——本文是其远源。\n\n### 5.5 文学史地位\n\n本篇被推为「**东坡第一小文**」者甚多。明人王舜俞《三苏文粹》评曰:「八十余字,尽得东坡精神。」清人吴楚材、吴调侯《古文观止》收此篇,评曰:「**如怨如慕,如泣如诉之变调**;**前赋之注脚**。」\n\n## 六、关联网络\n\n### 6.1 与「前赤壁赋」(1082 七月)共为黄州文学标志\n\n前赋主客泛舟、对话辩难;本篇一人一友、共步中庭。前赋以哲思胜,本篇以心境胜。两篇合看,可见东坡黄州时期之「**外与内**」:外则泛游赤壁,内则闲步小院。\n\n### 6.2 与「后赤壁赋」(1082 十月)互见季节\n\n前赋夏景(七月),本赋冬景(十月)——前后两次月色、两种心情。后赋亦为冬景(十月),与本篇同月——本篇之「月色入户」与后赋之「山高月小」,同为元丰六年冬月之月,前者温润,后者凛冽。\n\n### 6.3 与「张怀民」之交谊\n\n张怀民(字梦得),亦贬官至黄州,与苏轼常往来。本篇因张怀民而起,二人共步中庭,共赏月色,此为贬谪交谊之典型——非官场应酬,而是「同是天涯沦落人」之精神共鸣。\n\n苏轼另有《赠张梦得》一诗(系年不详),可与本篇互见。\n\n### 6.4 与「承天寺」之地望\n\n承天寺在黄州(今湖北黄冈)城内东南,为黄州名刹。苏轼多次游之,《东坡志林》中有数则记承天寺。本篇是其承天寺诸记之代表。\n\n## 七、溯源记录\n\n- **原文依据**:通行整理本,以中华书局 1986 年点校本《苏轼全集》所载为底。本文文字简,异文少,各本大体一致。\n- **系年依据**:王水照、崔铭《苏轼年表》;孔凡礼《苏轼年谱》卷四十。明确系于元丰六年(1083)十月十二日。\n- **异说来源**:\n  1. 张怀民身份:宋本注及清人王文诰《苏文忠公诗编注集成》以为「张梦得」(字梦得,即张怀民),今并存其说。\n  2. 「藻荇」之具体所指:《诗经·周南·参差荇菜》之荇,或即「水镜草」,非确指。\n- **素材来源标注**:\n  - **朱刚《苏轼十讲》第四讲「三咏赤壁」**:已取得文本。本篇为黄州末期小品,可与该讲第六目「也无风雨也无晴」之东坡精神建构互见。\n  - **林语堂《苏东坡传》第十六章「赤壁赋」**:已取得文本,详写黄州东坡之生活情境。\n  - **王水照《苏轼研究》**、**王水照朱刚《苏轼评传》**、**王水照崔铭《苏轼传》**:已取得文本。\n  - **苏东坡新传(李一冰)**:本环境读取失败(编码问题),**待重试**。本篇与第七章「三咏赤壁成绝唱」同期,可与该章互见。";
