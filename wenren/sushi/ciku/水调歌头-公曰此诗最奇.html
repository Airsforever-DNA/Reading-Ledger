<div class="dg-hero" style="padding:42px 20px 32px;"><div class="kicker">东坡词库 · 全量轻读</div><h1 style="font-size:27px;">水调歌头</h1><div class="meta">未系年</div></div>
<div class="dg-wrap" style="max-width:680px;">
<div class="ck-card">
<div style="text-align:center;font-size:14px;color:#9a7b3f;letter-spacing:2px;margin-bottom:6px;">又</div>
<span class="cl">公曰：此诗最奇丽，然非听琴，乃听琵琶也。余深然之。建安章质夫家善琵琶者，乞为歌词。余久不作，特取退之词，稍加概括，使就声律，以遗之云</span><span class="cl">昵昵儿女语，灯火夜微明。恩冤尔汝来去，弹指泪和声。忽变轩昂勇士，一鼓填然作气，千里不留行。回首暮云远，飞絮搅青冥。</span><span class="cl">众禽里，真彩凤，独不鸣。跻攀寸步千险，一落百寻轻。烦子指间风雨。置我肠中冰炭，起坐不能平。推手从归去，无泪与君倾。</span>
<div style="text-align:center;margin-top:24px;"><span class="badge">〔宋〕苏轼</span><span class="badge">未系年</span></div>
