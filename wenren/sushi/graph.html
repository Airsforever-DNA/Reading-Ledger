  return {
    backgroundColor: 'transparent',
    tooltip: {backgroundColor: '#141a16', borderColor: '#4a5448', textStyle: {color: '#e8e0cd'},
      extraCssText: 'max-width:340px;white-space:normal;',
      formatter: function(p) {
        if (p.dataType === 'edge') return '<b style="color:#e0c87f;">' + (p.data.label || '') + '</b>' +
          (p.data.evolved ? '<br><i style="color:#b8d090;">' + p.data.evolved + '</i>' : '') +
          (p.data.note ? '<br>' + p.data.note : '');
        return '<b style="font-size:15px;color:#e0c87f;">' + p.data.name + '</b><br><i style="color:#b8ad93;">' +
          p.data.category + ' · ' + p.data.value + ' 条关系 · 点击进入人物志</i>';
      }},
    legend: [{data: cats, textStyle: {color: '#b8ad93'}, type: 'scroll', bottom: 6, inactiveColor: '#4a5448'}],
    graphic: layout === 'none' ? RINGS : [],
    series: [series]
  };
}
chart.setOption(buildOption('none'));
function setLayout(l) {
  document.getElementById('b-ring').className = l === 'none' ? 'on' : '';
  document.getElementById('b-force').className = l === 'force' ? 'on' : '';
  chart.setOption(buildOption(l), true);
}
chart.on('click', p => { if (p.dataType === 'node') window.location.href = 'figure/' + p.data.id + '.html'; });
window.addEventListener('resize', () => chart.resize());
</script></body></html>
