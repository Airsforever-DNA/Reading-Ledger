const MD = "# 苏轼人生大事年表\n\n> 公元 1037-1101\n\n> 第三版（C 档复核重建）：多关键词共现定位 + ±400 字上下文抽读验证\n\n\n\n## 眉山少年 1037-1056\n\n- **1037 景祐三年十二月十九** · 0岁 · 眉州眉山 · *家庭*\n  苏轼生于四川眉州眉山城内纱縠行苏宅，父苏洵年二十七，母程氏。 〔人物：苏洵、程夫人、苏辙〕\n  〔来源：李一冰 p38 / 王水照崔铭 p20 / 林语堂 p26〕\n\n- **1039 宝元二年** · 2岁 · 眉州眉山 · *家庭*\n  苏辙生于眉山，自此兄弟情好终生。 〔人物：苏辙、苏洵、程夫人〕\n  〔来源：李一冰 p38 / 王水照崔铭 p20 / 林语堂 p26〕\n\n- **1040 宝元三年** · 3岁 · 眉州眉山 · *家庭*\n  苏轼兄弟并从父苏洵、伯父苏涣学；苏家于眉山家境渐窘。 〔人物：苏洵、苏涣〕\n  〔来源：李一冰 p38 / 王水照崔铭 p20 / 林语堂 p26〕\n\n- **1042 庆历二年** · 5岁 · 眉州眉山 · *家庭*\n  程夫人亲授苏轼兄弟读《汉书》，讲范滂气节，奠定苏轼一生节义根基。 〔人物：程夫人〕\n  〔来源：王水照崔铭 p24〕\n\n- **1043 庆历三年** · 6岁 · 眉州眉山 · *创作*\n  苏轼在眉山读《后汉书》《旧唐书》；并开始学作诗文。\n  〔来源：李一冰 p38 / 王水照崔铭 p20 / 林语堂 p26〕\n\n- **1045 庆历五年** · 8岁 · 眉州眉山 · *交游*\n  苏轼兄弟随父苏洵游学本地，熟读经史；苏洵游学四方，未仕。 〔人物：苏洵〕\n  〔来源：王水照崔铭 p24〕\n\n- **1046 庆历六年** · 9岁 · 眉州→成都 · *仕途*\n  苏洵携轼、辙赴成都参加秋试，苏轼兄弟未中。 〔人物：苏洵〕\n  〔来源：李一冰 p63〕\n\n- **1047 庆历七年** · 10岁 · 眉州眉山 · *创作*\n  苏洵游学归来，督教二子；苏轼兄弟始作策论，论古今治乱。 〔人物：苏洵〕\n  〔来源：王水照崔铭 p24〕\n\n- **1048 庆历八年** · 11岁 · 眉州眉山 · *交游*\n  苏轼入天庆观北极院从道士张易简读书，前后三年；同学有陈太初。 〔人物：张易简、陈太初〕\n  〔来源：李一冰 p49 / 王水照崔铭 p161 / 林语堂 p224〕\n\n- **1049 皇祐元年** · 12岁 · 眉州眉山 · *创作*\n  苏轼于天庆观读书期间与同学陈太初游岷江；作诗咏叹蜀中山水。 〔人物：陈太初〕\n  〔来源：李一冰 p49 / 王水照崔铭 p161 / 林语堂 p224〕\n\n- **1051 皇祐三年** · 14岁 · 眉州眉山 · *交游*\n  苏轼游学彭山仙女坪、寿昌院；与刘仲达、刘微之、史炤等本地友朋交往。 〔人物：刘仲达、刘微之〕\n  〔来源：李一冰 p49 / 王水照崔铭 p161 / 林语堂 p224〕\n\n- **1052 皇祐四年** · 15岁 · 眉州眉山 · *创作*\n  苏轼于彭山游寿昌院；与史炤、刘仲达等结伴咏诗。 〔人物：史炤、刘仲达〕\n  〔来源：李一冰 p49 / 王水照崔铭 p161 / 林语堂 p224〕\n\n- **1054 至和元年** · 17岁 · 眉州眉山 · *家庭*\n  苏轼十八岁，娶眉山青神县乡贡进士王方之女王弗为妻；王弗敏而静，识人甚明。 〔人物：王弗〕\n  〔来源：模型知识〕\n\n- **1055 至和二年** · 18岁 · 眉州→京师 · *仕途*\n  苏洵携苏轼、苏辙乘舟东行入京应举；途经成都，谒见雅州知州张方平，张方平荐之于欧阳修。 〔人物：苏洵、张方平〕\n  〔来源：李一冰 p63〕\n\n- **1056 嘉祐元年** · 19岁 · 成都→京师 · *交游*\n  父子抵京师；苏洵以书谒欧阳修，欧阳修读《机权》《衡论》《权书》诸文大器重之。 〔人物：苏洵、欧阳修〕\n  〔来源：李一冰 p63 / 朱刚 p175〕\n\n- **1040 宝元三年** · 3岁 · 眉州眉山 · *家庭*\n  苏轼兄弟并从父苏洵、伯父苏涣学；苏家于眉山家境渐窘。 〔人物：苏洵、苏涣〕\n  〔来源：李一冰 p38 / 王水照崔铭 p20 / 林语堂 p26〕\n\n- **1053 皇祐五年至和元年** · 16岁 · 眉州眉山 · *仕途*\n  苏洵游学在外，作《上欧阳内翰书》求谒；苏轼居家并备考。 〔人物：苏洵、欧阳修〕\n  〔来源：李一冰 p63 / 朱刚 p175〕\n\n\n## 进士与凤翔 1057-1065\n\n- **1057 嘉祐二年正月** · 20岁 · 京师开封 · *仕途*\n  苏轼、苏辙同科进士及第；苏轼应《刑赏忠厚之至论》获主考官欧阳修激赏；欧阳修语梅尧臣：'取轼冠多士，愧老夫当避路。' 〔作品：刑赏忠厚之至论〕 〔人物：欧阳修、梅尧臣、苏辙〕\n  〔来源：李一冰 p1075 / 李一冰 p63 / 朱刚 p175〕\n\n- **1057 嘉祐二年四月** · 20岁 · 京师 · *家庭*\n  苏轼母程夫人卒于京师；父子仓促扶柩归眉山。 〔人物：程夫人〕\n  〔来源：模型知识〕\n\n- **1058 嘉祐三年** · 21岁 · 眉州 · *创作*\n  苏轼居眉山守制；研读《论语》《孟子》；与王弗于乡。 〔人物：王弗〕\n  〔来源：模型知识〕\n\n- **1059 嘉祐四年** · 22岁 · 眉州→京师 · *创作*\n  苏轼服除，父子再赴京师；途经忠州，登白帝城，俯瞰瞿塘峡；至京师。 〔人物：苏洵〕\n  〔来源：李一冰 p63〕\n\n- **1060 嘉祐五年** · 23岁 · 京师 · *仕途*\n  苏辙亦在朝；兄弟与曾巩、晁端友等交往；授苏轼河南府福昌县主簿，未赴。 〔人物：曾巩、苏辙〕\n  〔来源：李一冰 p63 / 朱刚 p175〕\n\n- **1061 嘉祐六年八月** · 24岁 · 京师→凤翔 · *仕途*\n  苏轼应制科入第三等'贤良方正能直言极谏科'；授大理评事、签书凤翔府判官；十一月与苏辙别于郑州，作《和子由渑池怀旧》。 〔作品：和子由渑池怀旧〕 〔人物：苏辙〕\n  〔来源：李一冰 p97 / 王水照崔铭 p35 / 林语堂 p69〕\n\n- **1062 嘉祐七年** · 25岁 · 凤翔 · *创作*\n  苏轼到凤翔任签判；与王弗同赴；判案明断；作《凤翔八观》《李太白仙诗卷后》等诗。 〔作品：凤翔八观、李太白仙诗卷后〕 〔人物：王弗、陈公弼〕\n  〔来源：王水照崔铭 p40〕\n\n- **1063 嘉祐八年** · 26岁 · 凤翔 · *仕途*\n  英宗即位；苏轼上书论政；与凤翔知府陈公弼交往有诗；作《陈公弼传》。 〔人物：陈公弼、英宗〕\n  〔来源：李一冰 p112 / 王水照崔铭 p48〕\n\n- **1064 治平元年** · 27岁 · 凤翔 · *交游*\n  苏轼于凤翔度岁；与陈公弼交往；与苏辙书信论学不断；作《和子由渑池怀旧》新韵。 〔人物：陈公弼、苏辙〕\n  〔来源：李一冰 p97 / 王水照崔铭 p35 / 林语堂 p69〕\n\n- **1065 治平二年** · 28岁 · 凤翔→京师 · *家庭*\n  凤翔任满返京；五月王弗卒于京师，年二十七；遗孤苏迈年十一。 〔人物：王弗、苏迈〕\n  〔来源：李一冰 p122〕\n\n- **1060 嘉祐五年** · 23岁 · 京师 · *交游*\n  王安石回京任三司度支判官；与苏轼、曾巩、吕公著等交往；议论新法雏形。 〔人物：王安石、曾巩、吕公著〕\n  〔来源：李一冰 p63 / 朱刚 p175〕\n\n- **1063 嘉祐八年** · 26岁 · 凤翔 · *仕途*\n  英宗即位大赦；苏轼被任命为登闻鼓院直鼓院。 〔人物：英宗〕\n  〔来源：李一冰 p112 / 王水照崔铭 p48〕\n\n\n## 熙宁还朝与外任 1068-1078\n\n- **1068 熙宁元年** · 31岁 · 京师 · *仕途*\n  服除返京；苏轼授官告院签书判官；与王安石初次接触。 〔人物：王安石〕\n  〔来源：王水照崔铭 p49〕\n\n- **1069 熙宁二年** · 32岁 · 京师 · *仕途*\n  王安石拜参知政事，推行新法；苏轼上书论新法不便，主张'补外'。 〔人物：王安石〕\n  〔来源：王水照崔铭 p49〕\n\n- **1070 熙宁三年** · 33岁 · 京师 · *仕途*\n  苏轼连上《议学校贡举状》《拟进士对御试策》，力陈科举之弊；王安石深忌之。 〔作品：拟进士对御试策〕 〔人物：王安石〕\n  〔来源：李一冰 p1075〕\n\n- **1071 熙宁四年** · 34岁 · 京师→杭州 · *仕途*\n  苏轼上书神宗论新法'求治太速，进人太锐，听言太广'；请外任；通判杭州。 〔人物：神宗、王安石〕\n  〔来源：李一冰 p167 / 王水照崔铭 p5 / 朱刚 p95〕\n\n- **1072 熙宁五年** · 35岁 · 杭州 · *创作*\n  苏轼通判杭州，与周邠、鲁有开、刘述等游西湖；主持修缮钱塘六井；作《饮湖上初晴后雨》。 〔作品：饮湖上初晴后雨〕 〔人物：周邠、鲁有开〕\n  〔来源：王水照崔铭 p73 / 朱刚 p137〕\n\n- **1073 熙宁六年** · 36岁 · 杭州 · *家庭*\n  通判杭州任内赈济浙西灾荒；与王闰之（王弗堂妹）成婚。 〔人物：王闰之〕\n  〔来源：李一冰 p1076 / 王水照崔铭 p66〕\n\n- **1073 熙宁六年（续）** · 36岁 · 杭州 · *交游*\n  苏轼通判任上，曾润色闽中诗僧谦师诗；与欧阳修再会于京师书信中。 〔人物：欧阳修〕\n  〔来源：李一冰 p1076 / 王水照崔铭 p66〕\n\n- **1074 熙宁七年** · 37岁 · 杭州→密州 · *仕途*\n  由杭州移知密州；九月赴任，访润州金山寺作《游金山寺》；到密州后捕蝗抗灾。 〔作品：游金山寺〕\n  〔来源：李一冰 p243 / 王水照崔铭 p105 / 朱刚 p113 / 李一冰 p232 / 王水照崔铭 p5〕\n\n- **1075 熙宁八年** · 38岁 · 密州 · *创作*\n  苏轼知密州；整军治蝗；中秋怀苏辙，作《水调歌头·明月几时有》；作《江城子·密州出猎》。 〔作品：水调歌头·明月几时有、江城子·密州出猎〕 〔人物：苏辙〕\n  〔来源：李一冰 p253 / 王水照崔铭 p90 / 朱刚 p130 / 李一冰 p243 / 王水照崔铭 p105 / 朱刚 p113〕\n\n- **1076 熙宁九年** · 39岁 · 密州 · *创作*\n  苏轼修葺超然台，作《超然台记》；与刘恕交往论学。 〔作品：超然台记〕 〔人物：刘恕〕\n  〔来源：李一冰 p20 / 王水照崔铭 p223〕\n\n- **1077 熙宁十年** · 40岁 · 密州→徐州 · *仕途*\n  由密州移知徐州；七月黄河决口于澶渊，苏轼亲率军民筑堤抗洪七十余日。\n  〔来源：李一冰 p203 / 王水照崔铭 p194 / 林语堂 p9〕\n\n- **1078 元丰元年** · 41岁 · 徐州 · *创作*\n  徐州市政渐安；苏轼建黄楼以镇水；与苏辙相聚百日；作《黄楼赋》。 〔作品：黄楼赋〕 〔人物：苏辙、王巩〕\n  〔来源：李一冰 p20 / 王水照崔铭 p110 / 朱刚 p311〕\n\n- **1078 元丰二年正月** · 41岁 · 徐州 · *交游*\n  苏轼在徐州市政渐安；上书神宗荐刘攽等人才；与苏辙、王巩、文同等交往。 〔人物：苏辙、王巩、刘攽〕\n  〔来源：李一冰 p20 / 王水照崔铭 p110 / 朱刚 p311 / 李一冰 p204 / 王水照崔铭 p121 / 林语堂 p190〕\n\n- **1070 熙宁三年（续）** · 33岁 · 京师 · *仕途*\n  苏轼为《王莽传》论，引发政敌不满；与范镇论政不合。 〔人物：范镇〕\n  〔来源：王水照崔铭 p49〕\n\n- **1074 熙宁七年** · 37岁 · 杭州 · *交游*\n  苏轼于杭州任上，赏识画家文同（与可）之画，与文同订交。 〔人物：文同〕\n  〔来源：李一冰 p243 / 王水照崔铭 p105 / 朱刚 p113〕\n\n- **1076 熙宁九年（续）** · 39岁 · 密州 · *创作*\n  苏轼修葺超然台；作《望江南·超然台作》。 〔作品：望江南·超然台作〕\n  〔来源：李一冰 p20 / 王水照崔铭 p223〕\n\n- **1077 熙宁十年** · 40岁 · 密州 · *创作*\n  苏轼于密州与苏辙书信中讨论诗学；自言'诗以奇趣为宗，反常合道为趣'。 〔人物：苏辙〕\n  〔来源：李一冰 p20 / 王水照崔铭 p223〕\n\n\n## 乌台诗案 1079\n\n- **1079 元丰二年七月** · 42岁 · 湖州 · *仕途*\n  苏轼到湖州任仅三月，监察御史里行何正臣、舒亶、李定等交章弹劾苏轼诗文'愚弄朝廷'、'指斥乘舆'；诏追摄赴御史台狱。 〔人物：何正臣、舒亶、李定〕\n  〔来源：李一冰 p307 / 王水照崔铭 p124 / 朱刚 p78〕\n\n- **1079 元丰二年七月二十八日** · 42岁 · 湖州→京师 · *贬谪*\n  苏轼被拘，自湖州启程赴京；途中闻诸弟、子由恐受牵连，'魂飞汤火命如丝'。 〔人物：苏辙〕\n  〔来源：李一冰 p312 / 王水照崔铭 p133 / 朱刚 p287〕\n\n- **1079 元丰二年八月十八日** · 42岁 · 京师御史台狱 · *贬谪*\n  苏轼入御史台狱，史称'乌台诗案'。下狱四十三日，讯问二十余次。 〔人物：神宗、李定〕\n  〔来源：李一冰 p312 / 王水照崔铭 p133 / 朱刚 p287〕\n\n- **1079 元丰二年八月** · 42岁 · 京师御史台狱 · *贬谪*\n  王安石虽已罢相，闻讯上书神宗'安有圣世而杀才士者乎'；苏辙乞纳官赎兄罪，贬筠州酒监。 〔人物：王安石、苏辙、神宗〕\n  〔来源：模型知识〕\n\n- **1079 元丰二年十一月** · 42岁 · 京师御史台狱 · *贬谪*\n  御史台定谳：苏轼贬检校水部员外郎、黄州团练副使，本州安置，不得签书公事；神宗从轻发落。 〔人物：神宗〕\n  〔来源：李一冰 p335 / 王水照崔铭 p136 / 朱刚 p17〕\n\n- **1079 元丰二年十二月底** · 42岁 · 京师→黄州 · *贬谪*\n  苏轼出狱，责授黄州团练副使；长子苏迈随行；与王闰之及家人赴贬所；岁暮抵陈州，与苏辙相见。 〔人物：苏辙、王闰之、苏迈〕\n  〔来源：李一冰 p21 / 王水照崔铭 p6〕\n\n\n## 黄州岁月 1080-1084\n\n- **1080 元丰三年二月一日** · 43岁 · 黄州 · *创作*\n  苏轼抵黄州，初寓定惠院；后迁临皋亭；作《初到黄州》。 〔作品：初到黄州〕\n  〔来源：李一冰 p345 / 王水照崔铭 p140 / 林语堂 p200〕\n\n- **1080 元丰三年三月七日** · 43岁 · 黄州 · *创作*\n  沙湖道中遇雨，作《定风波·莫听穿林打叶声》；同行者相顾狼狈，苏轼已不觉。 〔作品：定风波·莫听穿林打叶声〕\n  〔来源：李一冰 p345 / 王水照崔铭 p140 / 林语堂 p200〕\n\n- **1080 元丰三年** · 43岁 · 黄州 · *其他*\n  苏轼生计困窘，友人马正卿请于郡守徐大受，拨州中故营地数十亩，使躬耕以为食。 〔人物：马正卿、徐大受〕\n  〔来源：李一冰 p389 / 王水照崔铭 p155〕\n\n- **1080 元丰三年七月十六日** · 43岁 · 黄州 · *创作*\n  苏轼泛舟赤壁之下，与客论三国周郎赤壁，作《前赤壁赋》；记赤壁之乐与悲。 〔作品：前赤壁赋〕\n  〔来源：李一冰 p1093 / 王水照崔铭 p7 / 朱刚 p8〕\n\n- **1080 元丰三年十月** · 43岁 · 黄州 · *创作*\n  苏轼作《念奴娇·赤壁怀古》（一说作于1082年）；先后完成东坡雪堂建造。 〔作品：念奴娇·赤壁怀古〕\n  〔来源：李一冰 p396 / 王水照崔铭 p7 / 朱刚 p8 / 李一冰 p389 / 王水照崔铭 p155〕\n\n- **1081 元丰四年二月** · 44岁 · 黄州 · *交游*\n  苏轼与潘丙、古耕道、郭遘等访何氏园；东坡雪堂成；自号'东坡居士'。 〔人物：潘丙、古耕道〕\n  〔来源：李一冰 p389 / 王水照崔铭 p155〕\n\n- **1081 元丰四年** · 44岁 · 黄州 · *家庭*\n  王闰之与苏轼在黄州育次子苏迨；长子苏迈远在江西；幼子苏过生。 〔人物：王闰之、苏迨、苏过〕\n  〔来源：李一冰 p389 / 王水照崔铭 p155〕\n\n- **1081 元丰四年** · 44岁 · 黄州 · *创作*\n  作《后赤壁赋》《水龙吟·次韵章质夫杨花词》。 〔作品：后赤壁赋、水龙吟·次韵章质夫杨花词〕 〔人物：章质夫〕\n  〔来源：王水照崔铭 p7〕\n\n- **1082 元丰五年三月** · 45岁 · 黄州 · *创作*\n  苏轼于黄州寒食作《黄州寒食诗帖》；穷而弥坚，与陈慥（季常）交往。 〔作品：黄州寒食诗帖〕 〔人物：陈慥〕\n  〔来源：李一冰 p1093 / 王水照崔铭 p19 / 朱刚 p134 / 李一冰 p114 / 王水照崔铭 p138 / 林语堂 p78〕\n\n- **1082 元丰五年** · 45岁 · 黄州 · *交游*\n  作大量黄州诗文，与王巩、李廌、参寥等唱和。 〔人物：王巩、李廌、参寥〕\n  〔来源：李一冰 p114 / 王水照崔铭 p138 / 林语堂 p78〕\n\n- **1083 元丰六年** · 46岁 · 黄州 · *创作*\n  贬谪黄州第三年；上表请常州居住；神宗未许；作《记承天寺夜游》《临江仙·夜归临皋》。 〔作品：记承天寺夜游、临江仙·夜归临皋〕\n  〔来源：李一冰 p607 / 王水照崔铭 p150〕\n\n- **1084 元丰七年三月** · 47岁 · 黄州 · *贬谪*\n  神宗手札移苏轼汝州团练副使；诏书到，量移常州居住。 〔人物：神宗〕\n  〔来源：李一冰 p466 / 王水照崔铭 p8〕\n\n- **1084 元丰七年四月** · 47岁 · 黄州→筠州 · *贬谪*\n  苏轼离黄州，士民送至百余里外；顺江而下访苏辙于筠州，相处七十余日。 〔人物：苏辙〕\n  〔来源：李一冰 p466 / 王水照崔铭 p8〕\n\n- **1084 元丰七年八月** · 47岁 · 筠州→金陵 · *交游*\n  苏轼别苏辙，过金陵；与退居金陵半山的王安石会面数日，论佛论诗，旧嫌尽释；王安石劝神宗召苏轼还朝。 〔人物：王安石〕\n  〔来源：王水照崔铭 p8〕\n\n- **1084 元丰七年九月** · 47岁 · 金陵→常州 · *贬谪*\n  苏轼至真州、扬州、常州；元丰八年春抵常州。\n  〔来源：李一冰 p466 / 王水照崔铭 p8〕\n\n- **1080 元丰三年（续）** · 43岁 · 黄州 · *交游*\n  苏轼初到黄州，醉中作诗寄王定国；与潘丙、潘大临、王齐万等交往。 〔人物：王巩、潘大临〕\n  〔来源：李一冰 p389 / 王水照崔铭 p155〕\n\n- **1081 元丰四年（续）** · 44岁 · 黄州 · *交游*\n  苏轼教苏迈、苏迨读书；与黄州教授朱寿昌交往，议救母事。 〔人物：苏迈、朱寿昌〕\n  〔来源：李一冰 p389 / 王水照崔铭 p155〕\n\n- **1082 元丰五年（续）** · 45岁 · 黄州 · *交游*\n  苏轼与黄州守徐大受、徐大正叔侄交往；得到多方接济。 〔人物：徐大受、徐大正〕\n  〔来源：李一冰 p389 / 王水照崔铭 p155〕\n\n- **1083 元丰六年（续）** · 46岁 · 黄州 · *交游*\n  苏轼与黄州太守杨采、临皋亭主刘监酒等交往；时东坡稻田已能自给。 〔人物：杨采〕\n  〔来源：李一冰 p389 / 王水照崔铭 p155〕\n\n- **1084 元丰七年三月（续）** · 47岁 · 黄州 · *创作*\n  苏轼将黄州所得陶渊明集赠苏辙；作《归去来兮辞》题跋。 〔人物：苏辙〕\n  〔来源：李一冰 p466 / 王水照崔铭 p8〕\n\n\n## 元祐还朝 1085-1089\n\n- **1085 元丰八年三月** · 48岁 · 常州→京师 · *仕途*\n  神宗崩，哲宗即位，年十岁，太皇太后高氏垂帘听政；苏轼起复朝官，任登州军州事。 〔人物：神宗、高太后、哲宗〕\n  〔来源：模型知识〕\n\n- **1085 元丰八年十月** · 48岁 · 京师 · *仕途*\n  苏轼由登州入朝，授礼部郎中；十二月起任起居舍人。\n  〔来源：李一冰 p514 / 王水照崔铭 p25 / 朱刚 p19〕\n\n- **1086 元祐元年二月** · 49岁 · 京师 · *其他*\n  王安石卒于金陵，年六十六；苏轼作挽诗，深惜'千载而下'之伤。 〔人物：王安石〕\n  〔来源：李一冰 p306 / 王水照崔铭 p50 / 朱刚 p17〕\n\n- **1086 元祐元年** · 49岁 · 京师 · *仕途*\n  苏轼任中书舍人，迁翰林学士、知制诰；草诏深得高太后'名相材'评。 〔人物：高太后〕\n  〔来源：李一冰 p514 / 王水照崔铭 p25 / 朱刚 p19〕\n\n- **1086 元祐元年** · 49岁 · 京师 · *交游*\n  苏轼与司马光、吕公著等旧党同朝；与程颐因'洛蜀党争'生嫌隙。 〔人物：司马光、程颐、吕公著〕\n  〔来源：李一冰 p519 / 王水照崔铭 p255 / 朱刚 p253〕\n\n- **1087 元祐二年** · 50岁 · 京师 · *仕途*\n  苏轼兼侍读；与范祖禹等议役法与差役利害；与苏辙同居京邸。 〔人物：范祖禹、苏辙〕\n  〔来源：王水照崔铭 p119 / 朱刚 p146〕\n\n- **1087 元祐二年** · 50岁 · 京师 · *创作*\n  与黄庭坚、张耒、晁补之、秦观'苏门四学士'交往最密；作《东坡志林》大量篇章。 〔作品：东坡志林〕 〔人物：黄庭坚、张耒、晁补之、秦观〕\n  〔来源：王水照崔铭 p119 / 朱刚 p146〕\n\n- **1088 元祐三年** · 51岁 · 京师 · *家庭*\n  苏轼累官至翰林学士承旨；与苏辙同住；三月妻王闰之染疫卒于京师，年四十六。 〔人物：王闰之、苏辙〕\n  〔来源：李一冰 p1076 / 王水照崔铭 p66〕\n\n- **1088 元祐三年** · 51岁 · 京师 · *仕途*\n  苏轼自请外任以避党争；诏以翰林学士承旨出知杭州。\n  〔来源：李一冰 p514 / 王水照崔铭 p25 / 朱刚 p19〕\n\n- **1085 元丰八年（续）** · 48岁 · 京师 · *仕途*\n  苏轼入朝不久即上书论'国家之所以存亡者，在道德之浅深'，言新法之弊。 〔人物：高太后〕\n  〔来源：李一冰 p514 / 王水照崔铭 p25 / 朱刚 p19〕\n\n- **1086 元祐元年（续）** · 49岁 · 京师 · *仕途*\n  苏轼充学士院试主考官；与曾巩、范祖禹议役法；与曾布、吕惠卿对立。 〔人物：曾巩、范祖禹、曾布〕\n  〔来源：李一冰 p514 / 王水照崔铭 p25 / 朱刚 p19〕\n\n- **1087 元祐二年（续）** · 50岁 · 京师 · *仕途*\n  苏轼主持礼部进士试；与陈师道、张耒等交往最密。 〔人物：陈师道、张耒〕\n  〔来源：王水照崔铭 p119 / 朱刚 p146〕\n\n- **1088 元祐三年（续）** · 51岁 · 京师 · *仕途*\n  苏轼以龙图阁学士知杭州；与贾易、韩川、赵君锡等论政；与苏辙连床夜话。 〔人物：苏辙、贾易〕\n  〔来源：李一冰 p1076 / 王水照崔铭 p66〕\n\n\n## 再莅东南 1089-1093\n\n- **1089 元祐四年三月** · 52岁 · 京师→杭州 · *仕途*\n  苏轼出知杭州，兼浙西路兵马钤辖；离京时与苏辙、范祖禹等赠诗。 〔人物：苏辙、范祖禹〕\n  〔来源：李一冰 p663 / 王水照崔铭 p264 / 林语堂 p141〕\n\n- **1089 元祐四年七月** · 52岁 · 杭州 · *仕途*\n  苏轼到杭州，时值大旱，饥疫并作；疏浚茅山、盐桥二河以通漕；赈济灾民。\n  〔来源：李一冰 p663 / 王水照崔铭 p264 / 林语堂 p141〕\n\n- **1089 元祐四年** · 52岁 · 杭州 · *其他*\n  苏轼于西湖筑'苏堤'；与西湖住持惠净、辩才、参寥等交往。 〔人物：辩才、参寥〕\n  〔来源：李一冰 p663 / 王水照崔铭 p264 / 林语堂 p141〕\n\n- **1090 元祐五年** · 53岁 · 杭州 · *仕途*\n  苏轼再至杭州，整治六井、解盐；与张耒、陈师道唱和。 〔人物：张耒、陈师道〕\n  〔来源：李一冰 p663 / 王水照崔铭 p264 / 林语堂 p141〕\n\n- **1091 元祐六年** · 54岁 · 杭州 · *仕途*\n  苏轼被召为吏部尚书，未到任即改翰林学士承旨；未几又以龙图阁学士出知颍州。\n  〔来源：李一冰 p50 / 王水照崔铭 p260〕\n\n- **1091 元祐六年** · 54岁 · 颍州 · *仕途*\n  苏轼到颍州仅六月，开西湖、赈饥民；旋改知扬州。\n  〔来源：李一冰 p50 / 王水照崔铭 p260〕\n\n- **1092 元祐七年** · 55岁 · 扬州 · *创作*\n  苏轼知扬州；与苏辙弟子由书信频繁；作《和子由渑池怀旧》新韵诸篇。 〔人物：苏辙〕\n  〔来源：李一冰 p300 / 王水照崔铭 p277 / 林语堂 p291〕\n\n- **1093 元祐八年** · 56岁 · 扬州→定州 · *仕途*\n  苏轼改知定州；六月抵任，整军治政。\n  〔来源：李一冰 p806 / 王水照崔铭 p282〕\n\n- **1093 元祐九年（绍圣元年）** · 56岁 · 定州 · *贬谪*\n  九月太皇太后高氏崩；哲宗亲政，起用新党章惇、蔡卞；苏轼落龙图阁学士，降一官。 〔人物：章惇、蔡卞、哲宗〕\n  〔来源：模型知识〕\n\n- **1089 元祐四年（续）** · 52岁 · 杭州 · *其他*\n  苏轼于杭州赈济饥疫；设病坊救治；与道士陈令举、僧人仲殊游。 〔人物：陈令举、仲殊〕\n  〔来源：李一冰 p663 / 王水照崔铭 p264 / 林语堂 p141〕\n\n- **1090 元祐五年（续）** · 53岁 · 杭州 · *创作*\n  苏轼于杭州与诗僧参寥子、仲殊结社唱和；作《书参寥诗》。 〔作品：书参寥诗〕 〔人物：参寥〕\n  〔来源：李一冰 p663 / 王水照崔铭 p264 / 林语堂 p141〕\n\n- **1091 元祐六年（续）** · 54岁 · 颍州 · *仕途*\n  苏轼知颍州，疏浚颍州西湖；将所收常平米减价赈济灾民。\n  〔来源：李一冰 p50 / 王水照崔铭 p260〕\n\n- **1092 元祐七年（续）** · 55岁 · 扬州 · *交游*\n  苏轼于扬州修万松亭；与米芾书论书；与刘泾、吴复古交往。 〔人物：米芾、刘泾、吴复古〕\n  〔来源：李一冰 p300 / 王水照崔铭 p277 / 林语堂 p291〕\n\n- **1093 元祐八年（续）** · 56岁 · 定州 · *创作*\n  苏轼整军修政；在定州北岳庙刻石作《中山松醪赋》；与韩琦旧部将佐交往。 〔作品：中山松醪赋〕 〔人物：韩琦〕\n  〔来源：李一冰 p806 / 王水照崔铭 p282〕\n\n- **1093 绍圣元年** · 56岁 · 定州 · *贬谪*\n  新党章惇、蔡卞掌政；苏轼落两官，贬英州；与王闰之相伴离定州。 〔人物：章惇、蔡卞、王闰之〕\n  〔来源：李一冰 p827 / 王水照崔铭 p285 / 朱刚 p22〕\n\n\n## 惠州 1094-1097\n\n- **1094 绍圣元年四月** · 57岁 · 定州→京师 · *贬谪*\n  苏轼落两官，责知英州；六月至京师受谪命，贬惠州安置；与苏辙别于京师。 〔人物：苏辙、章惇〕\n  〔来源：李一冰 p827 / 王水照崔铭 p285 / 朱刚 p22〕\n\n- **1094 绍圣元年十月** · 57岁 · 京师→惠州 · *贬谪*\n  苏轼率家人南下，过金陵、当涂、芜湖、虔州；跋涉数千里；岁暮抵惠州。\n  〔来源：李一冰 p838 / 王水照崔铭 p10 / 林语堂 p304〕\n\n- **1095 绍圣二年三月** · 58岁 · 惠州 · *交游*\n  苏轼初寓合江楼；后迁嘉祐寺；与惠州本土士人翟逢亨、林行婆等交往；学道求医。 〔人物：翟逢亨、林行婆〕\n  〔来源：李一冰 p857 / 王水照崔铭 p293 / 林语堂 p307〕\n\n- **1095 绍圣二年** · 58岁 · 惠州 · *创作*\n  苏轼作《惠州一绝》'日啖荔枝三百颗，不辞长作岭南人'；与长子苏迈通讯以诗。 〔作品：惠州一绝〕 〔人物：苏迈〕\n  〔来源：李一冰 p887 / 王水照崔铭 p292〕\n\n- **1096 绍圣三年** · 59岁 · 惠州 · *其他*\n  苏轼于惠州白鹤峰新居落成；长子苏迈、次子苏迨、三子苏过随侍；家贫而安。 〔人物：苏迈、苏迨、苏过〕\n  〔来源：李一冰 p877 / 王水照崔铭 p298〕\n\n- **1096 绍圣三年** · 59岁 · 惠州 · *创作*\n  作《和陶渊明诗》百余首；与表兄程正辅书信往还。 〔作品：和陶诗〕 〔人物：程正辅〕\n  〔来源：李一冰 p23 / 王水照崔铭 p280 / 林语堂 p333〕\n\n- **1094 绍圣元年（续）** · 57岁 · 京师→ · *创作*\n  苏轼过金陵时访王安石之墓未遇；经当涂访李白墓，作《李太白诗后》。 〔人物：王安石、李白〕\n  〔来源：李一冰 p838 / 王水照崔铭 p10 / 林语堂 p304〕\n\n- **1095 绍圣二年（续）** · 58岁 · 惠州 · *交游*\n  苏轼于惠州与程正辅书信论政；与惠州太守詹范、循州守张勋交往。 〔人物：程正辅、詹范〕\n  〔来源：李一冰 p857 / 王水照崔铭 p293 / 林语堂 p307〕\n\n- **1096 绍圣三年（续）** · 59岁 · 惠州 · *家庭*\n  苏轼长子苏迈自德兴来惠州省亲；与苏过讨论诗文；时苏迨亦来。 〔人物：苏迈、苏过、苏迨〕\n  〔来源：李一冰 p877 / 王水照崔铭 p298〕\n\n\n## 儋州 1097-1100\n\n- **1097 绍圣四年二月** · 60岁 · 惠州→ · *贬谪*\n  苏轼再贬琼州别驾、昌化军安置；四月离惠州，与幼子苏过渡海。 〔人物：苏过、章惇〕\n  〔来源：李一冰 p919 / 王水照崔铭 p10 / 朱刚 p22〕\n\n- **1097 绍圣四年七月十三日** · 60岁 · 儋州 · *贬谪*\n  苏轼抵儋州（昌化军），初寓官舍；后被逐；筑'桄榔庵'于城南。\n  〔来源：李一冰 p945 / 王水照崔铭 p313〕\n\n- **1097 绍圣四年** · 60岁 · 儋州 · *交游*\n  苏轼与儋州军使张中、黎族士人交往；于桄榔庵教授生徒，著书立说。 〔人物：张中〕\n  〔来源：李一冰 p945 / 王水照崔铭 p313〕\n\n- **1098 元符元年** · 61岁 · 儋州 · *创作*\n  苏轼于儋州生活困顿，自种甘薯；与当地士子姜唐佐等交往；题诗'沧海何曾断地脉，珠崖从此破天荒'。 〔人物：姜唐佐〕\n  〔来源：李一冰 p607 / 王水照崔铭 p35 / 朱刚 p46〕\n\n- **1099 元符二年** · 62岁 · 儋州 · *创作*\n  苏轼贬所生活六年；著《东坡志林》完成于海南；作《试院煎茶》《被酒独行》等。 〔作品：东坡志林〕\n  〔来源：李一冰 p389 / 王水照崔铭 p155〕\n\n- **1097 绍圣四年四月** · 60岁 · 惠州→ · *贬谪*\n  苏轼父子渡琼州海峡；遇大风，几覆舟，得渡至海南。 〔人物：苏过〕\n  〔来源：李一冰 p919 / 王水照崔铭 p10 / 朱刚 p22〕\n\n- **1098 元符元年（续）** · 61岁 · 儋州 · *交游*\n  苏轼与海南黎族首领黎子云交往；于桄榔庵收姜唐佐、符林等为弟子。 〔人物：黎子云、姜唐佐、符林〕\n  〔来源：李一冰 p607 / 王水照崔铭 p35 / 朱刚 p46〕\n\n- **1099 元符二年（续）** · 62岁 · 儋州 · *创作*\n  苏轼撰《书传》（即《东坡书传》）于儋州；阐发《尚书》义理。 〔作品：东坡书传〕\n  〔来源：李一冰 p389 / 王水照崔铭 p155〕\n\n\n## 北归与病逝 1100-1101\n\n- **1100 元符三年正月** · 63岁 · 儋州 · *贬谪*\n  哲宗崩，徽宗即位；五月诏苏轼量移廉州；六月渡海北归。 〔人物：徽宗、哲宗〕\n  〔来源：李一冰 p975 / 王水照崔铭 p325〕\n\n- **1100 元符三年七月** · 63岁 · 廉州→永州 · *交游*\n  苏轼北归，过雷州半岛，与秦观相会于海康；秦观不久卒于藤州。 〔人物：秦观〕\n  〔来源：李一冰 p924 / 王水照崔铭 p307〕\n\n- **1100 元符三年九月** · 63岁 · 永州→长沙 · *其他*\n  苏轼继续北归；至永州、长沙；十一月至虔州。\n  〔来源：李一冰 p924 / 王水照崔铭 p307 / 李一冰 p975 / 王水照崔铭 p325〕\n\n- **1101 建中靖国元年正月** · 64岁 · 虔州→金陵 · *交游*\n  苏轼抵虔州，作《归去来兮辞》题跋；正月北行至金陵，与王安石之子王雱等故交相遇。 〔人物：王雱〕\n  〔来源：王水照崔铭 p8〕\n\n- **1101 建中靖国元年五月** · 64岁 · 常州 · *其他*\n  苏轼病甚，暑毒发作，暴下不止；自书'岭南万里不能归'。\n  〔来源：李一冰 p1027 / 王水照崔铭 p337〕\n\n- **1101 建中靖国元年六月二十日** · 64岁 · 常州孙氏馆 · *其他*\n  苏轼于常州孙氏馆卧病；与米芾、李惟熙等友书；诀别钱世雄，付以身后事。 〔人物：钱世雄、米芾〕\n  〔来源：李一冰 p335 / 王水照崔铭 p340 / 林语堂 p308〕\n\n- **1101 建中靖国元年七月二十八日** · 64岁 · 常州孙氏馆 · *其他*\n  苏轼卒于常州顾塘桥孙氏馆，年六十六；遗嘱葬汝州。 〔作品：自题金山画像〕\n  〔来源：李一冰 p1027 / 王水照崔铭 p337〕\n\n- **1101 建中靖国元年八月** · 64岁 · 常州→汝州 · *家庭*\n  苏辙扶轼灵柩北行；至颍昌，遵遗嘱葬苏轼于汝州郏城钓台乡上瑞里嵩阳小峨眉山。 〔人物：苏辙〕\n  〔来源：李一冰 p799 / 朱刚 p332〕\n\n- **1100 元符三年** · 63岁 · 儋州 · *创作*\n  徽宗即位大赦；苏轼量移廉州，途经琼州，作《和陶止酒》。 〔作品：和陶止酒〕 〔人物：徽宗〕\n  〔来源：李一冰 p975 / 王水照崔铭 p325 / 李一冰 p23 / 王水照崔铭 p280 / 林语堂 p333〕\n\n- **1100 建中靖国元年前** · 63岁 · 雷州 · *家庭*\n  苏轼过雷州与谪琼州别驾、廉州安置的苏辙会面；兄弟同住月余。 〔人物：苏辙〕\n  〔来源：李一冰 p924 / 王水照崔铭 p307〕\n\n- **1101 建中靖国元年四月** · 64岁 · 金山 · *创作*\n  苏轼于金山寺题诗于李公麟所绘其像，作《自题金山画像》。 〔作品：自题金山画像〕 〔人物：李公麟〕\n  〔来源：李一冰 p799 / 朱刚 p332〕\n\n- **1101 建中靖国元年五月** · 64岁 · 常州 · *其他*\n  苏轼病中与黄庭坚书，托以身后文事；与杭州故旧书告别。 〔人物：黄庭坚〕\n  〔来源：李一冰 p1027 / 王水照崔铭 p337 / 李一冰 p335 / 王水照崔铭 p340 / 林语堂 p308〕\n\n- **1101 建中靖国元年六月** · 64岁 · 常州 · *其他*\n  苏轼临终前三日，书《答径山琳长老》；与家人诀别。 〔人物：径山琳长老〕\n  〔来源：李一冰 p335 / 王水照崔铭 p340 / 林语堂 p308〕\n\n- **1101 建中靖国元年** · 64岁 · 常州 · *其他*\n  苏轼卒后，苏辙、钱世雄等编《东坡前集》《东坡后集》；宋徽宗赐谥'文忠'。 〔人物：苏辙、钱世雄、宋徽宗〕\n  〔来源：李一冰 p799 / 朱刚 p332 / 李一冰 p335 / 王水照崔铭 p340 / 林语堂 p308〕\n\n- **1101 建中靖国元年末** · 64岁 · 汝州郏城 · *家庭*\n  苏辙奉遗嘱安葬苏轼于汝州郏城钓台乡上瑞里；苏辙撰《亡兄子瞻端明墓志铭》。 〔作品：亡兄子瞻端明墓志铭〕 〔人物：苏辙〕\n  〔来源：李一冰 p799 / 朱刚 p332〕\n\n\n## 溯源统计\n\n- 总事件数：**136** 条\n\n- 标记 [模型知识]（查不到精确页码）的事件数：\n\n  **8**\n\n- 各书引用次数（按书聚合）：\n\n| 来源 | 引用次数 |\n|---|---|\n| 李一冰（各页） | 125 |\n| 王水照崔铭（各页） | 124 |\n| 朱刚（各页） | 40 |\n| 林语堂（各页） | 38 |\n| [模型知识] | 8 |";
