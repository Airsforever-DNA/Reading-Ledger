const MD = "# 宋史·苏轼传\n\n> 本文件为\"苏轼知识工程\"网络采集产物，采集时间：2026-09-29\n> 来源：Wikisource https://zh.wikisource.org/wiki/宋史/卷338\n> 说明：Wikisource 宋史/卷338 为节选本（非完整原始文献），已如实标注\n\n---\n\n## 苏轼传（宋史·卷三百三十八）\n\n### 人物简介\n\n苏轼（1037-1101），字子瞻，眉州眉山人，北宋著名文学家、政治家，与其弟苏辙并称\"苏辙\"，与父苏洵合称\"三苏\"。\n\n### 早年求学\n\n苏轼十岁时，父亲苏洵外出游学，母亲程氏亲自教授他读书。程氏读《范滂传》时感慨，苏轼表示愿为范滂，程氏回应：\"汝能为滂，吾顾不能为滂母邪？\"\n\n### 进士及第\n\n嘉祐二年（1057年），苏轼参加礼部考试，撰写《刑赏忠厚论》，主考官欧阳修惊喜，欲擢为第一，疑为曾巩所作，置第二。后在《春秋》对义中获第一，殿试中乙科。欧阳修曾说：\"吾当避此人出一头地。\"\n\n### 仕途经历\n\n- 大理评事、签书凤翔府判官\n- 判登闻鼓院\n- 直史馆\n- 权开封府推官\n- 通判杭州\n- 知密州\n- 知徐州\n- 知湖州\n- 龙图阁学士、知杭州\n- 翰林学士\n- 礼部尚书\n\n### 政治立场\n\n苏轼反对王安石新法，多次上书批评。他提出\"结人心，厚风俗，存纪纲\"三策，认为改革过快会危害国家。他因诗托讽，被御史李定、舒亶等弹劾，以讪谤罪入狱，后被贬为黄州团练副使。\n\n### 政绩卓著\n\n**徐州抗洪**：黄河决口曹村，苏轼率民抗洪，城得保全。\n\n**杭州治理**：苏轼任杭州知州时，解决供水问题，疏浚西湖，筑苏公堤，救荒防疫，政绩卓著，杭州人民为其建生祠。\n\n**其他事迹**：在定州整军，在惠州、儋州等地传播文化。\n\n### 流放岁月\n\n- 黄州团练副使（1080-1084）\n- 惠州安置（1094-1097）\n- 琼州别驾、昌化军安置（1097-1100）\n- 儋州：在此地\"著书以为乐\"\n\n### 晚年与去世\n\n徽宗立后获赦，复朝奉郎。建中靖国元年（1101年）卒于常州，年六十六。\n\n### 文学成就\n\n苏轼是北宋文学巨匠，散文、诗、词、书法均有极高成就。他自谓：\"作文如行云流水，初无定质，但常行于所当行，止于所不可不止。\"\n\n著作包括：\n- 《东坡集》四十卷\n- 《后集》二十卷\n- 《奏议》十五卷\n- 《易传》《论语说》《书传》等\n\n### 历史评价\n\n论曰：苏轼\"器识之闳伟，议论之卓荦，文章之雄雋，政事之精明，四者皆能以特立之志为之主，而以迈往之气辅之。\"\n\n高宗时赠资政殿学士，崇赠太师，谥\"文忠\"。\n\n### 儿子苏过\n\n苏过（1072-1123），字叔党，苏轼幼子。随父流放惠州、儋州，侍奉父亲。苏轼卒后，葬父于汝州郏城小峨眉山，居家颍昌，营湖阴水竹数亩，名曰\"小斜川\"，自号\"斜川居士\"。有《斜川集》二十卷。\n\n---\n\n## 数据说明\n\n- **Wikisource 宋史/卷338 为节选本**，非《宋史》原文全文\n- 完整《宋史·苏轼传》原文收录于《宋史》卷三百三十八，需查阅中华书局点校本或其他完整版本\n- 本文件依据 Wikisource 节选本如实录入\n\n**来源**：https://zh.wikisource.org/wiki/宋史/卷338\n**采集时间**：2026-09-29\n";
