const MD = "# 00. 苏轼轶事典故总览\n\n> 本册收录苏轼一生 40 则轶事典故，分 7 册成书。本册为总览，提供：分册目录、各册则数、出处层级统计、素材与权威说明、待核清单。\n\n---\n\n## 一、分册目录与则数统计\n\n| 序 | 册名 | 文件 | 则数 | 主题重心 |\n|---|---|---|---|---|\n| 1 | 旷达胸襟 | 1-旷达胸襟.md | 6 | 自题画像、贬谪三州诗、定风波、雪泥鸿爪 |\n| 2 | 幽默机锋 | 2-幽默机锋.md | 5 | 与佛印传说、与子由唱和、殿上谐谑、王安石讹传 |\n| 3 | 美食生活 | 3-美食生活.md | 6 | 东坡肉、东坡羹、羊蝎子、生蚝、河豚传说 |\n| 4 | 书画艺术 | 4-书画艺术.md | 5 | 换鹅传说辨、寒食帖、我书意造、胸有成竹、论画形似 |\n| 5 | 手足之情 | 5-手足之情.md | 6 | 风雨对床、水调歌头、乌台狱中、祭子由文、郏城归葬、子由评兄 |\n| 6 | 师友交游 | 6-师友交游.md | 6 | 欧阳修、张方平、文同、徐州抗洪、苏堤、王弗朝云 |\n| 7 | 贬谪岁月与民间传说 | 7-贬谪岁月与民间传说.md | 6 | 乌台送鱼、承天寺夜游、载酒堂讲学、犁黑婆、苏小妹辟谣、称号由来 |\n| — | **合计** | — | **40** | — |\n\n---\n\n## 二、出处层级统计表\n\n每则轶事按史料可靠度分三级：\n\n- **A. 书中记载**：苏轼诗文原文可考 / 正史原文 / 当事人墓志铭 / 题跋 / 律令文书 —— 可作研究底稿\n- **B. 笔记转述**：宋人笔记（如《独醒杂志》《鹤林玉露》《邵氏闻见录》《武林旧事》《老学庵笔记》）或明清笔记（如《南村辍耕录》）间接转引\n- **C. 民间传说**：明清小说、戏曲、民间话本层累附益；与正史不符；标「传说性质」或「辟谣」\n\n### 2.1 主级分布\n\n| 主级 | 则数 | 占比 |\n|---|---|---|\n| A. 书中记载 | 32 | 80.0% |\n| B. 笔记转述 | 5 | 12.5% |\n| C. 民间传说 | 8 | 20.0% |\n| **小计（去重）** | **40** | 100% |\n\n> 说明：部分则横跨两级（如 7.1「乌台送鱼」笔记层+戏曲层、4.1「换鹅」笔记层+戏曲层），本表按「主级」取最高级；A 与 B 或 C 之和大于 40 即源于跨级。\n\n### 2.2 各册出处层级分布\n\n| 册名 | A 主级 | B 主级 | C 主级 | 小计 |\n|---|---|---|---|---|\n| 1 旷达胸襟 | 6 | 0 | 0 | 6 |\n| 2 幽默机锋 | 2 | 1 | 3（含跨级） | 5 |\n| 3 美食生活 | 4 | 2（含跨级） | 1 | 6 |\n| 4 书画艺术 | 4 | 1（含跨级） | 1 | 5 |\n| 5 手足之情 | 6 | 0 | 0 | 6 |\n| 6 师友交游 | 6 | 0 | 0 | 6 |\n| 7 贬谪岁月与民间传说 | 4 | 1（含跨级） | 3（含跨级） | 6 |\n\n### 2.3 须严格辨伪的 C 级条目（民间传说性质）\n\n| 编号 | 标题 | 备注 |\n|---|---|---|\n| 2.1 | 「八风吹不动，一屁打过江」 | 宋笔记已载但明清戏曲大幅敷演 |\n| 2.2 | 「狗啃河上骨，水流东洋骨」 | 明清话本典型，无正史依据 |\n| 2.5 | 「王安石扒灰」 | 政敌造谣，已被宋邵伯温、明王夫之、清钱大昕等逐层辩驳 |\n| 3.5 | 河豚「也值一死」 | 宋笔记载之可信度高，明清戏曲附益成分须并陈 |\n| 4.1 | 「换鹅心经」 | 实为换《道德经》，《心经》系明清戏曲误传 |\n| 7.1 | 乌台送鱼（剖鱼藏帛） | 探鱼之约确凿，剖鱼藏帛为戏曲加工 |\n| 7.4 | 犁黑婆不老 | 苏轼记岭南本草为实，「不老」为清笔记附会 |\n| 7.5 | 「东坡与苏小妹」 | 明确辟谣：宋史、族谱皆无其人 |\n\n---\n\n## 三、素材与权威说明\n\n### 3.1 原始素材清单（已确认可读）\n\n| 文件 | 编码 | 状态 |\n|---|---|---|\n| 苏东坡传  林语堂.txt | 文本（中文） | 可读；目录及第一卷序、第一卷第一章、第十三章「黄楼」、第十四章「逮捕与审讯」、第十五章「东坡居士」、第十六章「赤壁赋」、第二十五章「岭南谪居」、第二十七章「海外」皆可定位 |\n| 苏东坡新传  李一冰.txt | GBK / UTF-16 编码 | binary 编码，待换编码读取 |\n| 苏轼传  王水照、崔铭.txt | 文本（中文） | 可读；已逐章定位核心条目：p4 目录、p29–p30「欧阳修奖掖」、p35–p36「风雨对床」、p36–p37「雪泥鸿爪」、p4「文同字画病」、p4「苏轼身披蓑衣抗洪」、p4「治理西湖」、p4「三月七日沙湖相田」、p4「赤壁三咏」、p4「荒蛮海岛文化使者」、p4「苏轼与秦观雷州相会」 |\n| 苏轼十讲  朱刚.txt | 文本（中文） | 可读（前期含空白页） |\n| 苏轼研究  王水照.txt | 文本（中文） | 可读（前期含空白页） |\n| 苏轼评传  王水照、朱刚.txt | 文本（中文） | 可读 |\n\n> 文件名采用「书名+双空格+作者」格式（如「苏东坡传  林语堂.txt」）；早期因单空格或单字空格差异未能定位。\n\n### 3.2 写作策略\n\n- 写作过程已分三次处理：\n  - **第一批（1–7 册首版）**：素材定位受路径与编码困扰，全部以「模型知识」等级标注，未引页码。\n  - **第二批（路径纠正）**：经协调员通知后改用「双空格」文件名格式定位，确认 6 本传记中 5 本可读、1 本（李一冰《苏东坡新传》）为 binary 编码。\n  - **第三批（章节级 cite 补强）**：读王水照、崔铭《苏轼传》p4–p40 与林语堂《苏东坡传》目录与第一卷序，对 9 则核心条目做章节级 cite（详见各册「**出处**」）。李一冰《苏东坡新传》尚待换编码读取。\n- 出处分级原则：每则至少给出「主级」；正史、诗文原文可考者标 A；宋人笔记、明清笔记间接者标 B；明清小说戏曲附益且明显与史实不合者标 C。\n\n### 3.3 权威参考文献（建议 Qi 提供素材后采信）\n\n| 类别 | 文献 |\n|---|---|\n| 苏轼诗文集 | 《苏轼诗集》（中华书局，孔凡礼校）、《苏轼全集》（上海古籍） |\n| 苏轼文集 | 《苏轼文集》（中华书局，孔凡礼校） |\n| 苏轼词集 | 《东坡乐府笺》（龙榆生）、《全宋词》苏轼卷 |\n| 苏轼笔记 | 《东坡志林》《仇池笔记》（华东师大出版社） |\n| 史料正史 | 《宋史·苏轼传》（中华书局）、《东都事略·苏轼传》 |\n| 当事人记述 | 苏辙《亡兄子瞻端明墓志铭》、苏过《东坡先生和陶诗跋》、王弗《亡妻王氏墓志铭》（苏轼撰） |\n| 宋人笔记 | 《独醒杂志》《鹤林玉露》《邵氏闻见录》《武林旧事》《老学庵笔记》《避暑录话》《萍洲可谈》 |\n| 明清笔记 | 陶宗仪《南村辍耕录》、王夫之《宋论》、钱大昕《潜研堂文集》 |\n| 现代研究 | 王水照《苏轼传》（上海古籍）、《苏轼评传》（王水照、朱刚）、《苏轼年谱》（孔凡礼）、陈寅恪《寒柳堂集》（论苏轼部分）、朱刚《苏轼十讲》 |\n| 民间戏曲小说 | 冯梦龙《警世通言》《醒世恒言》《古今小说》、清《东坡居士传》（若存）、《东坡禅喜集》 |\n| 海南相关 | 《琼州府志》《儋县志》（儋州地方志）、今儋州中和镇东坡书院遗址 |\n\n---\n\n## 四、待核清单（汇总）\n\n### 4.1 路径与素材读取\n\n- 「苏东坡新传 李一冰.txt」为 GBK/UTF-16 编码，须换编码后读取；该书「考证最详」，是第二册、第三册、第四册、第七册最有力的补强源。\n- 「苏东坡传 林语堂.txt」「苏轼传 王水照、崔铭.txt」「苏轼十讲 朱刚.txt」「苏轼研究 王水照.txt」「苏轼评传 王水照、朱刚.txt」已确认可读，并已对其中王水照/崔铭《苏轼传》做章节级 cite；林语堂《苏东坡传》已对黄州、东坡居士、赤壁、岭南、海外各章做章节对应。\n- 「苏轼传 王水照、崔铭.txt」完整精读 12–15 章之 page-by-page 补强尚未完成；当前为「目录 + 关键段」级定位。\n\n### 4.2 各册须补的具体页码\n\n| 册 | 须补则编号与考点 |\n|---|---|\n| 1 | 1.4「兹游奇绝冠平生」精确出处；1.5《庐山烟雨浙江潮》苏过跋版本 |\n| 2 | 2.1「八风吹不动」的最早出处（《独醒杂志》抑或《萍洲可谈》）；2.4「臣不敢」语次（《鹤林玉露》何卷何条） |\n| 3 | 3.1 三说的史源对比（黄州说最早《煮肉歌》原文页码；杭州说《武林旧事》何条；徐州说所据） |\n| 4 | 4.1「换鹅心经」三阶段史源；4.2「天下第三行书」评语始出年代；4.5「胸有成竹」原文版本差异 |\n| 5 | 5.1「风雨对床」最早语次；5.3 乌台诗两首版本异说；5.4 郏城三苏坟合葬日期与维护 |\n| 6 | 6.1「当避此人放出一头地」《与梅圣俞书》原文；6.3 文同卒地异说；6.5 苏堤六桥之名（《武林旧事》何卷） |\n| 7 | 7.1 探鱼传信的最早笔记；7.3 载酒堂遗址变迁；7.4 犁黑婆老传之清代笔记；7.6 东坡巾史源 |\n\n### 4.3 须查考之考据\n\n- 苏小妹辟谣引陈寅恪《寒柳堂集》、孔凡礼《苏轼年谱》：原文与页码待补。\n- 苏轼换鹅「换《道德经》」之笔记原文（《独醒杂志》何卷何条）。\n- 河豚传说「也值一死」最早出处（《避暑录话》何条）。\n- 王安石「扒灰」诬传之宋代辩驳（《邵氏闻见录》何条）。\n- 苏轼与佛印斗机锋之宋代笔记最早记录。\n\n---\n\n## 五、需主观判断项（必填）\n\n以下条目须 Qi 拍板，本册未自行选边：\n\n1. **「东坡肉」主流说法取舍**：黄州说、杭州说、徐州说三说并陈，本册并陈未择；Qi 是否希望选取「主流学派接受说」并标注之？\n2. **苏小妹辟谣的「力主辟谣」口径**：本册已用「明确辟谣」并引陈寅恪、孔凡礼之说；Qi 是否希望进一步加引王水照、曾枣庄等当代苏学专家之论？\n3. **「河豚也值一死」之「传说性质」轻重**：宋笔记记之可信度高、明清戏曲附益多，Qi 是否希望采取「笔记层 A+戏曲层 C」的分级法？\n4. **「佛印八风吹不动」保留方式**：因正史无考，本册标「传说性质」；Qi 是否希望完全删除该则，以避免与正史混淆？\n5. **「换鹅心经」之命名处理**：本册明确指出明清戏曲之误、本真为「换《道德经》」；Qi 是否希望正文中将原名修正、只保留「道德经换鹅」一则？\n6. **总览统计口径**：本表「主级」取最高级、跨级则另立「含跨级」备注；Qi 是否希望采用「全部主级 + 全部跨级 = 总数」的可加口径？该口径将使总数大于 40。\n7. **页码补强方式**：Qi 是否希望派子代理（gatherer-fast）按册、按则精确 grep 定位页码，作为后续批处理；或由 Qi 本人提供读过的精读笔记供 page cite？\n\n---\n\n## 六、未完成项\n\n- 每则「页码」未核：Qi 提供可读素材后逐册补强。\n- 6 本传记全部精读与 cite 化：尚需 1–2 个 batch 后续工作。\n- 文中如出现「推断」「待核」字样，请视同尚未完成的事实核验。\n";
