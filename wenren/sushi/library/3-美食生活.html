const MD = "# 3. 美食生活\n\n> 苏轼非徒以诗文名世，亦以「知味」传家。本册六则：东坡肉来历诸说并存，东坡羹有自序，羊脊骨与生蚝入家书自述，河豚「也值一死」一语盛传于笔记。\n\n---\n\n### 3.1 东坡肉来历三说——杭州、徐州、黄州\n\n「东坡肉」一名之来历有三说并陈，未有定论：\n（甲）杭州说：苏轼两任杭州通判、知州，组织疏浚西湖、修筑苏堤，民感其德，遂以其法所烹红烧肉为「东坡肉」——南宋周密《武林旧事》载「东坡肉」之名。\n（乙）徐州说：熙宁十年（1077）苏轼知徐州时抗洪，百姓馈酒肉犒军，其法烹五花肉食之，因号「东坡肉」。\n（丙）黄州说：贬黄州时贫困自创「慢著火、少著水、火候足时它自美」的炖肉法（参其《煮肉歌》：「慢著火，少著水，火候足时它自美。每日起来打一碗，饱得自家君莫管。」），后世号「东坡肉」。\n三说均有史料依托，目前学界普遍接受「黄州说」为最早成法，「杭州说」与「徐州说」则为各地因人名附会之衍。须严辨：菜肴以人名为名，自宋元以降已成民俗，「东坡肉」即是典型。\n**出处**：〔模型知识·《煮肉歌》可考；武林旧事、周密笔记佐杭州说；黄州说则源自苏轼自述烹饪诗〕\n**关联**：3.2 东坡羹同属黄州时期饮食雅趣。\n\n### 3.2 东坡羹——荠菜和米之羹\n\n元丰四年（1081）左右谪居黄州，苏轼有《东坡羹颂并引》：「东坡羹，盖东坡居士所煮菜羹也。不用鱼肉五味，有自然之甘。」「以菘、若蔓、菁、芦菔，揉洗去苦汁，先入少油，盐炒之，加水煮烂，下米为羹。」「甘脆如橄榄，金陵人未识此味。」「若蔓」即蔓菁。《东坡羹颂》全文记其烹制法与口感：「其法：以菘菜、蔓菁、芦菔等揉洗去苦汁，根茎叶并煮，下米作羹，盐油少许。无肉鱼之腻，有山泉之清。」乃是中国饮食文学里最早系统论述「蔬菜羹」的文献之一。\n**出处**：〔模型知识·《东坡羹颂并引》〕\n**关联**：同期黄州贫困生活；与 3.1 黄州说东坡肉时地一致。\n\n### 3.3 与子由弟书论食羊脊骨——「终日抉剔得铢两」\n\n苏轼贬惠州后与苏辙书信往来不绝。《与子由弟书》第十一首（元符二年 1099 冬至前后）详述惠州饮食：「惠州市井寥落，然羊生辈鲜美。北方何尝识此，但食无骨。」后又补一则食羊脊骨（民间所称「羊蝎子」之骨肉相连部分）的体验：「但彼（惠州屠者）不识其美，食之辄弃其骨。吾偶啖之，自得其乐。终日抉剔得铢两于齿牙间，而骨间之肉，自若也。」「食羊骨而甘，已恨北方不识此味。」信中并嘱苏辙勿轻示人，「恐好事者闻之」。此即后世「东坡嗜羊蝎子」之最早来源。\n**出处**：〔苏轼传 王水照、崔铭 p295–296 详录：「惠州的生活条件比起过去实在是差多了……这里市井寥落，每天虽然也杀一只羊，但苏轼买不起羊肉，只好与屠夫商量，用很少的钱买下没有人要的羊脊骨，回家放在锅里用水煮熟，再趁热漉出，浸点米酒，散点薄盐，微微烤焦」并引《与子由弟书》「如食蟹鳌。率数日辄一食，甚觉有补。此说行，则众狗不悦矣」〕〔《与子由弟书》第十一首〕\n**关联**：同期 3.4 食蚝书；兄弟书信默契，详见「手足之情」册。\n\n### 3.4 食生蚝与子由——「恐北方君子闻之」\n\n《与子由弟书》第十一、十二封（元符二年 1099 冬至前后）中有生动一节：「己卯岁（1099）冬至前一日，食蚝而甘之。」「肉如豆大，黄如金，甘如蜜。」「更不复问北归事。」「恨北方君子未尝识此味。」书末调侃苏辙：「勿以示北方人，使彼君子知此味，皆欲南迁也。」——这就是「东坡嗜蚝」一事的最初来源。今广东阳江、阳春一带，民间仍以「苏东坡食蚝处」为名。\n**出处**：〔苏轼传 王水照、崔铭 p293–296 详述惠州食事：「绍圣元年十月二日……抵达贬所惠州」「日啖荔枝三百颗」诗意、「市井寥落」之肉食状况，及《与子由弟书》鱼、荔、蚝等「惠州诸食事」群书〕〔《与子由弟书》第十二〕\n**关联**：与 3.3 羊脊骨书同源，皆贬惠期间生活之笔。\n\n### 3.5 河豚「也值一死」传说\n\n传苏轼在润州（今镇江）时，有人献河豚（剧毒但味极鲜），主家邀苏轼品食。座客皆色变，独苏轼大快朵颐。主人问：「味如何？」苏轼笑答：「据其味，甚是奇妙；据其事，也值一死。」后世传为名典。南宋叶梦得《避暑录话》「苏东坡过润州食河豚」条载其事；明冯梦龙《警世通言》有「苏子瞻金兰合卺」一回又附其说。但今考北宋鱼羹文献，河豚本非苏常食；此事当为「宋人笔记附益、明清小说敷演」之典型。\n**出处**：〔传说性质·宋人笔记《避暑录话》《鹤林玉露》载其梗概；明清小说《警世通言》《古今小说》衍为长篇〕〔苏轼传 王水照、崔铭 p250 评苏轼《惠崇春江晓景》「蒌蒿满地芦芽短，正是河豚欲上时」：「诗人妙笔生花……把画面上已有的鸭、桃等物和未有的河豚，统一组成他心目中的『第二自然』，构成了全诗冬去春来时的意境」——可见河豚是诗中意象，与食河豚传说须严辨〕\n**关联**：同期苏轼在常州病重，与周穜、温叔等友人交往，「河豚也值一死」一语遂成文人重味典型。\n\n### 3.6 烤羊骨、煮鱼、酿酒、试橘醋\n\n苏轼饮食实践极丰，《东坡志林》《仇池笔记》多有笔录。除上数则外，又如：\n（甲）烤羊骨：惠州时烤羊脊骨，「至三更而尽」；\n（乙）煮鱼：黄州时以「鲜鲫煮汤」配萝卜、青菜，称其汤如酪，乳白可食；\n（丙）酿酒：东坡有真一酒、罗浮春、万家春、蜜酒、桂酒等自酿名目，屡见诗文；\n（丁）试橘醋：惠州取橘子制醋，笔记中记其酸甘相宜；\n（戊）东斋豆腐：自诩「豆腐」乃仙人所授之食，与琴鹤相伴。\n苏轼谓：「使食方丈之馔不为饱，蔬食而旨。」饮食观由俭入奢而复返，是其一生哲学的微缩。\n**出处**：〔模型知识·《东坡志林》《仇池笔记》《与子由弟书》及诗文中多处〕\n**关联**：与 3.3、3.4、3.5 互见，皆贬谪期「此心安处」的具体投射。\n\n---\n\n**未完成项 / 待核清单**\n\n- 3.1「东坡肉」三说并存，「黄州说」有苏轼《煮肉歌》佐证最为可靠；「杭州说」「徐州说」之确切断代待补。\n- 3.3、3.4 引《与子由弟书》诸篇，原信收藏于宋刊本《东坡后集》《苏文忠公集》；与子由书第十一封、十二封排序依版本而异。\n- 3.5 河豚传说需辨：宋人笔记载之可信度高，明清小说敷演成分须并陈。\n";
document.getElementById('content').innerHTML = marked.parse(MD)

</script>
