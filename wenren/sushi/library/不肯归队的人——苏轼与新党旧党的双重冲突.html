const MD = "# 不肯归队的人——苏轼与新党旧党的双重冲突\n\n> 题记：涉世多艰，竟奚所为？如鸿风飞，流落四维。——苏辙《祭亡兄端明文》，《栾城集·栾城后集》卷二十\n\n---\n\n## 一、\"不肯归队\"的本质：不党\n\n\"不肯归队\"不是一句潇洒的标签，而是苏轼一生最大的政治性格。这一性格的决定性证据，在嘉祐年间的\"贤良进卷\"中已见端倪。\n\n嘉祐六年（1061），苏轼、苏辙兄弟参加制科考试，呈上各五十篇策论构成的\"贤良进卷\"。这些文章是后来研究苏轼早期思想最珍贵的原始资料（朱刚《苏轼十讲》第二讲，第50页）。其中《策略一》明确主张\"涤荡振刷，而卓然有所立\"，并告诫宋仁宗必须先下定改革的决心：\n\n> 天下之患，莫大于不知其然而然。不知其然而然者，是拱手而待乱也。（《苏轼文集》卷八）\n\n这是呼吁改革的姿态——但不是站在王安石一边呼吁改革的姿态。苏轼的呼吁是原则性的、有条件的：不预设任何特定改革方案，但要求皇帝必须有改革的意愿与判断。\n\n耐人寻味的是，与苏轼同年进士的吕惠卿、曾布、章惇，后来都成为王安石变法的中坚，而苏轼则选择了反对立场。苏轼并非没有改革的诉求（他自己就提出过\"贷民急\"等具体建议，朱刚《苏轼十讲》第二讲，第56页），问题在于他对改革的具体路径有不同看法。苏辙在《民政策下》第二道提出\"贷民急\"的方案，后来王安石的青苗法\"无论是施行方法，还是经典依据，都与王安石的'青苗法'极其近似\"（朱刚《苏轼十讲》第二讲，第56页）——但到了熙宁二年，苏辙却成了青苗法的第一个反对者。\n\n这是理解苏轼政治立场最关键的钥匙：他不是反对改革本身，而是反对任何一种不容讨论、不容修正的\"国是\"。王水照、朱刚在《苏轼评传》中精辟地指出：\n\n> 苏轼兄弟……明确主张贯通三教。〔此处引文扩展〕既然倡言整合三家，则三家的理论、主张都成为有待批判吸收的历史遗产，那么，就不能以引述权威论点的方式进行论断，而必须从研究现实的事物中直接得出合理的结论。（《苏轼评传》第七章，第131页）\n\n把\"贯通三教\"中的\"教\"替换为\"党\"，这句话就是苏轼政治立场的最精确概括：既然要整合三家的智慧，就必须允许批评和修正；同理，既然要整合不同的政治见解，就不能容忍任何一党把持话语霸权。这是一以贯之的方法论原则，也是苏轼一生坎坷的根源。〔作者综合观点〕\n\n## 二、熙宁年间：反新法之激进\n\n熙宁二年（1069），王安石拜参知政事，推行新法。苏轼正式卷入了新旧党争的漩涡。\n\n按朱刚的分析，这次党争的形成有深刻的政治结构原因：\n\n> 自范、欧振起士风以来，仁宗朝后期的士大夫，几乎没有完全满足于现状而不思进取的，即便被今人认作\"保守派\"首领的司马光，也在为谋求更良好的政治局面而劳心焦虑。……然而，那些曾经呼吁改革的人，后来多有反对王安石变法的，不独苏轼为然。（《苏轼十讲》第二讲，第59–60页）\n\n这说明熙宁年间的政治分歧不是\"改革派 vs 反改革派\"，而是\"激进变法 vs 渐进改良\"。朱刚进一步指出：\"年轻而有声望，又主张改革的苏轼，为何与他的那些同年朋友走上了不同的道路？\"（第60页）——这问题本身就是答案的一部分：苏轼主张改革，但他不能接受王安石变法的方式。\n\n嘉祐进卷中的《贾谊论》（《苏轼文集》卷四）是理解苏轼这一时期政治立场的关键文本。苏轼评论贾谊：\"非才之难，所以自用者实难\"，并指出贾谊失败的真正原因不是汉文帝不用他，而是贾谊\"不能自用其才\"——他不能在\"上得其君，下得其大臣\"之前耐心等候，而是\"立谈之间，而遽为人痛哭哉\"，最终\"志大而量小，才有余而识不足\"。\n\n这是一篇奇特的史论——它表面上评贾谊，实际上在塑造一种新型的士大夫处世之道。王安石读后怒不可遏，对宋神宗说：\"邪憸之人！臣非苟言之，皆有事状。作《贾谊论》，言优游浸渍，深交绛、灌，以取天下之权；欲附丽欧阳修，修作《正统论》，章望之非之，乃作论罢章望之，其论都无道理……\"（《续资治通鉴长编拾补》卷六，神宗熙宁二年十一月己巳条）\n\n王安石的愤怒不是因为《贾谊论》的论点本身，而是因为苏轼那种\"优游浸渍而深交之\"的处世态度，跟他所主张的\"执一\"的政治哲学格格不入。在王安石看来，苏轼这种对各方政治力量保持等距、用调和换时机的做法，本质上是对变革决心的消解。而苏轼则认为，正是这种调和与折中，才是真正的政治智慧。〔作者综合观点〕\n\n## 三、乌台诗案的政治逻辑：神宗亲政与传媒革命\n\n元丰二年（1079）的\"乌台诗案\"是苏轼人生的转折点，但它的政治逻辑却比表面看起来复杂得多。\n\n表面上看，是新党李定、舒亶、何正臣等御史台官员搜集苏轼诗文中\"讥讽朝廷\"的内容，作为弹劾的依据。这是中国历史上第一桩以出版物作为主要\"罪证\"的文字狱（朱刚《苏轼十讲》第三讲，第76页）。杭州的出版商开板雕印苏轼在杭州的作品《元丰续添苏子瞻学士钱塘集》，恰是御史台手中的主要罪证。\n\n但朱刚在《苏轼十讲》中敏锐地指出，乌台诗案的真正逻辑不在\"几个'小人'对苏轼的嫉恨和陷害\"，而在神宗亲自主持的\"朝廷\"对这位声名藉甚的异议者的惩罚：\n\n> 我们看到苏轼以个人的名声可以\"与朝廷争胜\"，就不难想象传媒领域的技术革命给一个时代带来的巨大变化，也不难理解并非暴君的宋神宗为什么要问\"罪\"于苏轼，而苏轼的写作从无\"罪\"变成有\"罪\"，又是由从熙宁到元丰的政治环境的变化所决定的。（《苏轼十讲》第三讲，第78–79页）\n\n具体而言，朱刚指出两个关键的政治变化：\n\n第一，熙宁七年（1074）王安石罢相后，\"新党\"失去了可以批评的具体对象，而宋神宗亲自主持政务。在传统政治格局中，皇帝亲自主持政务一般不被提倡，因为这极其危险——\"当权力在宰相手上时，这权力是可以批评的，批评者的安全由皇帝来保护；而一旦由皇帝亲自掌握大权，这权力便不可批评\"。宋神宗不算暴君，但他亲自主政后，\"整个国家的政治环境就变得迥异\"。此前\"旧党\"人士针对王安石而发的许多不满言辞，现在仿佛直接加在了神宗的头上（第77页）。\n\n第二，印刷出版是真正的技术革命。朱刚指出：\"持有'旧党'政见的苏轼，在他的诗文创作中当然寓含了不少反对'新法'之意、憎恶'新党'之情，而与他合作的近代化传媒，则使其个人写作成为'舆论'。\"（第76页）这是前代大诗人如屈原、陶渊明、李白、杜甫所未曾经受的——他们的批评若无人告密，君相也未必得知；但苏轼的声音\"会传遍国土，乃至响达境外，压迫所有人的耳膜\"。\n\n值得注意的是，\"诗案\"的司法处理其实是相对克制的。负责审讯的御史台虽对苏轼严厉拷问，但大理寺的\"检法\"结论是\"当徒二年，会赦当原\"——这意味着苏轼的\"罪\"按当时法律其实不重，最多剥夺两项官职就可以抵消（朱刚《苏轼十讲》第三讲，第85页）。审刑院也支持大理寺的判决。当时的\"鞫谳分司\"制度——审讯和判决由不同官署负责——顶住了御史台的政治压力，保证了苏轼获得了合法的处置。这说明北宋的司法制度——即便在皇帝亲自主政的政治高压下——仍然保有一定的专业精神。\n\n## 四、元祐年间：反旧党尽废新法之专断\n\n元丰八年（1085）神宗崩，哲宗即位，高太后垂帘听政，\"旧党\"全面回归。这是苏轼政治生命的第二次高峰，也是他陷入新一轮冲突的开始。\n\n朱刚在《苏轼十讲》中特别指出，苏轼对元祐时期的政治形势有清醒的估计：\n\n> 旧党全面占据了朝廷，可执掌政柄的人，并非司马光、范纯仁等公认的\"领袖\"，而恰恰是缺少政治经验的年轻人。在这种情况之下，旧党人士的一个共同呼声就是全面废除新法，恢复熙宁以前的旧观，包括差役法的恢复。（〔作者综合观点〕，参《苏轼十讲》第八讲\"元祐党争\"）\n\n苏轼对这个呼声明确持反对态度。他在给司马光的信中提出：\n\n> 差役、免役，各有利害。……（新法的）役人自差，以不变为更赋之害而利其佚；但不知后来之利否耳。今指以为免役之害而欲变之，则恐反受其弊。（参《苏轼十讲》第八讲）\n\n这是典型的苏轼立场：他不完全否定新法本身的某些合理性，也不完全否定新法在执行中可能产生的效果，但坚决反对把\"新法\"作为一个整体笼统废除。\n\n朱刚指出，元祐时期的苏轼\"在朝堂上反对'专欲变熙宁之法，不复较量利害'的立场\"，\"这是把新法逐条审视，区分其利弊，不一概排斥，也不一概接受\"（〔作者综合观点〕）。苏轼在元祐元年（1086）初任翰林学士，多次当面与司马光争执——据记载，\"公（苏轼）与光争之累日\"，甚至当面批评司马光\"专欲变熙宁之法，不复较量利害\"（《苏轼十讲》第八讲）。这一立场激怒了旧党同僚，他们无法理解：既然新法已经导致你被贬黄州，你为什么还要为新法中的某些内容辩护？\n\n答案依然来自苏轼的\"不肯归队\"：他反对新法，是因为新法的施行方式违背了他所坚持的原则；现在他反对旧党全面废除新法，则是因为旧党的做法同样违背了这一原则。对他而言，原则高于党争。〔作者综合观点〕\n\n## 五、蜀洛朔党争与夹缝中的独立性\n\n元祐年间，北宋政坛上出现了著名的\"蜀洛朔党争\"。所谓\"蜀党\"以苏轼、苏辙为首，\"洛党\"以二程为首（朱熹称\"道南学派\"），\"朔党\"以刘挚、梁焘、王岩叟为首。这三个党派的分歧不仅在政治主张上，而且在学术理念上：蜀学以苏轼为代表，强调\"推阐理势\"\"多切人事\"，深受《庄子》《老子》影响；洛学以程颐为代表，主张\"理\"为万物本体；朔党则更接近司马光的政治保守路线（朱刚《苏轼十讲》第八讲\"元祐党争\"）。\n\n苏轼在这场三方角力中的位置非常微妙。他的\"蜀学\"在学术上与洛学有根本对立（程颐甚至不与苏轼同桌共席），但他又不与朔党合作；他反对新法，但新党倒台后他又拒绝加入\"专欲变熙宁之法\"的旧党；他与洛学的程颐在哲学上有深刻分歧，但他从不卷入洛学与朔党之间的具体冲突。\n\n这意味着苏轼在元祐朝中处于\"三角夹缝\"的位置——他在每一边的眼里都是\"不够彻底\"的盟友。他不够彻底地反对新法，所以他不是朔党；他不够彻底地与程颐为敌，所以他不是朔党的天然盟友；他与洛学的冲突使他在朔党眼里也不完全可信赖。\n\n朱刚精辟地指出，苏轼的\"立朝大节极可观\"（《苏轼十讲》第八讲），是源于他\"不肯归队\"的独立性。这种独立性使他两头受击——新党视他为眼中钉，旧党也不能真正容他。\n\n苏轼在元祐四年（1089）出任杭州知州，离开朝廷这一决策中心。这是他主动选择\"避地\"，还是朝廷有意将他外放？这是史家至今仍存争议的问题。但有一点是清楚的：苏轼在中央的政治空间已经越来越小。他不再能影响政策，也不再能有效发言。\"不肯归队\"的代价是真实的。\n\n## 六、绍圣再贬与\"元祐党籍碑\"\n\n哲宗亲政后（1093年起），元祐年间主导朝政的旧党遭到系统性清算。绍圣元年（1094），苏轼被贬惠州；绍圣四年（1097）再贬儋州（海南）。崇宁年间（1102年后），蔡京等新党人物追述哲宗时期的党禁政策，立\"元祐党籍碑\"，苏轼名列其中（朱刚《苏轼研究》\"苏门诸公贬谪心态的缩影\"）。\n\n元祐党籍碑的出现，意味着北宋党争的最终形态：以道德名义进行的政治株连。苏轼在党籍碑上被列为\"待制以上官\"之首，他的弟弟苏辙、门人黄庭坚、秦观、晁补之、张耒等\"苏门\"核心人物，几乎全部上榜。\n\n这是\"不肯归队\"的最终代价。但苏轼在儋州（海南）期间，依旧保持着独立思考的清醒。苏辙在《亡兄子瞻端明墓志铭》中总结其兄一生的政治性格：\n\n> （其于人）见义勇为，而不顾其害。再斥再奋，气不少衰。（《栾城后集》卷二十二，引自朱刚《苏轼十讲》第八讲）\n\n这是苏辙对苏轼的盖棺定论。\"再斥再奋\"四字，是\"不肯归队\"在历史语境中的真实写照。\n\n## 七、结语\n\n苏轼的政治命运，是一场典型的\"中间人困境\"：他既不能完全站在新党一边，又不能完全站在旧党一边；他的独立判断能力不允许他成为任何一党的纯粹工具。结果是，他被两党都视为异己，最终成为北宋党争的最大牺牲品之一。\n\n但\"不肯归队\"也是苏轼留给后世的最大精神遗产之一。它示范了一种不依附于任何政治势力的独立思考精神，示范了在党同伐异的时代如何保持个人的判断力。这种精神在后世被无数文人士大夫所继承，成为中国士人精神的重要一脉。从这个意义上说，苏轼在党争中的失败，恰恰是他作为精神典范的最大胜利。\n\n---\n\n## 溯源记录\n\n- 苏辙《祭亡兄端明文》，《栾城集·栾城后集》卷二十（题记引文出处）。\n- 苏辙《亡兄子瞻端明墓志铭》，《栾城后集》卷二十二（论苏轼\"立朝大节\"与\"见义勇为\"）。\n- 苏轼《策略一》《贾谊论》，《苏轼文集》卷八、四（嘉祐进卷核心文本）。\n- 苏轼《赤壁赋》《宝绘堂记》《答谢民师书》，《苏轼文集》卷一、十一、四十九。\n- 苏轼《苏氏易传》卷八（关于\"大全\"之说）。\n- 王水照、朱刚《苏轼评传》第七章，南京大学出版社，2004年（关于三教整合、\"全\"的概念，第131–136页）。\n- 朱刚《苏轼十讲》第二讲\"贤良进卷\"，上海三联书店，2019年（关于苏轼早年改革诉求与王安石冲突，第50–66页）。\n- 朱刚《苏轼十讲》第三讲\"乌台诗案\"（关于神宗亲政、出版传媒、鞫谳分司，第76–95页）。\n- 朱刚《苏轼十讲》第六讲\"王苏关系\"（关于王安石与苏轼关系演变史）。\n- 朱刚《苏轼十讲》第八讲\"元祐党争\"（关于元祐年间苏轼反对\"专欲变熙宁之法\"的立场、蜀洛朔党争三角结构）。\n- 王水照《苏轼研究》\"苏门诸公贬谪心态的缩影\"——论秦观《千秋岁》及苏轼等和韵词（关于元祐党籍碑的论述）。\n- 《续资治通鉴长编拾补》卷六，神宗熙宁二年十一月己巳条（王安石评《贾谊论》原文）。\n\n注：文中\"中间人困境\"\"不肯归队的精神遗产\"\"三角夹缝的位置\"等结构性提法，均为作者基于上述材料的综合判断。引文核对以上列原始文献为据。\n";
