const MD = "# 2. 幽默机锋\n\n> 苏轼机锋所及，从朝堂到禅林，从父兄到同僚，每多谐谑而非嬉笑。本册五则，皆以「言外有意、笑里藏锋」见长。其中与佛印数则，乃明清小说《东坡居士传》《东坡禅喜集》《醒世恒言》等层累附益，非尽出正史，标「传说性质」以示区别。\n\n---\n\n### 2.1 与佛印斗机锋——「八风吹不动」与「放屁」传\n\n苏轼自诩禅悟，赋诗自夸，遣书僮渡江送佛印，诗曰：「稽首天中天，毫光照大千。八风吹不动，端坐紫金莲。」佛印览诗，即批「放屁」二字掷回。苏轼大怒，亲自过江理论。佛印笑曰：「八风吹不动，一屁打过江。」苏轼默然。「八风」指利、衰、毁、誉、称、讥、苦、乐，原出佛典《释氏要览》。此事宋人笔记《东坡居士传》已载，明冯梦龙《警世通言·苏知县罗衫再合》衍为长篇。\n**出处**：〔传说性质〕〔模型知识·宋元笔记如《东坡事类》《萍洲可谈》录其梗概〕〔明清《警世通言》《醒世恒言》等小说层层加工〕\n**关联**：同期与佛印书信多论禅偈；其参禅经历亦见《东坡志林·参禅》。\n\n### 2.2 佛印「狗啃河上骨，水流东洋骨」诗传\n\n传苏轼与佛印共赏苏轼新诗，诗云「师书已变猫儿相」（典出《梁书·王侯传》），佛印佯作不解，苏轼以为得意。佛印反笑：「然则河上诗『狗啃河上骨』如何？」佛印又应声：「狗啃河上骨，水流东洋骨。」二人相视大笑。此典常被引为禅门戏语。明冯梦龙《醒世恒言·苏小妹三难新郎》与清《东坡居士传》皆录之。\n**出处**：〔传说性质·不见正史·明清小说敷演为熟典〕\n**关联**：2.1「八风吹不动」之同源关系；反映明清民间文学对苏轼禅门形象的想象。\n\n### 2.3 与苏辙唱和戏语——「子由恰似梦中事」「恰似青州司马」\n\n苏轼与弟苏辙自小同窗、同登第、同为郎、同蒙难、同南迁，情好无间，戏语亦最频。熙宁年间苏轼通判杭州，苏辙在陈州，两地寄诗唱和互谑。苏轼答苏辙《渑池怀旧》：「人生到处知何似？应似飞鸿踏雪泥。泥上偶然留指爪，鸿飞那复计东西。老僧已死成新塔，坏壁无由见旧题。往日崎岖还记否？路长人困蹇驴嘶。」——这是兄弟间最沉痛的戏谑，名为怀旧，实写人生。子由读后和之：「辙不归矣。」（后为名作《怀渑池寄子瞻兄》）诗中飞鸿雪泥遂成成语。\n**出处**：〔苏轼传 王水照、崔铭 p36–37 引《和子由渑池怀旧》全诗及自注「往日马死于二陵，骑驴至渑池」〕〔《苏轼诗集》卷一〕\n**关联**：参「手足之情」册 5.1 风雨对床之约。\n\n### 2.4 殿上谐谑——「臣不敢」的禁中语\n\n苏轼任翰林学士时，每以学识之丰令同僚叹服，亦多犯颜直谏。一日讲筵，哲宗问起前朝一故事，苏轼答毕又补：「臣不敢言。」哲宗强令言之。苏轼笑：「臣惧宰相闻之。」满朝失笑。此语载入宋人笔记多种，盖欲以宰相之怒警哲宗之偏听，亦属「婉而多讽」之作。\n**出处**：〔模型知识·宋人笔记如《邵氏闻见后录》《鹤林玉露》录其梗概〕\n**关联**：同期《上神宗皇帝书》直陈「自近岁以来所闻之言」与殿上谐语异曲同工。\n\n### 2.5 与王安石「相公扒灰」「倚翠偷香」之诬传\n\n宋元话本、明清小说、戏曲常言苏轼与王安石妻吴氏有私，或曰王安石「扒灰」得吴氏；又谓苏轼侍妾为王安石夫人之女。此皆诬妄之辞，宋人正史（如《宋史·苏轼传》《东都事略》《邵氏闻见录》皆无）。宋代邵伯温《邵氏闻见录》明斥此说「出于闾巷之诬」，明清学者如王夫之《宋论》、清儒钱大昕《潜研堂文集》皆有驳辩。此传之所以盛传，因熙丰党争之酷、政敌互造之谣与民情之附会三者相合。\n**出处**：〔传说性质·宋元明清小说戏曲层累附益·与史实不符〕\n**关联**：同期王安石为相、与苏轼诗文学争是实；其诬乃政敌造谣之典型。\n\n---\n\n**未完成项 / 待核清单**\n\n- 2.1、2.2 与佛印相关各则，正史未见，详见明清小说；研究界（如清钱大昕、近代陈寅恪《寒柳堂集》论苏轼禅诗部分）有不同考辨。\n- 2.4「臣不敢」的精确语次未核：宋人笔记数种并存，盖原出《鹤林玉露》「东坡在翰苑」条。\n";
document.getElementById('content').innerHTML = marked.parse(MD)
