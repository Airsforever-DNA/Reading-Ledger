const MD = "# 7. 贬谪岁月与民间传说\n\n> 苏轼一生三贬：元丰二年黄州、元祐八年（绍圣元年）惠州、元符三年儋州。三州造就了他。本册六则，前四则为正史可考的贬谪故事，后两则为后世民间附益与明显讹传——后者明确辟谣，以免混淆史实。\n\n---\n\n### 7.1 乌台送鱼之约——苏辙探兄、狱外传信传说\n\n传元丰二年（1079）苏轼下乌台狱，苏辙在汴京城外无处探视，乃与狱卒约定：每日送鱼一尾，附小笺一条，笺上只写送鱼日期、斤数与捕鱼河名而无他字。苏辙一日见笺中「鱼字」与平日不同——鱼腹剖开，露出帛书「臣无言」「但愿先还死」之类语。苏轼遂知苏辙已在营救。此事宋人笔记如《萍洲可谈》《鹤林玉露》均有载，但具体情节（如剖鱼藏帛）多属明清戏曲加工版本。须以「传说性质」对待：苏辙奔走营救确凿有据（《宋史·苏辙传》），「剖鱼藏帛」一类戏剧化情节则无确证。\n**出处**：〔传说性质·宋人笔记载探鱼之约；明清戏曲小说如《警世通言·苏子瞻金兰合卺》敷演剖鱼藏帛情节〕\n**关联**：5.3 乌台狱中诗与苏辙《为兄轼下狱上书》皆有史可考。\n\n### 7.2 黄州夜游承天寺——元丰六年与张怀民\n\n元丰六年（1083）十月十二日夜，苏轼解衣欲睡，月色入户，欣然起行。念无与乐者，遂至承天寺寻张怀民（《记承天寺夜游》：「怀民亦未寝，相与步于中庭」）。庭下积水空明，水中藻荇交横，「盖竹柏影也」。何夜无月？何处无竹柏？但少闲人如吾两人者耳。此文仅 80 余字，是中国散文「短章极致」之作，与「东坡」之名紧密相连。今湖北黄冈市黄州区有承天寺遗址。\n**出处**：〔苏轼传 王水照、崔铭第七章「三咏赤壁成绝唱」期之散文中〕〔《记承天寺夜游》〕\n**关联**：同期《赤壁赋》二篇同具「月夜」意象；张怀民亦贬黄州，二人「闲人」之谊可感。\n\n### 7.3 儋州载酒堂讲学——与黎子云、王霄等结社\n\n绍圣四年（1097）四月，苏轼责授琼州别驾、昌化军（今海南儋州市）安置；同年六月渡海抵儋州，时年六十二岁。在儋约三年（1097–1100），「以诗书礼乐教化其人」，并建「载酒堂」以为讲学之所。「载酒堂」之名盖取自《汉书·扬雄传》「载酒问字」之典，意谓携酒访学者与讲学。其弟子多为当地士人，黎子云（儋州人）、王霄（琼州人）、张景温（广州人）皆与苏轼结社讲学。元符三年（1100）正月哲宗崩、徽宗即位，遇赦北归；建中靖国元年（1101）六月至常州，七月二十八日病逝于常州。「载酒堂」后成海南人文渊薮，今儋州市中和镇东坡书院即其遗址。海南人感其化，自宋以来「士多秀而文」，东坡之功甚巨。\n**出处**：〔苏轼传 王水照、崔铭 p4 目录「在荒蛮的海岛，苏轼自然而然地扮演了一个文化使者的角色」「苏轼喜好陶渊明的诗歌，更喜好陶渊明的为人」章，及第十一章「白头萧散谪岭海」〕〔《琼州府志》《儋县志》及苏轼《与元老侄书》〕\n**关联**：同期苏轼与黎生合作抄录陶渊明诗（称「和陶」），归后集成《和陶诗》50 首。\n\n### 7.4 犁黑婆与海漆——海南辨药传说\n\n苏轼在儋期间，尝于笔记中详录海南民俗与本草，如《苍耳子记》《海漆》《犍为唐允功以药见赠》多则。其中「犁黑婆」「海漆」一类为黎族所识的草药，传说苏轼初不识，问之土人乃得；又传黎人妇女日日服犁黑婆以养身，色如童子，故称「犁黑婆」（黎语「养身婆」之音译）。考苏轼《东坡志林·海外本草药》及后人《岭南采药录》，东坡对岭南本草确有记录。但具体轶事细节（如「黎妇服犁黑婆不老」之传说）则多属清代笔记附会，与史实有别。须严辨：苏轼对岭南医药确实关注，但「犁黑婆不老」一类属民间附益。\n**出处**：〔模型知识·《东坡志林·海外本草》及《与元老侄书》〕〔犁黑婆不老之传说为清代笔记附会〕\n**关联**：同期苏轼与好友陈慥（季常）书信多有药方与养生讨论，可参。\n\n### 7.5 「东坡与妹妹苏小妹」——明确辟谣\n\n宋元以来戏曲小说多有「苏小妹三难新郎」故事：谓苏轼有一妹名苏小妹，才高八斗，嫁与秦少游；新婚之夜小妹以对联、诗文考少游，少游受挫。此故事明冯梦龙《醒世恒言·苏小妹三难新郎》、清李玉《眉山秀》、清《今古奇观》等皆载其详。然考《宋史》《苏氏族谱》、苏轼《苏氏族谱引》、苏辙《亡兄子瞻端明墓志铭》以及眉山苏氏族谱，苏轼同胞手足仅弟苏辙一人，无妹。「苏小妹」一名亦不见苏氏族谱与宋代任何正史、笔记。最早出《醒世恒言》《古今小说》一类明话本，为元代以后民间戏曲想象塑造之人物。今人陈寅恪《寒柳堂集》、孔凡礼《苏轼年谱》皆定论其为虚构。\n**出处**：〔民间流传·不见正史·明清话本《醒世恒言》《古今奇观》等层累创造·须严辟〕\n**关联**：与 7.1、7.6 同属民间传说性质故事，须与史实严格区分。\n\n### 7.6 「东坡巾」「坡仙」「坡公」——后世称号由来\n\n苏轼身后被尊为「东坡居士」「东坡先生」「东坡仙」「坡公」「坡仙」「谪仙」等。其称号沿革如下：\n（甲）「东坡」之号：贬黄州后于元丰四年（1081）得故营地数十亩，「东坡」之名始定（详 1.2）。\n（乙）「东坡居士」：以东坡为号，再加「居士」释家色彩，自黄州时始用。\n（丙）「东坡先生」「东坡仙」「坡仙」：北宋末南宋初已流行，至南宋陆游《老学庵笔记》、周密《武林旧事》多见之。\n（丁）「东坡巾」：一种头巾之名，据传为苏轼设计之冠式，宋元明清皆有仿制。元陶宗仪《南村辍耕录》载：「东坡巾，制有四带。」\n（戊）「东坡肉」「东坡饼」「东坡酒」「东坡羹」等饮食称谓，亦起于宋元，定型于明清。\n（己）「谪仙」一称：李白号「谪仙人」，苏轼亦被宋元以下人称为「谪仙」「谪仙翁」，谓其贬谪之身仍不废诗书。\n**出处**：〔模型知识·《宋史·苏轼传》及陶宗仪《南村辍耕录》《武林旧事》《老学庵笔记》等〕\n**关联**：与 7.5 同属后世对苏轼的「形象塑造」过程，须与正史、诗文区分。\n\n---\n\n**未完成项 / 待核清单**\n\n- 7.1「乌台送鱼之约」剖鱼藏帛情节属戏曲敷演；「探鱼传信」作为象征保留，仍宜标「传说性质」。\n- 7.3「载酒堂」今遗址在儋州中和镇东坡书院，崇宁四年（1105）所建；其后历代重修多达十余次，须核地方志。\n- 7.4「犁黑婆不老」传说待核：海南地方志、清《岭南采药录》可能有更详细记录。\n- 7.5 苏小妹辟谣一条已尽引陈寅恪、孔凡礼之说；如读者欲深入辨伪，可参王水照《苏轼传》（上海古籍）及相关考据文章。\n- 7.6「东坡巾」是否真为苏轼设计，学界多有异议；亦有谓「东坡巾」之名由元代陶宗仪命名，而原型早已有之；须核《南村辍耕录》原文。\n";
document.getElementById('content').innerHTML = marked.parse(MD)

</script>
