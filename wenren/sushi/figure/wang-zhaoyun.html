<div class="dg-wrap">
  <div class="dg-figure-head"><div class="dg-figure-seal">王</div><div style="flex:1;">
    <p style="font-size:16px;">钱塘人，绍圣元年(1094)苏轼贬惠州时纳为侍妾，陪伴至岭南。生子苏遁，夭。性识清雅，苏轼诗赞其“敏而好义”。</p></div></div>
  <div class="dg-sec-title"><span class="n">关系</span><span class="t">与苏轼及交游圈</span><span class="l"></span></div>
