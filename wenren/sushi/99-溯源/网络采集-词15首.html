<script>
const MD = "# 苏轼词15首\n\n> 本文件为\"苏轼知识工程\"网络采集产物，采集时间：2026-09-29\n> 来源优先级：Wikisource > gushiwen.cn > 其他公共来源\n> 如实记录采集结果：成功标注来源URL，失败标注「采集失败」\n\n---\n\n## 1. 水调歌头·明月几时有\n\n**来源**：https://zh.wikisource.org/wiki/水調歌頭_(明月幾時有)\n**采集时间**：2026-09-29\n\n```\n明月几时有，把酒问青天。不知天上宫阙，今夕是何年。\n我欲乘风归去，惟恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间。\n转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆。\n人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。\n```\n\n---\n\n## 2. 念奴娇·赤壁怀古\n\n**来源**：https://zh.wikisource.org/wiki/念奴嬌_(蘇軾)\n**采集时间**：2026-09-29\n\n```\n大江东去，浪淘尽、千古风流人物。\n故垒西边，人道是、三国周郎赤壁。\n乱石穿空，惊涛拍岸，卷起千堆雪。\n江山如画，一时多少豪杰。\n遥想公瑾当年，小乔初嫁了，雄姿英发。\n羽扇纶巾，谈笑处、樯橹灰飞烟灭。\n故国神游，多情应笑我，早生华发。\n人间如梦，一尊还酹江月。\n```\n\n---\n\n## 3. 定风波·莫听穿林打叶声\n\n**来源**：https://zh.wikisource.org/wiki/定風波_(莫听穿林打叶声)\n**采集时间**：2026-09-29\n\n```\n三月七日，沙湖道中遇雨。雨具先去，同行皆狼狈，余独不觉。已而遂晴，故作此。\n\n莫听穿林打叶声，何妨吟啸且徐行。\n竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。\n料峭春风吹酒醒，微冷、山头斜照却相迎。\n回首向来萧瑟处，归去、也无风雨也无晴。\n```\n\n---\n\n## 4. 江城子·乙卯正月二十日夜记梦\n\n**来源**：https://so.gushiwen.cn/shi/view.aspx?id=5c777e20ada5\n**采集时间**：2026-09-29\n\n```\n十年生死两茫茫，不思量，自难忘。千里孤坟，无处话凄凉。\n纵使相逢应不识，尘满面，鬓如霜。夜来幽梦忽还乡，小轩窗，正梳妆。\n相顾无言，惟有泪千行。料得年年肠断处，明月夜，短松冈。\n```\n\n---\n\n## 5. 江城子·密州出猎\n\n**来源**：https://zh.wikisource.org/wiki/江城子_(密州出猎)\n**采集时间**：2026-09-29\n\n```\n老夫聊发少年狂，左牵黄，右擎苍。锦帽貂裘，千骑卷平冈。\n为报倾城随太守，亲射虎，看孙郎。酒酣胸胆尚开张，鬓微霜，又何妨。\n持节云中，何日遣冯唐。会挽雕弓如满月，西北望，射天狼。\n```\n\n---\n\n## 6. 临江仙·夜饮东坡醒复醉\n\n**来源**：https://www.bilibili.com（诗文朗诵页面）\n**采集时间**：2026-09-29\n\n```\n夜饮东坡醒复醉，归来仿佛三更。家童鼻息已雷鸣，敲门都不应，倚杖听江声。\n长恨此身非我有，何时忘却营营。夜阑风静縠纹平，小舟从此逝，江海寄余生。\n```\n\n---\n\n## 7. 卜算子·黄州定慧院寓居作\n\n**来源**：https://zh.wikisource.org/wiki/卜算子（蘇軾）\n**采集时间**：2026-09-29\n\n```\n缺月挂疏桐，漏断人初静。时见幽人独往来，缥缈孤鸿影。\n惊起却回头，有恨无人省。拣尽寒枝不肯栖，寂寞沙洲冷。\n```\n\n---\n\n## 8. 蝶恋花·花褪残红青杏小\n\n**来源**：https://ocaeyzq.org\n**采集时间**：2026-09-29\n\n```\n花褪残红青杏小。燕子飞时，绿水人家绕。枝上柳绵吹又少，天涯何处无芳草！\n墙里秋千墙外道，墙外行人，墙里佳人笑。笑渐不闻声渐悄，多情却被无情恼。\n```\n\n---\n\n## 9. 西江月·世事一场大梦\n\n**来源**：搜索片段综合（多源）\n**采集时间**：2026-09-29\n\n```\n世事一场大梦，人生几度秋凉。夜来风叶已鸣廊，看取眉头鬓上。\n酒贱常愁客少，月明多被云妨。中秋谁与共孤光，把盏凄然北望。\n```\n\n---\n\n## 10. 浣溪沙·簌簌衣巾落枣花\n\n**来源**：https://zhidao.baidu.com\n**采集时间**：2026-09-29\n\n```\n簌簌衣巾落枣花，村南村北响缫车。牛衣古柳卖黄瓜。\n酒困路长惟欲睡，日高人渴漫思茶，敲门试问野人家。\n```\n\n---\n\n## 11. 八声甘州·寄参寥子\n\n**来源**：采集失败\n**失败原因**：Wikisource 多途径 404，未找到有效在线文本\n\n---\n\n## 12. 水龙吟·次韵章质夫杨花词\n\n**来源**：https://zh.wikisource.org/wiki/水龍吟_(次韻章質夫楊花詞)\n**采集时间**：2026-09-29\n\n```\n似花还似非花，也无人惜从教坠。抛家傍路，思量却是，无情有思。萦损柔肠，困酣娇眼，欲开还闭。梦随风万里，寻郎去处，又还被、莺呼起。\n不恨此花飞尽，恨西园、落红难缀。晓来雨过，遗踪何在，一池萍碎。春色三分，二分尘土，一分流水。细看来，不是杨花，点点是离人泪。\n```\n\n---\n\n## 13. 鹧鸪天·林断山明竹隐墙\n\n**来源**：https://zh.wikisource.org/wiki/鷓鴣天（時謫黃州）\n**采集时间**：2026-09-29\n\n```\n林断山明竹隐墙，乱蝉衰草小池塘。翻空白鸟时时见，照水红蕖细细香。\n村舍外，古城傍，杖藜徐步转斜阳。殷勤昨夜三更雨，又得浮生一日凉。\n```\n\n---\n\n## 14. 贺新郎·乳燕飞华屋\n\n**来源**：https://www.shici.cloud\n**采集时间**：2026-09-29\n\n```\n乳燕飞华屋，悄无人、桐阴转午，晚凉新浴。手弄生绡白团扇，扇手一时似玉。渐困倚、孤眠清熟。帘外谁来推绣户，枉教人、梦断瑶台曲。又却是，风敲竹。\n石榴半吐红巾蹙，待浮花浪蕊都尽，伴君幽独。秾艳一枝细看取，芳心千重似束。又恐被、秋风惊绿。若待得君来向此，花前对酒不忍触。共粉泪，两簌簌。\n```\n\n---\n\n## 15. 满庭芳·蜗角虚名\n\n**来源**：https://zhidao.baidu.com\n**采集时间**：2026-09-29\n\n```\n蜗角虚名，蝇头微利，算来着甚干忙。事皆前定，谁弱又谁强。且趁闲身未老，须放我、些子疏狂。百年里，浑教是醉，三万六千场。\n思量，能几许？忧愁风雨，一半相妨。又何须抵死，说短论长。幸对清风皓月，苔茵展、云幕高张。江南好，一尊还酹江月。\n```\n\n---\n\n## 采集汇总\n\n| 序号 | 词牌名 | 状态 | 来源 |\n|------|---------|------|------|\n| 1 | 水调歌头 | ✅ | Wikisource |\n| 2 | 念奴娇 | ✅ | Wikisource |\n| 3 | 定风波 | ✅ | Wikisource |\n| 4 | 江城子（记梦） | ✅ | gushiwen |\n| 5 | 江城子（出猎） | ✅ | Wikisource |\n| 6 | 临江仙 | ✅ | bilibili |\n| 7 | 卜算子 | ✅ | Wikisource |\n| 8 | 蝶恋花 | ✅ | 多源综合 |\n| 9 | 西江月 | ✅ | 搜索综合 |\n| 10 | 浣溪沙 | ✅ | baidu zhidao |\n| 11 | 八声甘州 | ❌ | 采集失败 |\n| 12 | 水龙吟 | ✅ | Wikisource |\n| 13 | 鹧鸪天 | ✅ | Wikisource |\n| 14 | 贺新郎 | ✅ | shici.cloud |\n| 15 | 满庭芳 | ✅ | baidu zhidao |\n\n**成功：14 / 15**\n";
