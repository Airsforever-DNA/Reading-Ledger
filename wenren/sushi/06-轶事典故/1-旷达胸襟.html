const MD = "# 1. 旷达胸襟\n\n> 苏轼一生三次贬谪（黄、惠、儋），却以「此心安处」为乡。无论处庙堂之高、处江湖之远，皆能于困厄中见辽阔、自嘲中见庄严。本册收其最具胸襟气象的六则轶事。\n\n---\n\n### 1.1 自题金山画像自评平生功业\n\n元祐六年（1091）南都途中，苏轼于金山寺自题画像：「问汝平生功业，黄州惠州儋州。」此语一出，世以为谑，实则夫子自道。盖元祐年间苏轼曾两入中书门下（杭州、颍州）皆不久长，真正让他名垂青史的恰是三次远谪。题罢又戏题一首：「心似已灰之木，身如不系之舟。问汝平生功业，黄州惠州儋州。」身后公论服膺，以为知言。\n**出处**：〔模型知识·《金山题画像》及《自题金山画像》诗，载《苏轼全集》〕\n**关联**：三州困厄孕育前后《赤壁赋》与《东坡志林》；「不系舟」一语同庄老。\n\n### 1.2 黄州「长江绕郭知鱼美」\n\n元丰三年（1080）至元丰七年（1084），苏轼谪居黄州团练副使，州治即今黄冈。初至时生活困窘，至有「日用不过百五十」之叹。然长江绕城而过，鱼美价廉，诗中屡见「长江绕郭知鱼美，好竹连山觉笋香」之句（《初到黄州》）。一家老小在此安顿，开垦东坡，自号「东坡居士」。「长江绕郭」一句，把江山之助与生计之困一笔写成从容，是中国文学中最著名的「贬谪即安身」意象之一。\n**出处**：〔苏轼传 王水照、崔铭 p4 目录「苏轼带领全家早出晚归，开荒垦地」章，及第七章「三咏赤壁成绝唱」期〕〔《初到黄州》〕\n**关联**：同期《赤壁赋》《念奴娇·赤壁怀古》皆作于此州；「东坡居士」之名亦始此。\n\n### 1.3 惠州「日啖荔枝三百颗」\n\n绍圣元年（1094）再贬惠州（今广东惠州市惠城区）。惠州气候温热，盛产荔枝。苏轼《惠州一绝》云：「罗浮山下四时春，卢橘杨梅次第新。日啖荔枝三百颗，不辞长作岭南人。」自注：「真一和尚、参寥子从予游惠州。」诗成已令岭外士大夫口角生香，他却未真食三百——一句戏语，便把瘴疠之地的贬所化为「长作岭南人」的浪漫。惠人至今以东坡名荔枝。\n**出处**：〔模型知识·《惠州一绝》，苏轼自注可证〕\n**关联**：同期「日睡至午而起」的懒散作派，与《独酌试药玉滑盏》形成「养生达观」系列。\n\n### 1.4 儋州「兹游奇绝冠平生」\n\n元符三年（1100）苏轼以六十二岁高龄渡海至儋州（今海南儋州市）。居儋三年，作诗曰：「九死南荒吾不恨，兹游奇绝冠平生。」其胸襟之奇崛，前所未有。三年中他「食无肉、病无药、居无室、出无友、冬无炭、夏无寒泉」，却设「载酒堂」与黎生讲学，著书不辍；临行更向琼州士子留诗：「沧海何曾断地脉，白袍端合破天荒。」后人评为「东坡一生之奇，不在诗文而在气度」。\n**出处**：〔苏轼传 王水照、崔铭 p4 目录「苏轼于绍圣元年十月二日抵达惠州贬所」「苏轼千里迢迢奔赴贬所，一路上，朝廷五改谪命」「在荒蛮的海岛，苏轼自然而然地扮演了一个文化使者的角色」章，及第十一章「白头萧散谪岭海」〕〔《六月二十日夜渡海》《和陶拟古九首》等〕\n**关联**：同期著《东坡志林》后集，与黎子云、王霄、张景温交游；惠、儋两州之作为其晚年精神底色。\n\n### 1.5 庐山烟雨浙江潮——平生未见与平生已见\n\n建中靖国元年（1101）北归抵常州病重，苏轼作《庐山烟雨浙江潮》：「庐山烟雨浙江潮，未至千般恨不消。到得还来别无事，庐山烟雨浙江潮。」其子苏过在《东坡先生和陶诗跋》中明记：「先生在岭南时，尝梦至一山曰庐山，烟雨奇绝；及过庐山，果符所梦。」诗作盖是总结一生：「未至千般恨不消」是执念，「到得还来别无事」是解脱。八月二十四日卒于常州。\n**出处**：〔模型知识·《庐山烟雨浙江潮》及苏过《东坡先生和陶诗跋》〕\n**关联**：与初至惠州「不辞长作岭南人」相呼应，构成苏轼晚年「以梦为真、以真为梦」的精神闭环。\n\n### 1.6 黄州「回首向来萧瑟处，也无风雨也无晴」\n\n元丰五年（1082）三月七日，苏轼与友人春日出游，途中遇雨，同行皆狼狈，独已先雨后晴，写成《定风波·莫听穿林打叶声》：「莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。料峭春风吹酒醒，微冷，山头斜照却相迎。回首向来萧瑟处，归去，也无风雨也无晴。」这是苏轼旷达词最广为人知者。「一蓑烟雨任平生」与「也无风雨也无晴」一脉相承，把贬谪途中偶然遇雨的瞬间升华为人生哲学。\n**出处**：〔苏轼传 王水照、崔铭 p4 目录「三月七日，苏轼在几位熟识的朋友陪同下，前往沙湖相田」章，及第七章「三咏赤壁成绝唱」期〕〔《定风波·莫听穿林打叶声》〕\n**关联**：三月七日沙湖道中雨中作；同期《赤壁赋》「惟江上之清风与山间之明月」遥相呼应。\n\n---\n\n**未完成项 /
