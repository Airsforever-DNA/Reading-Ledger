<script>
const MD = "# 4. 书画艺术\n\n> 苏轼以诗文为世所宗，其书画与画论同样影响深远。本册五则：换鹅心经传说须辨源流、寒食帖背景已确、「我书意造本无法」与「论画以形似」皆其画论名句、「胸有成竹」语源在文同筼筜谷偃竹记。\n\n---\n\n### 4.1 换鹅心经传说辨——王羲之《黄庭经》与苏轼《道德经》\n\n宋以来笔记（如《独醒杂志》《鹤林玉露》）多载：「苏东坡谪惠州时，因爱鹅而书《道德经》一部换鹅。」明清话本（如《警世通言·苏子瞻金兰合卺》）衍为长篇：「东坡书《心经》一部，与一道士换鹅。」实考：\n（甲）王羲之换鹅事出自《晋书·王羲之传》：「山阴道士好鹅，王羲之求观之。笼鹅而归，以为右军书《黄庭经》一卷之值。」\n（乙）苏轼换鹅事则见于宋人笔记谓其书《道德经》换惠州鹅，并非《心经》。\n（丙）明清戏曲将「心经换鹅」套到东坡头上，遂与王羲之事混为一谈，盖以东坡「好禅」附会之。\n须严辨：苏轼换鹅传说的「换品」是《道德经》非《心经》；明代以后戏曲小说改称《心经》乃属附会。\n**出处**：〔传说性质·南宋《独醒杂志》《鹤林玉露》载东坡换《道德经》〕〔明清戏曲小说衍为《心经》〕\n**关联**：4.2 黄州寒食帖同为贬谪期间重要书迹。\n\n### 4.2 黄州寒食帖——天下第三行书\n\n元丰五年（1082）寒食节，苏轼在黄州临皋亭作《黄州寒食帖》，行书十七行，129 字，自「自我来黄州」至「也拟哭途穷」。「自我来黄州，已过三寒食。年年欲惜春，春去不容惜。今年又苦雨，两月秋萧瑟。卧闻海棠花，泥污燕脂雪。暗中偷负去，夜半真有力。何殊病少年，病起头已白。」通篇情感由郁怒到沉痛再到超脱，被誉为继王羲之《兰亭序》、颜真卿《祭侄文稿》之后「天下第三行书」。卷后有黄庭坚题跋：「东坡此诗似李太白，犹恐太白有未到处。此书兼颜鲁公、杨少师、李西台笔意，试使东坡复为之，未必及此。」\n**出处**：〔模型知识·《黄州寒食帖》及黄庭坚题跋，原作今存台北故宫博物院〕\n**关联**：同期 4.3「我书意造本无法」之诗学主张；4.5「胸有成竹」画论同期。\n\n### 4.3 「我书意造本无法」——苏轼书论主张\n\n苏轼《石苍舒醉墨堂》诗云：「我书意造本无法，点画信手烦推求。」「意造」与「无法」是其书论核心。早期学晋人（王羲之、颜真卿、徐浩），中年成熟后主张「自出新意，不践古人」，不为法度所拘。米芾评其书：「画字之流，笔力超迈。然病在多肥。」黄庭坚则赞：「东坡道人少时学兰亭，渐老渐熟，乃能成家。」苏轼另一面反对「诗中有画、画中有诗」的拼凑，主张「书初无意于佳乃佳尔」。\n**出处**：〔模型知识·《石苍舒醉墨堂》《评书》《书论》等〕\n**关联**：与 4.5「胸有成竹」画论相通，皆主「意在笔先」。\n\n### 4.4 「论画以形似，见与儿童邻」——苏轼诗画之辨\n\n苏轼《书鄢陵王主簿所画折枝二首》：「论画以形似，见与儿童邻。赋诗必此诗，定非知诗人。诗画本一律，天工与清新。」其主张：「画不在形似而在神似，诗不在事实而在情性。」此说出后影响宋元明清文人画千年。中国文人画之「不求形似但求神似」传统，以此为滥觞。后人赵孟頫「书画同源」、倪瓒「逸笔草草」、八大山人「白眼向人」皆奉为圭臬。须辨：苏轼此论非谓「不必形似」，而是「形似之外更当有神」。\n**出处**：〔模型知识·《书鄢陵王主簿所画折枝二首》〕\n**关联**：4.5「胸有成竹」同属文人画论系列。\n\n### 4.5 「胸有成竹」语源——文同筼筜谷偃竹记\n\n北宋嘉祐末至熙宁初，苏轼与文同（字与可）交往颇深。文同善画竹，为湖州竹派开创者。元丰二年（1079）文同卒于陈州（今河南淮阳），苏轼为作《文与可画筼筜谷偃竹记》。其文首述竹画心得：「今夫夫子之托于斯竹也，而予以为有道者，则非耶？故世之画竹，或先得成竹于胸中，执笔熟视，乃见其所欲画者，急起从之，振笔直遂，以追其所见。」这就是「胸有成竹」一语之语源。后世画竹者奉此为画竹之总诀。北宋《宣和画谱》载文同画竹流传卷目；《画继》评文同「以天造为师，以心为匠」皆本于此说。\n**出处**：〔苏轼传 王水照、崔铭 p4 目录「文同『字画病』的话头启发了苏轼的灵感」章，及「每逢休假日，文同总是邀请苏轼一道写字作画」章〕〔《文与可画筼筜谷偃竹记》〕\n**关联**：4.4「论画以形似」同期画论主张；「师友交游」册 6.3 与文同竹石之交互见。\n\n---\n\n**未完成项 / 待核清单**\n\n- 4.1「换鹅心经」传说，须辨三阶段：王羲之换《黄庭经》（晋史）→ 苏轼换《道德经》（宋笔记）→ 明清戏曲改《心经》。目前学界对苏轼换《道德经》事考证依《独醒杂志》《鹤林玉露》。\n- 4.2「天下第三行书」之评语最早见于何时何人，尚有争议；元末明初陶宗仪《书史会要》或清人评骥有不同表述，待核。\n- 4.5《文与可画筼筜谷偃竹记》「胸有成竹」原文表述「故世之画竹，或先得成竹于胸中」，须核原集。\n";
