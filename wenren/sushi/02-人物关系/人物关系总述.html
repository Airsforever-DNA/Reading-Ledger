const MD = "# 苏轼人物社会网络总述\n\n> **版本**：v1  \n> **素材**：《苏东坡传》（林语堂）/《苏东坡新传》（李一冰）/《苏轼传》（王水照、崔铭）/《苏轼十讲》（朱刚）/《苏轼研究》（王水照）/《苏轼评传》（王水照、朱刚）  \n> **配套文件**：`persons.json`（人物档案）、`relations.json`（关系边）。  \n> **规模**：人物 59 人 / 关系边 94 条。\n\n## 0. 概览：苏轼社会网络的七层结构\n\n苏轼一生交游纵横近四十年，以蜀中眉山起步、东坡海南收官，社会网络呈典型的\"血缘+科举+师承+仕宦+文学+艺术+宗教\"七层叠合结构。\n\n- **核心层**：血缘家庭——以\"三苏\"为骨，以三子为续；\n\n- **主轴层**：科举座主与文坛前辈——嘉祐二年(1057)入仕即获欧阳修、张方平、梅尧臣共同奖掖；\n\n- **延伸层**：苏门四学士、黄门六君子——形成北宋最具影响力的文学社群；\n\n- **政治层**：元祐旧党盟友与新法洛党政敌——王安石、章惇、程颐、蔡京为对头，司马光、文彦博、范纯仁为盟友；\n\n- **宗教层**：佛印、参寥为代表的禅林诗友；\n\n- **皇室层**：仁宗、英宗、神宗、哲宗四帝与高太后、向太后两后；\n\n- **艺术层**：文同、米芾、李公麟、王诜——元祐西园雅集为标志事件。\n\n\n## 一. 血缘家庭圈\n\n苏轼之社会网络，血缘为根。父苏洵、弟苏辙与苏轼本人合称\"三苏\"，是北宋文坛罕见的父子三人并立之局。父苏洵于庆历、嘉祐间携二子赴京应试，是苏轼人生转折之起点；母程夫人以《范滂传》教子立志，虽逝于眉山而影响最深。元配王弗 1065 年卒于京师，年仅二十七，苏轼铭其墓于彭山，此后十年常作悼亡诗；继室王闰之陪伴苏轼度过熙宁变法、元祐回朝的宦海浮沉，元祐七年(1093)病逝于京师；侍妾王朝云随侍至岭南惠州，1097 年卒于惠州，苏轼葬之于栖禅寺。三子：苏迈（王弗出）、苏迨与苏过（王闰之出）皆随侍贬所，苏过最能文，号斜川居士，营葬苏轼于郏城小峨眉。弟苏辙与苏轼同科登第、自同年至相逝，一生相依为命，元符年间同贬岭南，建中靖国初同北还，相会于颍昌。\n\n\n**本章人物清单（9 人）**\n\n| id | 姓名 | 身份标签 | 简介要点 | 主要出处 |\n|---|---|---|---|---|\n| `su-xun` | 苏洵 | 家人·父亲 | 字明允，号老泉，眉山人。苏轼之父，与二子合称“三苏”。屡试不第，愤而尽焚旧稿，闭门苦读数年，遂精于《孟子》《论语》及诸子… | 苏东坡传  林语堂 p26 / 苏东坡新传  李一冰 p38 |\n| `cheng-furen` | 程夫人 | 家人·母亲 | 眉山程氏，苏洵之妻，苏轼生母。出身眉山望族，性识端庄，教子有法，常以古人名节励苏轼。苏轼十岁前后程夫人卒，苏轼一生深痛未… | 苏东坡传  林语堂 p35 / 苏东坡新传  李一冰 p52 |\n| `su-zhe` | 苏辙 | 家人·胞弟 | 字子由，一字同叔，号颍滨遗老。苏轼同父同母弟，与兄同科登进士第。仕途坎坷，官至尚书右丞、门下侍郎，晚年贬雷州、循州。与兄… | 苏东坡传  林语堂 p26 / 苏东坡新传  李一冰 p39 |\n| `su-mai` | 苏迈 | 家人·长子 | 苏轼长子，王弗所生。历任州县官，仕至殿中丞、直史馆。苏轼贬谪期间多随侍；东坡《与迈诗》《付迈》手书多次提及。… | 苏东坡传  林语堂 p176 / 苏东坡新传  李一冰 p170 |\n| `su-dai` | 苏迨 | 家人·次子 | 苏轼次子，王闰之所生。字仲豫，号叔达。曾任承务郎。… | 苏东坡传  林语堂 p202 / 苏东坡新传  李一冰 p261 |\n| `su-guo` | 苏过 | 家人·三子 | 字叔党，号斜川居士，王闰之所生。苏轼幼子中最具才华，工诗书画，苏轼贬惠州、儋州皆随侍，亲历《东坡志林》成书背景。… | 苏东坡传  林语堂 p202 / 苏东坡新传  李一冰 p56 |\n| `wang-fu` | 王弗 | 家人·元配 | 眉山青神王氏，处士王方之女，苏轼元配。少年聪慧，每苏轼读书，伴坐终日；能记父兄所议论而助苏轼识别宦场人物。… | 苏东坡传  林语堂 p48 / 苏东坡新传  李一冰 p78 |\n| `wang-runzhi` | 王闰之 | 家人·继室 | 王弗堂妹，1068 年嫁苏轼为继室。生苏迨、苏过、苏遁。性格温厚持家，陪伴苏轼历经宦海浮沉，元祐间始享夫贵。… | 苏东坡新传  李一冰 p1076 / 苏轼传  王水照、崔铭 p66 |\n| `wang
